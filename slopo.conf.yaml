# Source directory with code to index.
# Absolute path, or relative to the current directory.
source_dir: .

# Paths to exclude from indexing, as a YAML list of .gitignore-style patterns
source_dir_exclude:
- '**/test/**'
# TODO: The plural spelling shouldn't exist anyway.
- '**/tests/**'
- '**/test-fixture/**'
- '*.test.ts'
- '*_test.rs'
- '*_tests.rs'
- '*Test.kt'
- 'dist'
- 'node_modules'
- '*.local.*'
- '*.local'
- '*.auto.tfvars'
- '*.tfstate'
- '*.tfstate.*'
- '*.lock'
- 'target'
- 'cache'
- '.cache'
- '*.log.jsonl'
- 'output'
- 'package-paused'
- 'package-deprecated'
- '.claude'
- '.factory'
- '.serena'
- '.*cache'
- '*~'
- '.idea'
- 'out'
- 'data'
- 'build'
- 'corpus'
- '*.out'
- '*.old'
- 'done-*'

# Approved embedding model in LiteLLM format.
# For all supported providers see
# https://docs.litellm.ai/docs/embedding/supported_embedding
embedding_model: voyage/voyage-code-4

# Output dimensions of the embedding model.
embedding_dimensions: 1024

# Provider API key.
# Alternatively, set the SLOPO_EMBEDDING_API_KEY environment variable
# (also picked up from a .env file in the current directory)
# Choose what fits your workflow and security requirements.
# Set in env var.
#embedding_api_key:

db_file: .slopo.local.dir/index.db

report_dir: .slopo.local.dir/

# Hand-tuned floor, and the lowest value this repository wants. 0.4.0 defaulted to 10 and 0.8.0
# defaults to 20 (slopo/config.py:151-152), so 13 is more permissive than the current upstream
# default rather than less. Below 13 the report fills with one-line idioms whose duplication is the
# design: 25 of the 33 css* value constructors in hyperscript/core are 8-node one-liners that each
# document one CSS unit. Small-idiom families are still worth measuring, through the queries in
# doc/troubleshooting/slopo-threshold-tuning.md, without indexing them here.
body_node_count_threshold: 13
