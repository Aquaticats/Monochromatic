name: rust-toolchain setup
description: >
  Installs the Rust toolchain `toolchain.lock.json` records and makes it the one the rest of the job compiles with.
  The lock holds a dated nightly (`.tools.rust.version`), which the repository's daily update moves; a workflow that
  typed that date itself, or installed the floating `nightly` channel, built with a compiler nothing here tested under
  (`doc/handover/cli-git-rust-implementation.md`, owner decision of 2026-11-15: "Everything nightly."). The step's work is
  a Node program of this repository, so the YAML holds one command and no shell, and the program's readings are unit
  tested.

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain toolchain.lock.json names
      shell: bash
      # One command: the workflow shell rules of monochromatic-lint
      # (`.github/actions/monochromatic-lint.config.jsonc`) allow a step two code lines and no shell construct, and the
      # program appends RUSTUP_TOOLCHAIN to GITHUB_ENV, which the later steps of the calling job read.
      run: node package/monorepo-task/core-exec/src/rust-toolchain-setup.ts
