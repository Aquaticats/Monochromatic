name: task-cli setup
description: >
  Mise-free CI bootstrap: installs the exact Node and pnpm versions the
  repository's `toolchain.lock.json` records and exposes `task-run`, the node-native
  task CLI that replaces `mise run` in every workflow. Plain shell only, so
  running it never adds an external action to the repository's allow-list.

inputs:
  node-version:
    description: >
      Node version to install. Empty reads `.tools.node.version` from
      `toolchain.lock.json` with jq; pass a value only to override the pin.
    required: false
    default: ''
  pnpm-version:
    description: >
      pnpm version to install. Empty reads `.tools.pnpm.version` from
      `toolchain.lock.json` with jq; pass a value only to override the pin.
    required: false
    default: ''
  install-dependencies:
    description: >
      Run `pnpm install --frozen-lockfile` after setup. Installing the pinned
      pnpm is implied: the frozen install cannot run without pnpm.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve the pinned Node and pnpm versions
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v jq >/dev/null; then
          echo '::error::task-cli-setup: jq is required to read toolchain.lock.json' >&2
          exit 1
        fi
        node_version='${{ inputs.node-version }}'
        if [ -z "$node_version" ]; then
          node_version=$(jq --raw-output '.tools.node.version' toolchain.lock.json)
        fi
        pnpm_version='${{ inputs.pnpm-version }}'
        if [ -z "$pnpm_version" ]; then
          pnpm_version=$(jq --raw-output '.tools.pnpm.version' toolchain.lock.json)
        fi
        case "$node_version" in
          '' | null) echo '::error::task-cli-setup: no Node version to install' >&2; exit 1 ;;
        esac
        case "$pnpm_version" in
          '' | null) echo '::error::task-cli-setup: no pnpm version to install' >&2; exit 1 ;;
        esac
        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
        echo "pnpm-version=$pnpm_version" >> "$GITHUB_OUTPUT"
        echo "task-cli-setup: node $node_version, pnpm $pnpm_version"

    - name: Install Node (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        version='${{ steps.pins.outputs.node-version }}'
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) platform=linux-x64 ;;
          Linux-ARM64) platform=linux-arm64 ;;
          macOS-ARM64) platform=darwin-arm64 ;;
          macOS-X64) platform=darwin-x64 ;;
          *) echo "task-cli-setup: unsupported runner ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
        esac
        install_dir="$RUNNER_TEMP/node-$version"
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location \
          "https://nodejs.org/dist/v$version/node-v$version-$platform.tar.gz" \
          | tar -xz -C "$install_dir" --strip-components=1
        echo "$install_dir/bin" >> "$GITHUB_PATH"
        export PATH="$install_dir/bin:$PATH"
        node --version
        npm --version

    - name: Install Node (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '${{ steps.pins.outputs.node-version }}'
        $arch = 'x64'
        if ('${{ runner.arch }}' -eq 'ARM64') { $arch = 'arm64' }
        $archive = Join-Path $env:RUNNER_TEMP "node-$version-win-$arch.zip"
        curl.exe --fail --silent --show-error --location `
          "https://nodejs.org/dist/v$version/node-v$version-win-$arch.zip" `
          --output $archive
        $stage = Join-Path $env:RUNNER_TEMP "node-stage-$version"
        Expand-Archive -Path $archive -DestinationPath $stage
        $root = Split-Path -Path (Get-ChildItem -Path $stage -Recurse -Filter node.exe | Select-Object -First 1).FullName
        Add-Content -Path $env:GITHUB_PATH -Value $root
        & (Join-Path $root 'node.exe') --version
        & (Join-Path $root 'npm.cmd') --version

    - name: Install pnpm
      if: inputs.pnpm-version != '' || inputs.install-dependencies == 'true'
      shell: bash
      run: |
        set -euo pipefail
        npm install --global "pnpm@${{ steps.pins.outputs.pnpm-version }}"
        echo "$(npm prefix --global)" >> "$GITHUB_PATH"
        pnpm --version

    - name: Expose task-run
      shell: bash
      run: |
        set -euo pipefail
        bin_dir="$RUNNER_TEMP/task-cli-bin"
        run_ts="${GITHUB_WORKSPACE//\\//}/package/dev-script/task-cli/src/run.ts"
        mkdir -p "$bin_dir"
        chmod +x "$run_ts"
        printf '#!/usr/bin/env bash\nexec node "%s" "$@"\n' "$run_ts" > "$bin_dir/task-run"
        chmod +x "$bin_dir/task-run"
        printf '@echo off\r\nnode "%s" %%*\r\n' "$run_ts" > "$bin_dir/task-run.cmd"
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
