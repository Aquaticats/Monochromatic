name: repository tools setup
description: >
  Fetches the prebuilt `file-enforcer`, `mpm-shadow`, `cargo-shadow` and `git-policy-cli` binaries this repository
  publishes and puts them on PATH.
  `mpm-shadow` and `git-policy-cli` come from the archive row of the `mpm-shadow` tool and of the
  `cargo:monochromatic-git-policy-cli` tool in `toolchain.lock.json` (a GitHub release, never crates.io) and are checked
  against the SHA-256 recorded there. `file-enforcer` and `cargo-shadow` come from the release of the version the lock
  names for `cargo:monochromatic-file-enforcer-cli` and `cargo:monochromatic-cargo-shadow` and are checked against the
  checksums file of that release. The work is one Node
  command, `package/monorepo-task/core-exec/src/repo-tools-setup.ts` (tested by `repo-tools-setup.unit.test.ts` beside it),
  which imports only `node:` modules and so runs from source on the Node already on `PATH` (type stripping needs Node 22.18
  or later), with no dependency installed; running it never adds an external action to the repository's allow-list.
  The developer-machine counterpart, which the root `toolchain:*` tasks run, is
  `package/monorepo-task/core-exec/src/mpm-shadow.ts`: the same lock row, the same SHA-256 check.
  A job that runs `file-enforcer` sets `FILE_ENFORCER_IDLE_SECONDS` in its own `env`, as the file-enforcer CLI README
  asks of CI: this action does not write `GITHUB_ENV`, which zizmor's `github-env` audit reports.

inputs:
  tools:
    description: >
      Space-separated list of the programs to install: `file-enforcer`, `mpm-shadow`, `cargo-shadow`, `git-policy-cli`, or any of them.
    required: false
    default: 'file-enforcer'

runs:
  using: composite
  steps:
    - name: Fetch and verify the repository tools
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        RUNNER_PLATFORM: ${{ runner.os }}-${{ runner.arch }}
      run: node package/monorepo-task/core-exec/src/repo-tools-setup.ts
