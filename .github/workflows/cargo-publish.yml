        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of every release archive). The arm64 runner is Ubuntu 24.04
        # for the same glibc. The nws-build-binary matrix does the same.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
