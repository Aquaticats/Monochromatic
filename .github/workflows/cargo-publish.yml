          --notes "monochromatic-pnpm-shadow v${VERSION}. ${crates_io_note}. Linux only (x86_64 and aarch64 gnu). Verify an archive with sha256sum --check against the checksums file or with gh attestation verify." \
          --target "$SHA"

  # monochromatic-lint: the repository's Rust, Markdown and MDX linter
  # (doc/planning/unified-linter.md, `Distribution and consumers`). It ships
  # like forbidden-strings: the same eight release targets, and tag and asset
  # names in cargo-binstall's default templates ({name}-v{version} tag,
  # {name}-{version}-{target}.tar.gz or .zip, {name}-{version}-{target}/{bin}
  # inside), so `cargo binstall monochromatic-lint` and the cargo-install fallback
  # find the archives with no [package.metadata.binstall]. One difference:
  # - 0.1.0 is published by hand to bootstrap Trusted Publishing
  #   (doc/runbook/publish-crate-first-time.md); a dispatch with dry-run off
  #   then authenticates, skips the existing upload, and builds the release.
  # - The binary matrix also runs in a dry run, so a dry dispatch proves every
  #   release target still builds with the rust-analyzer and Satteri
  #   dependencies; attestation and the release stay behind !inputs.dry-run.
  # The matrix compiles with each runner's preinstalled rustup toolchain, not
  # the repository's nightly toolchain, exactly as the forbidden-strings matrix does.

  ml-build-binary:
    needs: detect
    # Not gated on !inputs.dry-run: a dry run builds every target too.
    if: ${{ needs.detect.outputs.should_publish_ml == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The gnu archive links the glibc of its build host, so its runner is named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of the monochromatic-lint gnu archive). The arm64 runner is
        # Ubuntu 24.04 for the same glibc. The musl legs stay on ubuntu-latest: a statically
        # linked musl binary carries no glibc floor.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-latest
          needs_musl: true
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-24.04-arm
          needs_musl: true
        - target: x86_64-apple-darwin
          runner: macos-latest
        - target: aarch64-apple-darwin
          runner: macos-latest
        - target: x86_64-pc-windows-msvc
          runner: windows-latest
        - target: aarch64-pc-windows-msvc
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install musl tools
      if: ${{ matrix.needs_musl }}
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies fat LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/linter/monochromatic-lint
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_ml }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='monochromatic-lint'
        ext=''
        case "$TARGET" in
          *windows*) ext='.exe' ;;
        esac
        stage_dir="monochromatic-lint-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/linter/monochromatic-lint/target/${TARGET}/release/${bin}${ext}" "dist/${stage_dir}/"
        if [ -f package/linter/monochromatic-lint/README.md ]; then
          cp package/linter/monochromatic-lint/README.md "dist/${stage_dir}/"
        fi
        case "$TARGET" in
          *windows*)
            archive="${stage_dir}.zip"
            (cd dist && 7z a "${archive}" "${stage_dir}" >/dev/null)
            ;;
          *)
            archive="${stage_dir}.tar.gz"
            (cd dist && tar czf "${archive}" "${stage_dir}")
            ;;
        esac
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ml-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  ml-create-release:
    needs: [detect, ml-build-binary]
    if: ${{ needs.detect.outputs.should_publish_ml == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The label step reads one manifest; nothing here pushes or fetches.
        persist-credentials: false

    # The label rule of the owner (doc/planning/crates-io-footprint.md): the note below says where this version went,
    # and this is the same decision the publish job read before the upload.
    - name: Read the label of the released version
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: package/linter/monochromatic-lint/Cargo.toml

    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ml-bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_ml }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ steps.label.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-lint-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-lint/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "monochromatic-lint v${VERSION}" \
          --notes "monochromatic-lint v${VERSION}. ${crates_io_note}" \
          --target "$SHA"

  # monochromatic-git-policy-cli: the native Git policy wrapper (doc/planning/cli-git-native-cutover.md,
  # `Publishing the native crate`). It follows the monochromatic-lint jobs above, with these differences:
  # - Linux GNU targets only (x86_64 and aarch64). The Windows and macOS branches of the code never compiled in a
  #   release gate, and the repository's immutable releases mean one failing target produces no release.
  # - The executable is named after the crate (the owner renamed it from `cli-git-native` on 2026-11-04, so the archive of
  #   a release before that holds `cli-git-native`), so the archive holds
  #   monochromatic-git-policy-cli-<version>-<target>/monochromatic-git-policy-cli, the layout the crate's
  #   [package.metadata.binstall] table points at. It is the crate's only `[[bin]]`: the commit service is its mode
  #   `monochromatic-git-policy-cli monochromatic-git-policy-cli service run`, because cargo-binstall refuses an archive that
  #   lacks any `[[bin]]` of the crate (the second `cli-git-service` bin added on 2026-11-01 turned the catalog-specifiers
  #   workflow red).
  #   `package/git-policy/cli/bin/native-release-bins.unit.test.ts` fails when this job, Cargo.toml,
  #   releasable-crates.json and toolchain.lock.json list different executables.
  # - The crate links forbidden-strings by path in the repository and by version on crates.io once packaged, so the
  #   publish job waits until the required forbidden-strings release is in the crates.io index, which lets one push
  #   carry both version bumps.
  # - A smoke step runs each built executable, so a target that links but cannot start produces no release.
  # - The release also needs publish-crate, unlike ml-create-release, so a run that cannot authenticate or publish
  #   creates no immutable release for a crate that is not on crates.io.
  # First publication (0.1.0) is by hand to bootstrap Trusted Publishing
  # (doc/runbook/publish-crate-first-time.md); a later run authenticates, skips the existing upload, and builds the
  # release. The matrix compiles with each runner's preinstalled rustup toolchain, as the matrices above do.

  gpc-build-binary:
    needs: detect
    # Not gated on !inputs.dry-run: a dry run builds every target too.
    if: ${{ needs.detect.outputs.should_publish_gpc == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host (pidfd_spawnp needs glibc 2.39), so the runner is named, not
        # ubuntu-latest: GitHub moves that label to Ubuntu 26.04 (glibc 2.43) in November 2026, which would raise the
        # floor of every release archive. The arm64 runner below is named for the same glibc.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml keeps panic = "unwind", which the linked scanner requires.
    - name: Build binary
      shell: bash
      working-directory: package/git-policy/cli
      run: cargo build --release --locked --target ${{ matrix.target }} --bin monochromatic-git-policy-cli

    # The wrapper answers `monochromatic-git-policy-cli --help` without a repository, so a target that links but cannot start fails here.
    - name: Smoke-run the binary
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        help=$("package/git-policy/cli/target/${TARGET}/release/monochromatic-git-policy-cli" monochromatic-git-policy-cli --help)
        printf '%s\n' "$help" | grep -q '^Usage: git monochromatic-git-policy-cli'

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_gpc }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-git-policy-cli'
        bin='monochromatic-git-policy-cli'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/git-policy/cli/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        cp package/git-policy/cli/README.md "dist/${stage_dir}/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gpc-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  gpc-create-release:
    needs: [detect, publish-crate, gpc-build-binary]
    if: ${{ needs.detect.outputs.should_publish_gpc == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The label step reads one manifest; nothing here pushes or fetches.
        persist-credentials: false

    # The label rule of the owner (doc/planning/crates-io-footprint.md): the note below says where this version went,
    # and this is the same decision the publish job read before the upload.
    - name: Read the label of the released version
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: package/git-policy/cli/Cargo.toml

    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: gpc-bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_gpc }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ steps.label.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-git-policy-cli-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-git-policy-cli/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "monochromatic-git-policy-cli v${VERSION}" \
          --notes "monochromatic-git-policy-cli v${VERSION}. ${crates_io_note}" \
          --target "$SHA"

  # Answers one question for the jobs below: does this version's release tag exist
  # already? Releases are immutable here, so an existing tag cannot be refilled or
  # replaced; a real run then skips the build and the release without failing.
  # A dry run builds regardless, since dry-running the current version is the usual case.
  fec-release-state:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish_fec == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.state.outputs.tag_exists }}
    permissions:
      contents: read
    steps:
    - name: Look up the release tag
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_fec }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="monochromatic-file-enforcer-cli-v${VERSION}"
        # A 404 means the tag is absent; any other failure (rate limit, outage) must fail
        # this job rather than read as "absent" and fail later at `gh release create`.
        if reply=$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>&1); then
          echo "::notice::Tag ${tag} already exists; a real run skips the build and the release."
          echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
        elif printf '%s' "$reply" | grep --quiet 'HTTP 404'; then
          echo "Tag ${tag} does not exist yet."
          echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$reply" >&2
          exit 1
        fi

  # The binary builds from the repository tree (path dependencies), not from the registry copy,
  # so it does not wait for the publish job; the release job below does.
  fec-build-binary:
    needs: [detect, fec-release-state]
    # Not gated on !inputs.dry-run: a dry run builds every target too. A real run
    # builds only while the release tag is free.
    if: ${{ needs.detect.outputs.should_publish_fec == 'true' && (inputs.dry-run || needs.fec-release-state.outputs.tag_exists != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host, so the runners are named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of every release archive). The arm64 runner is Ubuntu 24.04
        # for the same glibc. The ms-build-binary matrix does the same. Linux only: the
        # server listens on a Unix socket and uses flock.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The build only reads the tree; nothing here needs the token in .git/config.
        persist-credentials: false

    - name: Add rust target
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: rustup target add "$TARGET"

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the crate's Cargo.lock records.
    - name: Build binary
      shell: bash
      working-directory: package/file-enforcer/cli
      env:
        TARGET: ${{ matrix.target }}
      run: cargo build --release --locked --target "$TARGET"

    # Each runner is native for its target, so the binary can run here. A build that
    # links but cannot start, or that reports another version than Cargo.toml, fails
    # before anything is packaged. The binary is `file-enforcer`, the crate is
    # `monochromatic-file-enforcer-cli`, and every line the binary prints is one JSON object.
    - name: Smoke-run the binary
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_fec }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='file-enforcer'
        got=$("package/file-enforcer/cli/target/${TARGET}/release/${bin}" --version)
        printf 'got:  %s\n' "$got"
        printf '%s' "$got" | grep --fixed-strings --quiet '"type":"version"'
        printf '%s' "$got" | grep --fixed-strings --quiet "file-enforcer ${VERSION}\""

    # Layout is {name}-{version}-{target}/{bin}, the bin-dir of [package.metadata.binstall];
    # the archive name is its pkg-url file name. The licenses sit beside the binary because
    # the crate is LGPL-3.0-or-later and the archive is a redistribution.
    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_fec }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-file-enforcer-cli'
        bin='file-enforcer'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}/LICENSES"
        cp "package/file-enforcer/cli/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        cp package/file-enforcer/cli/README.md "dist/${stage_dir}/"
        cp package/file-enforcer/cli/LICENSES/*.txt "dist/${stage_dir}/LICENSES/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Extracts the archive as a consumer would and runs the extracted binary, so a
    # wrong layout or a binary damaged by packaging fails here, not at install time.
    - name: Verify the archive
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_fec }}
        TARGET: ${{ matrix.target }}
        ARCHIVE_PATH: ${{ steps.pkg.outputs.archive_path }}
      run: |
        set -euo pipefail
        crate='monochromatic-file-enforcer-cli'
        bin='file-enforcer'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        check_dir=$(mktemp -d)
        tar xzf "$ARCHIVE_PATH" -C "$check_dir"
        for member in "${bin}" README.md LICENSES/LGPL-3.0-or-later.txt LICENSES/GPL-3.0-or-later.txt; do
          test -f "${check_dir}/${stage_dir}/${member}"
        done
        test -x "${check_dir}/${stage_dir}/${bin}"
        got=$("${check_dir}/${stage_dir}/${bin}" --version)
        printf 'extracted binary: %s\n' "$got"
        printf '%s' "$got" | grep --fixed-strings --quiet '"type":"version"'
        printf '%s' "$got" | grep --fixed-strings --quiet "file-enforcer ${VERSION}\""

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fec-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.dry-run && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every
  # asset at creation time, so every archive and the checksums file go up in one call.
  # Tag / asset names are the ones [package.metadata.binstall] in the crate's Cargo.toml
  # names: {name}-v{version} tag, {name}-{version}-{target}.tar.gz asset.
  # Needs publish-crate so no immutable release exists for a version that is not
  # on crates.io: cargo-binstall reads the metadata from the registry copy of the manifest.
  fec-create-release:
    needs: [detect, fec-release-state, publish-crate, fec-build-binary]
    if: ${{ needs.detect.outputs.should_publish_fec == 'true' && !inputs.dry-run && needs.fec-release-state.outputs.tag_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The label step reads one manifest; nothing here pushes or fetches.
        persist-credentials: false

    # The label rule of the owner (doc/planning/crates-io-footprint.md): the note below says where this version went,
    # and this is the same decision the publish job read before the upload.
    - name: Read the label of the released version
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: package/file-enforcer/cli/Cargo.toml

    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: fec-bin-*
        path: assets
        merge-multiple: true

    # A missing archive would become a permanent gap in an immutable release, so the
    # expected set is named here instead of trusting whatever the artifacts hold.
    - name: Write the checksums file
      env:
        VERSION: ${{ needs.detect.outputs.version_fec }}
      run: |
        set -euo pipefail
        crate='monochromatic-file-enforcer-cli'
        cd assets
        for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
          test -f "${crate}-${VERSION}-${target}.tar.gz"
        done
        test "$(ls | wc --lines)" -eq 2
        sha256sum -- *.tar.gz > "${crate}-${VERSION}-sha256sums.txt"
        cat "${crate}-${VERSION}-sha256sums.txt"

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_fec }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ steps.label.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-file-enforcer-cli-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-file-enforcer-cli/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "file-enforcer v${VERSION}" \
          --notes "monochromatic-file-enforcer-cli v${VERSION}. ${crates_io_note}. Linux only (x86_64 and aarch64 gnu). Verify an archive with sha256sum --check against the checksums file or with gh attestation verify." \
          --target "$SHA"

  # monochromatic-cargo-shadow: the cargo shadow that, before a command that resolves dependencies, makes Cargo.lock satisfy
  # its manifests under the rust-catalog.toml trust policy, then hands over to the real cargo
  # (doc/planning/cargo-shadow-update.md). 0.1.0 is published by hand to bootstrap Trusted Publishing
  # (doc/runbook/publish-crate-first-time.md); a dispatch with dry-run off then authenticates, skips the existing
  # upload, builds the two Linux archives (the crate is Unix only: it reads exit signals and replaces itself with cargo
  # through the Unix process extension) and creates one immutable release per version, shaped like the mpm-shadow release.

  # Answers one question for the jobs below: does this version's release tag exist
  # already? Releases are immutable here, so an existing tag cannot be refilled or
  # replaced; a real run then skips the build and the release without failing.
  # A dry run builds regardless, since dry-running the current version is the usual case.
  cgs-release-state:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish_cgs == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.state.outputs.tag_exists }}
    permissions:
      contents: read
    steps:
    - name: Look up the release tag
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_cgs }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="monochromatic-cargo-shadow-v${VERSION}"
        # A 404 means the tag is absent; any other failure (rate limit, outage) must fail
        # this job rather than read as "absent" and fail later at `gh release create`.
        if reply=$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>&1); then
          echo "::notice::Tag ${tag} already exists; a real run skips the build and the release."
          echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
        elif printf '%s' "$reply" | grep --quiet 'HTTP 404'; then
          echo "Tag ${tag} does not exist yet."
          echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$reply" >&2
          exit 1
        fi

  cgs-build-binary:
    needs: [detect, cgs-release-state]
    # Not gated on !inputs.dry-run: a dry run builds every target too. A real run
    # builds only while the release tag is free.
    if: ${{ needs.detect.outputs.should_publish_cgs == 'true' && (inputs.dry-run || needs.cgs-release-state.outputs.tag_exists != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host, so the runners are named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of every release archive). The arm64 runner is Ubuntu 24.04
        # for the same glibc. The nws-build-binary matrix does the same.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The build only reads the tree; nothing here needs the token in .git/config.
        persist-credentials: false

    - name: Add rust target
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: rustup target add "$TARGET"

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/cargo-shadow/cli
      env:
        TARGET: ${{ matrix.target }}
      run: cargo build --release --locked --target "$TARGET"

    # Each runner is native for its target, so the binary can run here. A build that
    # links but cannot start, or that reports another version than Cargo.toml, fails
    # before anything is packaged. Output format: `<bin name> <version>` (clap); the
    # binary is `cargo-shadow`, the crate is `monochromatic-cargo-shadow`.
    - name: Smoke-run the binary
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_cgs }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='cargo-shadow'
        got=$("package/cargo-shadow/cli/target/${TARGET}/release/${bin}" --version)
        want="${bin} ${VERSION}"
        printf 'got:  %s\nwant: %s\n' "$got" "$want"
        [ "$got" = "$want" ]

    # Layout is {name}-{version}-{target}/{bin}, the bin-dir of [package.metadata.binstall];
    # the archive name is its pkg-url file name. The licenses sit beside the binary because
    # the crate is LGPL-3.0-or-later and the archive is a redistribution.
    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_cgs }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-cargo-shadow'
        bin='cargo-shadow'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}/LICENSES"
        cp "package/cargo-shadow/cli/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        cp package/cargo-shadow/cli/README.md "dist/${stage_dir}/"
        cp package/cargo-shadow/cli/LICENSES/*.txt "dist/${stage_dir}/LICENSES/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Extracts the archive as a consumer would and runs the extracted binary, so a
    # wrong layout or a binary damaged by packaging fails here, not at install time.
    - name: Verify the archive
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_cgs }}
        TARGET: ${{ matrix.target }}
        ARCHIVE_PATH: ${{ steps.pkg.outputs.archive_path }}
      run: |
        set -euo pipefail
        crate='monochromatic-cargo-shadow'
        bin='cargo-shadow'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        check_dir=$(mktemp -d)
        tar xzf "$ARCHIVE_PATH" -C "$check_dir"
        for member in "${bin}" README.md LICENSES/LGPL-3.0-or-later.txt LICENSES/GPL-3.0-or-later.txt; do
          test -f "${check_dir}/${stage_dir}/${member}"
        done
        test -x "${check_dir}/${stage_dir}/${bin}"
        got=$("${check_dir}/${stage_dir}/${bin}" --version)
        printf 'extracted binary: %s\n' "$got"
        [ "$got" = "${bin} ${VERSION}" ]

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: cgs-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.dry-run && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every
  # asset at creation time, so every archive and the checksums file go up in one call.
  # Tag / asset names are the ones [package.metadata.binstall] in the crate's Cargo.toml
  # names: {name}-v{version} tag, {name}-{version}-{target}.tar.gz asset.
  # Needs publish-crate so no immutable release exists for a version that is not
  # on crates.io: cargo-binstall reads the metadata from the registry copy of the manifest.
  cgs-create-release:
    needs: [detect, cgs-release-state, publish-crate, cgs-build-binary]
    if: ${{ needs.detect.outputs.should_publish_cgs == 'true' && !inputs.dry-run && needs.cgs-release-state.outputs.tag_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The label step reads one manifest; nothing here pushes or fetches.
        persist-credentials: false

    # The label rule of the owner (doc/planning/crates-io-footprint.md): the note below says where this version went,
    # and this is the same decision the publish job read before the upload.
    - name: Read the label of the released version
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: package/cargo-shadow/cli/Cargo.toml

    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: cgs-bin-*
        path: assets
        merge-multiple: true

    # A missing archive would become a permanent gap in an immutable release, so the
    # expected set is named here instead of trusting whatever the artifacts hold.
    - name: Write the checksums file
      env:
        VERSION: ${{ needs.detect.outputs.version_cgs }}
      run: |
        set -euo pipefail
        crate='monochromatic-cargo-shadow'
        cd assets
        for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
          test -f "${crate}-${VERSION}-${target}.tar.gz"
        done
        test "$(ls | wc --lines)" -eq 2
        sha256sum -- *.tar.gz > "${crate}-${VERSION}-sha256sums.txt"
        cat "${crate}-${VERSION}-sha256sums.txt"

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_cgs }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ steps.label.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-cargo-shadow-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-cargo-shadow/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "cargo-shadow v${VERSION}" \
          --notes "monochromatic-cargo-shadow v${VERSION}. ${crates_io_note}. Linux only (x86_64 and aarch64 gnu). Verify an archive with sha256sum --check against the checksums file or with gh attestation verify." \
          --target "$SHA"
