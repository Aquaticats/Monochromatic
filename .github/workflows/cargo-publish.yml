      version: ${{ steps.detect.outputs.version }}
      goes_to_crates_io: ${{ steps.label.outputs.goes_to_crates_io }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

