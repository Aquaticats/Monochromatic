        manifest-path: 'package/file-enforcer/cli/Cargo.toml'

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/file-enforcer/cli/Cargo.toml'
