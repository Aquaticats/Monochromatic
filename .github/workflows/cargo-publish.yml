      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/file-enforcer/cli/target/package/monochromatic-file-enforcer-cli-${{ needs.fec-detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run && needs.fec-detect.outputs.goes_to_crates_io == 'true' }}
