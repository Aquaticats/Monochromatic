    # binary is `mpm-shadow`, the crate is `monochromatic-mpm-shadow`.
    - name: Smoke-run the binary
      shell: bash
      env:
        VERSION: ${{ needs.ms-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='mpm-shadow'
        got=$("package/mpm-shadow/cli/target/${TARGET}/release/${bin}" --version)
        want="${bin} ${VERSION}"
