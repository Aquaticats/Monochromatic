    needs: [ss-detect, ss-release-state]
    # Not gated on !inputs.dry-run: a dry run builds every target too. A real run
    # builds only while the release tag is free.
    if: ${{ needs.ss-detect.outputs.should_publish == 'true' && (inputs.dry-run || needs.ss-release-state.outputs.tag_exists != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host, so the runners are named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of every release archive). The arm64 runner is Ubuntu 24.04
        # for the same glibc. The nws-build-binary matrix does the same.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
