name: cargo-publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Which crate to publish (manual runs only)'
        type: choice
        options:
        - forbidden-strings
        - monochromatic-nested-wayland-session
        - forbidden-regex
        - monochromatic-jsonc-edit
        - monochromatic-lint
        - monochromatic-git-policy-cli
        - monochromatic-search-shadow
        - monochromatic-mpm-shadow
        - monochromatic-xml-edit
        - monochromatic-dependency-catalog
        - monochromatic-browserslist
        - monochromatic-file-enforcer
        - monochromatic-file-enforcer-cli
        - monochromatic-catalog-specifier
        - monochromatic-pnpm-shadow
        - monochromatic-cargo-shadow
        default: forbidden-strings
      dry-run:
        description: 'Dry run (package + verify, no crates.io upload, no GH release, no attestation)'
        type: boolean
        default: true
  push:
    branches: ['main']
    paths:
    - 'package/forbidden-strings/cli/Cargo.toml'
    - 'package/nested-wayland-session/cli/Cargo.toml'
    - 'package/forbidden-strings/core/Cargo.toml'
    - 'package/jsonc-edit/core-rust/Cargo.toml'
    - 'package/linter/monochromatic-lint/Cargo.toml'
    - 'package/git-policy/cli/Cargo.toml'
    - 'package/search-shadow/cli/Cargo.toml'
    - 'package/mpm-shadow/cli/Cargo.toml'
    - 'package/xml-edit/core-rust/Cargo.toml'
    - 'package/dependency-catalog/core-native/Cargo.toml'
    - 'package/browserslist/core-rust/Cargo.toml'
    - 'package/file-enforcer/core-rust/Cargo.toml'
    - 'package/file-enforcer/cli/Cargo.toml'
    - 'package/catalog-specifier/core-rust/Cargo.toml'
    - 'package/pnpm-shadow/cli/Cargo.toml'
    - 'package/cargo-shadow/cli/Cargo.toml'

permissions:
  contents: read

# Serialize runs so a second version bump landing while a publish is still
# uploading does not race the first. cancel-in-progress=false keeps the
# running publish alive; the second run queues.
concurrency:
  group: cargo-publish
  cancel-in-progress: false

jobs:

  # The crate list, and the two scripts every crate runs.
  #
  # One descriptor per published crate, in one list, is the only place this workflow names a crate: the detect job reads
  # it, decides which crates publish, and hands the same descriptors to the publish matrix, so adding a crate or changing
  # one of its settings is one line. Issue 1609 filed the shape this replaced: four phases copied per crate, each with a
  # script of its own, where a fix reached some copies and not the others.
  #
  # `cache`, `system_libs` and `locked` are a crate's exceptions; a missing field is false.
  # - fr, forbidden-regex: the regex engine behind forbidden-strings. A library: no [[bin]], no release archive.
  # - fs, forbidden-strings: cached, because the scanner's build.rs makes the cold compile heavy enough that a restore
  #   pays for itself (measured in doc/decision/ci-caching.md).
  # - nws, monochromatic-nested-wayland-session: a Wayland compositor, so the publish job installs the system -dev
  #   libraries its build links, and it is cached like forbidden-strings.
  # - je, monochromatic-jsonc-edit: the JSONC editor the file-enforcer crates build on.
  # - xe, dc, bl: monochromatic-xml-edit, monochromatic-dependency-catalog and monochromatic-browserslist, which have no
  #   first-party dependency on each other.
  # - fe, monochromatic-file-enforcer: the Rust file-enforcer library (doc/decision/file-enforcer-rust-rewrite.md).
  # - fec, monochromatic-file-enforcer-cli: the `file-enforcer` binary, pinned to exact versions of the four crates above.
  # - cs, monochromatic-catalog-specifier: the catalog specifier rule that the cli-git policy `mono/catalog-specifiers` and
  #   the pnpm-shadow wrapper share (doc/handover/catalog-specifier-policy.md). It pins only the already published
  #   monochromatic-jsonc-edit, so it publishes on its own.
  # - ps, cgs, ms, ss: the pnpm, cargo, mpm and search shadows. Each is Unix only: its code reads exit signals through the
  #   Unix process extension or /proc.
  # - ml, monochromatic-lint: the repository's Rust, Markdown and MDX linter, cached for the rust-analyzer and Satteri
  #   dependencies its compile pulls (doc/planning/unified-linter.md).
  # - gpc, monochromatic-git-policy-cli: the native Git policy wrapper, cached, and the one crate whose package and publish
  #   pass --locked, because its released forbidden-strings must be the indexed one, not the path copy
  #   (doc/planning/cli-git-native-cutover.md).
  #
  # Whatever the descriptor says, 0.1.0 of every crate is published by hand to bootstrap Trusted Publishing
  # (doc/runbook/publish-crate-first-time.md); from then on the idempotent publish step skips a version that is already
  # on crates.io.
  detect:
    runs-on: ubuntu-latest
    outputs:
      # The crates that publish in this run, as the include list of the publish matrix; `[]` when none does.
      publishing: ${{ steps.detect.outputs.publishing }}
      # One pair per crate that has a build or release job below, because those jobs are per crate: the matrix phase
      # reads its own entry, and the crate-specific phases read the decision and the version from here.
      should_publish_fs: ${{ steps.detect.outputs.should_publish_fs }}
      version_fs: ${{ steps.detect.outputs.version_fs }}
      should_publish_nws: ${{ steps.detect.outputs.should_publish_nws }}
      version_nws: ${{ steps.detect.outputs.version_nws }}
      should_publish_ss: ${{ steps.detect.outputs.should_publish_ss }}
      version_ss: ${{ steps.detect.outputs.version_ss }}
      should_publish_ms: ${{ steps.detect.outputs.should_publish_ms }}
      version_ms: ${{ steps.detect.outputs.version_ms }}
      should_publish_ps: ${{ steps.detect.outputs.should_publish_ps }}
      version_ps: ${{ steps.detect.outputs.version_ps }}
      should_publish_ml: ${{ steps.detect.outputs.should_publish_ml }}
      version_ml: ${{ steps.detect.outputs.version_ml }}
      should_publish_gpc: ${{ steps.detect.outputs.should_publish_gpc }}
      version_gpc: ${{ steps.detect.outputs.version_gpc }}
      should_publish_fec: ${{ steps.detect.outputs.should_publish_fec }}
      version_fec: ${{ steps.detect.outputs.version_fec }}
      should_publish_cgs: ${{ steps.detect.outputs.should_publish_cgs }}
      version_cgs: ${{ steps.detect.outputs.version_cgs }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        # need before+after revs to detect a version bump on push events.
        # fetch-depth: 2 holds `before` for a one-generation push; the detect
        # step fetches it when a push carries more, and treats a first push
        # (no `before`) as a bump.
        fetch-depth: 2

    # Every crate's bump is decided here, once, so a fix reaches all sixteen. The script is Node rather than shell
    # because it loops over the descriptors: doc/planning/workflow-shell-line-limit.md.
    - name: Detect the version bump of every crate
      id: detect
      shell: node {0}
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
        CRATES: |
          [
            { "key": "fr", "crate": "forbidden-regex", "manifest": "package/forbidden-strings/core/Cargo.toml" },
            { "key": "fs", "crate": "forbidden-strings", "manifest": "package/forbidden-strings/cli/Cargo.toml", "cache": true },
            { "key": "nws", "crate": "monochromatic-nested-wayland-session", "manifest": "package/nested-wayland-session/cli/Cargo.toml", "cache": true, "system_libs": true },
            { "key": "je", "crate": "monochromatic-jsonc-edit", "manifest": "package/jsonc-edit/core-rust/Cargo.toml" },
            { "key": "xe", "crate": "monochromatic-xml-edit", "manifest": "package/xml-edit/core-rust/Cargo.toml" },
            { "key": "dc", "crate": "monochromatic-dependency-catalog", "manifest": "package/dependency-catalog/core-native/Cargo.toml" },
            { "key": "bl", "crate": "monochromatic-browserslist", "manifest": "package/browserslist/core-rust/Cargo.toml" },
            { "key": "fe", "crate": "monochromatic-file-enforcer", "manifest": "package/file-enforcer/core-rust/Cargo.toml" },
            { "key": "fec", "crate": "monochromatic-file-enforcer-cli", "manifest": "package/file-enforcer/cli/Cargo.toml" },
            { "key": "cs", "crate": "monochromatic-catalog-specifier", "manifest": "package/catalog-specifier/core-rust/Cargo.toml" },
            { "key": "ps", "crate": "monochromatic-pnpm-shadow", "manifest": "package/pnpm-shadow/cli/Cargo.toml" },
            { "key": "cgs", "crate": "monochromatic-cargo-shadow", "manifest": "package/cargo-shadow/cli/Cargo.toml" },
            { "key": "ms", "crate": "monochromatic-mpm-shadow", "manifest": "package/mpm-shadow/cli/Cargo.toml" },
            { "key": "ss", "crate": "monochromatic-search-shadow", "manifest": "package/search-shadow/cli/Cargo.toml" },
            { "key": "ml", "crate": "monochromatic-lint", "manifest": "package/linter/monochromatic-lint/Cargo.toml", "cache": true },
            { "key": "gpc", "crate": "monochromatic-git-policy-cli", "manifest": "package/git-policy/cli/Cargo.toml", "cache": true, "locked": true }
          ]
      run: |
        import { spawnSync } from 'node:child_process';
        import { appendFileSync, readFileSync } from 'node:fs';

        // The all-zero revision a first push carries, so one comparison covers a missing and an empty before.
        const zeroSha = '0000000000000000000000000000000000000000';
        const before = process.env.BEFORE_SHA ?? '';
        const event = process.env.EVENT_NAME ?? '';
        const dispatchCrate = process.env.INPUT_CRATE ?? '';
        const crates = JSON.parse(process.env.CRATES ?? '[]');
        const output = process.env.GITHUB_OUTPUT ?? '';

        // Run a program and answer its text, or null when it exited non-zero.
        function run(program, args) {
          const child = spawnSync(program, args, { encoding: 'utf8' });
          return child.status === 0 ? child.stdout : null;
        }

        // The version a Cargo.toml holds: the first line that starts with `version = `.
        function versionOf(text) {
          const found = /^version = "([^"]*)"/mu.exec(text);
          return found === null ? '' : found[1];
        }

        // Whether the crates.io index already lists a version. The index path of a name of four or more characters is its
        // first two, its next two, then the name; a version the index cannot hold (an alpha, a beta, an unlabelled form)
        // is never listed, so asking is always safe.
        function indexLists(crate, version) {
          const path = `${crate.slice(0, 2)}/${crate.slice(2, 4)}/${crate}`;
          const index = run('curl', ['-sSf', '-H', 'User-Agent: monochromatic-ci', `https://index.crates.io/${path}`]);
          return (index !== null) && index.includes(`"vers":"${version}"`);
        }

        // A push can carry several generations, such as a merge whose second parent holds commits that were not on origin
        // yet, so the pre-push head can lie outside the depth-2 checkout. Fetch it once instead of reading its absence as
        // a version bump; a failed fetch fails this job, so nothing publishes.
        if ((before !== '') && (before !== zeroSha) && (run('git', ['cat-file', '-e', `${before}^{commit}`]) === null)) {
          const fetched = spawnSync('git', ['fetch', '--no-tags', '--depth=1', 'origin', before], { stdio: 'inherit' });
          if (fetched.status !== 0) {
            console.error(`git could not fetch ${before}, so the version before this push is unknown; refusing to publish.`);
            process.exit(1);
          }
        }

        const lines = [];
        const publishing = [];
        for (const crate of crates) {
          const after = versionOf(readFileSync(crate.manifest, 'utf8'));
          if (after === '') {
            console.error(`${crate.manifest} holds no version line; refusing to publish.`);
            process.exit(1);
          }
          const heldBefore = ((before === '') || (before === zeroSha))
            ? null
            : run('git', ['show', `${before}:${crate.manifest}`]);
          const previous = heldBefore === null ? '' : versionOf(heldBefore);
          // A manual dispatch publishes only the crate it names; a push publishes only if the version actually changed.
          let publish = ((event === 'workflow_dispatch') && (dispatchCrate === crate.crate))
            || ((event === 'push') && (previous !== after));
          // A crates.io version can be published only once: a push whose version the index already lists is not a bump,
          // so the build, publish and release jobs stay idle instead of failing on a duplicate upload or an immutable
          // release. A manual dispatch asks nothing, because it is the way to rebuild the binaries of a published version.
          if (publish && (event === 'push') && indexLists(crate.crate, after)) {
            console.log(`::notice::${crate.crate} ${after} is already on crates.io; nothing to publish.`);
            publish = false;
          }
          console.log(`${crate.crate}: before '${previous}', after '${after}', publishes ${publish}`);
          lines.push(
            `should_publish_${crate.key}=${publish}`,
            `version_${crate.key}=${after}`,
          );
          if (publish)
            publishing.push({
              key: crate.key,
              crate: crate.crate,
              manifest: crate.manifest,
              // The package directory: `cargo package` runs here, and the cache covers its target folder.
              dir: crate.manifest.slice(0, crate.manifest.length - '/Cargo.toml'.length),
              version: after,
              cache: crate.cache === true,
              system_libs: crate.system_libs === true,
              locked: crate.locked === true,
            });
        }
        // Written even when empty: the publish job tests this text before it expands its matrix, and an unset output
        // would arrive as an empty string that matches neither `[]` nor a list of entries.
        lines.push(`publishing=${JSON.stringify(publishing)}`);
        appendFileSync(output, `${lines.join('\n')}\n`);

  # The Rust file-enforcer (doc/decision/file-enforcer-rust-rewrite.md) is five crates that publish in dependency
  # order: monochromatic-jsonc-edit (the xml-edit, dependency-catalog, browserslist and file-enforcer crates need the
  # version that carries the span API), then monochromatic-xml-edit, monochromatic-dependency-catalog and
  # monochromatic-browserslist, which have no first-party dependency on each other, then monochromatic-file-enforcer,
  # then monochromatic-file-enforcer-cli, which also ships the `file-enforcer` binary. A crate's `cargo package` step
  # verifies by compiling against crates.io, so a dependency published in the same run must already be indexed: the
  # wait step below is that ordering, per entry, in place of a `needs:` chain over per-crate publish jobs whose run
  # order GitHub does not guarantee.
  #
  # One publish definition for every crate. detect's `publishing` list is the matrix, so a run that publishes nothing
  # skips this job instead of expanding it, and each entry carries its own package directory, crate name and flags.
  publish-crate:
    needs: detect
    if: ${{ needs.detect.outputs.publishing != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # A crate that cannot publish must not cancel the others: a re-run publishes the one that failed.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.publishing) }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    # The label rule of the owner (doc/planning/crates-io-footprint.md): only a plain number and -rc.N go to crates.io.
    # Every step below that touches crates.io reads this decision of its own crate.
    - name: Decide whether the version goes to crates.io
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: ${{ matrix.manifest }}

    - name: Install system libraries the crate links
      # Ubuntu equivalents of the Fedora -devel packages in the compositor's Containerfile: libwayland
      # (use_system_lib), libxkbcommon (linked, not dlopened), libdrm (backend_drm), EGL headers, and
      # clang/libclang for any bindgen in the drm-sys / wayland-sys graph.
      if: ${{ matrix.system_libs }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libwayland-dev libxkbcommon-dev libdrm-dev libegl-dev \
          clang libclang-dev

    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install nightly --profile minimal --no-self-update
        rustup default nightly

    # The five file-enforcer crates pin each other by exact version, and a Rust catalog writes a path dependency as the
    # exact requirement its packaged manifest keeps: `cargo package` resolves against crates.io, so a sibling this run
    # publishes must be in the index before this crate is packaged. A pin this run does not publish must already be
    # indexed, and packaging names it when it is not. This replaces the `needs:` chain that ordered the per-crate publish
    # jobs, whose run order GitHub does not guarantee.
    - name: Wait for the sibling releases this run publishes
      id: wait
      if: ${{ steps.label.outputs.goes_to_crates_io == 'true' }}
      shell: node {0}
      working-directory: ${{ matrix.dir }}
      env:
        CRATE: ${{ matrix.crate }}
        PUBLISHING: ${{ needs.detect.outputs.publishing }}
      run: |
        import { spawnSync } from 'node:child_process';
        import { readFileSync } from 'node:fs';

        // Polls for up to thirty minutes, thirty seconds apart, which is the bound the per-crate job this replaces used.
        // A test sets both to shrink the wait.
        const attempts = Number(process.env.WAIT_ATTEMPTS ?? 60);
        const seconds = Number(process.env.WAIT_SECONDS ?? 30);
        const crate = process.env.CRATE ?? '';
        const publishing = JSON.parse(process.env.PUBLISHING ?? '[]');
        const manifest = readFileSync('Cargo.toml', 'utf8');
        // Every dependency of this crate that pins an exact version of another crate, in one line:
        // `name = { path = "..", version = "=0.1.2" }`.
        const pins = [...manifest.matchAll(/^([a-z0-9-]+)\s*=\s*\{[^}]*\bversion\s*=\s*"=([^"]+)"[^}]*\}/gmu)]
          .map((match) => ({ name: match[1], version: match[2] }))
          .filter((pin) => (pin.name !== crate)
            && publishing.some((entry) => (entry.crate === pin.name) && (entry.version === pin.version)));
        if (pins.length === 0) {
          console.log(`${crate}: no dependency of this run publishes before it.`);
          process.exit(0);
        }
        // Whether the crates.io index lists a version: the path of a name of four or more characters is its first two
        // characters, its next two, then the name.
        function indexLists({ name, version }) {
          const path = `${name.slice(0, 2)}/${name.slice(2, 4)}/${name}`;
          const index = spawnSync('curl', ['-sSf', '-H', 'User-Agent: monochromatic-ci', `https://index.crates.io/${path}`], { encoding: 'utf8' });
          return (index.status === 0) && index.stdout.includes(`"vers":"${version}"`);
        }
        function sleep(milliseconds) {
          return new Promise((resolve) => { setTimeout(resolve, milliseconds); });
        }
        for (const pin of pins) {
          let listed = false;
          for (let attempt = 1; (attempt <= attempts) && !listed; attempt += 1) {
            listed = indexLists(pin);
            if (!listed) {
              console.log(`${pin.name} ${pin.version} is not in the crates.io index yet (attempt ${attempt} of ${attempts}).`);
              await sleep(seconds * 1000);
            }
          }
          if (!listed) {
            console.error(`${pin.name} ${pin.version} did not appear in the crates.io index.`);
            process.exit(1);
          }
          console.log(`${pin.name} ${pin.version} is in the crates.io index.`);
        }

    # Key shape, restore-keys rule, and size budget: doc/decision/ci-caching.md
    - name: Identify the Rust toolchain for the cache key
      id: toolchain
      if: ${{ matrix.cache }}
      run: echo "id=${ImageOS}-$(rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Cache cargo build artifacts
      if: ${{ matrix.cache }}
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          ${{ matrix.dir }}/target
          !${{ matrix.dir }}/target/package
        key: cargo-v2-publish-${{ matrix.key }}-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.dir)) }}
        restore-keys: |
          cargo-v2-publish-${{ matrix.key }}-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

    # `cargo package` verifies by compiling the packaged crate and leaves
    # the .crate at target/package/. We attest THESE bytes, then upload
    # with `cargo publish --no-verify` which uses the existing .crate
    # without re-packaging or deleting it (verified locally: file sha256
    # is byte-identical before and after `cargo publish --no-verify`).
    # We cannot attest after `cargo publish` because cargo deletes the
    # .crate as part of its post-upload cleanup when --no-verify is NOT
    # passed; that was the 0.1.6 failure mode.
    # LOCKED is `--locked` for the crates the descriptor marks, and empty otherwise, so an unquoted expansion adds no
    # argument.
    - name: Build .crate package (verifies by compile)
      if: ${{ steps.label.outputs.goes_to_crates_io == 'true' }}
      working-directory: ${{ matrix.dir }}
      env:
        LOCKED: ${{ matrix.locked && '--locked' || '' }}
      run: cargo package $LOCKED

    - name: Log cargo directory sizes
      if: ${{ always() && matrix.cache }}
      run: |
        du --summarize --human-readable ${{ matrix.dir }}/target "$HOME/.cargo/registry" "$HOME/.cargo/git" || true
        du --max-depth=2 --human-readable ${{ matrix.dir }}/target | sort --human-numeric-sort --reverse | head --lines=15 || true

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run && steps.label.outputs.goes_to_crates_io == 'true' }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: '${{ matrix.dir }}/target/package/${{ matrix.crate }}-${{ matrix.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run && steps.label.outputs.goes_to_crates_io == 'true' }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run && steps.label.outputs.goes_to_crates_io == 'true' }}
      working-directory: ${{ matrix.dir }}
      env:
        LOCKED: ${{ matrix.locked && '--locked' || '' }}
      run: cargo publish --dry-run $LOCKED --no-verify

    # The one upload in this workflow, and the one place its idempotence lives. A push of a plain number asks the
    # crates.io index first (the detect step above), but a manual dispatch does not: cargo-publish is also dispatched to
    # (re)build the release binaries of a version that is already published, and crates.io accepts a version once. So the
    # upload is preceded by the same question the index answers, and a run that finds the version already listed logs it
    # and publishes nothing.
    - name: Publish (skips if this version is already on crates.io)
      if: ${{ !inputs.dry-run && steps.label.outputs.goes_to_crates_io == 'true' }}
      working-directory: ${{ matrix.dir }}
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        CRATE: ${{ matrix.crate }}
        VERSION: ${{ matrix.version }}
        LOCKED: ${{ matrix.locked && '--locked' || '' }}
      run: |
        set -euo pipefail
        if curl -sSf -H 'User-Agent: monochromatic-ci' "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" >/dev/null 2>&1; then
          echo "::notice::${CRATE} ${VERSION} already on crates.io; skipping publish."
        else
          cargo publish $LOCKED --no-verify
        fi

  build-binary:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish_fs == 'true' && !inputs.dry-run }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The gnu archive links the glibc of its build host, so its runner is named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of the forbidden-strings gnu archive). The arm64 runner is
        # Ubuntu 24.04 for the same glibc. The musl legs stay on ubuntu-latest: a statically
        # linked musl binary carries no glibc floor.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-latest
          needs_musl: true
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-24.04-arm
          needs_musl: true
        - target: x86_64-apple-darwin
          runner: macos-latest
        - target: aarch64-apple-darwin
          runner: macos-latest
        - target: x86_64-pc-windows-msvc
          runner: windows-latest
        # Native Windows arm64 runner, free for public repositories (GA 2025-08-07).
        # Absent until 0.4.1 only because we believed GitHub had no hosted Windows arm64
        # runner: doc/decision/forbidden-strings-windows-arm64-release-target.md
        - target: aarch64-pc-windows-msvc
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install musl tools
      if: ${{ matrix.needs_musl }}
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Build binary
      shell: bash
      working-directory: package/forbidden-strings/cli
      run: cargo build --release --target ${{ matrix.target }}

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_fs }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='forbidden-strings'
        ext=''
        case "$TARGET" in
          *windows*) ext='.exe' ;;
        esac
        stage_dir="forbidden-strings-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/forbidden-strings/cli/target/${TARGET}/release/${bin}${ext}" "dist/${stage_dir}/"
        # README is decoration; if it ever moves or is renamed, ship the
        # binary anyway rather than failing the whole release pipeline.
        if [ -f package/forbidden-strings/cli/README.md ]; then
          cp package/forbidden-strings/cli/README.md "dist/${stage_dir}/"
        fi
        case "$TARGET" in
          *windows*)
            archive="${stage_dir}.zip"
            (cd dist && 7z a "${archive}" "${stage_dir}" >/dev/null)
            ;;
          *)
            archive="${stage_dir}.tar.gz"
            (cd dist && tar czf "${archive}" "${stage_dir}")
            ;;
        esac
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Attest each binary archive: the SLSA build-provenance signature binds
    # the archive's sha256 to this workflow run. Since the artifact transit
    # (upload-artifact -> download-artifact -> gh release create) is
    # byte-preserving, the digest still matches when consumers download
    # from the release page and run `gh attestation verify`.
    - name: Attest binary provenance
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  # Immutable releases (repo setting) means `gh release create` must include
  # every asset at creation time; you cannot add files later. So we wait for
  # every matrix entry to finish, collect all archives, then create the
  # release in one shot with all files attached.
  create-release:
    needs: [detect, build-binary]
    if: ${{ needs.detect.outputs.should_publish_fs == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The label step reads one manifest; nothing here pushes or fetches.
        persist-credentials: false

    # The label rule of the owner (doc/planning/crates-io-footprint.md): the note below says where this version went,
    # and this is the same decision the publish job read before the upload.
    - name: Read the label of the released version
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: package/forbidden-strings/cli/Cargo.toml

    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_fs }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ steps.label.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="forbidden-strings-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/forbidden-strings/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "forbidden-strings v${VERSION}" \
          --notes "forbidden-strings v${VERSION}. ${crates_io_note}" \
          --target "$SHA"

  # monochromatic-nested-wayland-session: a Wayland compositor, so LINUX-ONLY
  # (x86_64/aarch64 gnu; no macOS/Windows/musl, which cannot build/link the
  # Wayland stack) and the publish job installs the system -dev libraries it links
  # before every compile. Its jobs read the compositor's line of the crate list above.
  # Its release differs from forbidden-strings' in these ways
  # (doc/decision/nested-wayland-session-releases.md):
  # - The binary matrix also runs in a dry run: every target builds, is smoke-run,
  #   packaged and verified, and its archive is uploaded for one day. Attestation
  #   and the release stay behind !inputs.dry-run.
  # - nws-release-state looks the release tag up first. A real run for a version
  #   whose tag exists builds nothing and creates nothing, and does not fail,
  #   because immutable releases cannot be replaced.
  # - The release waits for publish-crate, so no immutable release exists for a
  #   version that is not on crates.io (cargo-binstall reads the registry manifest).
  # - The release carries a checksums file beside the archives, and each archive
  #   holds the licenses beside the binary and README.
  # The archives are found by [package.metadata.binstall] in the crate's Cargo.toml.

  # Answers one question for the jobs below: does this version's release tag exist
  # already? Releases are immutable here, so an existing tag cannot be refilled or
  # replaced; a real run then skips the build and the release without failing.
  # A dry run builds regardless, since dry-running the current version is the usual case.
  nws-release-state:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish_nws == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.state.outputs.tag_exists }}
    permissions:
      contents: read
    steps:
    - name: Look up the release tag
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_nws }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="monochromatic-nested-wayland-session-v${VERSION}"
        # A 404 means the tag is absent; any other failure (rate limit, outage) must fail
        # this job rather than read as "absent" and fail later at `gh release create`.
        if reply=$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>&1); then
          echo "::notice::Tag ${tag} already exists; a real run skips the build and the release."
          echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
        elif printf '%s' "$reply" | grep --quiet 'HTTP 404'; then
          echo "Tag ${tag} does not exist yet."
          echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$reply" >&2
          exit 1
        fi

  nws-build-binary:
    needs: [detect, nws-release-state]
    # Not gated on !inputs.dry-run: a dry run builds every target too. A real run
    # builds only while the release tag is free.
    if: ${{ needs.detect.outputs.should_publish_nws == 'true' && (inputs.dry-run || needs.nws-release-state.outputs.tag_exists != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host, so the runners are named, not
        # ubuntu-latest: GitHub moves that label to Ubuntu 26.04 (glibc 2.43) in November 2026,
        # which would raise the floor of every release archive. The arm64 runner is Ubuntu 24.04
        # for the same glibc. The gpc-build-binary matrix does the same.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The build only reads the tree; nothing here needs the token in .git/config.
        persist-credentials: false

    - name: Install system libraries the crate links
      # The same set as the publish job installs for this crate; the Containerfile names the Fedora equivalents.
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config \
          libwayland-dev libxkbcommon-dev libdrm-dev libegl-dev \
          clang libclang-dev

    - name: Add rust target
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: rustup target add "$TARGET"

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies fat LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/nested-wayland-session/cli
      env:
        TARGET: ${{ matrix.target }}
      run: cargo build --release --locked --target "$TARGET"

    # Each runner is native for its target, so the binary can run here. A build that
    # links but cannot start, or that reports another version than Cargo.toml, fails
    # before anything is packaged. Output format: `<bin name> <version>` (clap).
    - name: Smoke-run the binary
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_nws }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='monochromatic-nested-wayland-session'
        got=$("package/nested-wayland-session/cli/target/${TARGET}/release/${bin}" --version)
        want="${bin} ${VERSION}"
        printf 'got:  %s\nwant: %s\n' "$got" "$want"
        [ "$got" = "$want" ]

    # Layout is {name}-{version}-{target}/{bin}, the bin-dir of [package.metadata.binstall];
    # the archive name is its pkg-url file name. The licenses sit beside the binary because
    # the crate is LGPL-3.0-or-later and the archive is a redistribution.
    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_nws }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-nested-wayland-session'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}/LICENSES"
        cp "package/nested-wayland-session/cli/target/${TARGET}/release/${crate}" "dist/${stage_dir}/"
        cp package/nested-wayland-session/cli/README.md "dist/${stage_dir}/"
        cp package/nested-wayland-session/cli/LICENSES/*.txt "dist/${stage_dir}/LICENSES/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Extracts the archive as a consumer would and runs the extracted binary, so a
    # wrong layout or a binary damaged by packaging fails here, not at install time.
    - name: Verify the archive
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_nws }}
        TARGET: ${{ matrix.target }}
        ARCHIVE_PATH: ${{ steps.pkg.outputs.archive_path }}
      run: |
        set -euo pipefail
        crate='monochromatic-nested-wayland-session'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        check_dir=$(mktemp -d)
        tar xzf "$ARCHIVE_PATH" -C "$check_dir"
        for member in "${crate}" README.md LICENSES/LGPL-3.0-or-later.txt LICENSES/GPL-3.0-or-later.txt; do
          test -f "${check_dir}/${stage_dir}/${member}"
        done
        test -x "${check_dir}/${stage_dir}/${crate}"
        got=$("${check_dir}/${stage_dir}/${crate}" --version)
        printf 'extracted binary: %s\n' "$got"
        [ "$got" = "${crate} ${VERSION}" ]

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: nws-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.dry-run && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every
  # asset at creation time, so every archive and the checksums file go up in one call.
  # Tag / asset names are the ones [package.metadata.binstall] in the crate's Cargo.toml
  # names: {name}-v{version} tag, {name}-{version}-{target}.tar.gz asset.
  # Needs publish-crate so no immutable release exists for a version that is not
  # on crates.io: cargo-binstall reads the metadata from the registry copy of the manifest.
  nws-create-release:
    needs: [detect, nws-release-state, publish-crate, nws-build-binary]
    if: ${{ needs.detect.outputs.should_publish_nws == 'true' && !inputs.dry-run && needs.nws-release-state.outputs.tag_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The label step reads one manifest; nothing here pushes or fetches.
        persist-credentials: false

    # The label rule of the owner (doc/planning/crates-io-footprint.md): the note below says where this version went,
    # and this is the same decision the publish job read before the upload.
    - name: Read the label of the released version
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: package/nested-wayland-session/cli/Cargo.toml

    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: nws-bin-*
        path: assets
        merge-multiple: true

    # A missing archive would become a permanent gap in an immutable release, so the
    # expected set is named here instead of trusting whatever the artifacts hold.
    - name: Write the checksums file
      env:
        VERSION: ${{ needs.detect.outputs.version_nws }}
      run: |
        set -euo pipefail
        crate='monochromatic-nested-wayland-session'
        cd assets
        for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
          test -f "${crate}-${VERSION}-${target}.tar.gz"
        done
        test "$(ls | wc --lines)" -eq 2
        sha256sum -- *.tar.gz > "${crate}-${VERSION}-sha256sums.txt"
        cat "${crate}-${VERSION}-sha256sums.txt"

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_nws }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ steps.label.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-nested-wayland-session-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-nested-wayland-session/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "nested-wayland-session v${VERSION}" \
          --notes "monochromatic-nested-wayland-session v${VERSION}. ${crates_io_note}. Linux only (x86_64 and aarch64 gnu). Verify an archive with sha256sum --check against the checksums file or with gh attestation verify." \
          --target "$SHA"

  # monochromatic-search-shadow: the rg, grep and find shadow
  # (doc/planning/agent-search-io-throttle.md). The toolchain installs it with `cargo binstall`
  # through mpm. 0.1.0 was published by hand on 2026-10-29 to bootstrap Trusted Publishing
  # (doc/runbook/publish-crate-first-time.md) and carries no release archives, so binstall
  # compiles it from the registry source (about 9 s measured). From the version that adds
  # [package.metadata.binstall] to the crate's Cargo.toml on, the jobs below also build the
  # two Linux archives (the crate is Linux only: ioprio_set and /proc) and create one
  # immutable release per version, shaped like the nested-wayland-session release.

  # Answers one question for the jobs below: does this version's release tag exist
  # already? Releases are immutable here, so an existing tag cannot be refilled or
  # replaced; a real run then skips the build and the release without failing.
  # A dry run builds regardless, since dry-running the current version is the usual case.
  ss-release-state:
    needs: detect
    if: ${{ needs.detect.outputs.should_publish_ss == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.state.outputs.tag_exists }}
    permissions:
      contents: read
    steps:
    - name: Look up the release tag
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.detect.outputs.version_ss }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="monochromatic-search-shadow-v${VERSION}"
        # A 404 means the tag is absent; any other failure (rate limit, outage) must fail
        # this job rather than read as "absent" and fail later at `gh release create`.
        if reply=$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>&1); then
          echo "::notice::Tag ${tag} already exists; a real run skips the build and the release."
          echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
        elif printf '%s' "$reply" | grep --quiet 'HTTP 404'; then
          echo "Tag ${tag} does not exist yet."
          echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$reply" >&2
          exit 1
        fi

  ss-build-binary:
    needs: [detect, ss-release-state]
    # Not gated on !inputs.dry-run: a dry run builds every target too. A real run
    # builds only while the release tag is free.
    if: ${{ needs.detect.outputs.should_publish_ss == 'true' && (inputs.dry-run || needs.ss-release-state.outputs.tag_exists != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host, so the runners are named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of every release archive). The arm64 runner is Ubuntu 24.04
        # for the same glibc. The nws-build-binary matrix does the same.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The build only reads the tree; nothing here needs the token in .git/config.
        persist-credentials: false

    - name: Add rust target
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: rustup target add "$TARGET"

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/search-shadow/cli
      env:
        TARGET: ${{ matrix.target }}
      run: cargo build --release --locked --target "$TARGET"

    # Each runner is native for its target, so the binary can run here. A build that
    # links but cannot start, or that reports another version than Cargo.toml, fails
    # before anything is packaged. Output format: `<bin name> <version>` (clap); the
    # binary is `search-shadow`, the crate is `monochromatic-search-shadow`.
    - name: Smoke-run the binary
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_ss }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='search-shadow'
        got=$("package/search-shadow/cli/target/${TARGET}/release/${bin}" --version)
        # Since 0.2.1 the line goes on to name the shadowed tools: `search-shadow 0.2.1, a shadow of rg, ...`.
        want="${bin} ${VERSION}, a shadow of "
        printf 'got:  %s\nwant: %s...\n' "$got" "$want"
        [ "${got#"$want"}" != "$got" ]

    # Layout is {name}-{version}-{target}/{bin}, the bin-dir of [package.metadata.binstall];
    # the archive name is its pkg-url file name. The licenses sit beside the binary because
    # the crate is LGPL-3.0-or-later and the archive is a redistribution.
    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_ss }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-search-shadow'
        bin='search-shadow'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}/LICENSES"
        cp "package/search-shadow/cli/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        cp package/search-shadow/cli/README.md "dist/${stage_dir}/"
        cp package/search-shadow/cli/LICENSES/*.txt "dist/${stage_dir}/LICENSES/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Extracts the archive as a consumer would and runs the extracted binary, so a
    # wrong layout or a binary damaged by packaging fails here, not at install time.
    - name: Verify the archive
      shell: bash
      env:
        VERSION: ${{ needs.detect.outputs.version_ss }}
        TARGET: ${{ matrix.target }}
        ARCHIVE_PATH: ${{ steps.pkg.outputs.archive_path }}
      run: |
        set -euo pipefail
        crate='monochromatic-search-shadow'
        bin='search-shadow'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        check_dir=$(mktemp -d)
        tar xzf "$ARCHIVE_PATH" -C "$check_dir"
        for member in "${bin}" README.md LICENSES/LGPL-3.0-or-later.txt LICENSES/GPL-3.0-or-later.txt; do
          test -f "${check_dir}/${stage_dir}/${member}"
        done
        test -x "${check_dir}/${stage_dir}/${bin}"
        got=$("${check_dir}/${stage_dir}/${bin}" --version)
        printf 'extracted binary: %s\n' "$got"
        # Since 0.2.1 the line goes on to name the shadowed tools.
        want="${bin} ${VERSION}, a shadow of "
        [ "${got#"$want"}" != "$got" ]

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ss-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
