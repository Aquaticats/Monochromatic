    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fec-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.dry-run && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every
  # asset at creation time, so every archive and the checksums file go up in one call.
  # Tag / asset names are the ones [package.metadata.binstall] in the crate's Cargo.toml
  # names: {name}-v{version} tag, {name}-{version}-{target}.tar.gz asset.
  # Needs fec-publish-crate so no immutable release exists for a version that is not
  # on crates.io: cargo-binstall reads the metadata from the registry copy of the manifest.
  fec-create-release:
    needs: [fec-detect, fec-release-state, fec-publish-crate, fec-build-binary]
    # `!cancelled()` plus explicit results: fec-publish-crate needs the library publish jobs,
    # which a run that publishes nothing new skips, and the implicit success() would then skip this job too.
    if: ${{ !cancelled() && needs.fec-detect.result == 'success' && needs.fec-release-state.result == 'success' && needs.fec-publish-crate.result == 'success' && needs.fec-build-binary.result == 'success' && needs.fec-detect.outputs.should_publish == 'true' && !inputs.dry-run && needs.fec-release-state.outputs.tag_exists != 'true' }}
