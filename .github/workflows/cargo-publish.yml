        got=$("${check_dir}/${stage_dir}/${bin}" --version)
        printf 'extracted binary: %s\n' "$got"
        [ "$got" = "${bin} ${VERSION}" ]

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ms-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.dry-run && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every
  # asset at creation time, so every archive and the checksums file go up in one call.
  # Tag / asset names are the ones [package.metadata.binstall] in the crate's Cargo.toml
  # names: {name}-v{version} tag, {name}-{version}-{target}.tar.gz asset.
  # Needs ms-publish-crate so no immutable release exists for a version that is not
  # on crates.io: cargo-binstall reads the metadata from the registry copy of the manifest.
  ms-create-release:
    needs: [ms-detect, ms-release-state, ms-publish-crate, ms-build-binary]
    if: ${{ needs.ms-detect.outputs.should_publish == 'true' && !inputs.dry-run && needs.ms-release-state.outputs.tag_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ms-bin-*
        path: assets
        merge-multiple: true

    # A missing archive would become a permanent gap in an immutable release, so the
    # expected set is named here instead of trusting whatever the artifacts hold.
    - name: Write the checksums file
      env:
        VERSION: ${{ needs.ms-detect.outputs.version }}
      run: |
        set -euo pipefail
        crate='monochromatic-mpm-shadow'
        cd assets
        for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
          test -f "${crate}-${VERSION}-${target}.tar.gz"
        done
        test "$(ls | wc --lines)" -eq 2
        sha256sum -- *.tar.gz > "${crate}-${VERSION}-sha256sums.txt"
        cat "${crate}-${VERSION}-sha256sums.txt"

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.ms-detect.outputs.version }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ needs.ms-detect.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-mpm-shadow-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-mpm-shadow/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "mpm-shadow v${VERSION}" \
          --notes "monochromatic-mpm-shadow v${VERSION}. ${crates_io_note}. Linux only (x86_64 and aarch64 gnu). Verify an archive with sha256sum --check against the checksums file or with gh attestation verify." \
          --target "$SHA"

  # monochromatic-pnpm-shadow: the pnpm shadow that warns about dependency versions that are not catalog: or workspace:*
  # before a command that resolves or changes dependencies, then hands over to the real pnpm
  # (doc/handover/catalog-specifier-policy.md). 0.1.0 is published by hand to bootstrap Trusted Publishing
  # (doc/runbook/publish-crate-first-time.md); a dispatch with dry-run off then authenticates, skips the existing
  # upload, builds the two Linux archives (the crate is Unix only: it reads exit signals and replaces itself with pnpm
  # through the Unix process extension) and creates one immutable release per version, shaped like the mpm-shadow release.

  ps-detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
      goes_to_crates_io: ${{ steps.label.outputs.goes_to_crates_io }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    # The label rule of the owner (doc/planning/crates-io-footprint.md): only a plain number and -rc.N go to crates.io.
    # Every step below that touches crates.io reads this decision of its own crate.
    - name: Decide whether the version goes to crates.io
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: 'package/pnpm-shadow/cli/Cargo.toml'

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/pnpm-shadow/cli/Cargo.toml'
        after=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        before=''
        if [ -n "${BEFORE_SHA:-}" ] \
          && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
          # A push can carry several generations, such as a merge whose second parent
          # holds commits that were not on origin yet, so the pre-push head can lie
          # outside the depth-2 checkout. Fetch it instead of reading its absence as
          # a version bump; a failed fetch fails this job, so nothing publishes.
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git cat-file -e "${BEFORE_SHA}:${cargo_toml}" 2>/dev/null; then
            before=$(git show "${BEFORE_SHA}:${cargo_toml}" | awk -F'"' '/^version = / { print $2; exit }')
          fi
        fi
        printf 'before=%s\nafter=%s\n' "$before" "$after"
        if [ -z "$after" ]; then
          echo 'No version found in Cargo.toml; refusing to publish.' >&2
          exit 1
        fi
        publish=false
        if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_CRATE" = 'monochromatic-pnpm-shadow' ]; then
          publish=true
        elif [ "$EVENT_NAME" = 'push' ] && [ "$before" != "$after" ]; then
          publish=true
        fi
        if [ "$publish" = 'true' ]; then
          {
            echo "should_publish=true"
            echo "version=$after"
          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  ps-publish-crate:
    needs: ps-detect
    if: ${{ needs.ps-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install nightly --profile minimal --no-self-update
        rustup default nightly

    # Not cached: the cold build takes a few seconds (clap and the ignore crate are the only sizeable dependencies); a cache would add restore and save steps for almost no gain (doc/decision/ci-caching.md).
    - name: Build .crate package (verifies by compile)
      if: ${{ needs.ps-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/pnpm-shadow/cli
      run: cargo package

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run && needs.ps-detect.outputs.goes_to_crates_io == 'true' }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/pnpm-shadow/cli/target/package/monochromatic-pnpm-shadow-${{ needs.ps-detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run && needs.ps-detect.outputs.goes_to_crates_io == 'true' }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run && needs.ps-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/pnpm-shadow/cli
      run: cargo publish --dry-run --no-verify

    - name: Publish (skips if this version is already on crates.io)
      # Idempotent: skips when the version is already present, so re-runs never fail on a
      # duplicate upload, and a dispatch with dry-run off on 0.1.0 proves the OIDC route.
      if: ${{ !inputs.dry-run && needs.ps-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/pnpm-shadow/cli
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        VERSION: ${{ needs.ps-detect.outputs.version }}
      run: |
        set -euo pipefail
        if curl -sSf -H 'User-Agent: monochromatic-ci' \
          "https://crates.io/api/v1/crates/monochromatic-pnpm-shadow/${VERSION}" >/dev/null 2>&1; then
          echo "::notice::monochromatic-pnpm-shadow ${VERSION} already on crates.io; skipping publish."
        else
          cargo publish --no-verify
        fi

  # Answers one question for the jobs below: does this version's release tag exist
  # already? Releases are immutable here, so an existing tag cannot be refilled or
  # replaced; a real run then skips the build and the release without failing.
  # A dry run builds regardless, since dry-running the current version is the usual case.
  ps-release-state:
    needs: ps-detect
    if: ${{ needs.ps-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.state.outputs.tag_exists }}
    permissions:
      contents: read
    steps:
    - name: Look up the release tag
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.ps-detect.outputs.version }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        tag="monochromatic-pnpm-shadow-v${VERSION}"
        # A 404 means the tag is absent; any other failure (rate limit, outage) must fail
        # this job rather than read as "absent" and fail later at `gh release create`.
        if reply=$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>&1); then
          echo "::notice::Tag ${tag} already exists; a real run skips the build and the release."
          echo 'tag_exists=true' >> "$GITHUB_OUTPUT"
        elif printf '%s' "$reply" | grep --quiet 'HTTP 404'; then
          echo "Tag ${tag} does not exist yet."
          echo 'tag_exists=false' >> "$GITHUB_OUTPUT"
        else
          printf '%s\n' "$reply" >&2
          exit 1
        fi

  ps-build-binary:
    needs: [ps-detect, ps-release-state]
    # Not gated on !inputs.dry-run: a dry run builds every target too. A real run
    # builds only while the release tag is free.
    if: ${{ needs.ps-detect.outputs.should_publish == 'true' && (inputs.dry-run || needs.ps-release-state.outputs.tag_exists != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host, so the runners are named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of every release archive). The arm64 runner is Ubuntu 24.04
        # for the same glibc. The nws-build-binary matrix does the same.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1
        # The build only reads the tree; nothing here needs the token in .git/config.
        persist-credentials: false

    - name: Add rust target
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: rustup target add "$TARGET"

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/pnpm-shadow/cli
      env:
        TARGET: ${{ matrix.target }}
      run: cargo build --release --locked --target "$TARGET"

    # Each runner is native for its target, so the binary can run here. A build that
    # links but cannot start, or that reports another version than Cargo.toml, fails
    # before anything is packaged. Output format: `<bin name> <version>` (clap); the
    # binary is `pnpm-shadow`, the crate is `monochromatic-pnpm-shadow`.
    - name: Smoke-run the binary
      shell: bash
      env:
        VERSION: ${{ needs.ps-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='pnpm-shadow'
        got=$("package/pnpm-shadow/cli/target/${TARGET}/release/${bin}" --version)
        want="${bin} ${VERSION}"
        printf 'got:  %s\nwant: %s\n' "$got" "$want"
        [ "$got" = "$want" ]

    # Layout is {name}-{version}-{target}/{bin}, the bin-dir of [package.metadata.binstall];
    # the archive name is its pkg-url file name. The licenses sit beside the binary because
    # the crate is LGPL-3.0-or-later and the archive is a redistribution.
    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.ps-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-pnpm-shadow'
        bin='pnpm-shadow'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}/LICENSES"
        cp "package/pnpm-shadow/cli/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        cp package/pnpm-shadow/cli/README.md "dist/${stage_dir}/"
        cp package/pnpm-shadow/cli/LICENSES/*.txt "dist/${stage_dir}/LICENSES/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    # Extracts the archive as a consumer would and runs the extracted binary, so a
    # wrong layout or a binary damaged by packaging fails here, not at install time.
    - name: Verify the archive
      shell: bash
      env:
        VERSION: ${{ needs.ps-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
        ARCHIVE_PATH: ${{ steps.pkg.outputs.archive_path }}
      run: |
        set -euo pipefail
        crate='monochromatic-pnpm-shadow'
        bin='pnpm-shadow'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        check_dir=$(mktemp -d)
        tar xzf "$ARCHIVE_PATH" -C "$check_dir"
        for member in "${bin}" README.md LICENSES/LGPL-3.0-or-later.txt LICENSES/GPL-3.0-or-later.txt; do
          test -f "${check_dir}/${stage_dir}/${member}"
        done
        test -x "${check_dir}/${stage_dir}/${bin}"
        got=$("${check_dir}/${stage_dir}/${bin}" --version)
        printf 'extracted binary: %s\n' "$got"
        [ "$got" = "${bin} ${VERSION}" ]

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released. A dry run's copy lives one day.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ps-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: ${{ inputs.dry-run && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every
  # asset at creation time, so every archive and the checksums file go up in one call.
  # Tag / asset names are the ones [package.metadata.binstall] in the crate's Cargo.toml
  # names: {name}-v{version} tag, {name}-{version}-{target}.tar.gz asset.
  # Needs ps-publish-crate so no immutable release exists for a version that is not
  # on crates.io: cargo-binstall reads the metadata from the registry copy of the manifest.
  ps-create-release:
    needs: [ps-detect, ps-release-state, ps-publish-crate, ps-build-binary]
    if: ${{ needs.ps-detect.outputs.should_publish == 'true' && !inputs.dry-run && needs.ps-release-state.outputs.tag_exists != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ps-bin-*
        path: assets
        merge-multiple: true

    # A missing archive would become a permanent gap in an immutable release, so the
    # expected set is named here instead of trusting whatever the artifacts hold.
    - name: Write the checksums file
      env:
        VERSION: ${{ needs.ps-detect.outputs.version }}
      run: |
        set -euo pipefail
        crate='monochromatic-pnpm-shadow'
        cd assets
        for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
          test -f "${crate}-${VERSION}-${target}.tar.gz"
        done
        test "$(ls | wc --lines)" -eq 2
        sha256sum -- *.tar.gz > "${crate}-${VERSION}-sha256sums.txt"
        cat "${crate}-${VERSION}-sha256sums.txt"

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.ps-detect.outputs.version }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ needs.ps-detect.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-pnpm-shadow-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-pnpm-shadow/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "pnpm-shadow v${VERSION}" \
          --notes "monochromatic-pnpm-shadow v${VERSION}. ${crates_io_note}. Linux only (x86_64 and aarch64 gnu). Verify an archive with sha256sum --check against the checksums file or with gh attestation verify." \
          --target "$SHA"

  # monochromatic-lint: the repository's Rust, Markdown and MDX linter
  # (doc/planning/unified-linter.md, `Distribution and consumers`). It ships
  # like forbidden-strings: the same eight release targets, and tag and asset
  # names in cargo-binstall's default templates ({name}-v{version} tag,
  # {name}-{version}-{target}.tar.gz or .zip, {name}-{version}-{target}/{bin}
  # inside), so `cargo binstall monochromatic-lint` and the cargo-install fallback
  # find the archives with no [package.metadata.binstall]. Two differences:
  # - The publish step is the idempotent one of the later crates, because 0.1.0
  #   is published by hand to bootstrap Trusted Publishing
  #   (doc/runbook/publish-crate-first-time.md); a dispatch with dry-run off
  #   then authenticates, skips the existing upload, and builds the release.
  # - The binary matrix also runs in a dry run, so a dry dispatch proves every
  #   release target still builds with the rust-analyzer and Satteri
  #   dependencies; attestation and the release stay behind !inputs.dry-run.
  # The matrix compiles with each runner's preinstalled rustup toolchain, not
  # the repository's nightly toolchain, exactly as the forbidden-strings matrix does.

  ml-detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
      goes_to_crates_io: ${{ steps.label.outputs.goes_to_crates_io }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    # The label rule of the owner (doc/planning/crates-io-footprint.md): only a plain number and -rc.N go to crates.io.
    # Every step below that touches crates.io reads this decision of its own crate.
    - name: Decide whether the version goes to crates.io
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: 'package/linter/monochromatic-lint/Cargo.toml'

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/linter/monochromatic-lint/Cargo.toml'
        after=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        before=''
        if [ -n "${BEFORE_SHA:-}" ] \
          && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
          # A push can carry several generations, such as a merge whose second parent
          # holds commits that were not on origin yet, so the pre-push head can lie
          # outside the depth-2 checkout. Fetch it instead of reading its absence as
          # a version bump; a failed fetch fails this job, so nothing publishes.
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git cat-file -e "${BEFORE_SHA}:${cargo_toml}" 2>/dev/null; then
            before=$(git show "${BEFORE_SHA}:${cargo_toml}" | awk -F'"' '/^version = / { print $2; exit }')
          fi
        fi
        printf 'before=%s\nafter=%s\n' "$before" "$after"
        if [ -z "$after" ]; then
          echo 'No version found in Cargo.toml; refusing to publish.' >&2
          exit 1
        fi
        publish=false
        if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_CRATE" = 'monochromatic-lint' ]; then
          publish=true
        elif [ "$EVENT_NAME" = 'push' ] && [ "$before" != "$after" ]; then
          publish=true
        fi
        if [ "$publish" = 'true' ]; then
          {
            echo "should_publish=true"
            echo "version=$after"
          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  ml-publish-crate:
    needs: ml-detect
    if: ${{ needs.ml-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install nightly --profile minimal --no-self-update
        rustup default nightly

    # Key shape, restore-keys rule, and size budget: doc/decision/ci-caching.md
    - name: Identify the Rust toolchain for the cache key
      id: toolchain
      run: echo "id=${ImageOS}-$(rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Cache cargo build artifacts
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          package/linter/monochromatic-lint/target
          !package/linter/monochromatic-lint/target/package
        key: cargo-v2-publish-ml-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/linter/monochromatic-lint/Cargo.lock') }}
        restore-keys: |
          cargo-v2-publish-ml-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

    # Verifying compiles the packaged crate against its crates.io dependencies,
    # including the published monochromatic-jsonc-edit rather than the path copy.
    - name: Build .crate package (verifies by compile)
      if: ${{ needs.ml-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/linter/monochromatic-lint
      run: cargo package

    - name: Log cargo directory sizes
      if: always()
      run: |
        du --summarize --human-readable package/linter/monochromatic-lint/target "$HOME/.cargo/registry" "$HOME/.cargo/git" || true
        du --max-depth=2 --human-readable package/linter/monochromatic-lint/target | sort --human-numeric-sort --reverse | head --lines=15 || true

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run && needs.ml-detect.outputs.goes_to_crates_io == 'true' }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/linter/monochromatic-lint/target/package/monochromatic-lint-${{ needs.ml-detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run && needs.ml-detect.outputs.goes_to_crates_io == 'true' }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run && needs.ml-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/linter/monochromatic-lint
      run: cargo publish --dry-run --no-verify

    - name: Publish (skips if this version is already on crates.io)
      if: ${{ !inputs.dry-run && needs.ml-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/linter/monochromatic-lint
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        VERSION: ${{ needs.ml-detect.outputs.version }}
      run: |
        set -euo pipefail
        if curl -sSf -H 'User-Agent: monochromatic-ci' \
          "https://crates.io/api/v1/crates/monochromatic-lint/${VERSION}" >/dev/null 2>&1; then
          echo "::notice::monochromatic-lint ${VERSION} already on crates.io; skipping publish."
        else
          cargo publish --no-verify
        fi

  ml-build-binary:
    needs: ml-detect
    # Not gated on !inputs.dry-run: a dry run builds every target too.
    if: ${{ needs.ml-detect.outputs.should_publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The gnu archive links the glibc of its build host, so its runner is named, not
        # ubuntu-latest (GitHub moves that label to Ubuntu 26.04 in November 2026, which
        # would raise the floor of the monochromatic-lint gnu archive). The arm64 runner is
        # Ubuntu 24.04 for the same glibc. The musl legs stay on ubuntu-latest: a statically
        # linked musl binary carries no glibc floor.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: x86_64-unknown-linux-musl
          runner: ubuntu-latest
          needs_musl: true
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
        - target: aarch64-unknown-linux-musl
          runner: ubuntu-24.04-arm
          needs_musl: true
        - target: x86_64-apple-darwin
          runner: macos-latest
        - target: aarch64-apple-darwin
          runner: macos-latest
        - target: x86_64-pc-windows-msvc
          runner: windows-latest
        - target: aarch64-pc-windows-msvc
          runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install musl tools
      if: ${{ matrix.needs_musl }}
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml applies fat LTO and one codegen unit.
    - name: Build binary
      shell: bash
      working-directory: package/linter/monochromatic-lint
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.ml-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        bin='monochromatic-lint'
        ext=''
        case "$TARGET" in
          *windows*) ext='.exe' ;;
        esac
        stage_dir="monochromatic-lint-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/linter/monochromatic-lint/target/${TARGET}/release/${bin}${ext}" "dist/${stage_dir}/"
        if [ -f package/linter/monochromatic-lint/README.md ]; then
          cp package/linter/monochromatic-lint/README.md "dist/${stage_dir}/"
        fi
        case "$TARGET" in
          *windows*)
            archive="${stage_dir}.zip"
            (cd dist && 7z a "${archive}" "${stage_dir}" >/dev/null)
            ;;
          *)
            archive="${stage_dir}.tar.gz"
            (cd dist && tar czf "${archive}" "${stage_dir}")
            ;;
        esac
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ml-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  ml-create-release:
    needs: [ml-detect, ml-build-binary]
    if: ${{ needs.ml-detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: ml-bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.ml-detect.outputs.version }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ needs.ml-detect.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-lint-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-lint/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "monochromatic-lint v${VERSION}" \
          --notes "monochromatic-lint v${VERSION}. ${crates_io_note}" \
          --target "$SHA"

  # monochromatic-git-policy-cli: the native Git policy wrapper (doc/planning/cli-git-native-cutover.md,
  # `Publishing the native crate`). It follows the monochromatic-lint jobs above, with these differences:
  # - Linux GNU targets only (x86_64 and aarch64). The Windows and macOS branches of the code never compiled in a
  #   release gate, and the repository's immutable releases mean one failing target produces no release.
  # - The executable is named after the crate (the owner renamed it from `cli-git-native` on 2026-11-04, so the archive of
  #   a release before that holds `cli-git-native`), so the archive holds
  #   monochromatic-git-policy-cli-<version>-<target>/monochromatic-git-policy-cli, the layout the crate's
  #   [package.metadata.binstall] table points at. It is the crate's only `[[bin]]`: the commit service is its mode
  #   `monochromatic-git-policy-cli monochromatic-git-policy-cli service run`, because cargo-binstall refuses an archive that
  #   lacks any `[[bin]]` of the crate (the second `cli-git-service` bin added on 2026-11-01 turned the catalog-specifiers
  #   workflow red).
  #   `package/git-policy/cli/bin/native-release-bins.unit.test.ts` fails when this job, Cargo.toml,
  #   releasable-crates.json and toolchain.lock.json list different executables.
  # - The crate links forbidden-strings by path in the repository and by version on crates.io once packaged, so the
  #   publish job waits until the required forbidden-strings release is in the crates.io index, which lets one push
  #   carry both version bumps.
  # - A smoke step runs each built executable, so a target that links but cannot start produces no release.
  # - The release also needs gpc-publish-crate, unlike ml-create-release, so a run that cannot authenticate or publish
  #   creates no immutable release for a crate that is not on crates.io.
  # First publication (0.1.0) is by hand to bootstrap Trusted Publishing
  # (doc/runbook/publish-crate-first-time.md); a later run authenticates, skips the existing upload, and builds the
  # release. The matrix compiles with each runner's preinstalled rustup toolchain, as the matrices above do.

  gpc-detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
      goes_to_crates_io: ${{ steps.label.outputs.goes_to_crates_io }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    # The label rule of the owner (doc/planning/crates-io-footprint.md): only a plain number and -rc.N go to crates.io.
    # Every step below that touches crates.io reads this decision of its own crate.
    - name: Decide whether the version goes to crates.io
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: 'package/git-policy/cli/Cargo.toml'

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/git-policy/cli/Cargo.toml'
        after=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        before=''
        if [ -n "${BEFORE_SHA:-}" ] \
          && [ "$BEFORE_SHA" != '0000000000000000000000000000000000000000' ]; then
          # A push can carry several generations, such as a merge whose second parent
          # holds commits that were not on origin yet, so the pre-push head can lie
          # outside the depth-2 checkout. Fetch it instead of reading its absence as
          # a version bump; a failed fetch fails this job, so nothing publishes.
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi
          if git cat-file -e "${BEFORE_SHA}:${cargo_toml}" 2>/dev/null; then
            before=$(git show "${BEFORE_SHA}:${cargo_toml}" | awk -F'"' '/^version = / { print $2; exit }')
          fi
        fi
        printf 'before=%s\nafter=%s\n' "$before" "$after"
        if [ -z "$after" ]; then
          echo 'No version found in Cargo.toml; refusing to publish.' >&2
          exit 1
        fi
        publish=false
        if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_CRATE" = 'monochromatic-git-policy-cli' ]; then
          publish=true
        elif [ "$EVENT_NAME" = 'push' ] && [ "$before" != "$after" ]; then
          publish=true
        fi
        if [ "$publish" = 'true' ]; then
          {
            echo "should_publish=true"
            echo "version=$after"
          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  gpc-publish-crate:
    needs: gpc-detect
    if: ${{ needs.gpc-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install nightly --profile minimal --no-self-update
        rustup default nightly

    # Packaging replaces the path dependency with its version requirement, so the crates.io index must already
    # list the forbidden-strings release this crate requires. A push that bumps both crates starts the
    # forbidden-strings publish job in the same run; this step waits for it for up to thirty minutes.
    # The Rust catalog writes path dependencies as exact requirements (`version = "=0.5.0"`),
    # and the index lists bare versions (`"vers":"0.5.0"`), so the extraction drops a leading `=`.
    - name: Wait for the required forbidden-strings release
      if: ${{ needs.gpc-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/git-policy/cli
      run: |
        set -euo pipefail
        required=$(sed -n 's/^forbidden-strings = .*version = "=\{0,1\}\([^"]*\)".*/\1/p' Cargo.toml)
        if [ -z "$required" ]; then
          echo 'No forbidden-strings version requirement found in Cargo.toml.' >&2
          exit 1
        fi
        for attempt in $(seq 1 60); do
          if curl -sSf -H 'User-Agent: monochromatic-ci' https://index.crates.io/fo/rb/forbidden-strings \
            | grep -q "\"vers\":\"${required}\""; then
            echo "forbidden-strings ${required} is in the crates.io index."
            exit 0
          fi
          echo "forbidden-strings ${required} is not in the crates.io index yet (attempt ${attempt} of 60)."
          sleep 30
        done
        echo "forbidden-strings ${required} did not appear in the crates.io index." >&2
        exit 1

    # Key shape, restore-keys rule, and size budget: doc/decision/ci-caching.md
    - name: Identify the Rust toolchain for the cache key
      id: toolchain
      run: echo "id=${ImageOS}-$(rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

    - name: Cache cargo build artifacts
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: |
          package/git-policy/cli/target
          !package/git-policy/cli/target/package
        key: cargo-v2-publish-gpc-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/git-policy/cli/Cargo.lock') }}
        restore-keys: |
          cargo-v2-publish-gpc-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

    # Verifying compiles the packaged crate against its crates.io dependencies,
    # including the published forbidden-strings and monochromatic-jsonc-edit rather than the path copies.
    - name: Build .crate package (verifies by compile)
      if: ${{ needs.gpc-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/git-policy/cli
      run: cargo package --locked

    - name: Log cargo directory sizes
      if: always()
      run: |
        du --summarize --human-readable package/git-policy/cli/target "$HOME/.cargo/registry" "$HOME/.cargo/git" || true
        du --max-depth=2 --human-readable package/git-policy/cli/target | sort --human-numeric-sort --reverse | head --lines=15 || true

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run && needs.gpc-detect.outputs.goes_to_crates_io == 'true' }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/git-policy/cli/target/package/monochromatic-git-policy-cli-${{ needs.gpc-detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run && needs.gpc-detect.outputs.goes_to_crates_io == 'true' }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run && needs.gpc-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/git-policy/cli
      run: cargo publish --dry-run --locked --no-verify

    - name: Publish (skips if this version is already on crates.io)
      if: ${{ !inputs.dry-run && needs.gpc-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/git-policy/cli
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        VERSION: ${{ needs.gpc-detect.outputs.version }}
      run: |
        set -euo pipefail
        if curl -sSf -H 'User-Agent: monochromatic-ci' \
          "https://crates.io/api/v1/crates/monochromatic-git-policy-cli/${VERSION}" >/dev/null 2>&1; then
          echo "::notice::monochromatic-git-policy-cli ${VERSION} already on crates.io; skipping publish."
        else
          cargo publish --locked --no-verify
        fi

  gpc-build-binary:
    needs: gpc-detect
    # Not gated on !inputs.dry-run: a dry run builds every target too.
    if: ${{ needs.gpc-detect.outputs.should_publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        # The archive links the glibc of its build host (pidfd_spawnp needs glibc 2.39), so the runner is named, not
        # ubuntu-latest: GitHub moves that label to Ubuntu 26.04 (glibc 2.43) in November 2026, which would raise the
        # floor of every release archive. The arm64 runner below is named for the same glibc.
        - target: x86_64-unknown-linux-gnu
          runner: ubuntu-24.04
        - target: aarch64-unknown-linux-gnu
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Add rust target
      shell: bash
      run: rustup target add ${{ matrix.target }}

    - name: Show the toolchain that builds the release
      shell: bash
      run: rustc --version --verbose

    # --locked builds the dependency versions the published crate's Cargo.lock
    # records; the release profile in Cargo.toml keeps panic = "unwind", which the linked scanner requires.
    - name: Build binary
      shell: bash
      working-directory: package/git-policy/cli
      run: cargo build --release --locked --target ${{ matrix.target }} --bin monochromatic-git-policy-cli

    # The wrapper answers `monochromatic-git-policy-cli --help` without a repository, so a target that links but cannot start fails here.
    - name: Smoke-run the binary
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        help=$("package/git-policy/cli/target/${TARGET}/release/monochromatic-git-policy-cli" monochromatic-git-policy-cli --help)
        printf '%s\n' "$help" | grep -q '^Usage: git monochromatic-git-policy-cli'

    - name: Package binary archive
      id: pkg
      shell: bash
      env:
        VERSION: ${{ needs.gpc-detect.outputs.version }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        crate='monochromatic-git-policy-cli'
        bin='monochromatic-git-policy-cli'
        stage_dir="${crate}-${VERSION}-${TARGET}"
        mkdir -p "dist/${stage_dir}"
        cp "package/git-policy/cli/target/${TARGET}/release/${bin}" "dist/${stage_dir}/"
        cp package/git-policy/cli/README.md "dist/${stage_dir}/"
        archive="${stage_dir}.tar.gz"
        (cd dist && tar czf "${archive}" "${stage_dir}")
        archive_path="dist/${archive}"
        echo "archive_path=${archive_path}" >> "$GITHUB_OUTPUT"
        echo "archive_name=${archive}" >> "$GITHUB_OUTPUT"
        ls -la dist/

    - name: Attest binary provenance
      if: ${{ !inputs.dry-run }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: ${{ steps.pkg.outputs.archive_path }}

    # Uploaded in a dry run too, so the archive layout can be inspected and the
    # binary run before anything is released.
    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gpc-bin-${{ matrix.target }}
        path: ${{ steps.pkg.outputs.archive_path }}
        if-no-files-found: error
        retention-days: 7

  gpc-create-release:
    needs: [gpc-detect, gpc-publish-crate, gpc-build-binary]
    if: ${{ needs.gpc-detect.outputs.should_publish == 'true' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download all binary archives
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: gpc-bin-*
        path: assets
        merge-multiple: true

    - name: Create GitHub release with all archives
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.gpc-detect.outputs.version }}
        SHA: ${{ github.sha }}
        REPO: ${{ github.repository }}
        GOES_TO_CRATES_IO: ${{ needs.gpc-detect.outputs.goes_to_crates_io }}
      run: |
        set -euo pipefail
        tag="monochromatic-git-policy-cli-v${VERSION}"
        if [ "$GOES_TO_CRATES_IO" = 'true' ]; then
          crates_io_note="crates.io: https://crates.io/crates/monochromatic-git-policy-cli/${VERSION}"
        else
          crates_io_note='Not published to crates.io: a version labelled alpha or beta goes to GitHub releases only.'
        fi
        ls -la assets/
        gh release create "$tag" assets/* \
          --repo "$REPO" \
          --title "monochromatic-git-policy-cli v${VERSION}" \
          --notes "monochromatic-git-policy-cli v${VERSION}. ${crates_io_note}" \
          --target "$SHA"

  # The Rust file-enforcer (doc/decision/file-enforcer-rust-rewrite.md) is five crates that publish in
  # dependency order: monochromatic-jsonc-edit (the xe, dc, bl and fe jobs below need its version that
  # carries the span API), then monochromatic-xml-edit (xe), monochromatic-dependency-catalog (dc) and
  # monochromatic-browserslist (bl), which have no first-party dependency on each other, then
  # monochromatic-file-enforcer (fe), then monochromatic-file-enforcer-cli (fec), which also ships the
  # `file-enforcer` binary. A crate's `cargo package` step verifies by compiling against crates.io, so a
  # dependency published in the same run must already be indexed; the `needs:` below chain the publish
  # jobs, and `!cancelled()` plus the result checks let a dependent run when a prerequisite was skipped
  # because its own version did not change, but never when one failed. 0.1.0 of each crate is published by
  # hand to bootstrap Trusted Publishing (doc/runbook/publish-crate-first-time.md); from then on the
  # idempotent publish steps skip a version that is already on crates.io.


  xe-detect:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
      goes_to_crates_io: ${{ steps.label.outputs.goes_to_crates_io }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 2

    # The label rule of the owner (doc/planning/crates-io-footprint.md): only a plain number and -rc.N go to crates.io.
    # Every step below that touches crates.io reads this decision of its own crate.
    - name: Decide whether the version goes to crates.io
      id: label
      uses: ./.github/actions/decide-whether-a-version-goes-to-crates-io
      with:
        manifest-path: 'package/xml-edit/core-rust/Cargo.toml'

    - name: Detect version bump
      id: detect
      env:
        BEFORE_SHA: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_CRATE: ${{ github.event.inputs.crate }}
      run: |
        set -euo pipefail
        cargo_toml='package/xml-edit/core-rust/Cargo.toml'
        after=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        before=''
        if [ -n "${BEFORE_SHA:-}" ] \
