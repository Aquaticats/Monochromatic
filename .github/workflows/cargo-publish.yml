    if: ${{ needs.ss-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install nightly --profile minimal --no-self-update
        rustup default nightly

    # Not cached: the cold build takes a few seconds (clap is the only sizeable dependency); a cache would add restore and save steps for almost no gain (doc/decision/ci-caching.md).
    - name: Build .crate package (verifies by compile)
      if: ${{ needs.ss-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/search-shadow/cli
      run: cargo package

    - name: Attest .crate provenance
      if: ${{ !inputs.dry-run && needs.ss-detect.outputs.goes_to_crates_io == 'true' }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: 'package/search-shadow/cli/target/package/monochromatic-search-shadow-${{ needs.ss-detect.outputs.version }}.crate'

    - name: Authenticate with crates.io (Trusted Publishing)
      if: ${{ !inputs.dry-run && needs.ss-detect.outputs.goes_to_crates_io == 'true' }}
      id: auth
      uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe

    - name: Publish (dry run)
      if: ${{ inputs.dry-run && needs.ss-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/search-shadow/cli
      run: cargo publish --dry-run --no-verify

    - name: Publish (skips if this version is already on crates.io)
      # Idempotent: skips when the version is already present, so re-runs never fail on a
      # duplicate upload, and a dispatch with dry-run off on 0.1.0 proves the OIDC route.
      if: ${{ !inputs.dry-run && needs.ss-detect.outputs.goes_to_crates_io == 'true' }}
      working-directory: package/search-shadow/cli
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        VERSION: ${{ needs.ss-detect.outputs.version }}
      run: |
        set -euo pipefail
        if curl -sSf -H 'User-Agent: monochromatic-ci' \
          "https://crates.io/api/v1/crates/monochromatic-search-shadow/${VERSION}" >/dev/null 2>&1; then
