          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  je-publish-crate:
    needs: je-detect
    if: ${{ needs.je-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
