        fi
        printf 'before=%s\nafter=%s\n' "$before" "$after"
        if [ -z "$after" ]; then
          echo 'No version found in Cargo.toml; refusing to publish.' >&2
          exit 1
        fi
        publish=false
        if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$INPUT_CRATE" = 'monochromatic-cargo-shadow' ]; then
          publish=true
        elif [ "$EVENT_NAME" = 'push' ] && [ "$before" != "$after" ]; then
          publish=true
        fi
        if [ "$publish" = 'true' ]; then
          {
            echo "should_publish=true"
            echo "version=$after"
          } >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  cgs-publish-crate:
    needs: cgs-detect
    if: ${{ needs.cgs-detect.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Install Rust toolchain
      shell: bash
      run: |
        set -euo pipefail
