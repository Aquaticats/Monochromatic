name: forbidden-strings

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # actions: read lets the scan step list this workflow's past runs
  # (gh run list) to find the last validated push head. Read-only.
  actions: read
  contents: read
  attestations: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0

    - name: Download prebuilt forbidden-strings binary
      # The cargo-publish.yml workflow uploads SLSA-attested binaries for
      # x86_64-unknown-linux-gnu (and six other targets) on every
      # Cargo.toml version bump merged to main. We try the Cargo.toml
      # version first so the scanner matches the source tree, then fall
      # back to the latest release to cover the window between a
      # version-bump PR merging and cargo-publish.yml finishing.
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        cargo_toml='package/forbidden-strings/cli/Cargo.toml'
        version=$(awk -F'"' '/^version = / { print $2; exit }' "$cargo_toml")
        tag="forbidden-strings-v${version}"
        archive="forbidden-strings-${version}-x86_64-unknown-linux-gnu.tar.gz"
        # Download the public asset directly. `gh release view/download` use
        # the shared installation REST quota and can mask HTTP 403 as 404.
        status=$(curl --silent --show-error --location --output "$archive" --write-out '%{http_code}' \
          "https://github.com/$REPO/releases/download/$tag/$archive")
        if [ "$status" = '404' ]; then
          echo "::notice::Release $tag not yet published; falling back to latest forbidden-strings-v* release."
          tag=$(gh release list --repo "$REPO" --limit 50 --json tagName \
            --jq '[.[].tagName | select(startswith("forbidden-strings-v"))][0] // ""')
          if [ -z "$tag" ]; then
            echo "::error::No forbidden-strings-v* release found in $REPO." >&2
            exit 1
          fi
          version="${tag#forbidden-strings-v}"
          echo "Using fallback release: $tag"
          archive="forbidden-strings-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/$REPO/releases/download/$tag/$archive"
        elif [ "$status" != '200' ]; then
          echo "::error::Downloading $archive from $REPO returned HTTP $status." >&2
          exit 1
        fi

        # SLSA build-provenance: binds the archive's sha256 to the
        # cargo-publish.yml run that produced it. A swapped-out release
        # asset would fail this step.
        if [ "$version" = '0.5.0' ]; then
          # This release was signed before the organization transfer. Retain
          # its original signed bundle and exact signing identity; signatures
          # and the archive digest are still verified by gh.
          gh attestation verify "$archive" --repo Aquaticat/Monochromatic \
            --signer-workflow Aquaticat/Monochromatic/.github/workflows/cargo-publish.yml \
            --bundle package/forbidden-strings/cli/provenance/0.5.0-x86_64-unknown-linux-gnu.sigstore.jsonl
        else
          gh attestation verify "$archive" --repo "$REPO"
        fi

        # Install to a path on PATH so downstream steps invoke the binary
        # as plain `forbidden-strings`. Lives under RUNNER_TEMP so it
        # doesn't pollute the working tree.
        bin_dir="$RUNNER_TEMP/forbidden-strings"
        mkdir -p "$bin_dir"
        tar -xzf "$archive" \
          --strip-components=1 \
          -C "$bin_dir" \
          "forbidden-strings-${version}-x86_64-unknown-linux-gnu/forbidden-strings"
        chmod +x "$bin_dir/forbidden-strings"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/forbidden-strings" --version

    - name: Materialize deny-list
      # De-root design (commit 58995afff): no root example file and no root
      # rules file exist anymore. Compose the runtime rules file from the
      # committed shared appendix (forbidden-strings.append.txt, non-sensitive
      # repo-wide rules) plus the per-repo secret when one is configured. The
      # embedded betterleaks-ported baseline is NOT a file here: the scan steps
      # activate it with --builtin-rules, which reads it from inside the
      # downloaded binary. This keeps the baseline credential scan running even when
      # no secret exists, while the sensitive repo-specific literals stay
      # out-of-band: the gitignored forbidden-strings.append.local.txt is
      # absent in CI, so its sensitive equivalent is the FORBIDDEN_STRINGS_LIST
      # secret. Compose under RUNNER_TEMP so the secret-bearing file never
      # enters the working tree, and use printenv (not shell interpolation) so
      # the secret bytes are never expanded into a logged command line.
      env:
        FORBIDDEN_STRINGS_LIST: ${{ secrets.FORBIDDEN_STRINGS_LIST }}
      run: |
        set -euo pipefail
        rules="$RUNNER_TEMP/forbidden-strings.rules.txt"
        cp forbidden-strings.append.txt "$rules"
        chmod 600 "$rules"
        if [ -n "$FORBIDDEN_STRINGS_LIST" ]; then
          printenv FORBIDDEN_STRINGS_LIST >> "$rules"
        else
          echo "::notice::FORBIDDEN_STRINGS_LIST secret not set; baseline + shared appendix scan."
        fi

    - name: List changed files
      # Scope follows validation state, not the push event range (issue #993).
      # The push baseline is the newest commit whose tree an earlier successful
      # run of this workflow already validated. Only successful runs establish
      # such a baseline, so a canceled, failed, or timed-out run can never hide
      # its changes from later runs. `validated-tree-watermark-v1` marks
      # workflow revisions whose push runs scan the tree-to-tree delta from
      # their baseline, which proves their own head tree; runs of earlier
      # revisions scanned only their own push range and must never be trusted
      # as baselines. Without a suitable baseline (the first marked run, a
      # rewritten main, or an unavailable run list) the current tree is
      # scanned instead, the only coverage-safe answer. Pull requests and
      # merge groups keep their cumulative merge-base comparison and never
      # establish a baseline.
      #
      # `--raw` carries each entry's mode in the tree next to its path, which
      # the next step needs to tell a file from a folder link; `--no-renames`
      # keeps one record and one path per change, as `--name-only` did.
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_SHA: ${{ github.sha }}
        BRANCH: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        comparison_file="$RUNNER_TEMP/forbidden-strings.comparison"
        changed_list="$RUNNER_TEMP/forbidden-strings.changed-raw"
        whole_tree_marker="$RUNNER_TEMP/forbidden-strings.whole-tree"
        comparison=''
        if [ "$EVENT_NAME" = 'push' ]; then
          watermark=''
          candidates=''
          if ! candidates=$(gh run list \
            --repo "$REPO" \
            --workflow forbidden-strings.yml \
            --branch "$BRANCH" \
            --event push \
            --status success \
            --limit 50 \
            --json headSha \
            --jq '.[].headSha'); then
            echo '::notice::Workflow-run listing failed; scanning the current tree instead.'
          fi
          mapfile -t candidate_shas <<< "$candidates"
          for candidate in "${candidate_shas[@]}"; do
            [ -n "$candidate" ] || continue
            if ! git cat-file -e "$candidate^{commit}" 2>/dev/null; then continue; fi
            if ! git merge-base --is-ancestor "$candidate" "$HEAD_SHA"; then continue; fi
            candidate_workflow=$(git show "$candidate:.github/workflows/forbidden-strings.yml" 2>/dev/null) || candidate_workflow=''
            if ! grep -qF 'validated-tree-watermark-v1' <<< "$candidate_workflow"; then continue; fi
            # Any validated tree is coverage-safe; keep the one nearest to
            # HEAD so the scanned delta stays small.
            if [ -z "$watermark" ]; then
              watermark="$candidate"
            elif [ "$(git rev-list --count "$candidate".."$HEAD_SHA")" -lt "$(git rev-list --count "$watermark".."$HEAD_SHA")" ]; then
              watermark="$candidate"
            fi
          done
          if [ -n "$watermark" ]; then
            if ! git diff --raw --no-renames --diff-filter=ACMRT -z "$watermark" "$HEAD_SHA" > "$changed_list"; then
              echo "::error::Could not list files changed since validated commit $watermark." >&2
              exit 1
            fi
            comparison="$watermark..$HEAD_SHA"
          else
            : > "$whole_tree_marker"
          fi
        else
          if ! git diff --raw --no-renames --diff-filter=ACMRT -z origin/main...HEAD > "$changed_list"; then
            echo '::error::Could not list files changed against origin/main.' >&2
            exit 1
          fi
          comparison='origin/main...HEAD'
        fi
        printf '%s\n' "$comparison" > "$comparison_file"

    - name: Scan changed files
      # A content scan opens each changed entry as a file, and two kinds of tree
      # entry cannot be opened that way: a tracked link to a folder (the
      # scanner's `fs::read` follows it and fails with
      # `Is a directory (os error 21)`) and a submodule gitlink (its path is a
      # folder or absent). The `--all` walk leaves both out already
      # (`Mode::SYMLINK` and `Mode::COMMIT` in `src/walk.rs`); this step leaves
      # them out of the positional list, and the two steps after it inspect what
      # a file scan cannot reach (issue #6633): the entry's own name and, for a
      # link, the target text Git stores for it. A link to a file, a broken link
      # and a regular file the scanner cannot open are still handed over here,
      # because something inspectable may sit behind them; that link's stored
      # target text is scanned by the later steps too (issue #6640). One line
      # states how many entries were left out, by kind, and what inspects them
      # instead, so nothing leaves silently. `--` ends the option list, because a
      # repository path can begin with a dash.
      run: |
        set -euo pipefail
        rules="$RUNNER_TEMP/forbidden-strings.rules.txt"
        comparison_file="$RUNNER_TEMP/forbidden-strings.comparison"
        changed_list="$RUNNER_TEMP/forbidden-strings.changed-raw"
        whole_tree_marker="$RUNNER_TEMP/forbidden-strings.whole-tree"
        if [ -e "$whole_tree_marker" ]; then
          echo '::notice::No validated scan baseline; scanning the current tree.'
          forbidden-strings --builtin-rules --rules "$rules" --all
          exit 0
        fi
        comparison=$(cat -- "$comparison_file")
        changed=()
        listed_entries=0
        folder_links_left_out=0
        gitlink_entries_left_out=0
        changed_links=0
        while IFS= read -r -d '' raw_record; do
          IFS= read -r -d '' entry
          listed_entries=$((listed_entries + 1))
          # A raw record is `:<old mode> <new mode> <old sha> <new sha> <status>`
          # followed by the entry's path as its own NUL-terminated field.
          raw_fields=${raw_record#:}
          entry_mode=${raw_fields#* }
          entry_mode=${entry_mode%% *}
          if [ "$entry_mode" = '160000' ]; then
            gitlink_entries_left_out=$((gitlink_entries_left_out + 1))
            continue
          fi
          if [ "$entry_mode" = '120000' ]; then
            changed_links=$((changed_links + 1))
            # `-d` follows the link, so this is true only when the link points
            # at a folder; a link to a file and a broken link stay in.
            if [ -d "./$entry" ]; then
              folder_links_left_out=$((folder_links_left_out + 1))
              continue
            fi
          fi
          changed+=("$entry")
        done < "$changed_list"
        left_out_entries=$((folder_links_left_out + gitlink_entries_left_out))
        if [ "$listed_entries" -eq 0 ]; then
          echo "No changed files in $comparison; nothing to scan."
          exit 0
        fi
        if [ "$left_out_entries" -gt 0 ]; then
          printf 'Left out %d of %d changed entries the scanner cannot open as a file: folder links %d, submodule gitlinks %d. The next step scans their own names and, for each link, its stored target text. A link to a file, a broken link and an unreadable file stay in the scan; the stored target text of every changed link is scanned there too, %d in all.\n' \
            "$left_out_entries" "$listed_entries" "$folder_links_left_out" "$gitlink_entries_left_out" "$changed_links"
        fi
        if [ ${#changed[@]} -eq 0 ]; then
          echo "Every changed entry in $comparison is one the scanner cannot open as a file; the next step scans their names and link target texts."
          exit 0
        fi
        printf 'Scanning %d changed file(s) from %s:\n' "${#changed[@]}" "$comparison"
        printf '  %s\n' "${changed[@]}"
        forbidden-strings --builtin-rules --rules "$rules" -- "${changed[@]}"

    - name: Write each link's stored target text to a file
      # The runner skips the rest of a job after a failing step; `!cancelled()`
      # keeps these two steps running after the file scan fails, so a run that
      # finds something in a regular file still reports what it finds in a
      # link, and a link whose content and stored text both match shows both
      # findings in one run. A cancelled run skips them.
      if: ${{ !cancelled() }}
      # Two kinds of tree entry hold bytes the file scan never reads: a tracked
      # link's stored target text (the `120000` blob) and a submodule gitlink,
      # which has no content of its own. `--name-path` scans a file under a
      # logical name and needs one name per file, so the next step reads a list
      # of pairs, and this step builds it for both scope arms: a delta lists the
      # changed entries it was given, a whole-tree run takes every link and
      # gitlink of the index because it has no changed-entry list at all. Each
      # pair is written in the raw-record shape the next step already parses, so
      # one list feeds it either way (issue #6640).
      run: |
        set -euo pipefail
        whole_tree_marker="$RUNNER_TEMP/forbidden-strings.whole-tree"
        changed_list="$RUNNER_TEMP/forbidden-strings.changed-raw"
        entry_list="$RUNNER_TEMP/forbidden-strings.link-and-gitlink-raw"
        : > "$entry_list"
        links=0
        gitlinks=0
        if [ -e "$whole_tree_marker" ]; then
          while IFS= read -r -d '' record; do
            # An index record is `<mode> <object> <stage>` then a tab and the path.
            entry_mode=${record%% *}
            rest=${record#* }
            entry_sha=${rest%% *}
            entry=${rest#*$'\t'}
            if [ "$entry_mode" = '120000' ]; then
              links=$((links + 1))
            elif [ "$entry_mode" = '160000' ]; then
              gitlinks=$((gitlinks + 1))
            else
              continue
            fi
            printf ':%s %s %s %s A\0%s\0' "$entry_mode" "$entry_mode" "$entry_sha" "$entry_sha" "$entry" >> "$entry_list"
          done < <(git ls-files --stage -z)
          printf 'Whole-tree scan: the --all walk leaves link and gitlink entries out, so the next step scans each tracked link and gitlink by its own name and each link by its stored target text: tracked links %d, submodule gitlinks %d.\n' "$links" "$gitlinks"
          exit 0
        fi
        while IFS= read -r -d '' raw_record; do
          IFS= read -r -d '' entry
          raw_fields=${raw_record#:}
          entry_mode=${raw_fields#* }
          entry_mode=${entry_mode%% *}
          entry_new_sha=${raw_fields#* * * }
          entry_new_sha=${entry_new_sha%% *}
          if [ "$entry_mode" = '120000' ]; then
            links=$((links + 1))
          elif [ "$entry_mode" = '160000' ]; then
            gitlinks=$((gitlinks + 1))
          else
            continue
          fi
          printf ':%s %s %s %s A\0%s\0' "$entry_mode" "$entry_mode" "$entry_new_sha" "$entry_new_sha" "$entry" >> "$entry_list"
        done < "$changed_list"
        paired_entries=$((links + gitlinks))
        if [ "$paired_entries" -gt 0 ]; then
          printf 'Handing the next step every changed link and gitlink: tracked links %d, submodule gitlinks %d, each by its own name and, for each link, its stored target text.\n' "$links" "$gitlinks"
        fi

    - name: Scan each link's stored target text and each gitlink's name
      # A cancelled run skips this step too, for the reason the step before it
      # states.
      if: ${{ !cancelled() }}
      # The file scan and the `--all` walk cannot reach two kinds of tree entry
      # (issues #6633 and #6640): a tracked link's stored target text and a
      # submodule gitlink's name. `--name-path` scans a file under a logical name
      # and needs one name per file, so every entry of the list the step before
      # wrote goes to the scanner in one call, each with its stored target text
      # or, for a gitlink, an empty file, and each finding carries its `input`
      # index. The target text comes from the link's own blob in the tree, the
      # object its raw record names, and never from the path the link points at,
      # so nothing is followed.
      run: |
        set -euo pipefail
        rules="$RUNNER_TEMP/forbidden-strings.rules.txt"
        entry_list="$RUNNER_TEMP/forbidden-strings.link-and-gitlink-raw"
        if [ ! -s "$entry_list" ]; then
          echo 'No link or gitlink entry to scan in this run.'
          exit 0
        fi
        materialized="$RUNNER_TEMP/forbidden-strings.link-target-text"
        empty_text="$materialized/empty-text"
        mkdir -p "$materialized"
        : > "$empty_text"
        name_path_arguments=()
        inputs=()
        index=0
        while IFS= read -r -d '' raw_record; do
          IFS= read -r -d '' entry
          raw_fields=${raw_record#:}
          entry_mode=${raw_fields#* }
          entry_mode=${entry_mode%% *}
          input="$empty_text"
          if [ "$entry_mode" = '120000' ]; then
            entry_new_sha=${raw_fields#* * * }
            entry_new_sha=${entry_new_sha%% *}
            input="$materialized/$index"
            git cat-file blob "$entry_new_sha" > "$input"
          fi
          name_path_arguments+=(--name-path "$entry")
          inputs+=("$input")
          index=$((index + 1))
        done < "$entry_list"
        printf 'Scanning %d link and gitlink entries: each one by its own name, and each link by its stored target text:\n' \
          "${#inputs[@]}"
        forbidden-strings --builtin-rules --rules "$rules" "${name_path_arguments[@]}" -- "${inputs[@]}"
