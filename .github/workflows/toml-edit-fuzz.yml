name: toml-edit-fuzz

# Runs the property-based fuzz smoke, the toml-test conformance suite, and the
# V8 line-coverage reachability gate for @monochromatic-dev/module-toml-edit on
# changes that touch the package, its fuzz sidecar, its shared fixtures, or the
# fuzzing decision doc. The same *.property.unit.test.ts files run bounded in
# the sidecar's test:unit and as a short per-property campaign through the
# sidecar fuzz task. See
# package/module/toml-edit.fuzz/HANDOVER.fuzzing.md and
# doc/decision/toml-edit-fuzzing.md.
#
# push and pull_request are path-filtered to toml-edit. merge_group cannot be
# path-filtered (a GitHub limitation), so the Scope step below skips the heavy
# steps when a merge-queue entry changes no toml-edit files; the job still
# succeeds so a required merge-queue check stays green.

on:
  pull_request:
    branches: ['main']
    paths:
    - 'package/module/toml-edit/**'
    - 'package/module/toml-edit.fuzz/**'
    - 'package/test-fixture/toml-edit/**'
    - 'doc/decision/toml-edit-fuzzing.md'
    - '.github/workflows/toml-edit-fuzz.yml'
  merge_group:
    branches: ['main']
  push:
    branches: ['main']
    paths:
    - 'package/module/toml-edit/**'
    - 'package/module/toml-edit.fuzz/**'
    - 'package/test-fixture/toml-edit/**'
    - 'doc/decision/toml-edit-fuzzing.md'
    - '.github/workflows/toml-edit-fuzz.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        # The scope command validates the event's exact base and head commits.
        fetch-depth: 0

    - name: Scope to toml-edit changes
      id: scope
      # Runner-provided Node executes this before the task CLI or dependency installation.
      # The launcher remains CommonJS because Actions writes an extensionless file.
      # All decisions live in the dependency-free, subprocess-tested source entry.
      shell: node {0}
      env:
        SCOPE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        SCOPE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
      run: |
        require('node:child_process').execFileSync(
          process.execPath,
          ['package/module/toml-edit.fuzz/src/ci-scope.ts'],
          { stdio: 'inherit' },
        )

    - name: Set up node, pnpm and the task CLI
      if: steps.scope.outputs.run == 'true'
      uses: ./.github/actions/task-cli-setup

    - name: Build the bundle
      if: steps.scope.outputs.run == 'true'
      # Build before type-check: the test, conformance, and sidecar files import
      # the built `@monochromatic-dev/module-toml-edit`, so its dist .d.mts must
      # exist for tsgo to resolve them on a fresh checkout.
      run: task-run //package/module/toml-edit:build

    - name: Type-check
      if: steps.scope.outputs.run == 'true'
      run: task-run //package/module/toml-edit:lint:types

    - name: Type-check the sidecar
      if: steps.scope.outputs.run == 'true'
      run: task-run //package/module/toml-edit.fuzz:lint:types

    - name: Unit suite (fixtures)
      if: steps.scope.outputs.run == 'true'
      run: task-run //package/module/toml-edit:test:unit

    - name: Unit suite (sidecar, bounded property runs)
      if: steps.scope.outputs.run == 'true'
      run: task-run //package/module/toml-edit.fuzz:test:unit

    - name: Fuzz smoke (short per-property campaign)
      if: steps.scope.outputs.run == 'true'
      # A short per-property budget, not the 60s local default, keeps the smoke
      # bounded while still exploring well past the bounded-mode run count.
      run: task-run //package/module/toml-edit.fuzz:fuzz -- --budget 3000

    - name: Conformance (toml-test decode and encode for 1.0 and 1.1)
      if: steps.scope.outputs.run == 'true'
      # Follows the latest upstream toml-test runner through npx (a deliberate
      # moving oracle); the task logs the resolved runner version.
      run: task-run //package/module/toml-edit:test:conformance

    - name: Coverage gate (no per-file src reachability regression)
      if: steps.scope.outputs.run == 'true'
      # The committed baseline is a V8-coverage artifact. This repo always tracks
      # the latest node, so a node release that shifts V8 coverage is handled by
      # refreezing the baseline with
      # `task-run //package/module/toml-edit.fuzz:fuzz:coverage -- --write`, not by
      # pinning node.
      run: task-run //package/module/toml-edit.fuzz:fuzz:coverage
