name: npm-release

# Changesets release flow, decided in doc/decision/npm-publishing.md.
#
# - Pending changesets on main: the version job opens or updates the
#   "Version Packages" pull request.
# - No pending changesets and a package version missing from the registry:
#   the pack job builds and packs exactly those packages, then the publish job
#   uploads them with npm trusted publishing (OIDC). Only that job holds
#   id-token: write. No npm token exists or is read anywhere.
# - A package's first version cannot use trusted publishing (npm requires the
#   package to exist before a trusted publisher can be configured), so it is
#   published by hand: doc/runbook/publish-npm-package-first-time.md. The
#   publish job then finds it already on the registry and only tags it.
#
# Scoped to the files that can change what the flow does: a changeset file
# (opens or updates the Version Packages pull request), a package manifest or
# changelog (a merged Version Packages pull request, which is what publishes),
# and this workflow. Every other push to main is irrelevant to releasing, and
# running here on each one regenerated the Version Packages branch and mailed a
# push notification per commit (198 commits on 2026-09-06 alone).

on:
  push:
    branches:
      - main
    paths:
      - '.changeset/**'
      - '**/package.json'
      - '**/CHANGELOG.md'
      - '.github/workflows/npm-release.yml'
  workflow_dispatch:

permissions: {}


concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up node, pnpm and the task CLI
        uses: ./.github/actions/task-cli-setup

      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@8488615a623b1b9c987934bb89eae8af6a946ac1

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up node, pnpm and the task CLI
        uses: ./.github/actions/task-cli-setup

      # The push to main that runs this job seeds the cache. Key shape and size budget: doc/decision/ci-caching.md
      - name: Identify the Rust toolchain for the cache key
        id: toolchain
        run: echo "id=${ImageOS}-$(rustc --verbose --version | awk '/^commit-hash:/ { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache cargo build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: package/git-policy/cli/target
          key: cargo-v2-cli-git-release-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('package/git-policy/cli/Cargo.lock') }}
          restore-keys: |
            cargo-v2-cli-git-release-${{ runner.os }}-${{ steps.toolchain.outputs.id }}-

      # changeset:version runs the dependent-version ripple through the native cli-git executable, built from this checkout
      # with the runner's rustup toolchain. --locked builds the versions Cargo.lock records; the release profile keeps
      # panic = "unwind", which the linked scanner requires.
      - name: Build the native cli-git executable from the checkout
        working-directory: package/git-policy/cli
        run: cargo build --release --locked --bin cli-git-native

      # The executable is exposed under its own name, never as git: the changesets action runs git commands of its own
      # in the same environment, and the wrapper refuses bulk staging.
      - name: Expose the native cli-git executable to later steps
        run: printf '%s\n' "$GITHUB_WORKSPACE/package/git-policy/cli/target/release" >> "$GITHUB_PATH"

      - name: Open or update the version pull request
        uses: changesets/action/version@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          script: task-run changeset:version
          commit-message: 'chore(*): version packages'
          pr-title: 'chore(*): version packages'

  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    # Job-wide so the install, any pnpm install a build task re-runs, and the pack
    # all keep direct workspace dependencies linked per package; see the install step.
    env:
      pnpm_config_dedupe_direct_deps: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up node, pnpm and the task CLI
        uses: ./.github/actions/task-cli-setup

      - name: Build the packages in the publish plan
        run: task-run changeset:build

      - name: Pack
        id: pack
        uses: changesets/action/pack@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs:
      - select-mode
      - pack
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up node, pnpm and the task CLI
        uses: ./.github/actions/task-cli-setup

      - name: Publish with trusted publishing
        uses: changesets/action/publish@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true
