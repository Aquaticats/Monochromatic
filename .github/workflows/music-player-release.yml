                    owner = wintypes.DWORD(0)
                    user32.GetWindowThreadProcessId(hwnd, ctypes.byref(owner))
                    if owner.value == pid and class_name(hwnd) == "#32770":
                        found.append(hwnd)
                    return True

                user32.EnumWindows(EnumWindowsProc(visit), 0)
                if found:
                    return found[0]
                time.sleep(0.2)
            return None


        def dialog_message(hwnd):
            texts = []

            def visit(child, _):
                if class_name(child) == "Static":
                    texts.append(window_text(child))
                return True

            user32.EnumChildWindows(hwnd, EnumWindowsProc(visit), 0)
            return "\n".join(text for text in texts if text)


        def child_of_class(hwnd, wanted):
            """The first child window of the given class, or None."""
            found = []

            def visit(child, _):
                if class_name(child) == wanted:
                    found.append(child)
                return True

            user32.EnumChildWindows(hwnd, EnumWindowsProc(visit), 0)
            return found[0] if found else None


        def dismiss(dialog, process):
            """Presses OK the way a person would, and falls back to other ways the box accepts.

            Each way gets 5 seconds to end the process; the name of the way that did is returned, or None when none did.
            """
            button = child_of_class(dialog, "Button")
            ways = [("BM_CLICK on the OK button", button, BM_CLICK, 0), ("WM_CLOSE", dialog, WM_CLOSE, 0), ("WM_COMMAND IDOK", dialog, WM_COMMAND, IDOK)]
            for name, target, message, parameter in ways:
                if target is None:
                    print(f"    no window for {name}", flush=True)
                    continue
                user32.PostMessageW(target, message, parameter, 0)
                if kernel32.WaitForSingleObject(process, 5000) != WAIT_TIMEOUT:
                    return name
                print(f"    {name} did not end the process within 5 seconds", flush=True)
            return None


        # What decides how the console treats escape sequences on this runner, printed for the record.
        kernel32.FreeConsole()
        kernel32.AllocConsole()
        print(f"a new console starts with mode 0x{console_mode():x} (0x4 is ENABLE_VIRTUAL_TERMINAL_PROCESSING)", flush=True)
        try:
            with winreg.OpenKey(winreg.HKEY_CURRENT_USER, "Console") as key:
                print(f"HKCU\\Console VirtualTerminalLevel = {winreg.QueryValueEx(key, 'VirtualTerminalLevel')[0]!r}", flush=True)
        except OSError as error:
            print(f"HKCU\\Console VirtualTerminalLevel is not set ({error})", flush=True)
        for name in ("TERM", "NO_COLOR", "CLICOLOR", "CLICOLOR_FORCE"):
            print(f"environment {name}={os.environ.get(name)!r}", flush=True)

        # Console colors.
        os.environ["RUST_LOG"] = "debug"
        os.environ.pop(FORCE, None)
        fresh_console(False)
        process, _ = launch("--no-such-option", False, False)
        code = finish(process, 20000)
        text = console_text()
        check("colors, no handles, console without VT, bad argument", code == 2 and "no-such-option" in text and "attached to the console" in text and not has_escape(text), f"exit code {code}, console mode now 0x{console_mode():x}, console shows {text!r}")
        fresh_console(False)
        path = os.path.join(temp_dir, "colors-stdout.txt")
        stdout_file = open_inheritable_file(path)
        kernel32.SetStdHandle(STD_INPUT_HANDLE, None)
        kernel32.SetStdHandle(STD_OUTPUT_HANDLE, stdout_file)
        kernel32.SetStdHandle(STD_ERROR_HANDLE, None)
        process, _ = launch("--no-such-option", True, False)
        code = finish(process, 20000)
        kernel32.CloseHandle(stdout_file)
        text = console_text()
        check("colors, stdout file, stderr on a console without VT, bad argument", code == 2 and "no-such-option" in text and not has_escape(text), f"exit code {code}, console shows {text!r}")
        out_file = open_inheritable_file(os.path.join(temp_dir, "colors-out.txt"))
        err_file = open_inheritable_file(os.path.join(temp_dir, "colors-err.txt"))
        process, _ = launch("--no-such-option", True, True, out_file, err_file)
        code = finish(process, 20000)
        kernel32.CloseHandle(out_file)
        kernel32.CloseHandle(err_file)
        with open(os.path.join(temp_dir, "colors-err.txt"), "rb") as handle:
            logged = handle.read()
        check("colors, stderr in a file, bad argument", code == 2 and b"console attach skipped" in logged and b"no-such-option" in logged and b"\x1b" not in logged, f"exit code {code}, stderr file holds {logged[:400]!r}")

        # Startup failure with somewhere to print: no message box, the text is printed, exit status 1.
        os.environ["RUST_LOG"] = "info"
        os.environ[FORCE] = "window-system"
        fresh_console(True)
        process, pid = launch("", False, False)
        dialog = find_dialog(pid, 8)
        code = finish(process, 20000)
        text = console_text()
        check("startup failure, console of the parent", dialog is None and code == 1 and "Music Player could not start" in text, f"dialog {dialog}, exit code {code}, console shows {text[-600:]!r}")
        # The same four steps with stderr in a file (a script or the CI): no box, the text and the debug log in the file,
        # and the process must end on its own with the exit status of the step. A panic prints the standard panic message.
        os.environ["RUST_LOG"] = "debug"
        for step, phrase, wanted_code in (
            ("window-system", "connection to the Windows desktop", 1),
            ("window", "could not create its window", 1),
            ("event-loop", "window stopped working", 1),
            ("panic", "panicked at", 101),
        ):
            os.environ[FORCE] = step
            out_file = open_inheritable_file(os.path.join(temp_dir, "failure-out.txt"))
            err_file = open_inheritable_file(os.path.join(temp_dir, "failure-err.txt"))
            process, pid = launch("", True, True, out_file, err_file)
            dialog = find_dialog(pid, 8)
            code = finish(process, 20000)
            kernel32.CloseHandle(out_file)
            kernel32.CloseHandle(err_file)
            with open(os.path.join(temp_dir, "failure-err.txt"), encoding="utf-8", errors="replace") as handle:
                logged = handle.read()
            check(f"startup failure, forced {step} failure, stderr in a file", dialog is None and code == wanted_code and phrase in logged and FORCE in logged, f"dialog {dialog}, exit code {code} (None means still running after 28 seconds), stderr file ends with {logged[-1500:]!r}")

        os.environ["RUST_LOG"] = "info"
        # Startup failure in a double-click start: no console, no standard handle. The message box must appear.
        kernel32.FreeConsole()
        for step, phrase, wanted_code in (
            ("window-system", "connection to the Windows desktop", 1),
            ("window", "could not create its window", 1),
            ("event-loop", "window stopped working", 1),
            ("panic", "internal error", 101),
        ):
            os.environ[FORCE] = step
            process, pid = launch("", False, False)
            dialog = find_dialog(pid, 20)
            title = message = ""
            way = None
            if dialog is not None:
                title = window_text(dialog)
                message = dialog_message(dialog)
                way = dismiss(dialog, process)
            code = finish(process, 20000)
            print(f"    {step}: the box was closed by {way}", flush=True)
            for line in message.splitlines():
                print(f"    {step} message: {line}".encode("ascii", "backslashreplace").decode(), flush=True)
            good = dialog is not None and title.startswith("Music Player") and phrase in message and FORCE in message and code == wanted_code
            check(f"double-click start, forced {step} failure, message box", good, f"dialog {dialog}, title {title!r}, exit code {code} after OK")
        os.environ.pop(FORCE, None)

        if failures:
            raise SystemExit("failed: " + "; ".join(failures))
        PYTHON

    # The program must stay up when started on a folder, with no audio device on the runner. A start that
    # exits within the wait fails the job.
    - name: Launch the program and check it stays up
      if: ${{ !cancelled() && steps.build-binary.outcome == 'success' }}
      working-directory: package/music-player/desktop-app
      env:
        RUST_LOG: info
      run: |
        set -euo pipefail
        "target/${TARGET}/debug/music-player.exe" fixture > "${RUNNER_TEMP}/launch.log" 2>&1 &
        pid=$!
        sleep 15
        if kill -0 "$pid" 2>/dev/null; then
          echo "still running after 15 seconds"
          kill "$pid" || true
        else
          echo "::error::the program exited within 15 seconds"
          cat "${RUNNER_TEMP}/launch.log"
          exit 1
        fi
        head -n 40 "${RUNNER_TEMP}/launch.log"
        # The log went to a file, so it must hold plain text: no ESC byte of an ANSI color sequence.
        if grep --quiet --fixed-strings $'\x1b' "${RUNNER_TEMP}/launch.log"; then
          echo "::error::the log written to a file holds ANSI escape sequences"
          exit 1
        fi
        echo "the log file holds no escape sequence"

    - name: Run the tests (cargo nextest)
      working-directory: package/music-player/desktop-app
      run: cargo nextest run --locked --target "$TARGET" --no-fail-fast

  # SHA256SUMS covers every asset and is attested like them. It is computed only after every
  # build succeeded, so a partial release cannot get a checksum file.
  checksums:
    needs: [detect, notices, build-desktop, build-desktop-musl, build-android, test-alpine, test-windows]
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Attest build provenance for the files this job uploads.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
    steps:
    - name: Download all assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: asset-*
        path: assets
        merge-multiple: true

    - name: Check the asset set and write SHA256SUMS
      run: |
        set -euo pipefail
        expected=$(printf '%s\n' \
          "music-player-${VERSION}-android-arm64-v8a.apk" \
          "music-player-${VERSION}-android-third-party-licenses.txt" \
          "music-player-${VERSION}-android-x86_64.apk" \
          "music-player-${VERSION}-desktop-third-party-licenses.txt" \
          "music-player-${VERSION}-linux-arm64.tar.gz" \
          "music-player-${VERSION}-linux-musl-arm64.tar.gz" \
          "music-player-${VERSION}-linux-musl-x64.tar.gz" \
          "music-player-${VERSION}-linux-x64.tar.gz" \
          "music-player-${VERSION}-macos-arm64.dmg" \
          "music-player-${VERSION}-windows-arm64.exe" \
          "music-player-${VERSION}-windows-x64-gnu.exe" \
          "music-player-${VERSION}-windows-x64.exe")
        actual=$(ls -1 assets | LC_ALL=C sort)
        if [ "$actual" != "$expected" ]; then
          echo "::error::Unexpected asset set."
          diff <(echo "$expected") <(echo "$actual") || true
          exit 1
        fi
        mkdir -p checksums
        (cd assets && sha256sum -- *) > checksums/SHA256SUMS
        cat checksums/SHA256SUMS

    - name: Attest SHA256SUMS provenance
      if: ${{ needs.detect.outputs.dry_run == 'false' }}
      uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
      with:
        subject-path: checksums/SHA256SUMS

    - name: Upload SHA256SUMS as workflow artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: checksums
        path: checksums/SHA256SUMS
        if-no-files-found: error
        retention-days: ${{ needs.detect.outputs.dry_run == 'true' && 1 || 7 }}

  # Immutable releases (repo setting) means `gh release create` must include every asset at
  # creation time; you cannot add files later. So we wait for every build, collect all assets,
  # then create the release in one shot. In a dry run the same script prints the command instead.
  release:
    needs: [detect, checksums]
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Create the tag and the release: the only job that writes to the repository.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ needs.detect.outputs.dry_run }}
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: ${{ needs.detect.outputs.tag }}
      SHA: ${{ github.sha }}
      REF: ${{ github.ref }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
    # The test jobs also upload their smoke screenshots and logs as workflow artifacts (0.1.11 shipped eight of
    # them as release assets under the old pattern '*'), so the release names only the asset and checksum artifacts.
    - name: Download all assets
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: asset-*
        path: assets
        merge-multiple: true

    - name: Download SHA256SUMS
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: checksums
        path: assets

    - name: Write the release notes
      run: |
        set -euo pipefail
        cert="$EXPECTED_ANDROID_CERT_SHA256"
        cat > notes.md <<'NOTES'
        Music Player @VERSION@, a **pre-release**. The project is under active development.

        Built by CI from commit @SHA@ ([workflow run](@RUN_URL@)). Source: [@TAG@](https://github.com/@REPO@/tree/@TAG@).

        [![#MadeWithSlint](https://raw.githubusercontent.com/slint-ui/slint/7577a165d15b7a097789cb7c417691ed3f8c1bcf/logo/MadeWithSlint-logo-whitebg.png)](https://slint.dev)

        ## Downloads

        - Windows: `music-player-@VERSION@-windows-x64.exe` and `music-player-@VERSION@-windows-arm64.exe`, one standalone program each.
        - Windows without Microsoft's toolchain: `music-player-@VERSION@-windows-x64-gnu.exe` (x64 only), built with MinGW-w64 and GNU ld, one standalone program that needs no Visual C++ runtime. It is built from the same source as `windows-x64.exe`; pick either one.
        - macOS: `music-player-@VERSION@-macos-arm64.dmg`, for Apple silicon Macs only. There is no Intel Mac build; build from source instead.
        - Linux: `music-player-@VERSION@-linux-x64.tar.gz` and `music-player-@VERSION@-linux-arm64.tar.gz`, with the program, a launcher file and an icon.
        - Alpine Linux: `music-player-@VERSION@-linux-musl-x64.tar.gz` (x86_64) and `music-player-@VERSION@-linux-musl-arm64.tar.gz` (aarch64), for Alpine 3.24 or newer (musl libc), with the same contents as the Linux archives. The Linux archives above do not run on Alpine.
        - Android: `music-player-@VERSION@-android-arm64-v8a.apk` for phones, tablets and foldables (64-bit ARM), and `music-player-@VERSION@-android-x86_64.apk` for x86_64 emulators and Chromebooks (Android 8.0 or newer). Install the one that matches the device; each carries only its own native library.
        - `music-player-@VERSION@-desktop-third-party-licenses.txt` and `music-player-@VERSION@-android-third-party-licenses.txt`: the license notices of the desktop programs and of the Android app (see "Licenses").
        - `SHA256SUMS`: the SHA-256 of every file above.

        ## What has been tested

        The maintainers have run the Linux x86_64 build on Wayland with PipeWire and the Android app on emulators.
        Every other platform is **built by CI, not yet tested on this platform**: CI starts each desktop program with `--version` and nothing more.
        No build has run on a real Android device, on macOS or on Windows.
        The Alpine builds are the one exception: a separate CI workflow runs the unit tests and a headless window and sound check in Alpine containers on both architectures, but on debug builds and not on real Alpine hardware, and this release starts each Alpine program with `--version` inside an Alpine image.
        Expect problems and report them as issues.

        ## Unsigned builds and first launch

        - **Windows**: the programs are not signed with a developer identity. SmartScreen may show "Windows protected your PC": choose "More info", then "Run anyway". The executable opens no console window; started from a terminal, it prints there. In PowerShell, redirect with `| Out-File file.txt`, because PowerShell does not read the output of a program like this one through `>`.
        - **macOS**: the app is not notarized, and carries only an ad-hoc signature with no developer identity. Open the disk image, drag Music Player to Applications, and try to open it once. Then open System Settings, go to Privacy & Security, scroll down and click "Open Anyway", and click "Open" when the warning appears again. macOS remembers the choice. These are the steps in [Apple's guide](https://support.apple.com/en-us/102445).
        - **Android**: the APK is signed with the project release key. Allow installing from your browser or file manager when Android asks. Updates install over this app only when they carry the same key. Certificate SHA-256: `@CERT@`.
        - **Linux**: extract the archive and run `bin/music-player`. `INSTALL.txt` inside shows how to add a menu entry. It needs PipeWire and glibc 2.39 or newer (it is built on Ubuntu 24.04).
        - **Alpine Linux**: install the runtime packages with this one command, then extract the archive and run `bin/music-player` (`INSTALL.txt` inside shows the rest, including the runtime directory a plain Alpine install lacks). Without PipeWire the player plays through the default ALSA device.

        ```
        apk add fontconfig font-dejavu pipewire-libs libgcc wayland-libs-client wayland-libs-egl libxkbcommon mesa-egl mesa-gles mesa-dri-gallium alsa-lib
        ```

        ## Licenses

        Music Player is licensed under the [GNU Lesser General Public License, version 3 or later](https://github.com/@REPO@/blob/@TAG@/LICENSE).
        The desktop programs are built with the [Slint](https://slint.dev) toolkit, which this project uses under the [Slint Royalty-free Desktop, Mobile, and Web Applications License, version 2.0](https://slint.dev/terms-and-conditions#royalty-free); the Licenses page in Settings shows the "Made with Slint" widget that license asks for, this page shows the #MadeWithSlint badge at the top (the license accepts either; this project does both), and the license text is in the desktop notices. The code of this repository stays LGPL-3.0-or-later.
        The complete source code of this release is the tree at [@TAG@](https://github.com/@REPO@/tree/@TAG@); every Rust crate it uses is published on crates.io under the name and version its notices give.

        Each program carries the license notices of everything built into it: the program's own license texts, the bundled typeface (desktop) and icons, the Rust standard library, every Rust crate and, for Android, every Android library.
        - Desktop: `music-player --licenses` prints them; the Licenses row of Settings shows them in the app; the Linux and Alpine archives hold them as `THIRD-PARTY-LICENSES.txt`, and the disk image beside the app and inside it (`Contents/Resources`). The Windows programs are single files, so their notices are `music-player-@VERSION@-desktop-third-party-licenses.txt` here and `--licenses` (in PowerShell, `music-player.exe --licenses | Out-File licenses.txt`; `>` leaves an empty file there, as for every Windows program without a console).
        - Android: inside the APK as `assets/THIRD-PARTY-LICENSES.txt`, and `music-player-@VERSION@-android-third-party-licenses.txt` here. The Licenses row under the About heading of Settings shows them in the app.

        ## Verify a download

        Every file is attested with GitHub build provenance. With the [GitHub CLI](https://cli.github.com/):

        ```
        gh attestation verify <file> --repo @REPO@
        sha256sum --check --ignore-missing SHA256SUMS
        ```
        NOTES
        sed --in-place \
          --expression="s|@VERSION@|${VERSION}|g" \
          --expression="s|@SHA@|${SHA}|g" \
          --expression="s|@RUN_URL@|${RUN_URL}|g" \
          --expression="s|@TAG@|${TAG}|g" \
          --expression="s|@REPO@|${REPO}|g" \
          --expression="s|@CERT@|${cert}|g" \
          notes.md
        cat notes.md

    - name: Create the GitHub pre-release with all assets (a dry run only prints the command)
      run: |
        set -euo pipefail
        # The one place a release is created. A dry run prints the command instead of running it.
        run_gh() {
          if [ "$DRY_RUN" = 'true' ]; then
            printf 'DRY RUN, would run: gh'
            printf ' %q' "$@"
            printf '\n'
          else
            gh "$@"
          fi
        }
        ls -la assets/
        if [ "$DRY_RUN" = 'false' ]; then
          if [ "$REF" != 'refs/heads/main' ]; then
            echo "::error::A real release runs only from main, not $REF."
            exit 1
          fi
          # Re-check right before creating: a tag created since the detect job must not be touched.
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Tag ${TAG} exists now; leaving it alone."
            exit 0
          fi
        fi
        echo "tag: ${TAG}"
        echo "assets:"
        ls -1 assets
        run_gh release create "$TAG" assets/* \
          --repo "$REPO" \
          --title "Music Player ${VERSION} (pre-release)" \
          --notes-file notes.md \
          --target "$SHA" \
          --prerelease
