name: playwright-image

# Builds playwright.Dockerfile and publishes it as ghcr.io/aquaticats/monochromatic-playwright:<tag>, where <tag> is
# the first 16 hex digits of the SHA-256 of playwright.Dockerfile. `mise run prepare:playwright` computes the same tag,
# pulls it, and builds the file locally only when the pull fails (doc/runbook/publish-playwright-image.md).
#
# - A tag names one content: when it already exists nothing is built or pushed, so a rerun, or an edit of this file
#   alone, never replaces an image that people already pulled (playwright.Dockerfile installs bun from its latest
#   installer, so a rebuild under the same tag would not be the same bytes). The check that decides this fails the run
#   when it cannot tell (a registry error, a timeout) and only treats a missing tag, or a package the registry grants
#   no token for, as absent, so a transient fault never leads to an overwrite.
# - Authentication is the workflow's own GITHUB_TOKEN (packages: write). The first push creates the package, linked to
#   this repository by the org.opencontainers.image.source label; a new package is private until the owner makes it
#   public in its package settings (Danger Zone, Change visibility), which GitHub offers nowhere else. While it is
#   private, the last step of every run says so in a warning.
# - The image is linux/amd64, the runner's architecture. `mise run prepare:playwright` pulls it only on a machine that
#   reports linux/amd64 and builds locally on any other, because podman pulls a single-platform image of another
#   platform with only a warning.
# - Only runs on main publish. A workflow_dispatch from another ref skips the job, and the concurrency group is per ref
#   so such a run cannot cancel or delay a run on main. The guard lives in this file, so a branch that edits the file
#   is not stopped by it (doc/runbook/publish-playwright-image.md says what would be).

on:
  push:
    branches:
      - main
    paths:
      - 'playwright.Dockerfile'
      - '.github/workflows/playwright-image.yml'
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/aquaticats/monochromatic-playwright

concurrency:
  group: playwright-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the Playwright image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Reads this repository to check out playwright.Dockerfile.
      contents: read
      # Pushes the image to ghcr.io/aquaticats/monochromatic-playwright with the workflow's own token. The package is
      # linked to this repository by the org.opencontainers.image.source label, so no other credential is involved.
      packages: write # Pushes the image with the workflow's token
      # Attests build provenance of the pushed image, with the same action and permissions as music-player-release.yml.
      id-token: write # Gets the OIDC token that signs the attestation
      attestations: write # Stores the attestation for the image digest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compute the tag
        id: tag
        run: node package/monorepo-task/core-exec/src/playwright-image-tag.ts

      - name: Check whether the tag exists
        id: exists
        # Asks ghcr.io with the registry's own token flow (the workflow's token is the password of a basic-auth request, the
        # answer is a bearer token for this repository; credentials go through curl's standard input, not its command
        # line). A transport fault ends the step with curl's own message, so the build and the push are skipped.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          TAG: ${{ steps.tag.outputs.value }}
        run: node package/monorepo-task/core-exec/src/playwright-image-tag-exists.ts

      - name: Build the image
        if: steps.exists.outputs.present != 'true'
        env:
          TAG: ${{ steps.tag.outputs.value }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node package/monorepo-task/core-exec/src/playwright-image-build.ts

      - name: Push the image
        id: push
        if: steps.exists.outputs.present != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          TAG: ${{ steps.tag.outputs.value }}
        run: node package/monorepo-task/core-exec/src/playwright-image-push.ts

      # Provenance is recorded in GitHub's attestation store for the digest, as for the files music-player-release.yml
      # attests (no push-to-registry, so no registry credential is involved). Consumers still pull by tag and nothing
      # in a pull checks it; `gh attestation verify oci://<image>@<digest> --owner Aquaticats` does.
      - name: Attest provenance
        if: steps.exists.outputs.present != 'true'
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Check that anyone can pull it
        # Advisory only: a fault here is reported as the status in the summary (000 when nothing answered) and never fails a
        # run that has already published the image. No credentials of ours are sent: this is what a person without a login
        # (or prepare:playwright) sees.
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: node package/monorepo-task/core-exec/src/playwright-image-anonymous-pull-check.ts
