# Trial only.
# Measures what one GitHub-hosted runner gives a public repository: processors, memory, free disk,
# whether /dev/kvm can be opened, and, when it can, how long a small cloud image takes to answer
# under QEMU with KVM. Triggered by a push to this branch alone, and removed once its log is
# recorded in doc/planning/github-hosted-runners-for-package-checks-and-a-guest.md.
name: hosted-runner-specimen
on:
  push:
    branches: ['docs/planning-github-hosted-runners-carry-package-checks-and-a-guest-trial-proposed']
permissions:
  contents: read
concurrency:
  group: hosted-runner-specimen
  cancel-in-progress: true
jobs:
  specimen:
    name: specimen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Processors and virtualisation identity
        run: |
          set -eux
          nproc
          lscpu
          grep -m1 'model name' /proc/cpuinfo || true
          grep --only-matching --extended-regexp 'vmx|svm' /proc/cpuinfo | sort --unique || echo 'no vmx or svm flag'
          systemd-detect-virt || true
      - name: Memory
        run: |
          set -eux
          free --mebi
          head --lines=3 /proc/meminfo
      - name: Free disk
        run: |
          set -eux
          df --human-readable --output=source,fstype,size,used,avail,target /
          df --human-readable /dev/shm
      - name: Container runtimes present
        run: |
          set -eux
          docker --version || true
          podman --version || true
      - name: Whether /dev/kvm can be opened
        id: kvm
        run: |
          set -eux
          ls --long /dev/kvm || echo 'no /dev/kvm device node'
          getfacl --omit-header /dev/kvm || true
          python3 - <<'PROBE'
          import fcntl, os, sys
          KVM_GET_API_VERSION = 0xAE00
          openable = False
          for path in ("/dev/kvm", "/dev/null"):
              try:
                  descriptor = os.open(path, os.O_RDWR)
              except OSError as error:
                  print(f"{path}: open read-write failed: {error}", flush=True)
                  continue
              print(f"{path}: opened read-write, descriptor {descriptor}", flush=True)
              if path == "/dev/kvm":
                  try:
                      version = fcntl.ioctl(descriptor, KVM_GET_API_VERSION, 0)
                      print(f"/dev/kvm: KVM_GET_API_VERSION answered {version}", flush=True)
                      openable = version == 12
                  except OSError as error:
                      print(f"/dev/kvm: KVM_GET_API_VERSION failed: {error}", flush=True)
              os.close(descriptor)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"openable={'true' if openable else 'false'}\n")
          PROBE
      - name: Grant the runner user the device and probe again
        id: granted
        continue-on-error: true
        run: |
          set -eux
          sudo setfacl --modify "u:$(id --user):rw" /dev/kvm
          getfacl --omit-header /dev/kvm
          python3 - <<'GRANTED'
          import fcntl, os
          descriptor = os.open("/dev/kvm", os.O_RDWR)
          version = fcntl.ioctl(descriptor, 0xAE00, 0)
          os.close(descriptor)
          print(f"after the grant: opened, KVM_GET_API_VERSION answered {version}", flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              outputs.write(f"openable={'true' if version == 12 else 'false'}\n")
          GRANTED
      - name: Boot one small cloud image under QEMU with KVM
        id: guest
        if: steps.granted.outputs.openable == 'true'
        continue-on-error: true
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils curl
          qemu-system-x86_64 --version
          curl --fail --location --output cirros.img https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img
          qemu-img info cirros.img
          sudo setfacl --modify "u:$(id --user):rw" /dev/kvm
          started=$(date +%s)
          qemu-system-x86_64 \
            --machine q35 --accel kvm --cpu host --smp 2 -m 512 \
            --drive file=cirros.img,format=qcow2,if=virtio \
            --netdev user,id=net0 --device virtio-net-pci,netdev=net0 \
            --display none --serial file:console.log --no-reboot &
          pid=$!
          answered=false
          for _ in $(seq 1 240); do
            if grep --quiet 'login:' console.log 2>/dev/null; then answered=true; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          finished=$(date +%s)
          echo "qemu pid $pid, answered=$answered, seconds to login prompt $((finished - started))"
          kill "$pid" || true
          wait "$pid" || true
          tail --lines=40 console.log || true
          echo "seconds=$((finished - started)) answered=$answered" >> "$GITHUB_OUTPUT"
      - name: Whether the guest step ran
        if: always()
        run: |
          set -eux
          echo "openable as the runner user without a grant=${{ steps.kvm.outputs.openable }}"
          echo "openable after the grant=${{ steps.granted.outputs.openable }}"
          echo "guest=${{ steps.guest.outputs.seconds }} ${{ steps.guest.outputs.answered }}"
