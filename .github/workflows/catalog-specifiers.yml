name: catalog-specifiers

# Detection, not prevention: the cli-git commit policy `mono/catalog-specifiers` refuses a literal version in a manifest at
# commit time, but a commit made without the wrapper (a web edit, `--no-enforce-*`, another clone) reaches the repository
# anyway. This always-run workflow runs the same policy over every tracked manifest and fails the job on a violation.
# Whether a failing run blocks a merge is the repository owner's branch-protection setting, which this file cannot set.
# Contract and rationale: doc/handover/catalog-specifier-policy.md, package/catalog-specifier/core-rust/README.md.

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    - name: Install the cli-git release pinned in toolchain.lock.json
      # cargo-binstall comes from the prebuilt archive the lock pins, verified by the lock's sha256, and never compiles the
      # crate (AGENTS.md CM7). The pinned release may predate the rename of the program (2026-11-04), so the step tells the
      # later steps which program, command word and settings file the release has (CLI_PROGRAM, CLI_WORD, CLI_SETTINGS in
      # GITHUB_ENV). The work is one Node command, tested by catalog-specifiers-steps.unit.test.ts beside it.
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: node package/monorepo-task/core-exec/src/catalog-specifiers-install-policy-cli.ts

    - name: Check every tracked manifest
      # Exit 0 means every `package.json` uses `catalog:`, `catalog:<name>` or exactly `workspace:*` (peer dependencies:
      # `*`, `catalog:` or `catalog:<name>`) and no `package.json5`, `package.yaml` or `package.yml` is tracked.
      # Exit 2 means the policy is not listed in the repository's settings file (monochromatic-git-policy-cli.config.jsonc, or cli-git.config.jsonc for a pinned release before the rename), so the check would have run nothing; that fails too.
      run: |
        set -euo pipefail
        "$CLI_PROGRAM" "$CLI_WORD" check --all --policy mono/catalog-specifiers

    - name: Negative control, the check must reject a literal version
      # A check that cannot fail proves nothing. This stages one literal dependency in a throwaway repository and
      # requires exit 1 with the `disallowed-specifier` finding, so an exit 2 configuration failure cannot pass here.
      # The work is one Node command, tested by catalog-specifiers-steps.unit.test.ts beside it.
      run: node package/monorepo-task/core-exec/src/catalog-specifiers-negative-control.ts
