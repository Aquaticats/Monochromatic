name: catalog-specifiers

# Detection, not prevention: the cli-git commit policy `mono/catalog-specifiers` refuses a literal version in a manifest at
# commit time, but a commit made without the wrapper (a web edit, `--no-enforce-*`, another clone) reaches the repository
# anyway. This always-run workflow runs the same policy over every tracked manifest and fails the job on a violation.
# Whether a failing run blocks a merge is the repository owner's branch-protection setting, which this file cannot set.
# Contract and rationale: doc/handover/catalog-specifier-policy.md, package/catalog-specifier/core-rust/README.md.

on:
  pull_request:
    branches: ['main']
  merge_group:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # What the steps below run: the program, the word after it, and the settings file it reads.
      CLI_PROGRAM: monochromatic-git-policy-cli
      CLI_WORD: monochromatic-git-policy-cli
      CLI_SETTINGS: monochromatic-git-policy-cli.config.jsonc
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    # The git policy CLI comes from the GitHub release archive that toolchain.lock.json pins for this runner (an alpha goes
    # to GitHub releases only, never to crates.io), verified against the sha256 recorded beside it, by the same action
    # that installs the other repository tools. It puts monochromatic-git-policy-cli on PATH.
    - name: Install the git policy CLI pinned in toolchain.lock.json
      uses: ./.github/actions/repo-tools-setup
      with:
        tools: git-policy-cli

    - name: Check every tracked manifest
      # Exit 0 means every `package.json` uses `catalog:`, `catalog:<name>` or exactly `workspace:*` (peer dependencies:
      # `*`, `catalog:` or `catalog:<name>`) and no `package.json5`, `package.yaml` or `package.yml` is tracked.
      # Exit 2 means the policy is not listed in the repository's settings file (monochromatic-git-policy-cli.config.jsonc), so the check would have run nothing; that fails too.
      run: |
        set -euo pipefail
        "$CLI_PROGRAM" "$CLI_WORD" check --all --policy mono/catalog-specifiers

    - name: Negative control, the check must reject a literal version
      # A check that cannot fail proves nothing. This stages one literal dependency in a throwaway repository and
      # requires exit 1 with the `disallowed-specifier` finding, so an exit 2 configuration failure cannot pass here.
      # The work is one Node command, tested by catalog-specifiers-negative-control.unit.test.ts beside it.
      run: node package/monorepo-task/core-exec/src/catalog-specifiers-negative-control.ts
