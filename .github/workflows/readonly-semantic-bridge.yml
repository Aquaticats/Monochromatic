name: readonly semantic bridge host evidence

on:
  pull_request:
    branches: ['main']
    paths:
    - 'package/config/oxlint/**'
    - 'package/ownership-markers/foreign-borrowed/**'
    - 'package/oxlint-plugin/no-restricted-syntax/**'
    - 'package/oxlint-plugin/prefer-readonly-parameter-type/**'
    - 'package/oxlint-plugin/shared/**'
    - 'package/test-fixture/oxlint-no-restricted-syntax/**'
    - 'pnpm-lock.yaml'
    - '.github/workflows/readonly-semantic-bridge.yml'
  merge_group:
    branches: ['main']
  push:
    branches: ['main']
    paths:
    - 'package/config/oxlint/**'
    - 'package/ownership-markers/foreign-borrowed/**'
    - 'package/oxlint-plugin/no-restricted-syntax/**'
    - 'package/oxlint-plugin/prefer-readonly-parameter-type/**'
    - 'package/oxlint-plugin/shared/**'
    - 'package/test-fixture/oxlint-no-restricted-syntax/**'
    - 'pnpm-lock.yaml'
    - '.github/workflows/readonly-semantic-bridge.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semantic-bridge:
    name: semantic bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-15
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 1

    - name: Set up node, pnpm and the task CLI
      uses: ./.github/actions/task-cli-setup
      with:
        node-version: '26.12.0'
        pnpm-version: '12.14.0'

    - name: Build semantic plugin artifact
      run: task-run //package/oxlint-plugin/prefer-readonly-parameter-type:build:js:node

    - name: Verify native bridge lifecycle and platform paths
      run: task-run //package/oxlint-plugin/prefer-readonly-parameter-type:test:semantic-bridge-host

    - name: Verify external consumer artifact
      run: task-run //package/oxlint-plugin/prefer-readonly-parameter-type:test:external-consumer-host
