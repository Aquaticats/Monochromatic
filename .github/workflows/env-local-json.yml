name: env-local-json

# Validates the encrypted-store reader, its search-fetch integration, and the
# Node container matrix. The host job installs real sops and age directly;
# the container job uses the runners' podman to prove the tools work inside
# Ubuntu as root and non-root.
on:
  pull_request:
    branches: ['main']
    paths:
    - 'package/module/env-local-json/**'
    - 'package/module/matrix/**'
    - 'package/agent-harness-shared/search-fetch/**'
    - 'package/mcp/search-fetch/**'
    - 'package/pi-plugin/search-fetch/**'
    - '.github/workflows/env-local-json.yml'
    - 'task.ts'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'
  push:
    branches: ['main']
    paths:
    - 'package/module/env-local-json/**'
    - 'package/module/matrix/**'
    - 'package/agent-harness-shared/search-fetch/**'
    - 'package/mcp/search-fetch/**'
    - 'package/pi-plugin/search-fetch/**'
    - '.github/workflows/env-local-json.yml'
    - 'task.ts'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'
    - 'pnpm-lock.yaml'
    - 'pnpm-workspace.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up node, pnpm and the task CLI
      uses: ./.github/actions/task-cli-setup
    - name: Install sops and age
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends age
        SOPS_VERSION=3.13.3
        curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o /usr/local/bin/sops
        sudo chmod +x /usr/local/bin/sops
    - name: Matrix runner unit tests
      run: task-run //package/module/matrix:test
    - name: Build the reader
      run: task-run //package/module/env-local-json:build
    - name: Reader unit tests with real sops and age
      run: task-run //package/module/env-local-json:test:unit
    - name: Build search-fetch shared
      run: task-run //package/agent-harness-shared/search-fetch:build
    - name: Search-fetch shared unit tests
      run: task-run //package/agent-harness-shared/search-fetch:test:unit
    - name: MCP server build and tests
      run: task-run //package/mcp/search-fetch:buildAndTest
    - name: Pi extension verification
      run: task-run //package/pi-plugin/search-fetch:verify:extension

  container:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up node, pnpm and the task CLI
      uses: ./.github/actions/task-cli-setup
    - name: Build the reader
      run: task-run //package/module/env-local-json:build
    - name: Verify podman
      run: podman --version
    - name: Reader container matrix
      run: task-run //package/module/env-local-json:test:container
