name: git-policy-cli-fuzz

# Compiles package/git-policy/cli.fuzz against package/git-policy/cli on changes
# to either one, so a wrapper change that moves a public type or adds a dependency
# the sidecar's Cargo.lock does not record fails CI instead of the next fuzz
# campaign. The sidecar is its own Cargo workspace linking the wrapper by path,
# and until this workflow existed nothing ran its compile when the wrapper moved:
# doc/planning/catching-a-stale-fuzz-sidecar-lockfile.md measured the failure.
#
# The check is the sidecar's own `lint:types` task through `task-run`, the task CLI
# every workflow uses, because mise is never invoked in CI
# (doc/decision/mise-free-ci.md). Both of its cargo calls run `--locked --offline`,
# so the job fetches the locked crates first and a stale sidecar lock fails here
# too.
#
# push and pull_request are path-filtered to the wrapper, the sidecar and the
# crates the sidecar links by path. merge_group cannot be path-filtered (a GitHub
# limitation), so the Scope step reuses the tested toml-edit scope program to skip
# the compile when a merge group changes no filtered path; the job still succeeds
# so a required merge-queue check stays green.

on:
  pull_request:
    branches: ['main']
    paths:
    - 'package/git-policy/cli/**'
    - 'package/git-policy/cli.fuzz/**'
    - 'package/jsonc-edit/core-rust/**'
    - 'package/catalog-specifier/core-rust/**'
    - 'package/forbidden-strings/cli/**'
    - 'package/forbidden-strings/core/**'
    - 'package/linter/monochromatic-lint/**'
    - '.github/workflows/git-policy-cli-fuzz.yml'
  merge_group:
    branches: ['main']
  push:
    branches: ['main']
    paths:
    - 'package/git-policy/cli/**'
    - 'package/git-policy/cli.fuzz/**'
    - 'package/jsonc-edit/core-rust/**'
    - 'package/catalog-specifier/core-rust/**'
    - 'package/forbidden-strings/cli/**'
    - 'package/forbidden-strings/core/**'
    - 'package/linter/monochromatic-lint/**'
    - '.github/workflows/git-policy-cli-fuzz.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        # The scope command validates the event's exact base and head commits.
        fetch-depth: 0

    - name: Scope to the wrapper and its sidecar
      id: scope
      # Runner-provided Node executes this before the task CLI or dependency installation.
      # The launcher remains CommonJS because Actions writes an extensionless file.
      # The path lists and the fail-closed decision live in the tested source entry,
      # which this workflow reuses rather than copying
      # (doc/decision/toml-edit-ci-scope.md).
      shell: node {0}
      env:
        SCOPE_SUBJECT: git-policy-cli-fuzz
        SCOPE_PACKAGE_PREFIXES: |
          package/git-policy/cli/
          package/git-policy/cli.fuzz/
          package/jsonc-edit/core-rust/
          package/catalog-specifier/core-rust/
          package/forbidden-strings/cli/
          package/forbidden-strings/core/
          package/linter/monochromatic-lint/
        SCOPE_CONTRACT_PATHS: .github/workflows/git-policy-cli-fuzz.yml
        SCOPE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        SCOPE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
      run: |
        require('node:child_process').execFileSync(
          process.execPath,
          ['package/toml-edit/core.fuzz/src/ci-scope.ts'],
          { stdio: 'inherit' },
        )

    - name: Set up node and the task CLI
      if: steps.scope.outputs.run == 'true'
      uses: ./.github/actions/task-cli-setup
      with:
        # The task CLI and its task files load node builtins and relative files only,
        # so this job needs no workspace install.
        install-dependencies: 'false'

    - name: Resolve the pinned Rust toolchain
      if: steps.scope.outputs.run == 'true'
      # The repository's pin, single-sourced from toolchain.lock.json, so the
      # compile uses the toolchain the wrapper's own checks use.
      run: jq --raw-output '"RUST_TOOLCHAIN=\(.tools.rust.version)"' toolchain.lock.json >> "$GITHUB_ENV"

    - name: Install the pinned Rust toolchain
      if: steps.scope.outputs.run == 'true'
      # Clippy is a component, not part of the minimal profile, and the second check
      # of the task is a Clippy run.
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
        rustup default "$RUST_TOOLCHAIN"

    - name: Fetch the locked crates
      if: steps.scope.outputs.run == 'true'
      # The type-check runs with `--offline`, so every locked crate must already be
      # in the registry cache; `--locked` also refuses a lockfile behind its manifests.
      run: |
        cargo fetch --locked --manifest-path package/git-policy/cli/Cargo.toml
        cargo fetch --locked --manifest-path package/git-policy/cli.fuzz/Cargo.toml

    - name: Type-check the sidecar against the wrapper
      if: steps.scope.outputs.run == 'true'
      run: task-run //package/git-policy/cli.fuzz:lint:types
