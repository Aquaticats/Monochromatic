[tasks."build:js:client"]
extends = "build:js:client"

[tasks.build]
description = "Generate static dashboard from canary history and artifacts"
# canary-lint/ is the output directory and must not appear in sources.
run = """
task-depends -s "../inference-canary/src/*.ts" -s "../inference-canary/src/codegen/**/*" -s "../inference-canary/src/simulation/**/*" -s "../inference-canary/src/stak/**/*" -o "../inference-canary/src/canary-lint/**/*" -- mise run //packages/dev-script/inference-canary:run
mise run //packages/dev-script/inference-canary-viewer:build:js:client
node src/build.ts
"""

[tasks."dev:watch"]
description = "Rebuild dashboard on source or canary-lint changes"
run = "mise watch -w src -w ../inference-canary/src/canary-lint --no-vcs-ignore --debounce 1sec -r -- build"

[tasks."dev:serve"]
description = "Serve the built dashboard locally"
run = "bun ./dist/final/index.html"

[tasks.dev]
description = "Watch and serve the dashboard"
run = [{ tasks = ["dev:*"] }]

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"
