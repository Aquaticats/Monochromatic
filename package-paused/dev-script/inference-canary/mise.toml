[tasks.run]
description = "Run the inference canary against all configured models"
depends = ["prepare"]
run = "node src/canary.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks.prepare]
extends = "prepare"

[tasks."prepare:perf-test-data"]
run = [{ tasks = ["prepare:perf-test-data:*"] }]

[tasks."prepare:perf-test-data:css-mixin"]
run = "node src/codegen/perf-test-data/mise.generate-css-mixin-perf.ts"

[tasks."prepare:perf-test-data:csv"]
run = "node src/codegen/perf-test-data/mise.generate-csv-perf.ts"

[tasks."prepare:perf-test-data:expr"]
run = "node src/codegen/perf-test-data/mise.generate-expr-perf.ts"
