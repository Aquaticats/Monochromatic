[tasks.build]
description = "Build client JavaScript, then global CSS so tsdown cleaning cannot remove generated CSS"
run = "mise run build:js:client; mise run build:css"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:client"]
extends = "build:js:client"

[tasks."build:css"]
description = "Build global CSS from h-css style modules"
run = "node src/client/styles/build.ts"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:client"]
extends = "watch:build:js:client"

[tasks."watch:build:css"]
description = "Watch h-css style modules and rebuild global CSS on change"
# Initial build so global.css exists before the first file change;
# tsdown --watch does this automatically but mise watch does not.
# Glob includes styles/*.ts to catch reset.ts and theme.ts alongside *.styles.ts.
run = "mise run build:css; mise watch -w src/client -g '*.styles.ts' -g 'styles/*.ts' -r -- build:css"

[tasks."dev"]
description = "Start editord in watch mode (rebuilds client, restarts server)"
run = [{ tasks = ["watch:build:js:client", "watch:build:css", "dev:server"] }]

[tasks."dev:server"]
hide = true
description = "Start editord server with file-watch auto-restart"
# Driven by @monochromatic-dev/watch-restart-cli: TS-first watcher
# with an in-process content-hash cache (so external editors' byte-identical
# format-on-save writes do not trigger a restart), spawning the node child
# directly via node:child_process so SIGTERM reaches it through one process
# layer. See doc/troubleshooting/mise-watch.md for the failure modes that
# motivated this migration.
run = "watch-restart -w src/server -- node src/server/index.ts"

[tasks."start:server"]
hide = true
description = "Start editord server (single run)"
run = "node src/server/index.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
