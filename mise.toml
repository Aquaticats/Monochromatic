# Lints Rust, Markdown and MDX with monochromatic-lint, the cargo:monochromatic-lint
# tool, under the root monochromatic-lint.config.jsonc
# (doc/planning/unified-linter.md). It replaces the per-package lint:rust tasks and
# the Node Markdown linter. No-arg walks the whole tree, honouring .gitignore;
# file/dir paths restrict the walk. Exits 1 on error findings and 2 when the run
# could not be completed; warnings alone exit 0.
# Fills the Cargo registry cache with every crate each package's `Cargo.lock` names, for all targets, so offline
# readers of the lock find them: the closure check of `lint:monochromatic-lint` runs `cargo metadata --offline --locked`
# per package and skips a package whose crates are not cached (for example the Windows-only crates the music player's
# lock names). Post-`--` arguments are package directories (default: every directory with a tracked `Cargo.lock`).
# Needs the network; `cargo fetch --locked` never changes a lock file, and a package that fails is named at the end.
[tasks."fetch:rust-dependencies"]
description = "Download every locked Cargo dependency of each package (default: all with a Cargo.lock) so the offline closure check can read them"
usage = """
arg "[directories]" var=#true help="Package directories to fetch (default: every directory with a tracked Cargo.lock)"
"""
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
const { execFileSync, spawnSync } = await import('node:child_process')
const { dirname } = await import('node:path')
const requested = parseUsageArgs(process.env.usage_directories ?? '')
const lockFiles = execFileSync('git', ['ls-files', '*Cargo.lock'], { encoding: 'utf8' }).split('\\n').filter((line) => line !== '')
const directories = requested.length > 0 ? requested : lockFiles.map((lockFile) => dirname(lockFile))
const failed: string[] = []
for (const directory of directories) {
  const result = spawnSync('cargo', ['fetch', '--locked', '--manifest-path', directory + '/Cargo.toml'], { stdio: 'inherit' })
  if (result.status !== 0) { failed.push(directory) }
}
if (failed.length > 0) { throw new Error('cargo fetch --locked failed in: ' + failed.join(', ')) }
"""

# `depends` runs the fetch first (owner decision of 2026-11-07, "Fetch then warn"): the closure check reads the Cargo
# cache offline, and a package whose crates are missing is reported as a warning finding naming the fix, so the fetch
# keeps that warning from appearing on a cold cache. Unlike a `run` array entry, `depends` takes none of the post-`--`
# paths, so the fetch always covers every locked package.
[tasks."lint:monochromatic-lint"]
description = "Lint Rust, Markdown and MDX with monochromatic-lint, optionally restricted to specific paths"
depends = ["fetch:rust-dependencies"]
# No usage spec: mise appends post-`--` args to the command as a real argv vector
# (preserving spaces). The linter walks `.` when no paths are given.
run = "monochromatic-lint"

# Validates SKILL.md frontmatter in the canonical .agents/skills root: every block
# must strict-YAML parse with the `yaml` package Pi's skill loader parses with, and
# carry the Agent Skills spec fields that loader enforces (kebab-case name matching
# the directory, non-empty description of at most 1024 characters). The strict parse
# guards the multiline implicit-key shape that made Pi skip skills whole
# (doc/troubleshooting/yaml-multiline-implicit-key.md). Post-`--` paths select other
# skill roots, e.g. `mise run lint:skills -- ~/.agents/skills`. Exits 1 on problems;
# unknown frontmatter keys only warn, because other skill consumers legitimately
# carry their own keys.
[tasks."lint:skills"]
description = "Validate SKILL.md frontmatter: strict-YAML parse plus Agent Skills spec fields"
usage = 'arg "[roots]" var=#true help="Skill roots to check (default .agents/skills)"'
shell = "node --input-type=module-typescript -e"
run = '''
{{vars.parse_usage_args}}
import { existsSync, readdirSync, readFileSync } from 'node:fs';
import { join, resolve } from 'node:path';
import { parse } from 'yaml';

const ALLOWED_KEYS = new Set([
  'name',
  'description',
  'license',
  'compatibility',
  'metadata',
  'allowed-tools',
  'owner',
  'tags',
  'disable-model-invocation',
]);
const NAME_PATTERN = /^[a-z0-9]+(-[a-z0-9]+)*$/u;

const passedRoots = parseUsageArgs(process.env.usage_roots ?? '');
const roots = passedRoots.length > 0 ? passedRoots : ['.agents/skills'];
const problems = [];
const warnings = [];
let checked = 0;

for (const root of roots) {
  const rootDir = resolve(root);
  if (!existsSync(rootDir)) {
    problems.push(`${root}: no such skill root`);
    continue;
  }
  for (const entry of readdirSync(rootDir, { withFileTypes: true })) {
    if (!entry.isDirectory()) continue;
    const file = join(rootDir, entry.name, 'SKILL.md');
    if (!existsSync(file)) continue;
    checked += 1;
    const text = readFileSync(file, 'utf8');
    const block = /^---\r?\n([\s\S]*?)\r?\n---/u.exec(text);
    if (block === null) {
      problems.push(`${file}: no closed --- frontmatter block`);
      continue;
    }
    let data;
    try {
      data = parse(block[1]);
    } catch (error) {
      problems.push(`${file}: ${error.code ?? error.name}: ${String(error.message).split('\n')[0]}`);
      continue;
    }
    if (data === null || typeof data !== 'object' || Array.isArray(data)) {
      problems.push(`${file}: frontmatter is not a mapping`);
      continue;
    }
    const name = data.name;
    const description = data.description;
    if (typeof name !== 'string' || name.length === 0) {
      problems.push(`${file}: missing name`);
    } else {
      if (!NAME_PATTERN.test(name)) problems.push(`${file}: name ${name} is not kebab-case`);
      if (name.length > 64) problems.push(`${file}: name is ${name.length} characters (max 64)`);
      if (name !== entry.name) {
        problems.push(`${file}: name ${name} does not match directory ${entry.name}`);
      }
    }
    if (typeof description !== 'string' || description.length === 0) {
      problems.push(`${file}: missing description`);
    } else if (description.length > 1024) {
      problems.push(`${file}: description is ${description.length} characters (max 1024)`);
    }
    for (const key of Object.keys(data)) {
      if (!ALLOWED_KEYS.has(key)) warnings.push(`${file}: unknown frontmatter key ${key}`);
    }
  }
}

for (const problem of problems) console.error(problem);
for (const warning of warnings) console.error(`warning: ${warning}`);
console.log(
  `lint:skills: ${checked} SKILL.md files checked, ${problems.length} problems, ${warnings.length} warnings`,
);
if (problems.length > 0) process.exitCode = 1;
'''

