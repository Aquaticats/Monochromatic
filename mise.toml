#region Test Tasks

# Root test aggregate: the root unit glob, the Playwright suites, and every
# active package's own `test` task. The package layer exists because a TypeScript
# filename glob cannot reach cargo nextest, Gradle, tofu resolvers, or the
# Electron/Wayland boundary suites, so without it a green root run was not
# evidence of repository coverage (issue 305).
#
# Ownership policy, stated once and implemented in two places: a package that
# declares `[tasks.test]` owns its own suites, including its `*.unit.test.ts`
# files, and the root unit glob leaves those files to that package task (see
# [task_templates."test:unit"]). Every other package is reached by the root glob.
# Ownership therefore never overlaps and never leaves a gap, and a new package
# `[tasks.test]` becomes root-reachable with no edit here.
#
# Deliberate exclusions, each one named rather than silent:
# - `package-deprecated/` and `package-paused/` stay out through `[monorepo]
#   config_roots`, the same boundary that keeps them out of `lint` and `build`.
# - `*.expensive.unit.test.ts` stays opt-in through `mise run test:unit -- --all`,
#   as before.
# - Network resolver suites are separate task names (`test:*:network`) that no
#   package's `test` task lists, so this aggregate inherits that choice instead of
#   making one.
# - Nothing is excluded by platform or cost: an exclusion there would recreate the
#   false green this task removes. A suite needing a device, compositor, container
#   or network fails here loudly instead of being skipped.
#
# When args are provided, only unit tests run with those args (for single-file filtering).
# When no args are provided, every suite runs: the three root suites together,
# then the package fanout.
[tasks.test]
description = "Run all tests (root unit, browser, e2e and every package's own test task), or pass args to filter unit tests"
alias = "t"
usage = 'arg "[args]" var=#true help="Test file paths (when provided, only unit tests run)"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.run_test_files}}
const args = parseUsageArgs(process.env.usage_args ?? '')
if (args.length === 0) {
  // Root suites run together, then the package fanout runs alone: each package
  // suite is itself a multi-threaded cargo, Gradle or container run, so the
  // phases stay sequential and each phase stays internally bounded.
  // Both phases always run, so one failing suite cannot hide another's failure.
  const suites = ['test:unit', 'test:browser', 'test:e2e']
  const failed = []
  const runSuite = async (suite) => {
    const [code] = await once(spawn('mise', ['run', suite], { stdio: 'inherit' }), 'exit')
    if (code !== 0) { failed.push(suite) }
  }
  await Promise.all(suites.map(runSuite))
  await runSuite('test:packages')
  if (failed.length > 0) { throw new Error(`test suites failed: ${failed.join(', ')}`) }
} else {
  await runTestFiles(args, [])
}
"""

[tasks."test:packages"]
hide = true
description = "Run every active package's own test task, bounded by available parallelism, naming every failing package"
# The shared cross-package fanout derives its target suffix from the task name, and
# this wrapper's own name is not that suffix, so FANOUT_TASK supplies it, which is
# the mechanism the fanout var documents. Reusing that var keeps one fanout policy
# for lint and for test: availableParallelism workers, every failing child named in
# one error. Like the lint fanout, this fails rather than passing when no package
# declares the task.
