#region Preparation Tasks

# Thin alias of `toolchain:sync`, kept so existing callers keep working (the
# commented-out `enter` hook below, docs, and muscle memory). Invoked on a fresh
# clone with no manual step: it installs the versions toolchain.lock.json records
# (lock-constrained, the `pnpm install` model), and re-resolving versions is a
# separate update action. The array `run` sequences and fails fast on the first
# entry with no shell-specific chaining, so it works under both `sh` and `cmd`.
[tasks.bootstrap]
description = "Alias of toolchain:sync: converge every tool to the versions toolchain.lock.json records (runs on directory entry)"
run = ["mise run toolchain:sync"]

[tasks.prepare]
description = "Prepare environment: pnpm install, then fan out the prepare:* children (file sync, Playwright container, Android SDK, etc.). EXPENSIVE on a fresh clone: it auto-runs prepare:android (~2.9 GB Android SDK + NDK) and prepare:playwright (a podman image build) for every developer regardless of which packages they touch; this cost is intended and tolerated. Each child is idempotent, so reruns are cheap."
shell = "node --input-type=module-typescript -e"
# Deliberate variant of the vars.fanout pattern, NOT a reuse: prepare:pnpm must run
# first and complete (children need node_modules) before the remaining prepare:*
# children fan out in parallel, and pnpm is excluded from that parallel set. The
# shared fanout var has no sequential-first/exclude parameter; adding one for this
# single consumer would complicate ~9 other fanout callers, so this stays inline.
run = """
const { execFileSync, spawn } = await import('node:child_process')
const { once } = await import('node:events')
execFileSync('mise', ['run', 'prepare:pnpm'], { stdio: 'inherit' })
const prefix = `${process.env.MISE_TASK_NAME}:`
const depth = prefix.split(':').length
const pnpmTask = `${prefix}pnpm`
// `mise tasks --all --hidden --json` is intentionally large in this monorepo;
// raise execFileSync's default 1 MiB stdout cap so prepare fanout keeps working
// as the task graph grows.
const MISE_TASKS_JSON_MAX_BUFFER = 16 * 1024 * 1024
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: MISE_TASKS_JSON_MAX_BUFFER }))
const children = tasks.map((task) => task.name).filter((name) => name.startsWith(prefix) && name.split(':').length === depth && name !== pnpmTask)
const processes = children.map((name) => spawn('mise', ['run', name], { stdio: 'inherit' }))
const exits = await Promise.all(processes.map((proc) => once(proc, 'exit')))
const failed = children.filter((name, index) => exits[index][0] !== 0)
if (failed.length > 0) { throw new Error(`prepare child tasks failed: ${failed.join(', ')}`) }
"""

