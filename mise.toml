# Generated from mise.no-env.toml by file-enforcer.
# harper:ignore

# mise.toml is generated from mise.no-env.toml by file-enforcer (file-enforcer.config.ts, generateMiseToml).
# Edit mise.no-env.toml and run file-enforcer; never hand-edit mise.toml.

# mise configuration - replaces proto and moon
# https://mise.jdx.dev/configuration.html
# After cloning, run `mise trust` to mark this file as trustworthy.
# Mise refuses to evaluate env vars, templates, and `path:` plugin versions
# in untrusted config files. Trusting the monorepo root implicitly trusts
# all descendant config files (package/**/mise.toml).
# https://mise.jdx.dev/cli/trust.html

# Enables monorepo task discovery: tasks in subdirectories are auto-discovered
# and prefixed with their relative paths, creating a unified task namespace.
# https://mise.jdx.dev/tasks/monorepo.html
monorepo_root = true

[monorepo]
# Each package/*/* directory with a mise.toml becomes its own config root,
# giving it its own tools, env, and tasks while inheriting from the root.
# package-deprecated/*/* is intentionally excluded: archived packages remain
# installable (e.g. via npm) but should not be discovered as task config roots,
# so their tasks stay out of the active task graph.
config_roots = [
  "package/*/*",
]

[settings]
# Disable unused magical behavior
env_shell_expand = false

# Experimental features
experimental = true

# Per task timeout not implemented yet in Mise.
# task_timeout = "5s"

# Uncomment when debugging
# verbose = true

# Matches the package/*/* directory depth (e.g. package/logger/core = 3 segments).
task.monorepo_depth = 3

# Skip the extra Tera template pass that collects arg()/option()/flag() from run scripts.
# No tasks in this repo use Tera spec functions; only explicit `usage` fields are needed.
# Avoids two-pass parsing quirks and will be the default after Tera arguments are removed in 2026.11.0.
task.disable_spec_from_run_scripts = true

# No global shell override: mise uses its platform defaults (sh -c -o errexit on
# unix, cmd /c on Windows). Trivial single-command bodies and array `run` runners
# work under both. Bodies needing logic, structured data, or non-portable syntax
# declare `shell = "node --input-type=module-typescript -e"` per task (node -e strips TS, runs ESM imports, and
# supports top-level await).

[hooks]
# Runs at first `cd` before any tool is installed, so it must be cross-platform
# and depend only on mise itself (the one guaranteed prerequisite). It delegates
# to the `bootstrap` task, a thin alias of `toolchain:sync`, which installs the
# versions toolchain.lock.json records (lock-constrained, the `pnpm install`
# model). Hooks require a string body, so the array `run` (which mise sequences
# and fails fast on) lives on the task.
# Commented out to reduce delays in daily development.
# enter = { task = "bootstrap" }

[vars]
# Monorepo root for task templates that need to reference root-level config files.
monorepo_root = "{{config_root}}"
# node -e fanout script: discovers direct child tasks (one `:` level deeper) and
# runs each as a plain `mise run <child>` subprocess, all in parallel, then fails
# if any child failed. No `:::` separator or other mise-specific inline sugar:
# each child is an ordinary shelled `mise run`, and Node owns the concurrency.
# Interpolated into the fanout task templates, each of which sets
# `shell = "node --input-type=module-typescript -e"`. Runtime depth filtering is still required because the
# native `[{ tasks = ["prefix:*"] }]` glob matches all descendants, since mise
# treats `:` as a regular character in `*` globs.
fanout = """
const { execFileSync, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const prefix = `${process.env.MISE_TASK_NAME}:`
const depth = prefix.split(':').length
// `mise tasks --all --hidden --json` is intentionally large in this monorepo;
// raise execFileSync's default 1 MiB stdout cap so package fanout keeps working
// as the task graph grows.
const MISE_TASKS_JSON_MAX_BUFFER = 16 * 1024 * 1024
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: MISE_TASKS_JSON_MAX_BUFFER }))
const children = tasks.map((task) => task.name).filter((name) => name.startsWith(prefix) && name.split(':').length === depth)
if (children.length === 0) { throw new Error(`no child tasks for ${process.env.MISE_TASK_NAME}`) }
const processes = children.map((name) => spawn('mise', ['run', name], { stdio: 'inherit' }))
const exits = await Promise.all(processes.map((proc) => once(proc, 'exit')))
const failed = children.filter((name, index) => exits[index][0] !== 0)
if (failed.length > 0) { throw new Error(`fanout child tasks failed: ${failed.join(', ')}`) }
"""
# node -e cross-package fanout: the JS replacement for the native `mise
# '//package/...:<task>'` monorepo glob, which is unreliable (aborts the
# aggregate while child fanout work is still in flight; see
# doc/handover/lint-fix-2026-06.md). Mirrors the intra-package `fanout` var
# above, but selects every PACKAGE task whose suffix matches, rather than the
# current task's direct children. The target suffix is `FANOUT_TASK` when set
# (used by wrapper tasks whose own name differs from the fanned-out suffix),
# else derived from MISE_TASK_NAME by stripping the root `//:` prefix (mise
# names the root config's tasks `//:build`, `//:lint:detekt`, etc.). Enumerating
# real tasks means packages lacking the task are skipped, exactly like the
# native glob. A bounded worker pool (availableParallelism) keeps ~90 package
# linter subtrees from spawning at once; `watch:*` fans out unbounded so every
# long-running watcher starts and stays alive. Interpolated into the
# cross-package fanout tasks, each of which sets `shell = "node --input-type=module-typescript -e"`.
fanout_packages = """
const { execFileSync, spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { availableParallelism } = await import('node:os')
const taskName = process.env.MISE_TASK_NAME ?? ''
const suffix = process.env.FANOUT_TASK ?? (taskName.startsWith('//:') ? taskName.slice(3) : taskName)
// `mise tasks --all --hidden --json` is intentionally large in this monorepo;
// raise execFileSync's default 1 MiB stdout cap so package fanout keeps working
// as the task graph grows.
const MISE_TASKS_JSON_MAX_BUFFER = 16 * 1024 * 1024
const tasks = JSON.parse(execFileSync('mise', ['tasks', '--all', '--hidden', '--json'], { encoding: 'utf8', maxBuffer: MISE_TASKS_JSON_MAX_BUFFER }))
const targets = tasks.map((task) => task.name).filter((name) => name.startsWith('//package/') && name.slice(name.indexOf(':') + 1) === suffix)
if (targets.length === 0) { throw new Error(`no package tasks matched ${suffix}`) }
const limit = suffix.startsWith('watch') ? targets.length : Math.max(1, Math.min(availableParallelism(), targets.length))
const failed = []
let next = 0
const worker = async () => {
  while (next < targets.length) {
    const name = targets[next++]
    const [code] = await once(spawn('mise', ['run', name], { stdio: 'inherit' }), 'exit')
    if (code !== 0) { failed.push(name) }
  }
}
await Promise.all(Array.from({ length: limit }, worker))
if (failed.length > 0) { throw new Error(`package fanout failed: ${failed.join(', ')}`) }
"""

# Standards-review gate shadow run (doc/runbook/standards-review-gate.md).
# Reviews the landed commit against AGENTS.md through pi and appends one entry
# to doc/audit/standards-review-gate-shadow.md. Shadow semantics: it never
# blocks or fails a landing, records skips and reviewer failures in the log,
# and judges nothing, so "Named superlinear cost" arrives as unjudged.
# Reviewer route is pinned because pi's default provider answered 402
# billing_error on 2026-10-29 (doc/troubleshooting/pi-advisor-provider-billing.md);
# --no-tools keeps the reviewer from running git, which is the recursion guard.
# SHADOW_REVIEW_LOG points the log at a disposable fixture for tests and
# SHADOW_REVIEW_SHA replays any commit instead of HEAD.
shadow_review = """
const { execFileSync } = await import('node:child_process')
const { appendFileSync, mkdirSync, writeFileSync } = await import('node:fs')
const repo = execFileSync('git', ['rev-parse', '--show-toplevel'], { encoding: 'utf8' }).trim()
const git = (...args) => execFileSync('git', ['-C', repo, ...args], { encoding: 'utf8', maxBuffer: 1 << 26 })
const sha = git('rev-parse', process.env.SHADOW_REVIEW_SHA ?? 'HEAD').trim()
const subject = git('log', '-1', '--format=%s', sha).trim()
const patch = git('show', '--format=', '--patch', sha)
const names = git('diff-tree', '--no-commit-id', '--name-only', '-r', sha).split('\\n').filter(Boolean)
const codeFiles = names.filter((name) => /\\.(ts|tsx|rs|js|mjs|cjs)$/.test(name))
const logPath = process.env.SHADOW_REVIEW_LOG ?? `${repo}/doc/audit/standards-review-gate-shadow.md`
const entry = (line) => appendFileSync(logPath, `${line}\\n`)
if (codeFiles.length === 0) {
  entry(`- Skipped: ${sha.slice(0, 12)} ${subject} (no code files)`)
  process.exit(0)
}
const capLines = 2000
const lines = patch.split('\\n')
const truncated = lines.length > capLines
const scratch = `${process.env.HOME}/temp/agent/shadow-review`
mkdirSync(scratch, { recursive: true, mode: 0o700 })
const diffPath = `${scratch}/${sha.slice(0, 12)}.diff`
writeFileSync(diffPath, `${lines.slice(0, capLines).join('\\n')}\\n`)
const route = 'openai/gpt-6.1-sol via pi --print --no-session --no-tools --no-skills --no-themes --no-context-files'
const prompt = 'Review the candidate diff in the second file against the standards in the first file, AGENTS.md. Report findings only: each with the function name, a severity (blocker, major, minor, nit), the tag code of the standard it violates when one applies, and one or two sentences of rationale. Account cost across call boundaries: a per-entry or per-run call into a helper that walks unbounded data is superlinear. Never accept an inline complexity claim as proof: an O(n) or one-linear-pass comment is a claim, not evidence. If you have no findings in some respect, say so explicitly. Do not propose rewritten code. Keep the review under 400 words.'
const started = Date.now()
let outcome = ''
try {
  outcome = execFileSync('pi', ['--model', 'openai/gpt-6.1-sol', '--print', '--no-session', '--no-tools', '--no-skills', '--no-themes', '--no-context-files', '--thinking', 'xhigh', '--system-prompt', prompt, `@${repo}/AGENTS.md`, `@${diffPath}`], { encoding: 'utf8', maxBuffer: 1 << 26, cwd: repo, stdio: ['ignore', 'pipe', 'pipe'] }).trim()
} catch (error) {
  outcome = `Reviewer failed: ${error instanceof Error ? error.message : String(error)}`
}
const seconds = ((Date.now() - started) / 1000).toFixed(1)
entry(`- Date: ${new Date().toISOString()}`)
entry(`  Subject: ${sha.slice(0, 12)} ${subject}`)
entry(`  Input size: ${codeFiles.length} code files, ${lines.length} diff lines${truncated ? `, capped at ${capLines}` : ''}`)
entry(`  Reviewer route: ${route}`)
entry(`  Wall-clock cost: ${seconds} s`)
entry('  Named superlinear cost: unjudged')
entry('  Findings kept:')
for (const line of outcome.split('\\n')) { entry(`    ${line}`) }
entry('')
"""

# Bootstrap-safe dispatch to any workspace package's node entry. Resolves the
# monorepo root (mise sets MISE_MONOREPO_ROOT in monorepo mode; the fallback
# covers non-monorepo invocations), then runs the entry's built dist when present,
# else its TS source through node. runWorkspaceNode(packagePath, entryName, args)
# dispatches a package entry; ensureOxlintConfig builds the root oxlint config on
# fresh trees and rebuilds it when any bundled oxlint config or plugin package is
# newer than the sidecar outputs. Interpolated into the dispatcher tasks (root and
# per-package), each of which sets `shell = "node --input-type=module-typescript -e"`. Its imported bindings are
# reused by any inline follow-up in those bodies, so the follow-up must not
# reimport them.
dispatch_workspace_node = """
const { existsSync, readdirSync, statSync } = await import('node:fs')
const { join, resolve } = await import('node:path')
const { execFileSync } = await import('node:child_process')
const configRoot = process.env.MISE_CONFIG_ROOT ?? process.cwd()
const monorepoRoot = process.env.MISE_MONOREPO_ROOT ?? (existsSync(join(configRoot, 'mise.no-env.toml')) ? configRoot : resolve(configRoot, '..', '..', '..'))
const runWorkspaceNode = (packagePath, entryName, entryArgs) => {
  const packageRoot = join(monorepoRoot, packagePath)
  const built = join(packageRoot, 'dist', 'final', 'node', `${entryName}.mjs`)
  const source = join(packageRoot, 'src', `${entryName}.ts`)
  const entry = existsSync(built) ? built : existsSync(source) ? source : null
  if (entry === null) { throw new Error(`missing built or source entry: ${packagePath}/${entryName}`) }
  execFileSync('node', [entry, ...entryArgs], { stdio: 'inherit' })
}
const existingPaths = (paths) => paths.filter((path) => existsSync(path))
const newestMtime = (path) => {
  const stats = statSync(path)
  if (!stats.isDirectory()) { return stats.mtimeMs }
  return readdirSync(path, { withFileTypes: true }).reduce((newest, entry) => {
    const entryPath = join(path, entry.name)
    if (entry.isDirectory()) { return Math.max(newest, newestMtime(entryPath)) }
    if (entry.isFile()) { return Math.max(newest, statSync(entryPath).mtimeMs) }
    return newest
  }, stats.mtimeMs)
}
const oxlintConfigPackageDir = join(monorepoRoot, 'package', 'config', 'oxlint')
const oxlintPluginPackagesDir = join(monorepoRoot, 'package', 'oxlint-plugin')
const oxlintPluginPackageDirs = existsSync(oxlintPluginPackagesDir)
  ? readdirSync(oxlintPluginPackagesDir, { withFileTypes: true })
      .filter((entry) => entry.isDirectory())
      .map((entry) => join(oxlintPluginPackagesDir, entry.name))
      .filter((packageDir) => existsSync(join(packageDir, 'package.json')))
  : []
const oxlintPackageDirs = [oxlintConfigPackageDir, ...oxlintPluginPackageDirs]
const oxlintConfigDistDir = join(oxlintConfigPackageDir, 'dist', 'final', 'node')
const oxlintConfigSrcDir = join(oxlintConfigPackageDir, 'src')
const oxlintSidecarOutputPaths = readdirSync(oxlintConfigSrcDir, { withFileTypes: true })
  .filter((entry) => entry.isFile() && entry.name.startsWith('plugin-') && entry.name.endsWith('.ts'))
  .map((entry) => join(oxlintConfigDistDir, `${entry.name.slice(0, -3)}.mjs`))
const shouldBuildOxlintConfig = () => {
  const outputPaths = [
    join(oxlintConfigDistDir, 'index.mjs'),
    ...oxlintSidecarOutputPaths,
  ]
  if (outputPaths.some((outputPath) => !existsSync(outputPath))) { return true }
  const sourcePaths = existingPaths([
    ...oxlintPackageDirs.flatMap((packageDir) => [
      join(packageDir, 'src'),
      join(packageDir, 'package.json'),
      join(packageDir, 'tsconfig.json'),
      join(packageDir, 'rolldown.node.config.ts'),
    ]),
    join(monorepoRoot, 'pnpm-lock.yaml'),
    join(monorepoRoot, 'pnpm-workspace.yaml'),
  ])
  const oldestOutputMtime = Math.min(...outputPaths.map((outputPath) => statSync(outputPath).mtimeMs))
  const newestSourceMtime = Math.max(...sourcePaths.map(newestMtime))
  return newestSourceMtime > oldestOutputMtime
}
const ensureOxlintConfig = () => {
  if (shouldBuildOxlintConfig()) { execFileSync('mise', ['run', '//package/config/oxlint:build:js:node'], { stdio: 'inherit' }) }
}
"""
# Shell-word parser for mise's usage_args, which arrives as a single shell-escaped
# string (e.g. a path with a space becomes `'weird name.ts'`). Recovers the
# original argument vector: bare tokens split on spaces, single/double-quoted
# spans kept whole, backslash escapes honoured.
# Interpolated into tasks that take positional file-path args.
parse_usage_args = """
const parseUsageArgs = (raw) => {
  const argv = []
  let current = null
  let index = 0
  while (index < raw.length) {
    const char = raw[index]
    if (current === null) {
      if (char === ' ') { index += 1; continue }
      current = ''
    }
    if (char === '\\\\') { current += raw[index + 1] ?? ''; index += 2; continue }
    if (char === "'" || char === '"') {
      index += 1
      while (index < raw.length && raw[index] !== char) { current += raw[index]; index += 1 }
      index += 1
      continue
    }
    if (char === ' ') { argv.push(current); current = null; index += 1; continue }
    current += char
    index += 1
  }
  if (current !== null) { argv.push(current) }
  return argv
}
"""
# Runs test files from their nearest package task root as `node [nodeArgs] <file>`
# subprocesses, bounded to availableParallelism(), and lists non-zero exits.
# Every subprocess gets MONOCHROMATIC_LOG_DIRECTORY pointed at one per-run
# scratch directory under ${HOME}/temp/agent unless the caller already chose
# one, so test runs leave zero log files in any checkout (issue 576).
# Interpolated into the test tasks; each sets `shell = "node --input-type=module-typescript -e"`.
run_test_files = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { availableParallelism, homedir } = await import('node:os')
const { dirname, join: joinTestPath, resolve: resolveTestPath } = await import('node:path')
const { chmodSync, existsSync: testPathExists, mkdirSync } = await import('node:fs')
const testFileCwd = (file) => {
  let current = dirname(resolveTestPath(file))
  while (true) {
    if (testPathExists(joinTestPath(current, 'mise.toml'))) { return current }
    const parent = dirname(current)
    if (parent === current) { return process.cwd() }
    current = parent
  }
}
const testRunEnv = () => {
  const env = { ...process.env }
  if (env.MONOCHROMATIC_LOG_DIRECTORY !== undefined) { return env }
  const agentScratch = joinTestPath(homedir(), 'temp', 'agent')
  mkdirSync(agentScratch, { recursive: true, mode: 0o700 })
  chmodSync(agentScratch, 0o700)
  const stamp = new Date().toISOString().replaceAll(':', '-')
  const runLogDirectory = joinTestPath(agentScratch, 'module-test-logs', `${stamp}-${process.pid}`)
  mkdirSync(runLogDirectory, { recursive: true, mode: 0o700 })
  env.MONOCHROMATIC_LOG_DIRECTORY = runLogDirectory
  return env
}
const runTestFiles = async (files, nodeArgs) => {
  if (files.length === 0) { return }
  const env = testRunEnv()
  const limit = Math.max(1, Math.min(availableParallelism(), files.length))
  const failures = []
  let next = 0
  const worker = async () => {
    while (next < files.length) {
      const file = resolveTestPath(files[next])
      next += 1
      const proc = spawn('node', [...nodeArgs, file], { cwd: testFileCwd(file), stdio: 'inherit', env })
      const [code] = await once(proc, 'exit')
      if (code !== 0) { failures.push(file) }
    }
  }
  await Promise.all(Array.from({ length: limit }, worker))
  if (failures.length > 0) { throw new Error(`test files failed: ${failures.join(', ')}`) }
}
"""
# Shared Playwright-in-podman runner for the test:browser / test:e2e family. Owns
# the execFileSync import and the parseUsageArgs() call (so the interpolating task
# must put {{vars.parse_usage_args}} BEFORE {{vars.run_playwright}} and must not
# re-import execFileSync). Each task body shrinks to one runPlaywright(config, flags)
# call; the four tasks differ only in config file and --project flag.
#
# The mount deliberately does NOT use :Z. That flag relabels every file under the
# mount with per-container MCS categories, and this tree carries a six-figure count
# of files under node_modules/.monochromatic, which the logger is still appending
# to while the relabel walks it. The relabel failed outright here with
# "lsetxattr ... operation not permitted", so no browser test could run at all.
# label=disable skips the walk instead. It drops SELinux confinement for a
# container that already gets read-write access to the whole repo, so the
# confinement was not buying much; the win is that the harness runs.
run_playwright = """
const { execFileSync } = await import('node:child_process')
const runPlaywright = (config, extraFlags = []) => {
  execFileSync('mise', ['run', 'prepare:playwright'], { stdio: 'inherit' })
  const args = parseUsageArgs(process.env.usage_args ?? '')
  execFileSync('podman', ['run', '--rm', '--security-opt', 'label=disable', '-v', `${process.cwd()}:/work`, '-w', '/work', 'monochromatic-playwright', 'npx', 'playwright', 'test', '--config', config, ...extraFlags, ...args], { stdio: 'inherit' })
}
"""

[task_templates.build]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates."build:js"]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates."build:js:browser"]
run = "rolldown --configLoader native --config rolldown.browser.config.ts"

[task_templates."build:js:client"]
run = "rolldown --configLoader native --config rolldown.client.config.ts"

[task_templates."build:js:node"]
run = "rolldown --configLoader native --config rolldown.node.config.ts"

[task_templates."watch:build"]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates."watch:build:js"]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates."watch:build:js:browser"]
run = "rolldown --watch --configLoader native --config rolldown.browser.config.ts"

[task_templates."watch:build:js:client"]
run = "rolldown --watch --configLoader native --config rolldown.client.config.ts"

[task_templates."watch:build:js:node"]
run = "rolldown --watch --configLoader native --config rolldown.node.config.ts"

[task_templates.test]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates."test:unit"]
description = "Run active-tree *.unit.test.ts in parallel via node (excludes *.expensive.* unless --all); pass file paths to filter"
usage = """
flag "--all" help="Include active-tree *.expensive.* files; cannot be combined with file paths"
arg "[args]" var=#true help="Test file paths to run (when provided, only those files run); cannot be combined with --all"
"""
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.run_test_files}}
const { existsSync } = await import('node:fs')
const { glob } = await import('node:fs/promises')
const { join } = await import('node:path')
const args = parseUsageArgs(process.env.usage_args ?? '')
const all = (process.env.usage_all ?? '').trim() === 'true'
if (all && args.length > 0) { throw new Error('--all cannot be combined with file paths') }
const isInactiveTest = (file) => file.includes('/deprecated/') || file.startsWith('package-deprecated/') || file.includes('/package-deprecated/') || file.startsWith('package-paused/') || file.includes('/package-paused/')
let files
if (args.length === 0) {
  files = []
  for await (const file of glob('**/*.unit.test.ts', { exclude: (name) => name.includes('node_modules') })) {
    if (!isInactiveTest(file) && (all || !file.includes('.expensive.'))) { files.push(file) }
  }
} else {
  // Package-scoped tasks run with cwd = MISE_CONFIG_ROOT (the package dir), so a repo-root-relative
  // path passed verbatim resolves under the package. Resolve each arg against the monorepo root
  // (modern mise), then the mise invocation dir, then cwd.
  const base = process.env.MISE_MONOREPO_ROOT ?? process.env.MISE_ORIGINAL_CWD ?? process.cwd()
  files = args.map((file) => existsSync(file) ? file : join(base, file))
}
await runTestFiles(files, [])
"""

[task_templates."watch:test"]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates.lint]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

[task_templates."lint:oxlint"]
description = "Lint with Oxlint"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', [])
"""
[task_templates."format:oxlint"]
description = "Auto-fix this package with Oxlint using its package-local tsconfig"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix'])
"""
[task_templates."lint:types"]
description = "TypeScript"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
runWorkspaceNode('package/monorepo-task/core-exec', 'tsc-filter', ['--build'])
"""

[task_templates."watch:lint:types"]
description = "Type check in watch mode"
run = "tsc --watch"

[task_templates.prepare]
shell = "node --input-type=module-typescript -e"
run = "{{vars.fanout}}"

#region tasks
#
# Task naming follows `${category}${optional(`--${modifier}`)}:${child}`
# never use depends or post depends, use run only because it's the easiest to understand.

#region Utility Tasks

[tasks.try]
description = "Run a task, tolerating failures"
usage = 'arg "task" help="Task name to run with failure tolerance"'
shell = "node --input-type=module-typescript -e"
