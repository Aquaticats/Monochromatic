#region Rust catalog update -- recursive no-save update of every Cargo.lock under rust-catalog.toml's policy

[tasks."rust:update"]
description = "Update every first-party Cargo.lock under rust-catalog.toml's release-age and trust policy (pnpm -r --no-save update)"
# No usage spec: mise appends post-`--` args as a real argv vector, so
# `mise run rust:update -- --dry-run` reaches the bin's own argument parser.
run = "node package/dependency-catalog/cli-rust-update/src/cli.ts"

[tasks."rust:verify"]
description = "Check Rust registry versions locked since a base revision (default HEAD; CI passes --base) against rust-catalog.toml's trust policy"
run = "node package/dependency-catalog/cli-rust-update/src/cli.ts --verify"

#endregion Rust catalog update

#region Deps Update -- in-range update that explains strict minimumReleaseAge refusals

[tasks."deps:update"]
description = "pnpm update --recursive --no-save; on a strict minimumReleaseAge refusal, report the too-new versions, when they mature, and who pulls them in"
# Rationale: doc/troubleshooting/pnpm-update-no-save-strict-release-age.md.
run = "node package/deps-update/cli/src/index.ts"

#endregion Deps Update

#region Page Weight -- audit per-page transfer size (min, max, mean, median) across HTML in a dist directory

[tasks."page:weight"]
description = "Report per-page transfer size (min, max, mean, median) for a dist directory"
# No usage spec: mise appends the post-`--` dist path as a real argv vector. The
# entry validates a missing dist arg itself (EXIT_USAGE in src/index.ts).
run = "node package/page-weight/cli/src/index.ts"

#endregion Page Weight

#region Fix Tasks -- workarounds for upstream bugs

[tasks."fix:reinstall"]
description = "Clean reinstall to work around registry or resolution issues"
shell = "node --input-type=module-typescript -e"
run = """
const { rmSync } = await import('node:fs')
const { execFileSync } = await import('node:child_process')
rmSync('node_modules', { recursive: true, force: true })
execFileSync('pnpm', ['install'], { stdio: 'inherit' })
"""

#endregion Fix Tasks

# Forge shortcut tasks (forge:dev, forge:seed, forge:stress, prepare:garage) were removed when
# webapp-forge moved to package-paused/. Re-add them on un-pause.

# The canary task was removed when inference-canary moved to package-paused/
# (superseded by marginlab.ai). Re-add it on un-pause.

#endregion tasks

#region Changesets -- versioning and npm publishing (doc/decision/npm-publishing.md)

[tasks."npm:package:pack"]
description = "Pack the package at package/$NPM_PACKAGE for the targeted npm trusted-publisher workflow"
run = 'pnpm --filter "./package/$NPM_PACKAGE" pack --pack-destination "$NPM_PACK_DIR"'

[tasks."npm:package:publish"]
description = "Publish the packed package release using npm trusted publishing"
run = 'npm publish "$NPM_PACK_DIR"/*.tgz --access public --provenance --registry=https://registry.npmjs.org'

[tasks."changeset:add"]
description = "Add a changeset describing a user-visible change (interactive)"
run = "changeset add"

[tasks."changeset:status"]
description = "Show what the pending changesets will version"
run = "changeset status --verbose"

[tasks."changeset:version"]
description = "Apply pending changesets to package versions and changelogs, patch-bump dependents they miss, then refresh the lockfile"
# The ripple runs between the two: changesets ignores most workspace packages, and the Version Packages commit is authored in CI
# where the cli-git dependent-version-bump policy never runs (doc/decision/private-npm-registry.md).
# The native executable runs the ripple by its own name, not as `git`: the changesets action runs git commands of its own
# in the same environment, and the wrapper refuses `git add .`. `cli-git-native` is on PATH from the mise tool locally and from
# the release job's build step in CI.
run = [
  "changeset version",
  "cli-git-native cli-git fix --all --policy mono/dependent-version-bump",
  "pnpm install --lockfile-only",
]

[tasks."changeset:build"]
description = "Build every package the changeset publish plan will publish"
shell = "node --input-type=module-typescript -e"
run = """
import { execFileSync, } from 'node:child_process';
import { mkdtempSync, readFileSync, } from 'node:fs';
import { tmpdir, } from 'node:os';
import { join, relative, } from 'node:path';

type PlanEntry = { readonly kind: string; readonly name: string; };
type WorkspacePackage = { readonly name: string; readonly path: string; };

function buildPublishPlan(): void {
  const planPath = join(mkdtempSync(join(tmpdir(), 'changeset-plan-',),), 'plan.json',);
  execFileSync('changeset', ['publish-plan', '--output', planPath,], { stdio: 'inherit', },);
  const { plan, } = JSON.parse(readFileSync(planPath, 'utf8',),) as { readonly plan: readonly (readonly PlanEntry[])[]; };
  const names = plan.flat().filter(function isPublish(entry,) { return entry.kind === 'publish'; },).map(function toName(entry,) { return entry.name; },);
  if (names.length === 0) {
    console.log('changeset:build: the publish plan is empty; nothing to build',);
    return;
  }
  const workspace = JSON.parse(execFileSync('pnpm', ['list', '--recursive', '--depth', '-1', '--json',], { encoding: 'utf8', },),) as readonly WorkspacePackage[];
  for (const name of names) {
    const entry = workspace.find(function byName(candidate,) { return candidate.name === name; },);
    if (entry === undefined)
      throw new Error(`changeset:build: workspace package ${name} is in the publish plan but not in the workspace`,);
    const task = `//${relative(process.cwd(), entry.path,)}:build`;
    console.log(`changeset:build: ${name} -> mise run ${task}`,);
    execFileSync('mise', ['run', task,], { stdio: 'inherit', },);
  }
}

buildPublishPlan();
"""

#endregion Changesets

[env]
# Secrets live in the age-encrypted .env.local.json (sops backend), gitignored
# via the *.local.* pattern and decrypted at runtime by mise's built-in rops
# using the identity at ~/.config/mise/age.txt. Encrypted-only: no plaintext env
# slot survives, so a secret can never re-enter an unencrypted, backed-up file.
# Optional file - mise silently ignores it when missing.
# https://mise.jdx.dev/environments/secrets/sops.html
_.file = [{ path = ".env.local.json", redact = true }]

# The first entry is the gitignored per-worktree directory .cache/search-shadow-bin that
# holds the rg link to the installed search shadow (the postinstall of the
# cargo:monochromatic-search-shadow tool in the toolchain plan). It has to come first:
# the next entry holds the locked ripgrep, which would otherwise win and the shadow would
# never run. The second is the gitignored per-worktree toolchain exposure directory
# .cache/toolchain-bin, one link per tool toolchain.lock.json declares, so tasks
# resolve the locked tools before any ambient or global one. The third is the
# gitignored per-worktree directory .cache/cli-git-bin that holds the git link to the
# installed Git policy wrapper (the postinstall of the cargo:monochromatic-git-policy-cli
# tool in the toolchain plan).
# The rest are workspace bin dirs, globbed from what is installed on disk rather than
# read from workspace metadata. So this list changes with install state: a fresh
# clone, a pruned package, or a pnpm install that adds a dependency all move it.
# That is expected, and the regenerated list is committed as file-enforcer
# writes it. Do not revert it as drift and do not hand-edit it; the source is
# file-enforcer.config.ts. Issue #335 tracks deriving it from workspace metadata
# instead, which would make it stable across environments.
_.path = [
  ".cache/search-shadow-bin",
  ".cache/mpm-shadow-bin",
  ".cache/toolchain-bin",
  ".cache/cli-git-bin",
  "node_modules/.bin",
