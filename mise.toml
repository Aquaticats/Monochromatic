[task_templates."test:unit"]
description = "Run active-tree *.unit.test.ts in parallel via node (excludes *.expensive.* unless --all); pass file paths to filter"
usage = """
flag "--all" help="Include active-tree *.expensive.* files; cannot be combined with file paths"
arg "[args]" var=#true help="Test file paths to run (when provided, only those files run); cannot be combined with --all"
"""
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.run_test_files}}
const { existsSync } = await import('node:fs')
const { glob } = await import('node:fs/promises')
const { join, relative, sep } = await import('node:path')
const args = parseUsageArgs(process.env.usage_args ?? '')
const all = (process.env.usage_all ?? '').trim() === 'true'
if (all && args.length > 0) { throw new Error('--all cannot be combined with file paths') }
{{vars.is_inactive_test}}
// Ownership policy (see [tasks.test]): a package whose mise.toml declares its own
// `test` task owns its TypeScript unit files, because the root aggregate runs that
// package task for them. Root discovery therefore leaves those files alone, and
// what this glob keeps is exactly the files no package suite reaches.
// A package task keeps every file in its own tree: there the nearest mise.toml to
// each file is the task's own config root, so the ownership test is false and no
// file is dropped from a package's own unit run.
const taskConfigRoot = resolveTestPath(process.env.MISE_CONFIG_ROOT ?? process.cwd())
// Table headers, compared as whole lines, are the only thing a package's own
// `test` declaration has to be read for: the aggregate asks whether the package
// owns its suites, not what they run.
const testTaskHeaders = ['[tasks.test]', '[tasks."test"]']
const declaresTestTask = (packageRoot) => {
  try {
    const declared = readFileSync(joinTestPath(packageRoot, 'mise.toml'), 'utf8').split(String.fromCharCode(10))
    return declared.some((line) => testTaskHeaders.includes(line.trim()))
  } catch { return false }
}
const ownedByPackageSuite = (file) => {
  const packageRoot = testFileCwd(file)
  return packageRoot !== taskConfigRoot && declaresTestTask(packageRoot)
}
// Issue 1761: a run that executes no file is not evidence of coverage (AGENTS.md `TRV`). Every unit test file this
// config root holds is counted before the filters, so neither the `--all` opt-in nor the paused-tree skip can make a
// package look empty. A package whose tree truly holds none states itself in [vars] unit_test_exempt_packages with its
// reason, and that entry is itself an error once the package gains a file, so an exemption cannot outlive the gap.
// Both checks belong to a discovery run: a caller that names files has made its own claim about what runs.
{{vars.unit_test_exempt_packages}}
const taskLabel = process.env.MISE_TASK_NAME ?? 'test:unit'
let files
if (args.length === 0) {
  const monorepoRoot = process.env.MISE_MONOREPO_ROOT
  if (monorepoRoot === undefined) {
    throw new Error(`${taskLabel} cannot read [vars] unit_test_exempt_packages: mise did not set MISE_MONOREPO_ROOT, so this run cannot tell which package it covers`)
  }
  const packagePath = relative(monorepoRoot, taskConfigRoot).split(sep).join('/')
  const exemptReason = unitTestExemptPackages.get(packagePath)
  files = []
  let discovered = 0
  for await (const file of glob('**/*.unit.test.ts', { exclude: (name) => name.includes('node_modules') })) {
    if (isInactiveTest(file)) { continue }
    discovered += 1
    if ((all || !file.includes('.expensive.')) && !ownedByPackageSuite(file)) { files.push(file) }
  }
  if (discovered === 0) {
    if (exemptReason === undefined) {
      throw new Error(`${taskLabel} found no *.unit.test.ts file under ${packagePath === '' ? 'the monorepo root' : packagePath}, so it would report success without running a test. Add a unit test file to the package, or, when the package truly has none, add its path and the reason to [vars] unit_test_exempt_packages in the root mise.toml.`)
    }
    console.error(`${taskLabel} runs no file: ${packagePath} is exempt in [vars] unit_test_exempt_packages because ${exemptReason}`)
  } else if (exemptReason !== undefined) {
    throw new Error(`${taskLabel} found ${discovered} *.unit.test.ts file(s) under ${packagePath}, so its [vars] unit_test_exempt_packages entry no longer applies: remove the entry so those files run.`)
  } else if (files.length === 0) {
    // Deliberate: `*.expensive.*` is opt-in and a package's own [tasks.test] owns its files, so a full tree with
    // nothing runnable here is a skip the caller asked for, not the empty package this task refuses.
    console.error(`${taskLabel} runs no file: ${discovered} *.unit.test.ts file(s) exist here, and neither *.expensive.* without --all nor a file a package's own [tasks.test] owns is run by this task`)
  }
} else {
  // Package-scoped tasks run with cwd = MISE_CONFIG_ROOT (the package dir), so a repo-root-relative
  // path passed verbatim resolves under the package. Resolve each arg against the monorepo root
  // (modern mise), then the mise invocation dir, then cwd.
  const base = process.env.MISE_MONOREPO_ROOT ?? process.env.MISE_ORIGINAL_CWD ?? process.cwd()
  files = args.map((file) => existsSync(file) ? file : join(base, file))
}
await runTestFiles(files, [])
"""

