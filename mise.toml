run = """
{{vars.parse_usage_args}}
{{vars.run_test_files}}
const args = parseUsageArgs(process.env.usage_args ?? '')
if (args.length === 0) {
  const suites = ['test:unit', 'test:browser', 'test:e2e']
  const processes = suites.map((suite) => spawn('mise', ['run', suite], { stdio: 'inherit' }))
  const exits = await Promise.all(processes.map((proc) => once(proc, 'exit')))
  const failed = suites.filter((suite, index) => exits[index][0] !== 0)
  if (failed.length > 0) { throw new Error(`test suites failed: ${failed.join(', ')}`) }
} else {
