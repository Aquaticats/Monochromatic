# Rust dependency catalog: the one source of every registry and git dependency version
# the repository's Rust crates use. Each crate keeps its own Cargo workspace root; file-enforcer
# renders the entries a crate uses into that crate's generated [workspace.dependencies] table,
# and use sites say `workspace = true` plus their own features, optional, and default-features.
# Design and rules: doc/decision/rust-dependency-catalog.md.
#
# Adding a dependency: `cargo add <crate>` in the crate, then `mise run sync:files`; the sync moves
# the version here as a `>=` floor. Exceptions go in a named catalog that the crate selects under
# [package.metadata.rust-catalog.catalogs].

# Remove entries no crate uses on every sync (pnpm catalogPrune).
catalogPrune = true

# Supply-chain policy, with pnpm's names and this repository's pnpm values.
minimumReleaseAge = 1440
minimumReleaseAgeExclude = []
minimumReleaseAgeExcludePrune = true
minimumReleaseAgeIgnoreMissingTime = false
minimumReleaseAgeStrict = true
trustPolicy = "no-downgrade"
# Reviewed and approved by the owner on 2026-10-29 (issue #1806): first releases by publishers who are
# listed crate owners or publish through the owning team.
trustPolicyExclude = [
  "fontique@0.12.0",
  "parley@0.12.0",
  "parley_data@0.12.0",
  "parley_engine@0.12.0",
  "smallvec@1.16.4",
  "wayland-server@0.31.14",
]
trustPolicyExcludePrune = true

