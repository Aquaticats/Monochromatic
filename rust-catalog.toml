# bincode 1.x only (package/forbidden-strings/core): the crate uses the 1.x serde functions, and bincode 3.0.0 is a
# placeholder whose library is a single compile_error (its message is an xkcd address, comic 2347). The default
# catalog's open-ended floor let the 2026-11-07 update lock 3.0.0 and broke every crate that depends on forbidden-strings-core.
[catalogs.bincode-1]
bincode = "^1.3.3"

# branches 0.4 only (package/music-player/truepeak-core): `turso_core` requires branches ^0.4.3, and Cargo unifies features only
# within one semver line, so the `std` feature that keeps `branches::abort` off the removed `core::intrinsics::abort` has to be
# enabled on the 0.4 line. The default catalog's open-ended floor resolves 0.5.1, which `turso_core` never uses.
[catalogs.branches-0-4]
branches = "^0.4.3"

# Exact pins. Each one's reason sits beside the dependency in the crate that selects it.
[catalogs.pinned]
# Slint's testing backend has no semver guarantee and must equal the resolved slint release
# (package/ide/app, package/music-player/desktop-app).
i-slint-backend-testing = "=1.18.1"
# All rust-analyzer crates share one exact release (package/linter/monochromatic-lint and its fuzz sidecar).
ra_ap_hir = "=0.0.336"
ra_ap_hir_ty = "=0.0.336"
ra_ap_ide_db = "=0.0.336"
ra_ap_load-cargo = "=0.0.336"
ra_ap_proc_macro_api = "=0.0.336"
ra_ap_project_model = "=0.0.336"
ra_ap_syntax = "=0.0.336"
ra_ap_test_fixture = "=0.0.336"
ra_ap_vfs = "=0.0.336"
# package/linter/monochromatic-lint: the backend's tested input-storage API.
salsa = "=0.27.2"
# package/linter/monochromatic-lint: the approved Markdown/MDX parser crates, upgraded together behind the parity suite.
satteri-arena = "=0.3.1"
satteri-ast = "=0.5.3"
satteri-pulldown-cmark = "=0.6.3"
# package/nested-wayland-session/cli.
smithay = "=0.7.0"
# package/linter/monochromatic-lint: Unicode tables matching ra-ap-rustc_lexer.
unicode-ident = "=1.0.24"
unicode-properties = "=0.1.4"

# package/file-manager/app stays on the windows 0.58 API; see the comment beside its windows dependency.
[catalogs.windows-legacy]
windows = "0.58"
