name: current-baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev libcairo2-dev \
            libpango1.0-dev libgtk-3-dev libgtk-4-dev qt6-base-dev qt6-declarative-dev podman
      - name: Set up node, pnpm and the task CLI
        uses: ./.github/actions/task-cli-setup
        with:
          node-version: '26.12.0'
          pnpm-version: '12.14.0'
      - name: Install the repository tools
        uses: ./.github/actions/repo-tools-setup
        with:
          tools: file-enforcer
      - name: Prepare dependencies
        run: task-run prepare:pnpm
      - name: Build
        id: build
        continue-on-error: true
        timeout-minutes: 90
        run: task-run build
      - name: Unit
        if: steps.build.outcome == 'success'
        timeout-minutes: 60
        run: task-run test:unit
