dedupeDirectDeps: true
hoist: false
hoistWorkspacePackages: false
lockfileIncludeTarballUrl: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Pi releases in lockstep with its scope siblings: each pi-* release requires
  # the same-day chord (`^<same version>`). Excluding only part of the scope
  # makes every update within the cutoff fail on the rest, so the whole
  # publisher scope is trusted (user-approved 2026-09-22). See
  # doc/troubleshooting/pnpm-update-no-save-strict-release-age.md.
  - '@earendil-works/*'
  - 'cidr-tools@12.1.3'
  - 'ip-bigint@9.0.7'
  # matcher-fork.fuzz differential subject: upstream matcher 6.1.0 published
  # 2026-09-25, inside the 24h cutoff; the oracle needs the exact release the
  # fork was derived from, not an older mature one.
  - 'matcher@6.1.0'
  # make-asynchronous-fork.fuzz differential subject: upstream
  # make-asynchronous 2.1.0 published 2026-09-25, inside the 24h cutoff; the
  # oracle needs the exact release the fork was derived from, not an older
  # mature one.
  - 'make-asynchronous@2.1.0'
  # TypeScript 7.1.0-beta published 2026-10-20T16:45Z, inside the 24h cutoff;
  # this exact beta is the requested compiler (user-approved 2026-10-20).
  - 'typescript@7.1.0-beta'
  # @typescript/typescript-<platform> binaries publish in lockstep with the
  # typescript release above (same 7.1.0-beta stamp), so the whole scope is
  # trusted the same way as the Pi scope (user-approved 2026-10-20).
  - '@typescript/*'
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
nodeLinker: isolated

overrides:
  '@anthropic-ai/sdk': 'catalog:'
  # Drop @earendil-works/pi-* transitive deps that this workspace does not
  # exercise: either unused in the published dist, loaded only via lazy
  # `import()` inside provider modules, or loaded through an optional fallback.
  # Statically-imported deps that are reachable from each pi-* package's entry
  # (pi-ai/dist/index.js, pi-coding-agent/dist/index.js, pi-tui/dist/index.js)
  # must stay installed or the package crashes at module load with
  # `Cannot find package ...`.
  # `package/pi-plugin/auto-mode` imports both pi-ai and pi-coding-agent at runtime;
  # `package/pi-plugin/{morph-compact,terminal-title}` use pi-coding-agent type-only
  # and re-implement the runtime helpers locally in
  # `package/pi-plugin/morph-compact/src/pi-utils.ts`.
  # See doc/troubleshooting/dependencies.md for the audit.
  '@earendil-works/pi-ai>@aws-sdk/client-bedrock-runtime': '-'
  '@earendil-works/pi-ai>@google/genai': '-'
  '@earendil-works/pi-ai>@mistralai/mistralai': '-'
  '@earendil-works/pi-ai>chalk': '-'
  '@earendil-works/pi-ai>proxy-agent': '-'
  '@earendil-works/pi-ai>undici': '-'
  '@earendil-works/pi-ai>zod-to-json-schema': '-'
  '@earendil-works/pi-coding-agent>@mariozechner/clipboard': '-'
  '@earendil-works/pi-coding-agent>marked': '-'
  '@earendil-works/pi-tui>chalk': '-'
  # pi-tui only reaches koffi inside enableWindowsVTInput() on win32; the
  # dynamic require is wrapped in try/catch and degrades Shift+Tab handling.
  '@earendil-works/pi-tui>koffi': '-'
  '@earendil-works/pi-tui>mime-types': '-'
  # Remove texture-compressor from @loaders.gl/textures@4.4.4. The sole
  # integration launches its CLI by name through npx; no JavaScript import
  # requires the package, and deps-cube uses SimpleMeshLayer rather than the
  # experimental CompressedTextureWriter. This drops image-size@0.7.5, which
  # has no patched release for GHSA-5p2g-fcmc-qvqq or GHSA-w3rx-r6r6-pgpr.
  # Upstream made the same dependency optional after loaders.gl#3552/#3553.
  # The 4.4.4 writer can still ask npx to download the absent CLI; keep that
  # writer unreachable. Remove this override after a stable release carries #3553.
  # See doc/troubleshooting/dependencies.md for the source and runtime audit.
  '@loaders.gl/textures>texture-compressor': '-'
  # Substitute @ungap/structured-clone@1.3.0 with a workspace shim that
  # re-exports globalThis.structuredClone (the native function on Node 17+,
  # Bun, and every browser meeting the Firefox ESR 140 baseline). The
  # upstream is a ponyfill carrying a published CWE-502 deprecation
  # ("Potential CWE-502 - Update to 1.3.1 or higher") and is reached
  # transitively from package/ssg/aquati.cat through
  # mdast-util-to-hast (lib/state.js lines 263, 271, 381; lib/footer.js
  # line 235) and rehype-autolink-headings (lib/index.js line 156). Both
  # consumers import the default export and call it as structuredClone(value)
  # with one argument; no transferables, no { lossy } / { json } modes are
  # used, so re-exporting the native global is API-equivalent by
  # construction. Only the default export is consumed; named serialize /
  # deserialize are intentionally omitted and can be added if a future
  # transitive dep reaches in.
  # See package/shim/ungap-structured-clone/README.md and
  # doc/troubleshooting/dependencies.md for the audit trail.
  '@ungap/structured-clone': 'link:package/shim/ungap-structured-clone'
  # Remove abort-controller globally. It is a polyfill of the WHATWG
  # AbortController for Node < 15. Our supported runtimes (Node 22+, Bun)
  # all ship a native AbortController on globalThis. The only transitive
  # importer is readable-stream@4 (pulled in by isomorphic-git), which
  # already guards the require with `globalThis.AbortController ||
  # require('abort-controller').AbortController` in pipeline.js,
  # duplexify.js, and operators.js -- the `||` short-circuits to the
  # native constructor before the require evaluates. Removing the package
  # also drops the sole importer of event-target-shim (1739 LOC,
  # last commit 2021-01, abandoned), reducing supply-chain surface.
  # See doc/troubleshooting/dependencies.md and doc/dependency-blocklist.md.
  'abort-controller': '-'
  # Remove argparse globally. It is shipped solely for the CLI entry point of
  # wawoff2 (bin/woff2_{compress,decompress}.js, pulled in directly by
  # ssg/aquati.cat). That CLI is never invoked anywhere in the tree or
  # in CI; we use wawoff2.decompress as a library. The other former argparse
  # importer, js-yaml (bin/js-yaml.js, pulled in via stylelint > cosmiconfig;
  # stylelint removed 2026-10-04, see doc/decision/remove-stylelint.md),
  # has itself left the graph: it is substituted with the throwing stub via the
  # `js-yaml` policy in .pnpmfile.policies.json, so it no longer ships argparse.
  # The workspace does not consume js-yaml at all; YAML parsing uses the `yaml`
  # package (see package/dev-script/deps-cube/src/catalog.ts and
  # package/ssg/aquati.cat/src/lib/content.ts). Removing argparse
  # leaves the library APIs intact and drops 4214 LOC of supply-chain surface
  # (last commit 2022-05).
  # See doc/troubleshooting/dependencies.md and doc/dependency-blocklist.md.
  'argparse': '-'
  # Patch GHSA-rgw5-rvv9-x895 / CVE-2026-69152: >=4.0.0 <5.0.9 can build
  # unbounded intermediate arrays, bypassing the prior output cap and allowing
  # denial of service. Every transitive path resolves through minimatch@10.2.5
  # (`brace-expansion: ^5.0.5`), so the fixed release is range-compatible.
  'brace-expansion': '>=5.0.9'
  # Remove dprint globally. The npm distribution is a Node wrapper that re-execs
  # the native binary; each invocation pays the Node startup cost (multiple
  # seconds in this workspace, vs sub-100ms for the native binary directly).
  # The workspace runs dprint through mise (pinned in mise.toml), which executes
  # the native binary without the wrapper. No workspace package depends on the
  # npm distribution, so stripping it at install time is a no-op for the
  # current tree; the override exists to keep it that way. If a future change
  # adds `dprint` to a package.json, pnpm silently drops it and the binary
  # never reaches node_modules, surfacing as a clear `Cannot find package`
  # error at the call site. See doc/troubleshooting/dprint.md (Bug 1) and
  # package/config/dprint/README.md for the policy and VSCode-extension
  # workaround. Refs #163.
  'dprint': '-'
  # Patch GHSA-7p8r-x3mc-p8w7 / CVE-2026-18446: >=4.0.0 <4.1.2 can treat a
  # backslash as an authority introducer, causing host confusion. The sole
  # transitive consumer used to be ajv@8.20.0 (pulled in by stylelint > table;
  # stylelint removed 2026-10-04, see doc/decision/remove-stylelint.md), so the
  # consumer may leave the graph. The override stays as defense in depth so any
  # future ajv resolution lands on a patched v4 release (the workspace already
  # overrides ajv's `^3.0.1` request to v4).
  'fast-uri': '>=4.1.2'
  # Patch GHSA-5wm8-gmm8-39j9 / CVE-2026-44665: <=1.1.6 lets quote characters
  # in attribute values break out of the attribute and inject sibling
  # attributes when processEntities is disabled. Only transitive consumer is
  # fast-xml-parser@5.7.2 (`fast-xml-builder: ^1.1.5`); patch-level bump.
  'fast-xml-builder': '>=1.1.7'
  'fast-xml-parser': '>=5.7.0'
  'jspdf>canvg': '-'
  'jspdf>dompurify': '-'
  # Keep katex out of the install for GHSA-238p-pmpm-9mq7 / CVE-2026-103923:
  # >=0.11.0 <0.18.2 lets existing prototype pollution bypass its trust
  # restrictions. Its sole consumer is micromark-extension-math@3.1.0 (via
  # remark-math@6 in package/translation-repair/document-structure), whose
  # latest release still asks for `katex: ^0.16.0`, so the fix cannot be reached
  # in range. The import must still resolve: that package's root re-exports
  # `mathHtml` from `lib/html.js`, which runs `import katex from 'katex'` when
  # the module loads, so removing katex ('-') made every unbundled load of
  # remark-math throw ERR_MODULE_NOT_FOUND (built bundles drop `lib/html.js`).
  # A workspace shim stands in: every member throws and nothing renders. The
  # workspace uses only the syntax extension, never `mathHtml`.
  # See package/shim/katex/README.md and doc/troubleshooting/dependencies.md.
  'micromark-extension-math>katex': 'link:package/shim/katex'
  # Patch [ERR_PNPM_TRUST_DOWNGRADE]: nanoid@3.3.14 failed verification with possible package takeover.
  'nanoid': '>=5.1.15'
  # Substitute deprecated node-domexception@1.0.0 with a workspace shim that
  # re-exports globalThis.DOMException (the native constructor on Node 17+
  # and Bun). fetch-blob/from.js hard-imports the package and uses it as a
  # constructor, so removal would crash node-fetch at module load. The shim
  # is API-identical-by-construction, eliminating pnpm's install-time
  # deprecation warning without altering runtime behaviour.
  # See doc/troubleshooting/dependencies.md and doc/dependency-blocklist.md.
  'node-domexception': 'link:package/shim/node-domexception'
  'postcss': 'catalog:'
  # Substitute proper-lockfile@4.1.2 with a workspace shim that implements
  # lockSync/lock via node:fs.mkdirSync atomic-dir locking. The upstream is
  # abandoned (moxystudio/node-proper-lockfile, last commit 2021-01) and hard-
  # imported by @earendil-works/pi-coding-agent's dist/core/auth-storage.js
  # (line 12) and dist/core/settings-manager.js (line 4); both modules are
  # statically re-exported from the package's dist/index.js barrel (lines 6
  # and 22). The pi CLI host evaluates them at startup (dist/main.js:377
  # SettingsManager.create, dist/main.js:408 AuthStorage.create,
  # dist/core/model-registry.js:519 await authStorage.getApiKey), so removal
  # would crash pi at module load and the workspace silent stub would hang
  # on `await release` because the stub's Proxy treats every property access
  # (including .then) as a self-return.
  # See doc/decision/proper-lockfile-removal.md and
  # doc/troubleshooting/dependencies.md.
  'proper-lockfile': 'link:package/shim/proper-lockfile'
  # Substitute readable-stream@3 (winston, winston-transport) and
  # readable-stream@4 (isomorphic-git) with a single workspace shim that
  # re-exports node:stream. Both upstream versions are userland mirrors of
  # node:stream that originally targeted retired Node releases; on Node 22+
  # they ship 3,005 LOC of duplicate stream machinery whose only purpose was
  # back-compat with versions that no longer matter. The shim's index.cjs
  # mirrors the end-state shape of readable-stream@3's entry (default export
  # is Stream.Readable with every node:stream property defined as an own
  # property on it, plus .Stream pointing at the module itself), and its
  # lib/_stream_*.js subpaths re-export the matching node:stream class so
  # winston-transport's deep import of readable-stream/lib/_stream_writable.js
  # resolves unchanged. The shim uses Object.defineProperty rather than
  # Object.assign because node:stream.Readable inherits a getter-only
  # promises accessor on Node 22+ that makes the upstream Object.assign
  # pattern throw at module load. The substitution also makes the transitive
  # abort-controller fallback guards inside readable-stream@4's pipeline.js,
  # duplexify.js, and operators.js unreachable, formally closing the loop on
  # the 'abort-controller': '-' override above.
  # See doc/decision/readable-stream-shim.md for the full audit, including
  # the enumerated consumer surface and the verification plan.
  'readable-stream': 'link:package/shim/readable-stream'
  # Patch [ERR_PNPM_TRUST_DOWNGRADE]: semver@6.3.1 failed verification with possible package takeover.
  'semver': '>=7.8.5'
  # Patch GHSA-38rv-x7px-6hhq / CVE-2026-9675,
  # GHSA-pr7r-676h-xcf6 / CVE-2026-9678,
  # and GHSA-vmh5-mc38-953g / CVE-2026-9697: undici >=8.0.0 <8.5.0
  # carries WebSocket denial-of-service, shared-cache information disclosure,
  # and SOCKS5 ProxyAgent TLS certificate validation bypass advisories.
  # Current @earendil-works/pi-coding-agent 0.79.7 still pins undici 8.3.0,
  # so a workspace-wide security floor is needed until upstream bumps it.
  'undici': '>=8.5.0'
  # Patch GHSA-58qx-3vcg-4xpx / CVE-2026-45736: ws <8.20.1 discloses
  # uninitialized memory when a non-Uint8Array TypedArray (e.g.
  # Float32Array) is passed as the reason argument to close(). The
  # vulnerable API is not reached from any workspace code (all close()
  # calls pass no reason or a string), but the override ensures the
  # fixed version is resolved across all transitive consumers (openai,
  # @libsql/isomorphic-ws, crossws). Patch-level bump is
  # range-compatible with every consumer's ^8.x constraint.
  'ws': '>=8.20.1'

packageExtensions:
  # mitata calls `import('@mitata/counters')` at runtime to add hardware
  # performance counters (cycles, instructions, IPC, cache, branches) to its
  # benchmark output, but does not declare the package as a dependency. Under
  # this workspace's strict isolation (hoist: false, nodeLinker: isolated) that
  # dynamic import is unresolvable from mitata's own location, so counters never
  # load. Declaring the dependency here makes pnpm link it under mitata so the
  # import resolves. Only consumer is the file-enforcer-perf benchmark package.
  mitata:
    optionalDependencies:
      '@mitata/counters': 'catalog:'
  # @luma.gl/gpgpu 9.4.2 (pulled in by @deck.gl/core 9.4) declares
  # @luma.gl/webgpu as a required peer, but its dist imports only
  # @luma.gl/{core,engine,shadertools}. deps-cube renders with WebGL, so mark the
  # peer optional instead of installing an unused backend.
  '@luma.gl/gpgpu':
    peerDependenciesMeta:
      '@luma.gl/webgpu':
        optional: true
  # @deepseek-ai/dsh-llm-pi-ai 0.2.1-rc.2 statically imports its harness
  # service peers at load (@deepseek-ai/dsh-launch-environment among them),
  # but under this workspace's strict isolation (hoist: false,
  # nodeLinker: isolated, resolvePeersFromWorkspaceRoot: false) no importer
  # here can satisfy those peers, so the imports are unresolvable from the
  # adapter's own location in workspace tests. Declaring the packages it
  # imports as dependencies here makes pnpm link them under the adapter
  # instance so the imports resolve; the dsh runtime provides the same
  # packages itself. The shipped `lib/index.js` and `lib/types` reference
  # neither @deepseek-ai/dsh-authorization nor @deepseek-ai/dsh-fs, so both
  # peers are marked optional instead of provided here: pnpm peers check
  # flags @deepseek-ai/dsh-authorization otherwise, and @deepseek-ai/dsh-fs
  # stays quiet only while @deepseek-ai/dsh-attachment keeps it reachable.
  # The dsh runtime provides both where the adapter runs for real.
  '@deepseek-ai/dsh-llm-pi-ai':
    dependencies:
      '@deepseek-ai/dsh-attachment': '0.2.1-rc.2'
      '@deepseek-ai/dsh-credentials': '0.2.1-rc.2'
      '@deepseek-ai/dsh-launch-environment': '0.2.1-rc.2'
      '@deepseek-ai/dsh-llm': '0.2.1-rc.2'
      '@deepseek-ai/dsh-timeout': '0.2.1-rc.2'
    peerDependenciesMeta:
      '@deepseek-ai/dsh-authorization':
        optional: true
      '@deepseek-ai/dsh-fs':
        optional: true
  # @deepseek-ai/dsh-config-editor 0.2.1-rc.2 reaches this workspace only as
  # the @deepseek-ai/dsh-settings dependency, whose shipped code never
  # imports it, so nothing here loads its entry. That entry imports
  # @deepseek-ai/cordis-plugin-include and @deepseek-ai/dsh-app-boot at load,
  # and the dsh runtime provides both, so the peers are marked optional here
  # instead of installing packages for an entry nobody loads. A change that
  # starts loading the entry must provide the packages instead (installing
  # @deepseek-ai/dsh-app-boot pulls its own harness peers in as well).
  '@deepseek-ai/dsh-config-editor':
    peerDependenciesMeta:
      '@deepseek-ai/cordis-plugin-include':
        optional: true
      '@deepseek-ai/dsh-app-boot':
        optional: true
packageImportMethod: clone-or-copy
packages:
  - 'package/*/*'
peerDependencyRules:
  allowedVersions:
    # rolldown-plugin-dts 0.28.8 declares `typescript: ~7.0.0`, but it only
    # requires the version-only package root and type-imports the root; dts
    # generation runs on the Oxc generator (doc/philosophy/tool-choices.md)
    # and builds verified against 7.1.0-beta. Remove when upstream widens.
    'rolldown-plugin-dts>typescript': '7'
pmOnFail: ignore
preferWorkspacePackages: true
resolutionMode: highest
resolvePeersFromWorkspaceRoot: false
runtimeOnFail: ignore
savePrefix: ''
saveWorkspaceProtocol: false
shellEmulator: false
strictPeerDependencies: true

# Without multi-platform entries, the lockfile only records the optional
# dependencies for the current host OS/arch. When a developer on macOS
# commits pnpm-lock.yaml and CI runs on linux-x64, `pnpm install
# --frozen-lockfile` fails because the Linux native binaries are missing
# from the lockfile. Listing darwin/linux, x64/arm64, and glibc/musl here
# ensures the lockfile is portable across the mixed local-dev/CI
# environments we actually have. Tradeoff: the pnpm virtual store
# (~1.2 GB) includes unused platform binaries.
#
# See doc/decision/pnpm-supported-architectures.md for full rationale.
supportedArchitectures:
  cpu:
    - x64
    - arm64
    - current
  libc:
    - glibc
    - musl
    - current
  os:
    - darwin
    - linux
    - current
trustPolicy: no-downgrade
