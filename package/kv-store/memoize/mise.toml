[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"
# The suites import the built node artifact, whose declarations name the store
# package, so both builds must exist before the type checker reads them.
depends = ["build:js:node", "//package/kv-store/core:build:js:browser"]

[tasks."test:unit"]
extends = "test:unit"
# The suites import the built node artifact of this package and of the store
# package it shares a sentinel with, so both builds must land first.
depends = ["build:js:node", "//package/kv-store/core:build:js:node"]
