[tasks."perf:setup"]
description = "Create performance benchmark fixture files in the test scratch root"
run = "node src/setup-fixture.ts"

[tasks."perf:micro"]
description = "Run micro-benchmarks of individual file-enforcer operations (hardware counters appear once CAP_PERFMON is granted via perf:enable-counters)"
run = "node src/perf.bench.test.ts"

[tasks."perf:e2e"]
description = "Run end-to-end benchmarks with hyperfine on host"
run = "node src/run-e2e.ts"

[tasks."perf:constrained"]
description = "Run benchmarks under CPU contention (5 containers on 1 core, 1GB RAM)"
run = "node src/run-constrained.ts"

[tasks."perf:teardown"]
description = "Remove performance benchmark fixture files"
shell = "node --input-type=module-typescript -e"
run = """
const { rmSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join } = await import('node:path')
// The directory scratchRoot() from test-harness-core returns, where the perf scripts keep their fixtures.
const scratch = process.env.MONOCHROMATIC_TEST_SCRATCH || join(process.env.XDG_CACHE_HOME || join(homedir(), '.cache'), 'monochromatic-dev', 'test-scratch')
rmSync(join(scratch, 'file-enforcer-perf'), { recursive: true, force: true })
"""

# CAP_PERFMON / setcap are Linux-only, so this task is intentionally non-portable.
[tasks."perf:enable-counters"]
description = "Grant CAP_PERFMON to the node binary so mitata surfaces hardware counters in perf:micro (system-wide; re-run after a node upgrade)"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { realpathSync } = await import('node:fs')
const nodeBin = realpathSync(execFileSync('which', ['node'], { encoding: 'utf8' }).trim())
execFileSync('sudo', ['setcap', 'cap_perfmon+ep', nodeBin], { stdio: 'inherit' })
execFileSync('getcap', [nodeBin], { stdio: 'inherit' })
"""

[tasks."perf:disable-counters"]
description = "Remove the CAP_PERFMON file capability that perf:enable-counters granted to node"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { realpathSync } = await import('node:fs')
const nodeBin = realpathSync(execFileSync('which', ['node'], { encoding: 'utf8' }).trim())
execFileSync('sudo', ['setcap', '-r', nodeBin], { stdio: 'inherit' })
console.log(`removed file capabilities from ${nodeBin}`)
"""

# lint:oxlint omitted -- see doc/troubleshooting/oxlint.md

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
