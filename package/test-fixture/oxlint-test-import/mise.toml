# lint:oxlint omitted -- root oxlint.config.ts ignorePatterns includes **/package/test-fixture/**
# but per-package tasks run oxlint from within the package directory where
# CWD-relative paths no longer contain "test-fixture/".
# See doc/troubleshooting/oxlint.md
#
# lint:types omitted -- the fixture test files deliberately import artifact paths
# such as `../dist/final/node/index.mjs` that no build produces here. The rule
# resolves specifiers lexically, so those imports are exactly what needs
# exercising, while a type check would only report every one of them as missing.

[tasks."lint-fixture"]
description = "Lint fixture cases with the test-import rule enabled (for plugin validation)"
run = "oxlint -c .oxlintrc.fixture.json case/"
