[tasks.lock]
description = "Regenerate the owning fuzz Cargo lockfile without network"
run = "cargo generate-lockfile --offline"

[tasks.list]
description = "List registered fuzz targets"
run = "cargo fuzz list --fuzz-dir ."

[tasks.test]
description = "Run generator and invariant controls"
run = "cargo nextest run --lib"

[tasks."test:planted"]
description = "Plant each listed defect in a disposable copy of the subject and require the generator controls to fail"
run = "node bin/planted-controls.ts"

[tasks."lint:types"]
description = "Check the fuzz helper library with denied Clippy warnings"
run = ["cargo check --lib", "cargo clippy --lib -- -D warnings"]

[tasks.build]
description = "Build AddressSanitizer targets in a 2 GiB / 2 CPU container"
run = "node bin/container.ts --build-only"

[tasks.smoke]
description = "Run generator controls, Clippy, then ASAN targets for 30s each in mount-free bounded containers"
run = "node bin/container.ts"

[tasks."lock:subject"]
description = "Seed the fuzz lockfile from the subject's lockfile, then let Cargo add only this sidecar's own packages, so both lock the same registry versions"
run = ["cp ../cli/Cargo.lock Cargo.lock", "cargo update --workspace --offline"]

[tasks."lock:members"]
description = "Record a changed dependency or dependency version of the subject in this lockfile without moving any other locked version"
run = "cargo update --offline --workspace"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:oxlint:paths"]
description = "Lint explicitly selected git-policy-cli.fuzz source paths without unrelated package diagnostics"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('lint:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', files)
"""

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."format:oxlint:paths"]
description = "Auto-fix explicitly selected git-policy-cli.fuzz paths with Oxlint without touching unrelated package files"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('format:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...files])
"""
