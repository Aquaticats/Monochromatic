[package]
name = "git-policy-cli-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[dependencies]
# Existing repository libFuzzer harness; no structured-generator crate is needed because
# every generator here builds values through the subject's own types.
libfuzzer-sys = { workspace = true, features = [ "arbitrary-derive", ] }
monochromatic-git-policy-cli = { path = "../cli", version = "=0.4.1" }
monochromatic-jsonc-edit = { path = "../../jsonc-edit/core-rust", version = "=0.1.1" }

# Library target hosting the shared generators and invariants used by every fuzz target
# and by the generator controls that `cargo test --lib` runs.
[lib]
name = "git_policy_cli_fuzz"
path = "src/lib.rs"

# cargo-fuzz discovers targets through `cargo metadata`, so each harness needs an explicit bin entry.
[[bin]]
name = "global_arguments"
path = "fuzz_targets/global_arguments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_loading"
path = "fuzz_targets/config_loading.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_schema"
path = "fuzz_targets/config_schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wrapper_controls"
path = "fuzz_targets/wrapper_controls.rs"
test = false
doc = false
bench = false

[[bin]]
name = "batch_reply"
path = "fuzz_targets/batch_reply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stage_listing"
path = "fuzz_targets/stage_listing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index_lock_records"
path = "fuzz_targets/index_lock_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rules_file"
path = "fuzz_targets/rules_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "final_newline"
path = "fuzz_targets/final_newline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "owner_records"
path = "fuzz_targets/owner_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dependent_version"
path = "fuzz_targets/dependent_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_records"
path = "fuzz_targets/transaction_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linter_output"
path = "fuzz_targets/linter_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_path"
path = "fuzz_targets/event_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linter_config"
path = "fuzz_targets/linter_config.rs"
test = false
doc = false
bench = false

# libFuzzer records and minimizes a failing input by unwinding out of the assertion.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# The subject links the forbidden-strings scanner, whose `build.rs` precompiles its embedded
# baseline through the forbidden-regex build-dependency. Cargo builds build scripts at
# `opt-level = 0` by default and reads profiles only from this workspace root; see
# ../../forbidden-strings/cli/Cargo.toml for the measurement.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# Independent workspace, matching the other fuzz sidecars.
[workspace]
members = ["."]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
libfuzzer-sys = ">=0.4"
