[tasks."native:test:container"]
description = "Run native wrapper tests and Clippy together in bounded containers with pacman's current Git; `-- --memory <size> --cpus <count> --pids-limit <count>` override this gate's own bounds of 2g for the suite's containers, 8g for the image build's compile (its own measured bound), 4 CPUs and 256 processes per test thread, which is 1024; a --memory bounds the build too, a --pids-limit below that floor is raised, and a gate given more CPUs should raise --memory with them (sizes like 512m or 2g, CPUs from 0.01 with fractions)"
# Mechanism D: the run-record retention of this package's target/verification runs before a run writes a new record,
# through cargo-shadow's own sweep so the task does not reimplement it (doc/handover/cargo-shadow-lean-build-folders.md).
run = ["cargo-shadow lean records target/verification", "node bin/test-native-container.ts"]

[tasks."test:service-manager"]
description = "Prove against a real user manager in a disposable container that a Git command never makes it read every unit it holds, and that an unrelated `Type=dbus` service bound to a target survives first provisioning, an upgrade, a downgrade, two releases used in turn from two worktrees, several callers at once, and a machine that has the earlier release's template installed; `-- --image <tag> --main-wrapper <path>` names the gate image and the executable of the release from `main`, which this task copies into both arms' containers (the candidate is this worktree's build, made first here). The arm from `main` has to end the unrelated service and its target, and the arm from this worktree has to keep them and ask for no reload, so a run that proves neither fails"
# Mechanism D: this task writes a verification record, so it sweeps this package's run records first.
run = ["cargo-shadow lean records target/verification", "cargo build --locked --offline --bin monochromatic-git-policy-cli", "node bin/service-manager-proof.ts"]

[tasks."native:mutation"]
description = "Run the gate, plant guard removals, then run cargo-mutants over the native wrapper in bounded containers; mise passes `-- <options>` to the mutation step only, so the gate runs at its own default bounds (run native:test:container with its own options first to change them)"
# The gate step sweeps this package's run records before either step writes another (mechanism D).
run = ["cargo-shadow lean records target/verification", "node bin/test-native-container.ts", "node bin/mutate-native-container.ts"]

[tasks."native:mutation:scoped"]
description = "Plant guard removals and run cargo-mutants for `-- --file <glob>` scopes (and `--examine <regex>` mutant-name patterns, `--timeout <s>`, `--build-timeout <s>`) against the last gate image; `--memory <size>`, `--cpus <count>` and `--pids-limit <count>` after the `--` override the 2g, 2 CPUs and 512 PIDs defaults"
# Mechanism D: this task writes native-mutation-* records of its own, so it sweeps the run records first too.
run = ["cargo-shadow lean records target/verification", "node bin/mutate-native-container.ts"]

[tasks."native:mutation:parallel"]
description = "Start one capped systemd unit per file for `-- [options] <label> <file.rs>...` (files relative to src/native, with their folder: command/command_add.rs), each running native:mutation:scoped through the shared slot limiter, after making each unit's image tag with `podman tag` from the last native:test:container image (`--from-tag <tag>` names another gate image; nothing starts when a tag cannot be made); the shared launcher's options such as --timeout, --build-timeout, --examine <regex> (repeatable, for every file), --memory, --cpus, --unit-memory-max, --unit-cpu-quota and --unit-tasks-max follow the same --. Where no campaign evidence proves the planted controls for an image, one more unit runs only the controls beside the file units, which skip them and name that unit; `--setenv NATIVE_MUTATION_SKIP_PLANTED=1` skips them without proof"
run = "node bin/native-mutation-parallel.ts --task //package/git-policy/cli:native:mutation:scoped --tag-env GIT_POLICY_NATIVE_IMAGE_TAG --scope-prefix src/native/ --unit-prefix cli-git-mutpar"

[tasks."native:mutation:planted"]
description = "Run only the planted controls over the last gate image and record their pass in target/verification/native-mutation-planted-*; `-- --memory <size> --cpus <count> --pids-limit <count>` override the defaults. native:mutation:parallel starts this as its own unit"
# Mechanism D: this task writes a native-mutation-planted-* record of its own, so it sweeps the run records first too.
run = ["cargo-shadow lean records target/verification", "node bin/native-planted-controls-only.ts"]

[tasks."native:mutation:reconcile"]
description = "Look up the planted-controls obligation of campaigns that deferred their controls to a controls unit: prints the record that validates each, or \"no record yet\" with the unit and its log, and exits nonzero unless all are validated (a controls invocation that ended without a matching record fails)"
run = "node bin/native-planted-controls-reconcile.ts"

[tasks."native:mutation:list"]
description = "List the mutants cargo-mutants finds in the native wrapper without building or running anything; `-- <options>` are passed on"
run = "cargo mutants --list --no-config"

[tasks."native:lock"]
description = "Generate the standalone native wrapper Cargo lockfile"
run = "cargo generate-lockfile --offline"

[tasks."native:lock:members"]
description = "Record a changed dependency list of the native wrapper in its lockfile without moving any other locked version"
run = "cargo update --offline --workspace"

[tasks."native:release"]
description = "Start the wrapper release on GitHub and print the run URL: `-- <from> <to> <note>` (quote the note; `--dry-run` first runs everything except the push and the publish, and skips the host's btrfs controls). A release of any version but an alpha waits for the btrfs controls on this host first (`native:release:host-controls`) and dispatches nothing when one fails, when one printed \"BTRFS CONTROL NOT RUN\", or when the run lacks a control the gate requires; an alpha is dispatched without them. The crate-release workflow bumps the crate and the fuzz crate's exact pin, checks the crate unless the version is an alpha, dry-runs the publish when it goes to crates.io, pushes the bump to main and starts cargo-publish; nothing compiles here"
# The registry entry of this crate names the gate (releasable-crates.json "dispatchGate"), so the dispatch command runs it
# after every refusal that costs nothing and before it starts the workflow; see doc/troubleshooting/nextest-hides-a-passing-tests-output.md
# for the one BTRFS CONTROL NOT RUN line a btrfs host prints, which the gate lets through.
run = "node ../../crate-release/cli/bin/dispatch-release.ts --crate monochromatic-git-policy-cli"

[tasks."native:release:host-controls"]
description = "Run the btrfs controls a release that is not an alpha waits for, then say whether the release may start: exit zero only when every required control passed on a btrfs fixture root, and otherwise print what refused and what a person does next; `-- <filter>...` narrows the run while iterating, which a release never does and which therefore always refuses"
# The one definition of the run and its judgement: `native:release` reaches it through the crate's registry entry, and a
# person can repeat exactly what the release waits for.
run = "node bin/native-release-host-controls.ts"

[tasks."native:release:wait"]
description = "Follow the release run that `native:release` printed, then the cargo-publish run it started, then check crates.io and the GitHub release: `-- <run URL or id> <version>`"
run = "node ../../crate-release/cli/bin/await-release.ts --crate monochromatic-git-policy-cli"

[tasks."native:gate"]
description = "Start the wrapper's full release gate (the image build, the compile, the suite and Clippy of native:test:container) as its own capped systemd user unit and print `<unit>.service=<log path>`: `-- [options] <worktree name under .claude/worktrees, or its full path> <label>`. The unit writes the run's own exit status as its log's last line and is collected when it ends, so read the verdict with `native:gate:verdict`, never from `systemctl show`. Options: `--repository <path>`, `--log-directory <path>`, `--unit-cpu-quota <value>`, `--unit-memory-max <value>`, `--unit-tasks-max <count>`, `--unit-io-weight <weight>`, `--container-pids-limit <count>`"
# The launcher is the promoted `~/temp/agent/gate/launch-gate.ts`; the caps, the label rules and why each value is what it
# is live in bin/native-gate-caps.ts and bin/native-gate-unit-name.ts.
run = "node bin/native-gate-launch.ts"

[tasks."native:gate:main-tip"]
description = "Detach the release gate worktree (`--worktree <name>`, default gate-wrapper-next-alpha) at the commit main points at now and start a gate there, labelled with that commit: `-- [options]`. Prints `gate worktree at <sha>` and `launch status <n>`, and exits 2 without moving the worktree when it holds uncommitted work"
# The promoted `~/temp/agent/gate/relaunch-gate-on-main-tip.ts`; a real wrapper release is gated this way
# (doc/handover/cli-git-rust-implementation.md, "Working rules for this effort", "Gates").
run = "node bin/native-gate-main-tip.ts"

[tasks."native:gate:verdict"]
description = "Wait, bounded, for a gate log's verdict line and print it with nextest's summary and the failures: `-- <log path> <deadline seconds>`. Exits zero as soon as a verdict line is there whatever the gate's own status was, and nonzero when the deadline passed without one; the printed `gate-exit-status=<n>` line carries the gate's status"
# The promoted `~/temp/agent/gate/wait-for-gate-verdict.ts`.
run = "node bin/native-gate-verdict.ts"

[tasks."native:ts-checks"]
description = "Run the TypeScript checks of this package (or of `-- <task>...`) each in its own capped systemd user scope, all at once, and print one line per check with its status and a failing check's lines: `-- [--worktree <path>] [--deadline-seconds <count>] [--unit-cpu-quota <value>] [--unit-memory-max <value>] [--unit-tasks-max <count>] [--unit-io-weight <weight>] [<task>...]`. Exits 0 when every check passed and 2 when one failed or ran past its deadline; `--deadline-seconds` must be from 1 to 2147483, and every run names its scopes with an identity of its own so two runs of one check are independent; replaces the scratch script `~/temp/agent/gate/ts-checks.ts`"
# The promoted `~/temp/agent/gate/ts-checks.ts`; the caps, the deadline and the labels live in
# bin/native-capped-scope-command.ts and bin/native-ts-checks.ts.
run = "node bin/native-ts-checks.ts"

[tasks."native:install"]
description = "Move the installed wrapper to a released version and take one real commit sample with it: `-- [--repository <path>] [--deadline-seconds <count>] [--dry-run] <version>`. Re-resolves cargo:monochromatic-git-policy-cli in toolchain.lock.json, prints the lock diff against the last commit, converges the installed tools, refuses unless `git --version` names the release and, from 0.6.1-alpha.46 on, `git monochromatic-git-policy-cli zfs-root --version` names it too (a release before that floor cannot answer the words, so its install skips that check and keeps the ones it can answer), commits what the lock then holds unless the last commit already holds it (refusing when another process wrote the lock while the release was installed, and leaving that write as it is), then prints the newest timing line and the service journal of the sample commit; `--deadline-seconds` must be from 1 to 2147483; replaces the scratch script `~/temp/agent/upgrade-wrapper.ts`"
# The promoted `~/temp/agent/upgrade-wrapper.ts`; the steps, the version check and the bounds live in
# bin/native-install.ts.
run = "node bin/native-install.ts"

[tasks."native:lock:check"]
description = "Ask cargo whether every manifest the gate builds still resolves against its own lockfile, and print one line per manifest with the status, the directory and cargo's first error: `-- [--checkout <path>] [--refresh] [<directory>...]`. `--refresh` re-resolves the locked entries first, which writes a lockfile, and prints both answers; the exit status is nonzero when any locked check failed. Replaces the scratch scripts `locked-check.ts` and `lock-refresh.ts`"
run = "node bin/native-lock-check.ts"

[tasks."native:build"]
description = "Build the crate's one executable on the host, for differential runs that start it by path"
run = "cargo build --locked --offline --bins"

[tasks."native:build:release"]
description = "Build the crate's one optimised executable on the host, for timing runs that start it by path (`target/release/monochromatic-git-policy-cli`, whose root modes the words `monochromatic-git-policy-cli zfs-root <mode>` select); nothing is installed"
run = "cargo build --locked --offline --release --bins"

[tasks."native:check"]
description = "Type-check the native wrapper library, executable and test targets without running them"
run = "cargo check --locked --offline --all-targets"

[tasks."native:build:measurement"]
description = "Build the optimised wrapper executable with the clone conversion fence's measurement-only routes compiled in (`measurement-routes`: options C and D of doc/planning/cli-git-clone-rung-conversion-fence.md), for a report that times them; the feature is off by default and no shipped build enables it, this task exists only beside that feature, the executable is never installed or released, and its switches are absent from every shipped build"
run = "cargo build --locked --offline --release --bin monochromatic-git-policy-cli --features measurement-routes"

[tasks."native:clippy:measurement"]
description = "Lint the native wrapper with the fence's measurement-only routes compiled in, so no line of a measurement build goes unlinted; the feature is off by default and this task exists only beside it"
run = "cargo clippy --locked --offline --all-targets --features measurement-routes -- -D warnings"

[tasks."native:clippy"]
description = "Lint the native wrapper on the host with the gate's Clippy flags; the container gate stays the authority"
run = "cargo clippy --locked --offline --all-targets -- -D warnings"

[tasks."native:clippy:windows"]
description = "Type-check and lint the native wrapper library for x86_64-pc-windows-gnu with warnings denied; nothing is run"
# Needs the Windows GNU standard library on the host: `rustup target add x86_64-pc-windows-gnu`.
# The Linux gate never compiles the `#[cfg(not(unix))]` blocks; this is the only check that does.
run = "cargo clippy --locked --offline --lib --target x86_64-pc-windows-gnu -- -D warnings"

[tasks."native:test:host"]
description = "Run native unit tests matching `-- <filter>...` on the host while iterating; tests that start Git need the gate's Git (pacman's current `git`)"
# The controls that trace a command under `strace` fail, naming the variable and the program, when this host has no
# tracer and the run says nothing; none of the tasks in this file sets CLI_GIT_STRACE_ABSENT_ACKNOWLEDGED, because every
# one of them runs where `strace` is installed (this host, and the gate image built from native-test-base.Containerfile).
# A run that truly has no tracer states it, and then each such control prints one line naming itself and passes.
run = "cargo nextest run --locked --offline --lib"

[tasks."native:test:archive"]
description = "Archive the native unit tests for a guest that has cargo-nextest but not this toolchain, so the btrfs controls run where a btrfs fixture root exists"
run = "cargo nextest archive --locked --offline --lib --archive-file target/verification/native-tests.tar.zst"

[tasks."native:test:binary:host"]
description = "Run the native binary-level tests matching `-- <filter>...` on the host against the host's Git; the gate's Git stays the authority"
run = "cargo nextest run --locked --offline --test native_binary"

[tasks."native:test:host:btrfs"]
description = "Run every native test with its btrfs controls real instead of skipped, on a fixture root that must be on btrfs (`CLI_GIT_TEST_ROOT`, default `${HOME}/temp/agent/cli-git-btrfs-fixtures`); the gate's acknowledgement variable is unset, so a control that cannot run fails the run naming its control and the filesystem it found, and `--success-output=final` brings the line of a passing control that had nothing to check here into the log; `-- <filter>...` narrows the run while iterating"
# The gate's fixture root is a tmpfs the container makes, and never a btrfs filesystem, so the gate sets
# CLI_GIT_BTRFS_ABSENT_ACKNOWLEDGED and every btrfs control prints one line naming itself and passes. This task is the
# other half of that bargain: on a btrfs host nothing is acknowledged, so each of those controls really runs, and no list
# of their names can go stale as tests are added. Its root is btrfs by definition, so the one ZFS control acknowledges
# the absence of a ZFS fixture root here; native:test:host leaves that unset, and on this ZFS host it runs for real.
# CLI_GIT_STRACE_ABSENT_ACKNOWLEDGED stays unset too: this task runs on a host, which has `strace`, so the traced
# controls really run and a host that lost the tracer fails them instead of passing without a count.
run = "env --unset=CLI_GIT_BTRFS_ABSENT_ACKNOWLEDGED CLI_GIT_ZFS_ABSENT_ACKNOWLEDGED=1 CLI_GIT_TEST_ROOT=\"${CLI_GIT_TEST_ROOT:-$HOME/temp/agent/cli-git-btrfs-fixtures}\" cargo nextest run --locked --offline --all-targets --no-fail-fast --success-output=final"

[tasks."test:git-image"]
description = "Build the gate's base image: the newest CachyOS image on its `latest` tag (pulled now; needs a network when it, native-test-base.Containerfile or browserslist-data.lock.json is new to this host), the Rust toolchain and the tools the tests start (Git, Node, pnpm, strace, cargo-nextest), all current pacman packages, and the pinned browserslist data tarballs an offline `file-enforcer check` resolves against; prints the release of each; `-- [--memory <size>] [--cpus <count>] [--pids-limit <count>]` (defaults 2g, 2 CPUs, 512 PIDs). native:test:container builds it first when needed"
# Mechanism D: this task writes a git-image-* record of its own, so it sweeps the run records first too.
run = ["cargo-shadow lean records target/verification", "node bin/build-git-test-image.ts"]

[tasks."lint:clippy"]
description = "Lint the native wrapper with Clippy, warnings denied; matches the sibling Rust CLI package/forbidden-strings/cli"
run = "cargo clippy --locked --offline --all-targets -- -D warnings"

[tasks.build]
description = "Build the crate's one executable in release mode: `monochromatic-git-policy-cli`, the artifact the cargo-installed `git` runs, and the root-owned file the ZFS route's root modes are started as"
run = "cargo build --release --locked --offline --bins"

[tasks."native:perf"]
description = "Measure the latency the release wrapper adds to forwarded Git commands (added p95 under 2,000 ms) and commits (every paired delta under 5,000 ms) against paired direct Git; `-- --output perf/native-latency-<date>.json` stores the raw samples"
depends = ["build"]
run = "node bin/native-perf.ts --binary target/release/monochromatic-git-policy-cli --samples 30"

[tasks.lint]
extends = "lint"

[tasks."lint:monochromatic-lint"]
description = "Lint this package's Rust, rustdoc and Markdown with the repository linter, failing on any error or any warning (`--max-warnings 0`); `mise run //:format:monochromatic-lint -- package/git-policy/cli` applies its fixes"
# The shared `lint` template runs every direct `lint:*` child of this package, so this task is part of `lint`.
# The root task owns the invocation (the root `monochromatic-lint.config.jsonc`); warnings alone exit 0 there,
# so the threshold is stated here. Same shape as package/ide/app and package/wg/cli-quicker-exempt.
run = "mise run //:lint:monochromatic-lint -- --max-warnings 0 package/git-policy/cli"

[tasks."lint:sidecar-locks"]
description = "Fail when a sidecar crate beside this package (package/git-policy/cli.fuzz) locks a package this package locks at another version, or when cargo refuses the sidecar's Cargo.lock; `mise run //package/git-policy/cli.fuzz:lock:members` records the versions again"
# The shared `lint` template runs every direct `lint:*` child of this package, so a change to this package now fails on a
# sidecar lock that fell behind it. The sidecar's own `lint` still compiles the fuzz targets against this package; that
# build resolves this package's manifests, never the versions its lock records.
run = "node bin/native-sidecar-locks.ts"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:oxlint:paths"]
description = "Lint explicitly selected git-policy-cli source paths without unrelated package diagnostics"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? forwardedArgumentWords())
if (files.length === 0) { throw new Error('lint:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', files)
{{vars.forwarded_arguments_marker}}
"""

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."format:oxlint:paths"]
description = "Auto-fix explicitly selected git-policy-cli paths with Oxlint without touching unrelated package files"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? forwardedArgumentWords())
if (files.length === 0) { throw new Error('format:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...files])
{{vars.forwarded_arguments_marker}}
"""

[tasks."test:unit"]
extends = "test:unit"

[tasks."e2e:concurrent:trace"]
description = "Mine anonymized commit shapes from repository history with real Git into e2e/commit-shape-trace.json"
# Runs on the host with /usr/bin/git, bypassing the wrapper; the output holds shapes only
# (no contents, paths, object IDs, messages, or author data).
usage = '''
flag "--repository <path>" help="Repository whose history is mined (default: this checkout)"
flag "--revision <rev>" help="Revision whose history is mined" default="HEAD"
flag "--limit <count>" help="Newest non-merge commits mined" default="4000"
'''
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const args = [
  ...(process.env.usage_repository ? ['--repository', process.env.usage_repository] : []),
  '--revision', process.env.usage_revision ?? 'HEAD',
  '--limit', process.env.usage_limit ?? '4000',
]
const child = spawn('node', ['e2e/commit-shape-trace-generator.ts', ...args], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`commit-shape trace generator exited with ${String(code)}`)
'''

[tasks."test:e2e:concurrent:image"]
description = "Build the base image of the concurrent-commit e2e suite: the newest CachyOS image on its `latest` tag (pulled now), pacman's current Git and Node, and ssh-keygen (needs a network when that image or the Containerfile is new to this host); `-- --memory <size> --cpus <count>` override the 2g and 2 CPU defaults of the build"
# The image tag names the CachyOS image and the Containerfile it came from, so a new CachyOS image builds a new base. The build installs pacman packages (signature-checked); the suite itself runs with --network=none.
run = "node bin/e2e-native-container.ts base"

[tasks."test:e2e:concurrent:native:image"]
description = "Build the native end-to-end image: the release native executable linked as /opt/native/bin/git into the concurrent-commit e2e base image (built first when it does not exist); `-- --memory <size> --cpus <count>` override the 2g and 2 CPU defaults of the build"
# Mount-free build in the gate's base image (CachyOS with Rust, the e2e image's own CachyOS image); GIT_POLICY_NATIVE_IMAGE_TAG names the image tag.
run = "node bin/e2e-native-container.ts image"

[tasks."test:e2e:concurrent:native"]
description = "Replay concurrent-commit workloads through the native executable on the image's current Git in a bounded, network-isolated container; the scenarios and invariants are the retired incumbent suite's, unchanged; `--memory <size>` and `--cpus <count>` override the 2g and 2 CPU defaults of the run only (the image build it depends on always uses the defaults)"
depends = ["test:e2e:concurrent:native:image"]
usage = '''
flag "--seed <seed>" help="Replay this decimal seed (printed by every run)"
flag "--scenario <names>" help="Comma-separated scenario names to run"
flag "--git <versions>" help="Comma-separated Git releases to run; only the image's installed Git exists, so give its release or nothing"
flag "--memory <size>" help="Container memory, such as 512m or 2g (default 2g)"
flag "--cpus <count>" help="Container CPUs, from 0.01, fractions allowed (default 2)"
'''
run = "node bin/e2e-native-container.ts run"

[tasks."e2e:mount-git-worktree-clone-datasets"]
description = "Run the root modes' adoption arm end to end in the throwaway `mvm` libvirt guest: the administrator records a replacement `.claude/worktrees` folder and each mismatch (another device, a link, a widened mode, a differing slot) is refused without recording anything; `-- <create|prepare|run|destroy|all> [--name <guest>] [--log-dir <dir>] [--keep-guest]`. The guest is the ZFS binding's recipe (Ubuntu 24.04, OpenZFS 2.4.4), and the arm runs only inside it: on this machine it prints SKIPPED"
run = "node e2e/mount-git-worktree-clone-datasets-guest.ts"

[tasks."e2e:zfs-slot-state"]
description = "Run plan step 12's slot classes, move and removal refusals, prune pointer and repair report end to end in the throwaway `mvm` libvirt guest: one real Git registration and one real clone, the mounted and the unmounted class of the same slot, a record that disagrees with the mount, a pending add and a pending removal, the wrapper's refusals of `git worktree move` and `git worktree remove` beside Git's own answers, the prune pass that writes the recorded pointer back, and the repair report before Git runs, with and without a registration; `-- <create|prepare|run|destroy|all> [--name <guest>] [--log-dir <dir>] [--keep-guest]`. The guest is the ZFS binding's recipe (Ubuntu 24.04, OpenZFS 2.4.4), and the arm runs only inside it: on this machine it prints SKIPPED"
run = "node e2e/slot-state-and-move-refusal-guest.ts"

[tasks."e2e:settling-command"]
description = "Run the settling command's guest arm end to end in the throwaway `mvm` libvirt guest: one file-backed pool, then a clone that stands refusing the command with every record left, a clone a person destroyed outside the wrapper settled with its registration and its three records, and a slot whose checkout has begun keeping its registration, its pointer and the person's file while only the records go; `-- <create|prepare|run|destroy|all> [--name <guest>] [--log-dir <dir>]`. The guest is the ZFS binding's recipe (Ubuntu 24.04, OpenZFS 2.4.4), and the arm runs only inside it"
run = "node e2e/settling-command-guest.ts"

[tasks."e2e:doctor-zfs-route"]
description = "Run plan step 18's `doctor` checks end to end in the throwaway `mvm` libvirt guest, on one file-backed pool: the device, ABI, pool, dataset, key, mount, store, delegation, handler, staging and identity facts on the design's layout, then each broken fact and the finding that names it, and the removal-side lines for one real clone's state, registration, managed Git lock, binding record, plan, snapshots, origin, retention and holders; `-- <create|prepare|build|arm|destroy|all> [--name <guest>] [--log-dir <dir>] [--keep-guest]`. The guest is the ZFS binding's recipe (Ubuntu 24.04, OpenZFS 2.4.4), and the arm runs only inside it: on this machine it prints SKIP"
run = "node e2e/doctor-zfs-route-guest.ts"

[tasks."e2e:deferred-origin-check"]
description = "Run plan step 15's deferred-origin arm end to end in the throwaway `mvm` libvirt guest: one file-backed pool, then the planned removal going on, an origin snapshot marked with `zfs destroy -d` refusing, the reap that mark causes when a removal goes ahead, and an origin moved by `zfs promote` refusing; `-- <create|prepare|run|destroy|all> [--name <guest>] [--log-dir <dir>]`. The guest is the ZFS binding's recipe (Ubuntu 24.04, OpenZFS 2.4.4), and the arm runs only inside it"
run = "node e2e/deferred-origin-check-guest.ts"

[tasks."e2e:removal-lineage-proof"]
description = "Run plan step 14's removal arm, and plan step 15's deferred-origin refusals, end to end in the throwaway `mvm` libvirt guest: one file-backed pool, then the healthy removal entering and writing its plan, VM item 11's promote refusing before the first delete with every protected tuple surviving and reverse promotion restoring the lineage, VM item 13's live and stale bookmarks, and VM item 12's grant set and same-name replacement; then the same refusal arms through the built wrapper's own `git worktree remove` on a second file-backed pool, where the proof runs read-only and nothing is written, a promotion's inherited snapshot and bookmark are refused with every protected object surviving, and a same-name replacement clone is refused on its GUID; and plan step 15's arms through the library's writing path on a third pool, because the removal's command path stays cut until step 16: a healthy removal destroying the clone's own snapshots and recording every answer, the look refusing a mark already set, the first check refusing a mark set after the look, the head check refusing a mark set after the batch with the plan keeping what it destroyed, and a marked replacement clone refused at the entry's own proof; `-- <create|prepare|run|destroy|all> [--name <guest>] [--log-dir <dir>]`. The guest is the ZFS binding's recipe (Ubuntu 24.04, OpenZFS 2.4.4), and the arms run only inside it"
run = "node e2e/removal-lineage-proof-guest.ts"

[tasks."native:lock:scanner"]
description = "Seed the native wrapper lockfile from the linked scanner's lockfile, then let Cargo add only the wrapper's own packages, so both lock the same registry versions"
run = [
  "cp ../../forbidden-strings/cli/Cargo.lock Cargo.lock",
  "cargo update --workspace --offline",
]
