[tasks."native:test:container"]
description = "Run native wrapper tests and Clippy in bounded containers with pacman's current Git; `-- --memory <size> --cpus <count> --pids-limit <count>` override the 2g, 2 CPUs and 512 PIDs defaults (sizes like 512m or 2g, CPUs from 0.01 with fractions)"
# Mechanism D: the run-record retention of this package's target/verification runs before a run writes a new record,
# through cargo-shadow's own sweep so the task does not reimplement it (doc/handover/cargo-shadow-lean-build-folders.md).
run = ["cargo-shadow lean records target/verification", "node bin/test-native-container.ts"]

[tasks."native:mutation"]
description = "Run the gate, plant guard removals, then run cargo-mutants over the native wrapper in bounded containers; mise passes `-- <options>` to the mutation step only, so the gate runs at the default limits (run native:test:container with its own options first to change them)"
# The gate step sweeps this package's run records before either step writes another (mechanism D).
run = ["cargo-shadow lean records target/verification", "node bin/test-native-container.ts", "node bin/mutate-native-container.ts"]

[tasks."native:mutation:scoped"]
description = "Plant guard removals and run cargo-mutants for `-- --file <glob>` scopes (and `--examine <regex>` mutant-name patterns, `--timeout <s>`, `--build-timeout <s>`) against the last gate image; `--memory <size>`, `--cpus <count>` and `--pids-limit <count>` after the `--` override the 2g, 2 CPUs and 512 PIDs defaults"
run = "node bin/mutate-native-container.ts"

[tasks."native:mutation:parallel"]
description = "Start one capped systemd unit per file for `-- [options] <label> <file.rs>...` (files relative to src/native, with their folder: command/command_add.rs), each running native:mutation:scoped through the shared slot limiter, after making each unit's image tag with `podman tag` from the last native:test:container image (`--from-tag <tag>` names another gate image; nothing starts when a tag cannot be made); the shared launcher's options such as --timeout, --build-timeout, --examine <regex> (repeatable, for every file), --memory, --cpus, --unit-memory-max, --unit-cpu-quota and --unit-tasks-max follow the same --. Where no campaign evidence proves the planted controls for an image, one more unit runs only the controls beside the file units, which skip them and name that unit; `--setenv NATIVE_MUTATION_SKIP_PLANTED=1` skips them without proof"
run = "node bin/native-mutation-parallel.ts --task //package/git-policy/cli:native:mutation:scoped --tag-env GIT_POLICY_NATIVE_IMAGE_TAG --scope-prefix src/native/ --unit-prefix cli-git-mutpar"

[tasks."native:mutation:planted"]
description = "Run only the planted controls over the last gate image and record their pass in target/verification/native-mutation-planted-*; `-- --memory <size> --cpus <count> --pids-limit <count>` override the defaults. native:mutation:parallel starts this as its own unit"
run = "node bin/native-planted-controls-only.ts"

[tasks."native:mutation:reconcile"]
description = "Look up the planted-controls obligation of campaigns that deferred their controls to a controls unit: prints the record that validates each, or \"no record yet\" with the unit and its log, and exits nonzero unless all are validated (a controls invocation that ended without a matching record fails)"
run = "node bin/native-planted-controls-reconcile.ts"

[tasks."native:mutation:list"]
description = "List the mutants cargo-mutants finds in the native wrapper without building or running anything; `-- <options>` are passed on"
run = "cargo mutants --list --no-config"

[tasks."native:lock"]
description = "Generate the standalone native wrapper Cargo lockfile"
run = "cargo generate-lockfile --offline"

[tasks."native:lock:members"]
description = "Record a changed dependency list of the native wrapper in its lockfile without moving any other locked version"
run = "cargo update --offline --workspace"

[tasks."native:release"]
description = "Start the wrapper release on GitHub and print the run URL: `-- <from> <to> <note>` (quote the note; `--dry-run` first runs everything except the push and the publish). The crate-release workflow bumps the crate and the fuzz crate's exact pin, checks, dry-runs the publish, pushes the bump to main and starts cargo-publish; nothing compiles here"
run = "node ../../crate-release/cli/bin/dispatch-release.ts --crate monochromatic-git-policy-cli"

[tasks."native:release:wait"]
description = "Follow the release run that `native:release` printed, then the cargo-publish run it started, then check crates.io and the GitHub release: `-- <run URL or id> <version>`"
run = "node ../../crate-release/cli/bin/await-release.ts --crate monochromatic-git-policy-cli"

[tasks."native:build"]
description = "Build the native wrapper executable on the host, for differential runs that start it by path"
run = "cargo build --locked --offline --bin monochromatic-git-policy-cli"

[tasks."native:build:release"]
description = "Build the optimised native wrapper executable on the host, for timing runs that start it by path (`target/release/monochromatic-git-policy-cli`); nothing is installed"
run = "cargo build --locked --offline --release --bin monochromatic-git-policy-cli"

[tasks."native:check"]
description = "Type-check the native wrapper library, executable and test targets without running them"
run = "cargo check --locked --offline --all-targets"

[tasks."native:clippy"]
description = "Lint the native wrapper on the host with the gate's Clippy flags; the container gate stays the authority"
run = "cargo clippy --locked --offline --all-targets -- -D warnings"

[tasks."native:clippy:windows"]
description = "Type-check and lint the native wrapper library for x86_64-pc-windows-gnu with warnings denied; nothing is run"
# Needs the Windows GNU standard library on the host: `rustup target add x86_64-pc-windows-gnu`.
# The Linux gate never compiles the `#[cfg(not(unix))]` blocks; this is the only check that does.
run = "cargo clippy --locked --offline --lib --target x86_64-pc-windows-gnu -- -D warnings"

[tasks."native:test:host"]
description = "Run native unit tests matching `-- <filter>...` on the host while iterating; tests that start Git need the gate's Git (pacman's current `git`)"
run = "cargo nextest run --locked --offline --lib"

[tasks."native:test:binary:host"]
description = "Run the native binary-level tests matching `-- <filter>...` on the host against the host's Git; the gate's Git stays the authority"
run = "cargo nextest run --locked --offline --test native_binary"

[tasks."test:git-image"]
description = "Build the gate's base image: the newest CachyOS image on its `latest` tag (pulled now; needs a network when it or native-test-base.Containerfile is new to this host), the Rust toolchain and the tools the tests start (Git, Node, pnpm, strace, cargo-nextest), all current pacman packages; prints the release of each; `-- [--memory <size>] [--cpus <count>] [--pids-limit <count>]` (defaults 2g, 2 CPUs, 512 PIDs). native:test:container builds it first when needed"
run = "node bin/build-git-test-image.ts"

[tasks."lint:clippy"]
description = "Lint the native wrapper with Clippy, warnings denied; matches the sibling Rust CLI package/forbidden-strings/cli"
run = "cargo clippy --locked --offline --all-targets -- -D warnings"

[tasks.build]
description = "Build the native wrapper executable `monochromatic-git-policy-cli` in release mode, the artifact the cargo-installed `git` runs"
run = "cargo build --release --locked --offline --bins"

[tasks."native:perf"]
description = "Measure the latency the release wrapper adds to forwarded Git commands (added p95 under 2,000 ms) and commits (every paired delta under 5,000 ms) against paired direct Git; `-- --output perf/native-latency-<date>.json` stores the raw samples"
depends = ["build"]
run = "node bin/native-perf.ts --binary target/release/monochromatic-git-policy-cli --samples 30"

[tasks.lint]
extends = "lint"

[tasks."lint:monochromatic-lint"]
description = "Lint this package's Rust, rustdoc and Markdown with the repository linter, failing on any error or any warning (`--max-warnings 0`); `mise run //:format:monochromatic-lint -- package/git-policy/cli` applies its fixes"
# The shared `lint` template runs every direct `lint:*` child of this package, so this task is part of `lint`.
# The root task owns the invocation (the root `monochromatic-lint.config.jsonc`); warnings alone exit 0 there,
# so the threshold is stated here. Same shape as package/ide/app and package/wg/cli-quicker-exempt.
run = "mise run //:lint:monochromatic-lint -- --max-warnings 0 package/git-policy/cli"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."lint:oxlint:paths"]
description = "Lint explicitly selected git-policy-cli source paths without unrelated package diagnostics"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('lint:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', files)
"""

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."format:oxlint:paths"]
description = "Auto-fix explicitly selected git-policy-cli paths with Oxlint without touching unrelated package files"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('format:oxlint:paths requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...files])
"""

[tasks."test:unit"]
extends = "test:unit"

[tasks."e2e:concurrent:trace"]
description = "Mine anonymized commit shapes from repository history with real Git into e2e/commit-shape-trace.json"
# Runs on the host with /usr/bin/git, bypassing the wrapper; the output holds shapes only
# (no contents, paths, object IDs, messages, or author data).
usage = '''
flag "--repository <path>" help="Repository whose history is mined (default: this checkout)"
flag "--revision <rev>" help="Revision whose history is mined" default="HEAD"
flag "--limit <count>" help="Newest non-merge commits mined" default="4000"
'''
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const args = [
  ...(process.env.usage_repository ? ['--repository', process.env.usage_repository] : []),
  '--revision', process.env.usage_revision ?? 'HEAD',
  '--limit', process.env.usage_limit ?? '4000',
]
const child = spawn('node', ['e2e/commit-shape-trace-generator.ts', ...args], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`commit-shape trace generator exited with ${String(code)}`)
'''

[tasks."test:e2e:concurrent:image"]
description = "Build the base image of the concurrent-commit e2e suite: the newest CachyOS image on its `latest` tag (pulled now), pacman's current Git and Node, and ssh-keygen (needs a network when that image or the Containerfile is new to this host); `-- --memory <size> --cpus <count>` override the 2g and 2 CPU defaults of the build"
# The image tag names the CachyOS image and the Containerfile it came from, so a new CachyOS image builds a new base. The build installs pacman packages (signature-checked); the suite itself runs with --network=none.
run = "node bin/e2e-native-container.ts base"

[tasks."test:e2e:concurrent:native:image"]
description = "Build the native end-to-end image: the release native executable linked as /opt/native/bin/git into the concurrent-commit e2e base image (built first when it does not exist); `-- --memory <size> --cpus <count>` override the 2g and 2 CPU defaults of the build"
# Mount-free build in the gate's base image (CachyOS with Rust, the e2e image's own CachyOS image); GIT_POLICY_NATIVE_IMAGE_TAG names the image tag.
run = "node bin/e2e-native-container.ts image"

[tasks."test:e2e:concurrent:native"]
description = "Replay concurrent-commit workloads through the native executable on the image's current Git in a bounded, network-isolated container; the scenarios and invariants are the retired incumbent suite's, unchanged; `--memory <size>` and `--cpus <count>` override the 2g and 2 CPU defaults of the run only (the image build it depends on always uses the defaults)"
depends = ["test:e2e:concurrent:native:image"]
usage = '''
flag "--seed <seed>" help="Replay this decimal seed (printed by every run)"
flag "--scenario <names>" help="Comma-separated scenario names to run"
flag "--git <versions>" help="Comma-separated Git releases to run; only the image's installed Git exists, so give its release or nothing"
flag "--memory <size>" help="Container memory, such as 512m or 2g (default 2g)"
flag "--cpus <count>" help="Container CPUs, from 0.01, fractions allowed (default 2)"
'''
run = "node bin/e2e-native-container.ts run"

[tasks."native:lock:scanner"]
description = "Seed the native wrapper lockfile from the linked scanner's lockfile, then let Cargo add only the wrapper's own packages, so both lock the same registry versions"
run = ["cp ../../forbidden-strings/cli/Cargo.lock Cargo.lock", "cargo update --workspace --offline"]
