[package]
name = "monochromatic-git-policy-cli"
version = "0.5.30"
edition = "2024"
description = "Repository-owned Git policy wrapper: forwards Git commands and checks commits against configured policies."
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
# `include` patterns are gitignore-style, so an unanchored `README.md` would also package `e2e/README.md`.
include = [
  "src/native/**/*.rs",
  "src/native/dependent_version/dependent_version_fixtures/*.json",
  "src/native/service/service_units/*",
  "src/native/lock/index_lock_restart_manager.ps1",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "LICENSES/*.txt",
]
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/git-policy/cli"

[lib]
name = "git_policy_cli"
path = "src/native/lib.rs"

# The artifact is deliberately not named `git`: a `target/*/git` or a tool `bin/git` on PATH would shadow Git by accident.
# The repository's mise tool entry links it as `git` in a per-worktree directory after installing it.
[[bin]]
name = "cli-git-native"
path = "src/native/main.rs"

# The resident commit service (doc/planning/cli-git-resident-service.md): a separate program the operating system starts
# on demand through socket activation; the wrapper never starts it.
[[bin]]
name = "cli-git-service"
path = "src/native/service_main.rs"

# cargo-binstall's default URL is {repo}/releases/download/v{version}/{name}-{target}-v{version},
# but this repository tags each crate's release monochromatic-git-policy-cli-v<version> and names the archive
# monochromatic-git-policy-cli-<version>-<target>, so without this table mise falls back to compiling from source.
# Only Linux archives are released, and only for the GNU targets; any other target compiles from source.
# doc/troubleshooting/mise-cargo-binstall-falls-back-to-compiling.md has the evidence.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Consumer-level controls that start the built executable against real Git.
[[test]]
name = "native_binary"
path = "src/native/binary/binary_tests.rs"

# A consumer of the candidate and scanner layers that can reach only the library's public interface.
[[test]]
name = "native_candidates"
path = "src/native/candidate/candidate_consumer_tests.rs"

[dependencies]
# Both native tools use the already adopted comment-preserving JSONC foundation.
monochromatic-jsonc-edit = { path = "../../jsonc-edit/core-rust", version = "=0.1.2" }
# The pure catalog specifier rule behind the `mono/catalog-specifiers` policy: manifest bytes in, findings out.
# The pnpm wrapper shares it, so the policy never re-implements the grammar (doc/handover/catalog-specifier-policy.md).
monochromatic-catalog-specifier = { path = "../../catalog-specifier/core-rust", version = "=0.1.0" }
# The repository's own scanner, linked in-process instead of spawned: `src/native/candidate/scanner_adapter.rs`
# loads its rules once per invocation and scans candidate bytes through `Scanner::scan`.
# Its catch boundaries need this crate's effective profile to unwind; `scanner_adapter.rs` refuses to build otherwise.
forbidden-strings = { path = "../../forbidden-strings/cli", version = "=0.6.1" }
# The Markdown policy's linter, linked in-process instead of spawned: `src/native/markdown/markdown_linter.rs` calls
# `monochromatic_lint::run_embedded::fix_source`, the executable's own `--stdin --fix` code, on a guarded thread.
# Without its default `semantic` feature: the rust-analyzer backend is not used by Markdown, and linking it made
# every start of this executable slower (doc/planning/cli-git-rust-implementation.md, "Markdown policy in process").
monochromatic-lint = { path = "../../linter/monochromatic-lint", version = "=0.5.0", default-features = false }
# Lock, journal and work records are JSON read and written with `serde_json`.
# The scanner already links this exact version, so it adds no package to the lockfile.
serde_json = { workspace = true }
# Unguessable lock tokens and unique scratch names, the incumbent's `randomUUID`, from the operating system's source.
# Already in the lockfile through the scanner's `tempfile`.
getrandom = { workspace = true }
# The standards-review shadow run's one HTTPS call, in-process instead of `node` and `fetch`
# (doc/planning/cli-git-standards-review-port.md, "HTTP client choice"): blocking, no runtime, no threads of its own,
# `ring` for TLS and the embedded Mozilla roots, so nothing is read from the system. `rustls` selects exactly those.
ureq = { workspace = true, default-features = false, features = ["rustls"] }
# Git stores every loose object and every packed entry as a zlib stream; the in-process repository reads
# (`src/native/repo_read_*`) inflate them with this pure Rust decoder instead of starting `git cat-file`.
# It adds two packages (itself and `adler2`) to the lockfile; the measurement is in
# doc/planning/cli-git-in-process-reads.md.
miniz_oxide = { workspace = true, default-features = false, features = ["with-alloc"] }
# The diff behind the word-level second merge pass (`src/native/merge/word_merge.rs`): `capture_diff_slices` with the Myers
# algorithm, nothing else of the crate. Apache-2.0, no dependencies of its own, one package added to the lockfile.
# The owner chose a merge of the wrapper's own on this crate over a port of Jujutsu's code and over linking `jj-lib`
# (doc/planning/cli-git-merge-auto-resolution.md, "merge-code options measured"); the tests keep it equal to Jujutsu's results.
similar = { workspace = true, default-features = false }

# `sigaction` with signal details, `kill` and process-group facts, which the standard library does not expose.
# Already in the lockfile through the scanner's dependencies.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# The `markdown/autofix` policy's `exclude` patterns are gitignore syntax; the linter it runs and the
# scanner above match them with this crate's gitignore matcher, already locked through the scanner.
ignore = { workspace = true }
# `scratch_location::scratch_file` makes the anonymous private file that holds the captured output of a Git child
# (`bounded_push`, `bounded_query`, `lfs_upload`, `service_hold_retry`) with its exclusive temporary-file call;
# it is already locked through the scanner's `gix-tempfile`.
tempfile = { workspace = true }

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Starting an executable that is not in the page cache reads most of the file from disk in one fault, so a smaller
# executable is a shorter first start after eviction or install. Stripping the symbol tables cut the release build's
# first-start read from 9.45 MiB to 8.09 MiB. Fat link-time optimization with one code generation unit would read
# 7.43 MiB but lengthens the release build, so it is not adopted. The numbers and the method are in
# doc/troubleshooting/native-binary-tests-hit-the-shared-bound-under-host-load.md.
[profile.release]
panic = "unwind"
overflow-checks = true
strip = "symbols"

# The scanner's `build.rs` precompiles its embedded baseline through the forbidden-regex
# build-dependency, which Cargo builds at `opt-level = 0` by default.
# Profiles are read only from this workspace root, so the scanner manifest's own build-override
# does not reach this crate; see ../../forbidden-strings/cli/Cargo.toml for the measurement
# (390.8s unoptimized against 98.5s at `opt-level = 3`, identical output).
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

# The native implementation keeps the repository's standalone Cargo ownership convention.
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
getrandom = ">=0.4.2"
ignore = ">=0.4.34"
libc = ">=0.2.191"
miniz_oxide = { version = ">=0.9.1", default-features = false }
serde_json = ">=1.0.154"
similar = { version = ">=3.2.1", default-features = false }
tempfile = ">=3.27.0"
ureq = { version = ">=3.5.0", default-features = false }
