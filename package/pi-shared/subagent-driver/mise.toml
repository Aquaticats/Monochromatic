[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."format:dprint"]
description = "Format this package's files with dprint"
run = "dprint fmt src"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the library, then run unit tests; the unit tests import the built library and run the bin from source"
run = ["mise run build", "mise run test:unit"]

[tasks."start-pi-run-when-a-pool-has-room"]
description = "Start one Pi run when its provider pool has room, or say why it started none: the worktree launcher's options, plus --session-of=<run folder> and --counts-only"
run = "node src/start-pi-run-when-a-pool-has-room.ts"

[tasks."start-pi-run-in-a-worktree"]
description = "Make a run's worktree with its branch started at the commit or branch the run names, link its dependencies, start the driver as a capped unit, and remove the worktree once the run has finished with it"
run = "node src/start-pi-run-in-a-worktree.ts"

[tasks."retry-pi-run-start-until-a-pool-has-room"]
description = "Ask the pool gate for a slot until it starts the run or the deadline passes: --deadline-seconds and --period-seconds, then -- and the pool gate's words"
run = "node src/retry-pi-run-start-until-a-pool-has-room.ts"

[tasks."start-pi-runs-from-a-batch-list"]
description = "Start every entry of a batch list through the retrying start, one at a time, and print the line each entry ended with: a failed entry names its own reason, the whole of what it printed is kept beside the runs, and the task exits non-zero when any entry failed"
run = "node src/start-pi-runs-from-a-batch-list.ts"

[tasks."save-the-final-message-of-a-review-that-wrote-no-review-file"]
description = "Write the last assistant message of a review's newest finished run as that review's review.md, when the run wrote none"
run = "node src/save-the-final-message-of-a-review-that-wrote-no-review-file.ts"

[tasks."list-processes-whose-command-line-holds-text"]
description = "List every process whose command line holds a text, with its number, its parent, its age and the head of its command line"
run = "node src/list-processes-whose-command-line-holds-text.ts"

[tasks."list-running-units-whose-worktree-is-gone"]
description = "Name every running unit whose worktree folder is gone, and count the units listed"
run = "node src/list-running-units-whose-worktree-is-gone.ts"

[tasks."print-the-final-report-of-the-newest-run-of-each-agent"]
description = "Print the newest finished run of each agent named, why it ended, and the head of the report it ended with"
run = "node src/print-the-final-report-of-the-newest-run-of-each-agent.ts"

[tasks."list-launchers-whose-unit-has-ended"]
description = "Name every launcher still running although its unit has ended, and with --stop end each of them, children first"
run = "node src/list-launchers-whose-unit-has-ended.ts"

[tasks."remove-finished-worktrees"]
description = "Remove the worktree of every finished Pi run, saying why each other one is left alone; without --apply it only lists them"
run = "node src/remove-finished-worktrees.ts"

[tasks."start-a-batch-in-its-own-unit"]
description = "Start a batch list in a systemd user unit of its own, so its launchers outlive the process that asked for them"
run = "node src/start-a-batch-in-its-own-unit.ts"

[tasks."write-a-brief-for-a-review"]
description = "Write what one review of a change reads: the diff of its ranges under the reviewed source folder, the brief naming its files, and its reproductions folder"
run = "node src/write-a-brief-for-a-review.ts"

[tasks."start-reviews-of-finished-branches"]
description = "Write and start one review of each finished branch, on the review pool, and save the last message of a review that wrote no review file"
run = "node src/start-reviews-of-finished-branches.ts"

[tasks."write-a-fix-brief-for-each-review"]
description = "Write one brief for each review whose defects a fix answers, and the batch list that starts those agents"
run = "node src/write-a-fix-brief-for-each-review.ts"
