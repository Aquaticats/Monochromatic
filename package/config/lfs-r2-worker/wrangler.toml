name = "monochromatic-lfs"
# The handler-only neutral bundle produced by `mise run build`; the deploy tasks depend on
# that build so wrangler ships the same artifact the unit tests exercised.
main = "dist/final/neutral/worker.mjs"
compatibility_date = "2026-06-01"
workers_dev = true

# Download is anonymous (public read). Upload is gated by the `clients` table in
# the D1 database below: one row per machine, holding the sha256 of its token, its
# scope and its revocation. The rows are written by hand with
# `wrangler d1 execute ... --file clients.sql`; see doc/runbook/lfs-r2-worker.md.
# LFS_WRITE_TOKEN, the secret this Worker shipped with, is accepted only while that
# table holds no row, so the first per-machine row retires it.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "monochromatic-lfs"

# Presence index (schema.sql). The batch handler asks it which oids exist with one
# query, because one R2 `head` per object costs 0.25 to 0.45 ms of CPU and the
# Workers Free plan allows 10 ms of CPU per request. R2 stays the source of truth.
[[d1_databases]]
binding = "INDEX"
database_name = "monochromatic-lfs-index"
database_id = "1a9241a8-2aa8-4e0a-860c-002762351e7c"
