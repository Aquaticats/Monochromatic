[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the neutral bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

[tasks.deploy]
description = "Build the neutral bundle, then deploy the Git LFS R2 worker to Cloudflare (requires a prior wrangler login)."
depends = ["build"]
run = "wrangler deploy"

[tasks."deploy:dry-run"]
description = "Build the neutral bundle, then validate the worker bundle with wrangler without deploying."
depends = ["build"]
run = "wrangler deploy --dry-run"

[tasks."index:schema"]
description = "Create the presence index table in the remote D1 database (idempotent; requires a prior wrangler login)."
run = "wrangler d1 execute monochromatic-lfs-index --remote --yes --file schema.sql"

[tasks."secret:write-token"]
description = "Set or rotate the LFS_WRITE_TOKEN upload secret (reads the value on stdin)."
run = "wrangler secret put LFS_WRITE_TOKEN"

[tasks."check:markdown-urls"]
description = "HEAD every Worker object URL embedded in repository Markdown and assert 200, an image content type, and a Content-Length equal to the LFS pointer size."
dir = "{{config_root}}/../../.."
shell = "node --input-type=module-typescript -e"
run = '''
import { execFileSync } from 'node:child_process'
import { createHash } from 'node:crypto'
import { readFile } from 'node:fs/promises'
/** Anonymous object base declared by the committed .lfsconfig (no credential). */
const base = (await readFile('.lfsconfig', 'utf8')).split('\n').map((line) => line.trim()).find((line) => line.startsWith('url = '))?.slice('url = '.length)
if (!base) { throw new Error('.lfsconfig declares no lfs.url') }
/** Length of a sha256 oid in hex. */
const OID_LENGTH = 64
/** Characters that end a bare URL inside Markdown. */
const URL_TERMINATORS = ' \t\r\n)]<>"\''
/** Whether text is exactly one lowercase hex oid. */
const isOid = (text) => text.length === OID_LENGTH && [...text].every((char) => '0123456789abcdef'.includes(char))
/** Every tracked Markdown and MDX file. */
const files = execFileSync('rg', ['--files', '--glob', '*.md', '--glob', '*.mdx'], { encoding: 'utf8' }).split('\n').filter((line) => line !== '')
/** Object URLs of the form <base>/<oid>/<path> found in Markdown, with the file embedding each. */
const found = []
for (const file of files) {
  const text = await readFile(file, 'utf8')
  for (let at = text.indexOf(`${base}/`); at !== -1; at = text.indexOf(`${base}/`, at + 1)) {
    let end = at
    while (end < text.length && !URL_TERMINATORS.includes(text[end])) { end += 1 }
    const url = text.slice(at, end)
    const [oid, ...pathParts] = url.slice(base.length + 1).split('/')
    if (isOid(oid) && pathParts.length > 0) { found.push({ file, url, oid, path: pathParts.join('/') }) }
  }
}
if (found.length === 0) { throw new Error(`no ${base}/<oid>/<path> URLs found in Markdown`) }
/** Pointer oid and size for a repository path: parsed from an LFS pointer, or hashed from real bytes; undefined when the path is unreadable. */
async function expected(path, problems) {
  let bytes
  try { bytes = await readFile(path) }
  catch (error) { problems.push(`path ${path} unreadable: ${error.code ?? error.message}`); return undefined }
  const head = bytes.subarray(0, 200).toString('utf8')
  if (head.startsWith('version https://git-lfs.github.com/spec/v1')) {
    return { oid: head.split('oid sha256:')[1]?.split('\n')[0] ?? '', size: Number(head.split('size ')[1]?.split('\n')[0]) }
  }
  return { oid: createHash('sha256').update(bytes).digest('hex'), size: bytes.byteLength }
}
/** One URL checked against the Worker and the local pointer. */
async function verify({ file, url, oid, path }) {
  const problems = []
  const want = await expected(path, problems)
  const response = await fetch(url, { method: 'HEAD' })
  const type = response.headers.get('content-type') ?? ''
  const length = Number(response.headers.get('content-length'))
  if (response.status !== 200) { problems.push(`status ${response.status}`) }
  if (!type.startsWith('image/')) { problems.push(`content-type ${JSON.stringify(type)}`) }
  if (want !== undefined && want.oid !== oid) { problems.push(`url oid ${oid} but pointer oid ${want.oid}`) }
  if (want !== undefined && length !== want.size) { problems.push(`content-length ${length} but pointer size ${want.size}`) }
  return { file, url, problems }
}
const results = await Promise.all(found.map(verify))
for (const { file, url, problems } of results) {
  console.log(`${problems.length === 0 ? 'ok  ' : 'FAIL'} ${file} ${url}${problems.length === 0 ? '' : `: ${problems.join('; ')}`}`)
}
const failed = results.filter((result) => result.problems.length > 0)
console.log(`${results.length - failed.length}/${results.length} Worker object URLs verified`)
if (failed.length > 0) { throw new Error(`${failed.length} Worker object URL(s) failed verification`) }
'''

[tasks."check:no-credential-in-git-config"]
description = "Fail when any Git configuration scope, or a tracked tool config, carries a credential in a URL, a key name or an Authorization header. Prints finding locations with credentials masked, then credential-free: yes or no."
shell = "node --input-type=module-typescript -e"
run = '''
import { execFileSync } from 'node:child_process'
import { readFile } from 'node:fs/promises'
import { resolve } from 'node:path'
import { findGitConfigCredentials, findUrlCredentials, parseGitConfigList } from '{{config_root}}/src/git-config-credential-guard.ts'
/** Repository top level (two levels above the package category folder), where the Git wrapper accepts commands. */
const top = resolve('{{config_root}}', '../../..')
/** Every entry of every scope (system, global, local, worktree, command) and every included file. */
const entries = parseGitConfigList({ output: execFileSync('git', ['config', '--list', '--null', '--show-scope', '--show-origin'], { encoding: 'utf8', cwd: top }) })
const configFindings = findGitConfigCredentials({ entries })
for (const finding of configFindings) {
  console.log(`FAIL git config ${finding.scope} ${finding.origin}: ${finding.reason} in ${finding.redactedKey}`)
}
/** Tracked files whose purpose is to configure a tool that talks to a server. */
const toolConfigs = execFileSync('git', ['ls-files', '-z', '--', '.lfsconfig', '.gitmodules', '**/.npmrc', '.npmrc', '**/.cargo/config.toml', '.cargo/config.toml', '**/.cargo/config', '**/.yarnrc.yml', '.yarnrc.yml', '**/.pnpmrc', '.config/mise/**', 'mise.toml'], { encoding: 'utf8', cwd: top }).split('\0').filter((path) => path !== '')
let fileFindings = 0
for (const path of toolConfigs) {
  const lines = (await readFile(`${top}/${path}`, 'utf8')).split('\n')
  lines.forEach((line, index) => {
    for (const found of findUrlCredentials({ text: line })) {
      fileFindings += 1
      console.log(`FAIL tool config ${path}:${index + 1}: credential in URL (${found.kind}, value withheld)`)
    }
  })
}
console.log(`checked ${entries.length} git config entries and ${toolConfigs.length} tracked tool configs`)
const clean = configFindings.length === 0 && fileFindings === 0
console.log(`credential-free: ${clean ? 'yes' : 'no'}`)
if (!clean) { process.exitCode = 1 }
'''
