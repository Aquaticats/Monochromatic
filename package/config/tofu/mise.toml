[tasks.init]
description = "Initialize the Hetzner OpenTofu working directory"
run = "tofu init"

[tasks.plan]
description = "Plan Hetzner firewall changes using secrets loaded from root .env.local.json"
run = "tofu plan"

[tasks.apply]
description = "Apply Hetzner firewall changes using secrets loaded from root .env.local.json"
run = "tofu apply"

[tasks.lint]
run = [{ tasks = ["lint:tofu", "lint:oxlint", "lint:types"] }]

[tasks.test]
run = [
  { tasks = ["test:storagebox-resolver", "test:hosts-resolver", "test:asn-cache", "test:external-caches"] },
]

[tasks."test:storagebox-resolver"]
description = "Smoke-test Storage Box hostname resolver without network access"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const result = JSON.parse(execFileSync('node', ['src/resolve_storagebox_hosts.ts'], { input: '{"hostnames":""}', encoding: 'utf8' }))
if (result.ips !== '') { throw new Error(`expected empty ips, got ${result.ips}`) }
let wildcardFailed = false
try { execFileSync('node', ['src/resolve_storagebox_hosts.ts'], { input: '{"hostnames":"*.your-storagebox.de"}', encoding: 'utf8' }) } catch { wildcardFailed = true }
if (!wildcardFailed) { throw new Error('expected wildcard hostname resolution to fail') }
"""

[tasks."test:storagebox-resolver:network"]
description = "Resolve a real Storage Box hostname through DNS"
usage = 'arg "host" help="Concrete your-storagebox.de hostname to resolve"'
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const host = process.env.usage_host
const result = JSON.parse(execFileSync('node', ['src/resolve_storagebox_hosts.ts'], { input: JSON.stringify({ hostnames: host }), encoding: 'utf8' }))
if (result.ips === '') { throw new Error(`expected resolved ips for ${host}`) }
"""

[tasks."test:hosts-resolver"]
description = "Smoke-test service hostname resolver without network access"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const result = JSON.parse(execFileSync('node', ['src/resolve_hosts.ts'], { input: '{"hostnames":""}', encoding: 'utf8' }))
if (Object.keys(result).length !== 0) { throw new Error(`expected empty map, got ${JSON.stringify(result)}`) }
let wildcardFailed = false
try { execFileSync('node', ['src/resolve_hosts.ts'], { input: '{"hostnames":"*.example.com"}', encoding: 'utf8', stdio: ['pipe', 'pipe', 'pipe'] }) } catch { wildcardFailed = true }
if (!wildcardFailed) { throw new Error('expected wildcard hostname resolution to fail') }
"""

[tasks."test:hosts-resolver:network"]
description = "Resolve a real service hostname through DNS"
usage = 'arg "host" default="nginx.org" help="Hostname to resolve"'
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const host = process.env.usage_host
const result = JSON.parse(execFileSync('node', ['src/resolve_hosts.ts'], { input: JSON.stringify({ hostnames: host }), encoding: 'utf8' }))
if (!result[host]) { throw new Error(`expected resolved ips for ${host}`) }
"""

[tasks."test:asn-cache"]
description = "Verify ASN database filtering, atomic cache replacement, and corrupt-cache rejection"
shell = "node --input-type=module-typescript -e"
run = '''
const { mkdtemp, readdir, rm, unlink, writeFile } = await import('node:fs/promises')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { lookupAsnNetworks } = await import('@monochromatic-dev/wg-core-allowedips/ts/asn-networks.ts')
const directory = await mkdtemp(join(tmpdir(), 'tofu-asn-cache-'))
await using cleanup = { async [Symbol.asyncDispose]() { await rm(directory, { force: true, recursive: true }) } }
const responseFor = text => new Response(
  new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream('gzip')),
  { status: 200 },
)
globalThis.fetch = async () => responseFor([
  JSON.stringify({ asn: 'AS64500', network: '192.0.2.0/24' }),
  JSON.stringify({ asn: 'AS64500', network: '2001:db8::1' }),
  JSON.stringify({ asn: 'AS64501', network: '198.51.100.0/24' }),
  '',
].join('\n'))
const networks = await lookupAsnNetworks({ asn: 'as64500', cacheDirectory: directory, token: 'fixture' })
if (JSON.stringify(networks) !== JSON.stringify(['192.0.2.0/24', '2001:db8::1'])) {
  throw new Error(`unexpected ASN networks: ${JSON.stringify(networks)}`)
}
const names = await readdir(directory)
if (JSON.stringify(names) !== JSON.stringify(['cache_AS64500.txt'])) {
  throw new Error(`atomic cache left unexpected files: ${JSON.stringify(names)}`)
}
const cachePath = join(directory, 'cache_AS64500.txt')
await writeFile(cachePath, 'not-a-network')
let corruptCacheRejected = false
try {
  await lookupAsnNetworks({ asn: 'AS64500', cacheDirectory: directory, token: '' })
} catch (error) {
  corruptCacheRejected = String(error).includes('Invalid network for AS64500')
}
if (!corruptCacheRejected) { throw new Error('expected corrupt ASN cache rejection') }
await unlink(cachePath)
globalThis.fetch = async () => responseFor(`${JSON.stringify({ asn: 'AS64500' })}\n`)
let malformedRecordRejected = false
try {
  await lookupAsnNetworks({ asn: 'AS64500', cacheDirectory: directory, token: 'fixture' })
} catch (error) {
  malformedRecordRejected = error instanceof Error
}
if (!malformedRecordRejected) { throw new Error('expected malformed target ASN record rejection') }
'''

[tasks."test:external-caches"]
description = "Smoke-test OpenTofu external helpers against local cache files when present"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { existsSync, readFileSync } = await import('node:fs')
if (existsSync('src/cache_AS41231.txt')) {
  const asn = JSON.parse(execFileSync('node', ['src/fetch_ips.ts'], { input: '{"asn":"AS41231"}', encoding: 'utf8' }))
  if (asn.ips === '') { throw new Error('expected cached AS41231 ips') }
}
if (existsSync('src/cache_tor_relays.txt')) {
  const tor = JSON.parse(execFileSync('node', ['src/fetch_tor_relays.ts'], { input: '{}', encoding: 'utf8' }))
  if (tor.ips === '') { throw new Error('expected cached Tor relay ips') }
}
if (existsSync('src/cache_resolved_hosts.json')) {
  const hosts = JSON.parse(readFileSync('src/cache_resolved_hosts.json', 'utf8'))
  if (Object.keys(hosts).length === 0) { throw new Error('expected cached resolved hosts') }
}
"""

[tasks.format]
run = [{ tasks = ["format:tofu"] }]

[tasks."format:tofu"]
description = "Format OpenTofu configuration"
run = "tofu fmt"

[tasks."lint:tofu"]
description = "Validate OpenTofu configuration"
run = [
  "tofu fmt -check -diff",
  "tofu validate",
]

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"
