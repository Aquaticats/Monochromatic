# OdyTTY settings panel
follow_os_theme = on

# OdyTTY settings panel
font_family = JetBrains Mono

# OdyTTY settings panel
always_show_tab_bar = on
background_treatment = off
buttons_iterm_compat = off
crt = off
cursor_style = bar
interactive_paths = on
osc52_write = on
restore_workspaces = on
session_replay = on
ssh_config_hosts = on
subpixel = off
tab_rail_gap = 0
workspace_rail = always

# OdyTTY settings panel
theme = custom-custom

# OdyTTY settings panel
new_output_fade = off
visual = off

# OdyTTY settings panel
line_height = 1.2

# OdyTTY settings panel
cursor_glow = off
cursor_motion = off
cursor_trail = off

# OdyTTY settings panel
tab_rail_autohide = off

# OdyTTY settings panel
selection_drag_extend = off
text_gamma = 1
wheel_zoom = off

# OdyTTY settings panel
synthetic_styles = off

# OdyTTY settings panel
tab_bar_height = 1

# OdyTTY settings panel
window_opacity = 95
window_padding = 0

# OdyTTY settings panel
bloom = off

# OdyTTY settings panel
font_size = 20

# OdyTTY settings panel
min_contrast = 6

# OdyTTY settings panel
selection_opacity = 0.95

# OdyTTY settings panel
colored_bg_opacity = 0.95

# OdyTTY settings panel
scrollback_lines = 20000
scroll_wheel_lines = 6

# OdyTTY settings panel
scroll_pixel_speed = 2
