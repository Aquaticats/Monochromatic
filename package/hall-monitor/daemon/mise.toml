[tasks.build]
description = "Compile hall-monitor to a standalone binary"
run = "bun build src/index.ts --compile --minify --bytecode --sourcemap --outfile hall-monitor"

[tasks.run]
description = "Run hall-monitor directly"
run = "node src/index.ts"

[tasks."run:dev"]
description = "Run hall-monitor with file-watch auto-restart"
run = "mise watch -w src -r -- node src/index.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks.test]
description = "Run every *.unit.test.ts in this package through the module-test harness"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const { resolve } = await import('node:path')
// Absolute paths: the runner resolves relative arguments against the monorepo root, not this package.
const files = []
for await (const file of glob('src/**/*.unit.test.ts')) { files.push(resolve(file)) }
if (files.length === 0) { throw new Error('no unit test files found under src/') }
execFileSync('mise', ['run', '//:test:unit', '--', ...files], { stdio: 'inherit' })
"""
