[tasks.build]
extends = "build"

[tasks."build:binary"]
description = "Compile hall-monitor to a standalone binary"
run = "bun build src/index.ts --compile --minify --bytecode --sourcemap --outfile hall-monitor"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks.run]
description = "Run hall-monitor directly"
run = "node src/index.ts"

[tasks."run:dev"]
description = "Run hall-monitor with file-watch auto-restart"
run = "mise watch -w src -r -- node src/index.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
# The suites import dist/final/node/testing.mjs, whose declarations are emitted by
# the node build, so the artifact must exist before the type checker reads it.
depends = ["build:js:node"]

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks.test]
extends = "test"

[tasks."test:unit"]
extends = "test:unit"
# The suites import dist/final/node/testing.mjs rather than sibling source, so the
# built artifact must exist before they run.
depends = ["build:js:node"]
