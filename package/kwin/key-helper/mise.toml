[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks.run]
description = "Run the key-helper daemon from source (dev)"
run = "node src/index.ts"

[tasks."run:dev"]
description = "Run the daemon from source with file-watch auto-restart"
run = "mise watch -w src -r -- node src/index.ts"

# Named `sea` (not `build:sea`) so the `build` fanout, which runs every `build:*`
# subtask, does not pull it in before the ESM bundle exists.
[tasks.sea]
description = "Embed the built ESM bundle into a Node SEA binary (key-helper-service)"
shell = "node --input-type=module-typescript -e"
run = """
import { execFileSync, } from 'node:child_process'
import { chmodSync, mkdirSync, mkdtempSync, readFileSync, renameSync, rmSync, writeFileSync, } from 'node:fs'
import { basename, join, resolve, } from 'node:path'

// Node 26 --build-sea does blob generation + injection in one step, loading the
// ESM main directly via "mainFormat": "module" in sea-config.json. It writes the
// output path in place, which fails with "text file is busy" while the daemon is
// running from that file. So the build goes to a scratch folder under dist/,
// through a copy of sea-config.json with its paths made absolute, and the result
// is renamed over the old binary: a rename swaps the directory entry, the running
// daemon keeps executing the file it opened, and a failed build leaves the old
// binary untouched.
const config = JSON.parse(readFileSync('sea-config.json', 'utf8',),)
mkdirSync('dist', { recursive: true, },)
const scratch = mkdtempSync(join('dist', 'sea-build-',),)
try {
  const builtPath = resolve(scratch, basename(config.output,),)
  const scratchConfigPath = join(scratch, 'sea-config.json',)
  writeFileSync(scratchConfigPath, JSON.stringify({ ...config, main: resolve(config.main,), output: builtPath, },),)
  execFileSync(process.execPath, ['--build-sea', scratchConfigPath,], { stdio: 'inherit', },)
  chmodSync(builtPath, 0o755,)
  renameSync(builtPath, config.output,)
} finally {
  rmSync(scratch, { recursive: true, force: true, },)
}
console.log(`built ${config.output}`,)
"""

[tasks.binary]
description = "Build the ESM bundle then embed it into the SEA binary"
run = ["mise run build", "mise run sea"]

[tasks.install]
description = "Symlink the KWin script, point autostart at the in-repo binary, enable the script"
# The steps themselves live in src/install.ts, where they are unit-tested: the
# autostart Exec line crosses both the desktop-entry grammar and /bin/sh, and a
# checkout path with a space or a quote used to break it silently.
shell = "node --input-type=module-typescript -e"
run = """
import { execFileSync } from 'node:child_process'
import { installKeyHelper } from './src/install.ts'

const home = process.env.HOME
if (!home) { throw new Error('HOME is not set') }
await installKeyHelper({
  homeDirectory: home,
  packageDirectory: process.cwd(),
  enableKwinScript() {
    execFileSync(
      'kwriteconfig6',
      ['--file', 'kwinrc', '--group', 'Plugins', '--key', 'key-helper-kwinEnabled', 'true'],
      { stdio: 'inherit' },
    )
  },
})
"""
