[tasks.run]
description = "Run mvm CLI"
run = "node src/cli.ts"

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the node lib + bin, then run unit tests; cli.unit.test.ts spawns the built cli.mjs"
run = ["mise run build", "mise run test:unit"]

# Live, BILLED Hetzner provisioning test. Excluded from test:unit (the .expensive.
# marker); run deliberately. Root mise loads HCLOUD_TOKEN from the encrypted
# .env.local.json before this task starts. Provisions and destroys billed servers.
[tasks."test:hetzner"]
description = "Run the live, BILLED Hetzner provisioning test using root SOPS secrets"
run = "node src/backend/hetzner/provision.expensive.unit.test.ts"
