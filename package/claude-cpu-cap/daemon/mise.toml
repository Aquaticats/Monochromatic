[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"
[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks."check:installed-unit"]
description = "Fail when the installed claude-cpu-watch.service is not a regular copy of systemd/claude-cpu-watch.service"
shell = "node --input-type=module-typescript -e"
run = '''
const { readFile, lstat } = await import('node:fs/promises');
const { homedir } = await import('node:os');
const { join } = await import('node:path');
const installed = join(homedir(), '.config', 'systemd', 'user', 'claude-cpu-watch.service');
const original = new URL('systemd/claude-cpu-watch.service', `file://${process.cwd()}/`).pathname;
if ((await lstat(installed)).isSymbolicLink()) {
  throw new Error(`${installed} is a link: the user manager would leave the unit unloaded when the repository is away; replace it with a copy (README, "Install")`);
}
if (await readFile(installed, 'utf8') !== await readFile(original, 'utf8')) {
  throw new Error(`${installed} differs from ${original}; copy the file again (README, "Install")`);
}
console.log('the installed unit is a regular copy of systemd/claude-cpu-watch.service');
'''
