[package]
name = "monochromatic-mpm-shadow"
version = "0.1.0"
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/mpm-shadow/cli"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["mpm", "cargo", "cleanup", "shim"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Shadows mpm: runs the real mpm, then deletes the superseded cached versions of this repository's own crates from cargo's registry."

# The artifact is deliberately not named `mpm`: a `target/*/mpm` or a tool `bin/mpm` on PATH would shadow mpm by accident.
# The repository's toolchain plan links it as `mpm` in a per-worktree directory after installing it, the way it links
# `cli-git-native` as `git`.
# cargo-binstall's default URL is {repo}/releases/download/v{version}/{name}-{target}-v{version}, but this
# repository tags each crate's release monochromatic-mpm-shadow-v<version> and names the archive
# monochromatic-mpm-shadow-<version>-<target>, so without this table cargo-binstall falls back to compiling.
# The archive holds the `mpm-shadow` binary (the {bin} below), not a file named after the crate.
# Releases carry Linux archives only (x86_64 and aarch64, tar.gz); any other target compiles from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "mpm_shadow"
path = "src/lib.rs"

[[bin]]
name = "mpm-shadow"
path = "src/main.rs"

[dependencies]
# Owns the `mpm-shadow` command grammar (`prune`, `--help`, `--version`). The shadow mode never touches it:
# the arguments mpm receives pass through untouched.
clap = { workspace = true }

# Reads cargo's own install record (`.crates2.json`) to learn which version of each crate is installed.
serde_json = { workspace = true }

[dev-dependencies]
# Disposable directories for the PATH, registry and install-record fixtures.
tempfile = { workspace = true }

# Every mpm run starts through this binary, so startup latency matters. A smaller, abort-on-panic,
# link-time-optimized binary starts fastest.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
clap = ">=4"
serde_json = ">=1"
tempfile = ">=3"
