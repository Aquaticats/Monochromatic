[package]
name = "jsonc-edit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[package.metadata]
cargo-fuzz = true

[dependencies]
# `arbitrary` drives the structured document generator: raw bytes almost never form valid
# JSONC, so the generator builds documents and paths from unstructured input instead.
# `libfuzzer-sys` is the harness.
arbitrary = { workspace = true, features = ["derive"] }
libfuzzer-sys = { workspace = true, features = ["arbitrary-derive"] }

[dependencies.monochromatic-jsonc-edit]
path = "../core-rust"
version = "=0.1.1"

# Library target hosting the shared generator, invariants and address picker used by every
# fuzz target via `use jsonc_edit_fuzz::...;`. Cargo would auto-detect `src/lib.rs`; it is
# spelled out so the rename surface is explicit, matching the other fuzz sidecars.
[lib]
name = "jsonc_edit_fuzz"
path = "src/lib.rs"

# Spell out `panic = "unwind"` so libFuzzer can capture and minimize crashes by unwinding.
# A panic under `abort` would kill the process before libFuzzer records a reproducer, and
# every invariant in this sidecar is expressed as an assertion.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# cargo-fuzz discovers targets through `cargo metadata`, so each harness needs an explicit
# bin entry: a bare `fuzz_targets/` directory is invisible to it, and `cargo fuzz list`
# then prints nothing while still exiting 0.
[[bin]]
name = "fuzz_parse_emit_roundtrip"
path = "fuzz_targets/fuzz_parse_emit_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_reject_and_recover"
path = "fuzz_targets/fuzz_reject_and_recover.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_depth_envelope"
path = "fuzz_targets/fuzz_depth_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_edit_invariants"
path = "fuzz_targets/fuzz_edit_invariants.rs"
test = false
doc = false
bench = false

# Use independent workspace for fuzzers
[workspace]
members = ["."]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
arbitrary = ">=1.4.2"
libfuzzer-sys = ">=0.4.13"
