<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <meta
      name='viewport'
      content='width=device-width, initial-scale=1'>
    <title>Monochromatic ESM TS Counter</title>
    <link
      rel='stylesheet'
      href='./styles.css'>
    <script
      type='module'
      src='./renderer.js'></script>
  </head>
  <body>
    <main
      class='app-shell'
      aria-labelledby='app-title'>
      <section
        class='counter-card'
        aria-describedby='counter-description'>
        <p class='eyebrow'>Electron, TypeScript, ESM, no Vite</p>
        <h1 id='app-title'>Hello from Electron</h1>
        <p
          id='counter-description'
          class='description'>
          Click the button to verify browser ESM, DOM events, and Electron's pure Wayland
          path.
        </p>
        <output
          id='counter-value'
          class='counter-value'
          aria-live='polite'>Count: 0</output>
        <button
          id='increment-button'
          class='increment-button'
          type='button'>
          Increment counter
        </button>
      </section>
    </main>
  </body>
</html>
