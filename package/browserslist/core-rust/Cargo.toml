[package]
name = "monochromatic-browserslist"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["parser-implementations", "development-tools"]
edition = "2024"
include = [
  "src/**/*.rs",
  "fixtures/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["browserslist", "caniuse", "browsers", "targets"]
license = "LGPL-3.0-or-later"
readme = "README.md"
description = "Resolves this repository's .browserslistrc to the target list npm browserslist 4.29.5 produces, for the query forms the repository uses only, from caniuse-lite and node-releases data pinned by hash in a lock file; every other query form fails with a not-implemented error."

[lib]
name = "monochromatic_browserslist"
path = "src/lib.rs"

[[bin]]
name = "browserslist-lock-update"
path = "src/bin/browserslist_lock_update.rs"

[dependencies]
# The sha-512 digest that npm publishes as `dist.integrity`; every downloaded tarball is checked against it.
sha2 = { workspace = true }

# Decodes the base64 half of an npm `sha512-<base64>` integrity string.
base64 = { workspace = true }

# Reads the lock, the node-releases data, and the Mozilla product-details document, and writes the lock.
serde_json = { workspace = true }

# Locates the per-user cache directory that holds the verified, extracted data keyed by integrity.
directories = { workspace = true }

# Inflates the gzip layer of an npm tarball.
flate2 = { workspace = true }

# Walks the tar entries of an npm tarball to find the few data files browserslist reads.
tar = { workspace = true, default-features = false }

# The HTTP stack the user approved on 2026-10-30: the client half of hyper, over tokio, with rustls for https.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { workspace = true }
hyper-rustls = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }

# Events on the fetch, verify and cache decisions; with no subscriber installed they cost a level check.
tracing = { workspace = true }

[dev-dependencies]
# The fake registry in the tests is a plain tokio TCP listener, so it needs the io helpers and the test macro.
tokio = { workspace = true, features = ["rt", "net", "time", "io-util"] }

# Disposable cache and fixture directories for the tests.
tempfile = { workspace = true }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
[workspace]

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
base64 = ">=0.23.1"
directories = ">=6"
flate2 = ">=1.1.10"
http-body-util = ">=0.1.5"
hyper = ">=1.12.0"
hyper-rustls = ">=0.27.10"
hyper-util = ">=0.1.21"
serde_json = ">=1.0.154"
sha2 = ">=0.10.9"
tar = { version = ">=0.4.46", default-features = false }
tempfile = ">=3.27.0"
tokio = ">=1.53.2"
tracing = ">=0.1.44"
