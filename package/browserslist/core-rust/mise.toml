[tasks.build]
description = "Build the monochromatic-browserslist library and binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the monochromatic-browserslist library and binary in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:types"]
description = "Type-level gate for this crate: cargo check plus clippy with warnings denied"
run = ["cargo check", "cargo clippy --release --all-targets -- -D warnings"]

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"

[tasks."publish:dry-run"]
description = "Package and verify, then abort before uploading to crates.io"
run = "cargo publish --dry-run"

[tasks.publish]
description = "Fallback local publish. Canonical path is .github/workflows/cargo-publish.yml (OIDC Trusted Publishing); the very first version of a crate must be published once with a personal API token (doc/runbook/publish-crate-first-time.md)."
run = "cargo publish"

[tasks.test]
description = "cargo nextest run in release mode (offline: the network tests use a fake registry on loopback)"
run = "cargo nextest run --release"

[tasks."test:debug"]
description = "cargo nextest run in debug mode for fast iteration"
run = "cargo nextest run"

[tasks."test:live"]
description = "Opt-in live test: fetch the pinned tarballs from registry.npmjs.org and read Mozilla product-details"
run = "cargo nextest run --run-ignored only --test live"

[tasks.update]
description = "Pick the newest published caniuse-lite and node-releases and the current Firefox ESR, verify them, rewrite the repository-root browserslist-data.lock.json, then regenerate the fixtures and conformance expectations (needs podman and network)"
run = ["cargo run --release -- update --lock ../../../browserslist-data.lock.json", "node bin/regenerate-conformance.ts"]

[tasks."conformance:regenerate"]
description = "Regenerate fixtures/data and conformance/expected.json from the locked data with npm browserslist 4.29.5 in a bounded container (needs podman and network)"
run = "node bin/regenerate-conformance.ts"

[tasks."lint:scripts:types"]
description = "Type-check the maintenance scripts in bin (TypeScript)"
extends = "lint:types"

[tasks."lint:scripts:oxlint"]
description = "Lint explicitly selected maintenance TypeScript script paths with Oxlint"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('lint:scripts:oxlint requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', files)
"""

[tasks."format:scripts:oxlint"]
description = "Auto-fix explicitly selected maintenance TypeScript script paths with Oxlint"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('format:scripts:oxlint requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...files])
"""
