<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <meta
      name='viewport'
      content='width=device-width, initial-scale=1'>
    <title>Monochromatic File Manager Electron</title>
    <link
      rel='stylesheet'
      href='./styles.css'>
    <script
      type='module'
      src='./renderer.js'></script>
  </head>
  <body>
    <main class='app-shell'>
      <div
        id='strip'
        class='strip'
        role='application'
        aria-label='Pane strip'>
      </div>
      <output
        id='status'
        class='status'
        aria-live='polite'></output>
    </main>
  </body>
</html>
