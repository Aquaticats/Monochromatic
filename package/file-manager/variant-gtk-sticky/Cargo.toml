[package]
name = "file-manager-gtk-sticky"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Sticky-band variant of the GTK file manager: the original's lane engine and collision solver replaced by one per-pane clamp, y = band_top + clamp(scroll - band_top, 0, band_height - PANE_HEIGHT), the same rule CSS position: sticky applies. See doc/audit/file-manager-sticky-flow.md."

# Lib+bin split so the pure band math unit-tests without spinning up GTK, matching the sibling
# desktop apps. The bin is a thin wrapper over the library `run`.
[lib]
name = "file_manager_gtk_sticky"
path = "src/lib.rs"

[[bin]]
name = "monochromatic-file-manager-gtk-sticky"
path = "src/main.rs"

[dependencies]
# The original app's crate: this variant reuses its public pane-strip model, filesystem reads, and
# domain types verbatim, so the two apps differ ONLY in the layout engine the audit doc compares.
file-manager = { path = "../app", version = "=0.1.0" }
# gtk4-rs over system GTK 4.22. One step above the original's v4_10 feature level: v4_12 adds
# `ListView::scroll_to`, used to initialize each list's keyboard cursor so the first Enter
# activates the selected row (keyboard parity with the Electron prototype's boundary test).
gtk4 = { workspace = true, features = ["v4_12"] }
# Machine-readable observed-state output for the nested-Wayland boundary test; the same shallow
# JSON schema the Electron prototype's main process writes, so both tests share assertions.
serde_json = { workspace = true }
# Non-blocking logging, same pattern as the original.
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
gtk4 = ">=0.11.4"
serde_json = ">=1.0.154"
tracing = ">=0.1.44"
tracing-appender = ">=0.2.5"
tracing-subscriber = ">=0.3.23"
