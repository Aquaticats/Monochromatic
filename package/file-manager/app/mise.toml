# Cargo work runs on the host, like the sibling desktop apps. Builds against the system
# GTK 4.22 (gtk4-devel layered via rpm-ostree); pkg-config locates it automatically, so no
# QMAKE-style env is needed (unlike the retired Qt spike). This package reclaims the canonical,
# function-named `file-manager` path from the old Slint prototype; the app is now GTK4.

[tasks.build]
description = "Release build"
run = "cargo build --release"

[tasks."build:debug"]
description = "Debug build"
run = "cargo build"

[tasks.lint]
description = "cargo check (type-check)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- --deny warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

# Debug build, then run the GUI. GTK auto-selects the native Wayland GDK backend in a Wayland
# session; GDK_BACKEND=wayland forces it (never XWayland) so DnD is exercised over real Wayland.
[tasks.run]
description = "Debug build, then run the GUI on native Wayland (GDK_BACKEND=wayland)"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
execFileSync('cargo', ['build'], { stdio: 'inherit' })
execFileSync('./target/debug/monochromatic-file-manager', [], {
  stdio: 'inherit',
  env: { ...process.env, GDK_BACKEND: 'wayland' },
})
"""
