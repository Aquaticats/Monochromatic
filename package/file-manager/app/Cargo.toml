[package]
name = "file-manager"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Native cross-platform file manager: a Niri-like horizontal strip of columns on GTK4, with native Wayland drag-and-drop. Supersedes the Slint prototype (stack decision 2026-07-08; see doc/handover/file-manager-toolkit-exploration.md)."

# Lib+bin split so the plain-Rust domain model (model/fs) unit-tests without spinning up GTK,
# matching the sibling desktop apps. The bin is a thin wrapper over the library `run`.
[lib]
name = "file_manager"
path = "src/lib.rs"

[[bin]]
name = "monochromatic-file-manager"
path = "src/main.rs"

[dependencies]
# gtk4-rs over system GTK 4.22. GtkListView virtualizes long file lists; GtkDropTarget/GtkDragSource
# give native Wayland drag-and-drop (the capability the winit/Slint stack lacked). The `v4_12`
# feature exposes `CssProvider::load_from_string` and `gdk::FileList` for the file drop.
# Worker->main-thread delivery of decoded pixels. glib removed `MainContext::channel`, so the
# gtk4-rs idiom is an async-channel drained by `glib::spawn_future_local` on the main context.
async-channel = { workspace = true }
gtk4 = { workspace = true, features = ["v4_12"] }
# In-process image decoding for preview thumbnails. Memory-safe pure-Rust decoders (no libjpeg/
# ffmpeg subprocess), matching the plan's "image thumbnails decode in-process with memory-safe Rust".
# Decoding runs on a worker thread, never the render path.
image = { workspace = true }
# Non-blocking logging: `tracing` on the hot path enqueues to a dedicated writer thread so logging
# never stalls the UI thread (same pattern as the Qt spike).
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Windows-only: native OLE drag source for outbound file drag to Explorer, since GDK's Win32
# backend leaves the file-to-"Shell IDList Array" conversion unimplemented. See
# doc/troubleshooting/gtk4-windows-outbound-file-drag.md. Compiled only on Windows.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# macOS-only: native AppKit drag source for outbound file drag to Finder, since GDK's Quartz
# backend never writes the dragged file to the NSPasteboard as an NSURL. See
# doc/troubleshooting/gtk4-macos-file-dnd.md. Compiled only on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSString", "NSURL", "NSArray", "NSGeometry"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSView", "NSWindow", "NSEvent", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSImage"] }

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Named catalogs this crate selects from rust-catalog.toml (doc/decision/rust-dependency-catalog.md).
[package.metadata.rust-catalog.catalogs]
windows = "windows-legacy"

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
async-channel = ">=2.5.0"
gtk4 = ">=0.11.4"
image = ">=0.25.10"
objc2 = ">=0.6.4"
objc2-app-kit = ">=0.3.2"
objc2-foundation = ">=0.3.2"
tracing = ">=0.1.44"
tracing-appender = ">=0.2.5"
tracing-subscriber = ">=0.3.23"
windows = "0.58"
