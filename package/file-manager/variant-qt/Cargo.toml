[package]
name = "file-manager-qt"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Qt/cxx-qt desktop file-manager: native Wayland drag-and-drop, successor to the Slint prototype."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[[bin]]
name = "monochromatic-file-manager-qt"
path = "src/main.rs"

[dependencies]
# cxx-qt 0.9.1 bridges Rust <-> Qt6. The UI is real Qt/QtQuick, so native OS
# drag-and-drop (including native Wayland, which winit/Slint lack) comes from Qt
# itself. Versions match the cxx-qt 0.9.1 release family; cxx is pinned to the
# same 1.0.176 the cxx-qt workspace uses so the generated bridge stays compatible.
cxx = { workspace = true }
cxx-qt = { workspace = true }
# `full` pulls the complete cxx-qt-lib type surface (QString, QUrl, QList, the
# QAbstractItemModel base, etc.) the file-manager model and drop handlers need.
cxx-qt-lib = { workspace = true, features = ["full"] }
# Non-blocking logging. The app logs extensively (repo LOG rule), so logging must never
# stall the UI/render thread: tracing on the hot path only enqueues, and tracing-appender's
# NonBlocking writer drains to stderr on a dedicated thread. A qInstallMessageHandler bridge
# (see src/qt_log.cpp) routes Qt's own qDebug/qCDebug into the same off-thread sink, so
# Qt-internal logs cannot block a frame either. Never enable QSG_RENDER_TIMING in production.
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
# `link_qt_object_files` links the QML module's generated object files (the qrc
# resource embedding qml/main.qml and the registered QObject) into the binary.
cxx-qt-build = { workspace = true, features = ["link_qt_object_files"] }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
cxx = ">=1.0.196"
cxx-qt = ">=0.9.1"
cxx-qt-build = ">=0.9.1"
cxx-qt-lib = ">=0.9.1"
tracing = ">=0.1.44"
tracing-appender = ">=0.2.5"
tracing-subscriber = ">=0.3.23"
