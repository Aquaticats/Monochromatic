# Cargo work runs directly on the host, like the sibling desktop apps. This package
# builds against the system Qt6 (6.11.1), whose -devel packages (qt6-qtbase-devel,
# qt6-qtdeclarative-devel, qt6-qtshadertools-devel) are layered via rpm-ostree; see the
# package README. clang/cmake (already layered) provide the C++ toolchain cxx-qt needs.

[env]
# cxx-qt-build (via qt-build-utils) locates Qt by running `qmake` on PATH, but Fedora/
# Bazzite ship only `qmake6` (there is no bare `qmake` for Qt6), so point the build at it
# explicitly. Without this, the build fails to find Qt even though it is installed.
QMAKE = "/usr/bin/qmake6"

[tasks.build]
description = "Release build"
run = "cargo build --release"

[tasks."build:debug"]
description = "Debug build"
run = "cargo build"

[tasks.lint]
description = "cargo check"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- --deny warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

# Debug build, then run the GUI forcing the native Wayland QPA platform so drag-and-drop
# is exercised over real Wayland (not XWayland). Uses node -e per the repo's no-shell-script
# rule. QT_QPA_PLATFORM=wayland pins the platform; on a non-Wayland session, drop it.
[tasks.run]
description = "Debug build, then run the GUI on native Wayland (QT_QPA_PLATFORM=wayland)"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
execFileSync('cargo', ['build'], { stdio: 'inherit' })
execFileSync('./target/debug/monochromatic-file-manager-qt', [], {
  stdio: 'inherit',
  env: { ...process.env, QT_QPA_PLATFORM: 'wayland' },
})
"""
