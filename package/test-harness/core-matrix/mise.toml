[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks.test]
description = "Run matrix self-tests against the built artifact (builds first)"
depends = ["build"]
run = [
  "node src/distro.unit.test.ts",
  "node src/runtime.unit.test.ts",
  "node src/container.unit.test.ts",
  "node src/discover.unit.test.ts",
]
