<svg
  xmlns='http://www.w3.org/2000/svg'
  viewBox='0 0 720 520'
  font-family="'Courier New', monospace">
  <defs>
    <filter
      id='shadow'
      x='-4%'
      y='-4%'
      width='108%'
      height='108%'>
      <feDropShadow
        dx='2'
        dy='2'
        stdDeviation='2'
        flood-opacity='0.15'
      />
    </filter>
  </defs>

  <!-- background -->
  <rect
    width='720'
    height='520'
    rx='12'
    fill='#fafaf9'
  />

  <!-- title -->
  <text
    x='360'
    y='38'
    text-anchor='middle'
    font-size='18'
    font-weight='bold'
    fill='#1c1917'>@monochromatic-dev/test-harness-core</text>
  <text
    x='360'
    y='58'
    text-anchor='middle'
    font-size='11'
    fill='#78716c'>Enterprise-Grade Test Architecture</text>

  <!-- describe box -->
  <rect
    x='40'
    y='80'
    width='200'
    height='100'
    rx='8'
    fill='#fef3c7'
    stroke='#f59e0b'
    stroke-width='1.5'
    filter='url(#shadow)'
  />
  <text
    x='140'
    y='105'
    text-anchor='middle'
    font-size='13'
    font-weight='bold'
    fill='#92400e'>describe()</text>
  <line
    x1='60'
    y1='115'
    x2='220'
    y2='115'
    stroke='#f59e0b'
    stroke-width='0.5'
  />
  <text
    x='140'
    y='135'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>Concurrency Engine:</text>
  <text
    x='140'
    y='152'
    text-anchor='middle'
    font-size='11'
    font-weight='bold'
    fill='#1c1917'>Promise.allSettled()</text>
  <text
    x='140'
    y='170'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>that's it. that's the engine.</text>

  <!-- it box -->
  <rect
    x='260'
    y='80'
    width='200'
    height='100'
    rx='8'
    fill='#dbeafe'
    stroke='#3b82f6'
    stroke-width='1.5'
    filter='url(#shadow)'
  />
  <text
    x='360'
    y='105'
    text-anchor='middle'
    font-size='13'
    font-weight='bold'
    fill='#1e40af'>it()</text>
  <line
    x1='280'
    y1='115'
    x2='440'
    y2='115'
    stroke='#3b82f6'
    stroke-width='0.5'
  />
  <text
    x='360'
    y='135'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>Execution Runtime:</text>
  <text
    x='360'
    y='152'
    text-anchor='middle'
    font-size='11'
    font-weight='bold'
    fill='#1c1917'>a for loop</text>
  <text
    x='360'
    y='170'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>with performance.now()</text>

  <!-- expect box -->
  <rect
    x='480'
    y='80'
    width='200'
    height='100'
    rx='8'
    fill='#dcfce7'
    stroke='#22c55e'
    stroke-width='1.5'
    filter='url(#shadow)'
  />
  <text
    x='580'
    y='105'
    text-anchor='middle'
    font-size='13'
    font-weight='bold'
    fill='#166534'>expect()</text>
  <line
    x1='500'
    y1='115'
    x2='660'
    y2='115'
    stroke='#22c55e'
    stroke-width='0.5'
  />
  <text
    x='580'
    y='135'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>Assertion Layer:</text>
  <text
    x='580'
    y='152'
    text-anchor='middle'
    font-size='11'
    font-weight='bold'
    fill='#1c1917'>chai in a trenchcoat</text>
  <text
    x='580'
    y='170'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>pretending to be Jest</text>

  <!-- arrows down -->
  <line
    x1='140'
    y1='180'
    x2='140'
    y2='220'
    stroke='#78716c'
    stroke-width='1.5'
    marker-end='url(#arrow)'
  />
  <line
    x1='360'
    y1='180'
    x2='360'
    y2='220'
    stroke='#78716c'
    stroke-width='1.5'
    marker-end='url(#arrow)'
  />
  <line
    x1='580'
    y1='180'
    x2='580'
    y2='220'
    stroke='#78716c'
    stroke-width='1.5'
    marker-end='url(#arrow)'
  />
  <defs>
    <marker
      id='arrow'
      viewBox='0 0 10 10'
      refX='10'
      refY='5'
      markerWidth='6'
      markerHeight='6'
      orient='auto'>
      <path
        d='M 0 0 L 10 5 L 0 10 z'
        fill='#78716c'
      />
    </marker>
  </defs>

  <!-- withTimeout -->
  <rect
    x='40'
    y='220'
    width='200'
    height='70'
    rx='8'
    fill='#fce7f3'
    stroke='#ec4899'
    stroke-width='1.5'
    filter='url(#shadow)'
  />
  <text
    x='140'
    y='248'
    text-anchor='middle'
    font-size='12'
    font-weight='bold'
    fill='#9d174d'>withTimeout()</text>
  <text
    x='140'
    y='268'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>Promise.race() + setTimeout</text>
  <text
    x='140'
    y='282'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>now with cleanup! (as of today)</text>

  <!-- sinon -->
  <rect
    x='260'
    y='220'
    width='200'
    height='70'
    rx='8'
    fill='#f3e8ff'
    stroke='#a855f7'
    stroke-width='1.5'
    filter='url(#shadow)'
  />
  <text
    x='360'
    y='248'
    text-anchor='middle'
    font-size='12'
    font-weight='bold'
    fill='#6b21a8'>createSinon()</text>
  <text
    x='360'
    y='268'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>sinon + Symbol.dispose</text>
  <text
    x='360'
    y='282'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>3 lines of actual code</text>

  <!-- chai plugins -->
  <rect
    x='480'
    y='220'
    width='200'
    height='70'
    rx='8'
    fill='#e0f2fe'
    stroke='#0ea5e9'
    stroke-width='1.5'
    filter='url(#shadow)'
  />
  <text
    x='580'
    y='248'
    text-anchor='middle'
    font-size='12'
    font-weight='bold'
    fill='#0c4a6e'>chai plugins</text>
  <text
    x='580'
    y='268'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>sinon-chai + as-promised</text>
  <text
    x='580'
    y='282'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>use(plugin) use(plugin) done</text>

  <!-- self-test ouroboros -->
  <rect
    x='160'
    y='340'
    width='400'
    height='90'
    rx='12'
    fill='#fefce8'
    stroke='#eab308'
    stroke-width='2'
    stroke-dasharray='6 3'
    filter='url(#shadow)'
  />
  <text
    x='360'
    y='368'
    text-anchor='middle'
    font-size='13'
    font-weight='bold'
    fill='#854d0e'>Self-Test Bootstrap Paradox</text>
  <text
    x='360'
    y='390'
    text-anchor='middle'
    font-size='11'
    fill='#1c1917'>tests itself with itself</text>
  <text
    x='360'
    y='408'
    text-anchor='middle'
    font-size='10'
    fill='#78716c'>import { describe, it, expect } from './the thing being tested'</text>
  <text
    x='360'
    y='422'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>if it fails, did it succeed?</text>

  <!-- circular arrow for ouroboros -->
  <path
    d='M 520 385 C 545 370, 555 395, 535 405'
    stroke='#eab308'
    stroke-width='1.5'
    fill='none'
    marker-end='url(#arrowGold)'
  />
  <defs>
    <marker
      id='arrowGold'
      viewBox='0 0 10 10'
      refX='10'
      refY='5'
      markerWidth='5'
      markerHeight='5'
      orient='auto'>
      <path
        d='M 0 0 L 10 5 L 0 10 z'
        fill='#eab308'
      />
    </marker>
  </defs>

  <!-- total LOC counter -->
  <rect
    x='220'
    y='460'
    width='280'
    height='40'
    rx='20'
    fill='#1c1917'
    filter='url(#shadow)'
  />
  <text
    x='360'
    y='485'
    text-anchor='middle'
    font-size='12'
    font-weight='bold'
    fill='#fafaf9'>Total framework code: ~250 lines</text>

  <!-- footnote -->
  <text
    x='360'
    y='510'
    text-anchor='middle'
    font-size='9'
    fill='#a8a29e'>smaller than most frameworks' contributing guidelines</text>
</svg>
