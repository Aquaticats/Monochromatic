[tasks.build]
extends = "build"

[tasks."build:js"]
description = "Build each artifact once in one dependency graph before bundling the browser consumer"
# Nested fan-out processes cannot deduplicate a neutral build shared with the client fixture.
depends = ["//package/test-harness/core:build:js:node", "//package/test-harness/core:build:js:client"]

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."build:js:client"]
description = "Bundle the built neutral harness consumer for browser acceptance"
extends = "build:js:client"
depends = ["//package/test-harness/core:build:js:browser"]

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
description = "Auto-fix this package or explicit package-relative paths"
usage = 'arg "[args]" var=#true help="Package-relative files to auto-fix; omitted means the package"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"
depends = ["build"]

[tasks."test:browser"]
description = "Verify the neutral harness in disposable browsers, bounded to 2 GiB RAM and 2 CPUs"
depends = ["//package/test-harness/core:build:js:client"]
usage = 'arg "[args]" var=#true help="Additional Playwright arguments, such as --project=chromium"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.dispatch_workspace_node}}
execFileSync('mise', ['run', 'prepare:playwright'], { cwd: monorepoRoot, stdio: 'inherit' })
// The lowest disk weight and the podman bound options come from package/container-limit/core (repository rule HXR).
const { containerLimitArguments } = await import(process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').resolve(process.cwd(), '../../container-limit/core/src/index.ts')).href)
// The shared pnpm store, mounted read-only at the path this checkout's node_modules links name, so `npx playwright`
// resolves the workspace's own Playwright instead of nothing (package/test-harness/core-matrix/src/pnpm-store-mount.ts).
const { pnpmStoreMountArguments } = await import(process.getBuiltinModule('node:url').pathToFileURL(process.getBuiltinModule('node:path').resolve(process.cwd(), '../core-matrix/src/pnpm-store-mount.ts')).href)
// 2048 processes is what podman run --help prints as the default, so today's effective cap becomes explicit (browsers start many
// threads, and threads count).
// Measured 2026-11-09T01:52:37Z: the browsers start and every test runs once the store is mounted; before that mount the
// run failed before any browser started (doc/handover/container-limits-everywhere.md, section Measured runs on this host).
execFileSync('podman', ['run', '--rm', ...containerLimitArguments({ memory: '2g', cpus: 2, pidsLimit: 2048 }), '--security-opt', 'label=disable', '--volume', `${monorepoRoot}:/work`, ...pnpmStoreMountArguments(), '--workdir', '/work', 'monochromatic-playwright', 'npx', 'playwright', 'test', '--config', 'playwright.browser.config.ts', 'package/test-harness/core/src/sinon.browser.test.ts', '--workers=1', ...parseUsageArgs(process.env.usage_args ?? '')], { stdio: 'inherit' })
"""

[tasks.buildAndTest]
description = "Build the harness, then run every *.unit.test.ts in its own node process"
run = ["mise run build", "mise run test:unit"]
