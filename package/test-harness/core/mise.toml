[tasks.build]
extends = "build"

[tasks."build:js"]
description = "Build each artifact once in one dependency graph before bundling the browser consumer"
# Nested fan-out processes cannot deduplicate a neutral build shared with the client fixture.
depends = ["//package/test-harness/core:build:js:node", "//package/test-harness/core:build:js:client"]

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."build:js:client"]
description = "Bundle the built neutral harness consumer for browser acceptance"
extends = "build:js:client"
depends = ["//package/test-harness/core:build:js:browser"]

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
description = "Auto-fix this package or explicit package-relative paths"
usage = 'arg "[args]" var=#true help="Package-relative files to auto-fix; omitted means the package"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks."test:browser"]
description = "Verify the neutral harness in disposable browsers, bounded to 2 GiB RAM and 2 CPUs"
depends = ["//package/test-harness/core:build:js:client"]
usage = 'arg "[args]" var=#true help="Additional Playwright arguments, such as --project=chromium"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.dispatch_workspace_node}}
execFileSync('mise', ['run', 'prepare:playwright'], { cwd: monorepoRoot, stdio: 'inherit' })
execFileSync('podman', ['run', '--rm', '--memory=2g', '--cpus=2', '--security-opt', 'label=disable', '--volume', `${monorepoRoot}:/work`, '--workdir', '/work', 'monochromatic-playwright', 'npx', 'playwright', 'test', '--config', 'playwright.browser.config.ts', 'package/test-harness/core/src/sinon.browser.test.ts', '--workers=1', ...parseUsageArgs(process.env.usage_args ?? '')], { stdio: 'inherit' })
"""

[tasks.buildAndTest]
description = "Build the harness, then run every *.unit.test.ts in its own node process"
run = ["mise run build", "mise run test:unit"]
