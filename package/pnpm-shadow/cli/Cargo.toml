[package]
name = "monochromatic-pnpm-shadow"
version = "0.1.2"
authors = ["Aquaticat"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/pnpm-shadow/cli"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["pnpm", "catalog", "shim", "package-json", "lint"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Shadows pnpm: before a command that resolves or changes dependencies it checks the workspace's package.json files for dependency versions that are not catalog: or workspace:*, warns on standard error, then runs the real pnpm unchanged. Never blocks."

# The artifact is deliberately not named `pnpm`: a `target/*/pnpm` or a tool `bin/pnpm` on PATH would shadow pnpm by accident.
# The repository's toolchain plan would link it as `pnpm` in a per-worktree directory, the way it links `cli-git-native` as `git`.
# cargo-binstall's default URL is {repo}/releases/download/v{version}/{name}-{target}-v{version}, but this
# repository tags each crate's release monochromatic-pnpm-shadow-v<version> and names the archive
# monochromatic-pnpm-shadow-<version>-<target>, so without this table cargo-binstall falls back to compiling.
# The archive holds the `pnpm-shadow` binary (the {bin} below), not a file named after the crate.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "pnpm_shadow"
path = "src/lib.rs"

[[bin]]
name = "pnpm-shadow"
path = "src/main.rs"

[dependencies]
# Owns the `pnpm-shadow` command grammar (`--help`, `--version`). Shadow mode never touches it:
# the arguments pnpm receives pass through untouched.
clap = { workspace = true, features = ["derive"] }

# Walks the workspace honoring `.gitignore`, so ignored directories (build output, vendored trees) are never read.
ignore = { workspace = true }

# The rule itself: bytes of one manifest in, findings out. The same crate backs the cli-git commit policy
# `mono/catalog-specifiers`, so the two can never disagree about what is allowed.
monochromatic-catalog-specifier = { path = "../../catalog-specifier/core-rust", version = "=0.1.1" }

[dev-dependencies]
# Disposable directories for the workspace and PATH fixtures.
tempfile = { workspace = true }

# Every pnpm run starts through this binary, so startup latency matters. A smaller, abort-on-panic,
# link-time-optimized binary starts fastest.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
clap = ">=4.6.7"
ignore = ">=0.4.34"
tempfile = ">=3.27.0"
