[tasks.run]
description = "Run wg-quicker"
run = "node src/index.ts"

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build wg-quicker, then run unit tests"
run = ["mise run build", "mise run test:unit"]

[tasks."test:integration:bypass"]
description = "Build wg-quicker, then verify bypass routing in a throwaway virtual machine"
run = ["mise run build", "mise run //package/wg/test-in-a-virtual-machine:run -- bypass"]

[tasks."test:integration:block"]
description = "Build wg-quicker and verify the traffic block with the real nft in a disposable user and network namespace"
run = ["mise run build", "node src/tunnel-traffic-block.integration.test.ts"]

[tasks."test:integration:route"]
description = "Build wg-quicker, then verify endpoint routing in a throwaway virtual machine"
run = ["mise run build", "mise run //package/wg/test-in-a-virtual-machine:run -- route"]
