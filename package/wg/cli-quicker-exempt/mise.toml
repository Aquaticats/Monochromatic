[tasks.build]
description = "Build the wg-quicker-exempt binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the wg-quicker-exempt binary in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy over the bin and tests"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."test:unit"]
description = "Run instruction and lifecycle unit tests through nextest"
run = "cargo nextest run"

[tasks."test:functional:protocols"]
description = "Run privileged disposable-cgroup protocol coverage in a throwaway virtual machine"
run = "mise run //package/wg/test-in-a-virtual-machine:run -- functional-protocols"

[tasks."test:functional"]
description = "Run every ignored test in a throwaway virtual machine, each as the caller it was written for"
run = "mise run //package/wg/test-in-a-virtual-machine:run -- functional"

[tasks.buildAndTest]
description = "Build wg-quicker-exempt and run its lints"
run = [
  "mise run build",
  "mise run test:unit",
  "mise run lint",
  "mise run lint:clippy",
  "mise run //:lint:monochromatic-lint -- package/wg/cli-quicker-exempt",
]
