[tasks.build]
description = "Build islands-black.jar for installing the plugin from disk."
run = "node src/build.ts"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"
[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the archive-helper bundle, then run the unit tests against it"
run = ["mise run build:js", "mise run test:unit"]
