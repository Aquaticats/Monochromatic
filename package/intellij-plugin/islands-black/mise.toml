[tasks.build]
description = "Build islands-black.jar for installing the plugin from disk."
run = "node src/build.ts"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"
[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"
depends = ["build"]

[tasks.test]
description = "Build the bundle the unit tests import, then run the whole unit suite"
run = ["mise run build:js", "mise run test:unit"]

[tasks.buildAndTest]
description = "Alias of test, under the name packages here use for a build-then-test run"
run = ["mise run test"]
