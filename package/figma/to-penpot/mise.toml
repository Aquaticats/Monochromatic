[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

# The suite imports the built bundle, so the artifact must exist before any test
# file loads; without this a fresh worktree's run fails on a missing dist file.
[tasks."test:unit"]
extends = "test:unit"
depends = ["//package/figma/to-penpot:build"]
