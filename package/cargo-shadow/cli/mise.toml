[tasks.build]
description = "Build the cargo-shadow binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the cargo-shadow binary in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy over the lib, bin and tests with warnings denied"
run = "cargo clippy --release --all-targets -- --deny warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.test]
description = "cargo nextest run --release where this host can give the tests a delegated control group; where it cannot (a container, a check that has no user manager) the same run names every test it had to leave out, with the reason and with the command that runs them, and counts none of them as a failure of cargo-shadow; the task takes no arguments (run `cargo nextest run --release <filter>` for a subset)"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawnSync } = await import('node:child_process')

// The one test whose whole body is the guard every test that needs a delegated control group begins with, so this answer comes from
// the code those tests use and no second copy of the route question can disagree with them.
const QUESTION = 'cgroup_probe_tests::probe_0_the_host_can_give_the_tests_a_delegated_scope'
const ACKNOWLEDGEMENT = 'CARGO_SHADOW_ALLOW_NO_CGROUP'
// The answer is a status and never a text: 0 when a scope can be had, 100 when this host has none, anything else when the question
// could not be asked at all (a build error, or a filter that names no test), which excuses nothing.
const NO_DELEGATED_CONTROL_GROUP = 100

// Nothing is acknowledged while the question is asked, so a host with a scope answers green and a host without one answers red with
// the reason the tests themselves would give.
const unacknowledged = { ...process.env }
delete unacknowledged[ACKNOWLEDGEMENT]
const asked = spawnSync('cargo', ['nextest', 'run', '--release', '-E', `test(=${QUESTION})`], { encoding: 'utf8', env: unacknowledged })
if (asked.status !== 0 && asked.status !== NO_DELEGATED_CONTROL_GROUP) {
  process.stderr.write((asked.stdout ?? '') + (asked.stderr ?? ''))
  console.error(`the test task could not ask ${QUESTION} whether this host can give the tests a delegated control group (status ${asked.status}); nothing was excused`)
  process.exit(asked.status ?? 1)
}

if (asked.status === 0) {
  // The gate as it always was, one failed window excepted: a test that needs a delegated control group and cannot find one fails
  // the run, and --no-fail-fast runs the rest anyway so one slow window does not hide the other eight hundred results.
  process.exit(spawnSync('cargo', ['nextest', 'run', '--release', '--no-fail-fast'], { stdio: 'inherit', env: unacknowledged }).status ?? 1)
}

// This host has none, so every test that needs one is excused and prints a line naming itself and the reason; --success-output=final
// brings the line of a passing test into the log, and what did not run then comes from the tests themselves, so no list of their names
// can go stale as tests are added.
const suite = spawnSync('cargo', ['nextest', 'run', '--release', '--no-fail-fast', '--success-output=final'], { stdio: 'inherit', env: { ...unacknowledged, [ACKNOWLEDGEMENT]: '1' } })
const reason = (asked.stderr ?? '').split('\n').map((line) => { return line.trim(); }).find((line) => { return line.includes('cannot give the test a delegated scope'); }) ?? ''
if (reason === '') {
  // The question answered 100 without the line this task quotes, so its own output is all there is to show.
  process.stderr.write((asked.stdout ?? '') + (asked.stderr ?? ''))
}
console.error(
  [
    '',
    'This host cannot give the tests a delegated control group.',
    reason === '' ? 'The reason is in the output of the question, printed above.' : `The reason, as the tests put it: ${reason}`,
    'Every test that needs one printed a SKIPPED line above, in this run: it did not run, so nothing it stands for was checked here,',
    'and none of those tests is a failure of cargo-shadow.',
    'They run where this account has a user manager on a cgroup v2 mount, for example inside a delegated scope of it:',
    '  systemd-run --user --scope --property=Delegate=yes -- mise run //package/cargo-shadow/cli:test',
    `Unsetting ${ACKNOWLEDGEMENT} turns each of those skips into a failure, which is what a gate wants where a scope can be had.`,
    '',
  ].join('\n'),
)
process.exit(suite.status ?? 1)
// mise appends extra task arguments to the end of this script, where they would be read as TypeScript, so this task takes no arguments.
'''

[tasks.package]
description = "Build and verify the crates.io package tarball"
run = "cargo package"

[tasks."publish:dry-run"]
description = "Package and verify, then abort before uploading to crates.io"
run = "cargo publish --dry-run"

[tasks.release]
description = "Start the cargo-shadow release on GitHub and print the run URL: `-- <from> <to> <note>` (quote the note; `--dry-run` first runs everything except the push and the publish). The crate-release workflow bumps the crate, checks, dry-runs the publish, pushes the bump to main and starts cargo-publish; nothing compiles here"
run = "node ../../crate-release/cli/bin/dispatch-release.ts --crate monochromatic-cargo-shadow"

[tasks."release:wait"]
description = "Follow the release run that `release` printed, then the cargo-publish run it started, then check crates.io and the GitHub release: `-- <run URL or id> <version>`"
run = "node ../../crate-release/cli/bin/await-release.ts --crate monochromatic-cargo-shadow"

[tasks.publish]
description = "Fallback local publish. Canonical path is .github/workflows/cargo-publish.yml (OIDC Trusted Publishing); the very first version of a crate must be published once with a personal API token (doc/runbook/publish-crate-first-time.md)."
run = "cargo publish"

[tasks."test:debug"]
description = "cargo nextest run in the debug profile (no LTO link), for the red-green loop; the release task stays the gate"
run = "cargo nextest run"
