[package]
name = "monochromatic-cargo-shadow"
version = "0.1.5-alpha.10"
authors = ["Aquaticat"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/cargo-shadow/cli"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["cargo", "catalog", "shim", "lockfile", "install"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Shadows cargo: before a command that resolves dependencies it makes the workspace's Cargo.lock satisfy its manifests under the rust-catalog.toml trust policy, then runs the real cargo unchanged. Also the Rust catalog CLI: install, update, verify."

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Declares the cfg name of `#[cfg_attr(dylint_lib = ..)]` suppressions, enforced by file-enforcer.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "cargo_shadow"
path = "src/lib.rs"

[[bin]]
name = "cargo-shadow"
path = "src/main.rs"

[dependencies]
# Owns the `cargo-shadow` command grammar (`install`, `update`, `verify`, `--help`, `--version`). Shadow mode never
# touches it: the arguments cargo receives pass through untouched.
clap = { workspace = true, features = ["derive"] }

# Reads Cargo.lock, Cargo.toml and rust-catalog.toml.
toml_edit = { workspace = true }

# Reads cargo metadata, toolchain.lock.json and the crates.io responses.
serde_json = { workspace = true }

# Reads the crates.io sparse index and web API for release age and publisher history.
ureq = { workspace = true, default-features = false, features = ["rustls"] }

# Parses and validates rust-catalog.toml, the one source of the release-age and trust settings.
monochromatic-dependency-catalog = { path = "../../dependency-catalog/core-native", version = "=0.2.1" }

# Reads the crates.io database dump (a gzip stream of a tar archive) without writing it to disk.
flate2 = { workspace = true }
tar = { workspace = true }

# Swaps two paths atomically (`renameat2` with `RENAME_EXCHANGE`) through a safe wrapper, so a lockfile restore can see what it
# displaced and undo the swap when that was another writer's file. Already in the lockfile through tempfile.
rustix = { workspace = true, features = ["fs", "process", "event"] }

# Keys the "already verified" cache of locked entries by a digest of the lockfile text, the way pnpm keys its lockfile-verification cache.
sha2 = { workspace = true }

[dev-dependencies]
# Disposable directories for the workspace and PATH fixtures.
tempfile = { workspace = true }

# Every cargo run starts through this binary, so startup latency matters.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]
# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
clap = ">=4.6.7"
flate2 = ">=1.1.11"
rustix = ">=1.1.6"
serde_json = ">=1.0.154"
sha2 = ">=0.11.1"
tar = ">=0.4.46"
tempfile = ">=3.27.0"
toml_edit = ">=0.25.19"
ureq = { version = ">=3.5.1", default-features = false }
