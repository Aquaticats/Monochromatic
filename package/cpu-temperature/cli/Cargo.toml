[package]
name = "monochromatic-cpu-temperature-cli"
version = "0.1.0"
license = "LGPL-3.0-or-later"
publish = false
description = "Live Linux CPU temperature control through hwmon and CPUFreq"
repository = "https://github.com/Aquaticats/Monochromatic.git"
edition = "2024"
readme = "README.md"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/cpu-temperature/cli"

[[bin]]
name = "set-max-cpu-temp"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tempfile = { workspace = true }

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
clap = ">=4.6.7"
tempfile = ">=3.27.0"
