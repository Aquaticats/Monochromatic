[package]
name = "browser-selector"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "A Slint picker for browsers and browser profiles on Linux"

[[bin]]
name = "monochromatic-browser-selector"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
gio = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
slint = { workspace = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-2"] }

[build-dependencies]
slint-build = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
anyhow = ">=1.0.104"
gio = ">=0.22.11"
rusqlite = ">=0.43.0"
serde_json = ">=1.0.154"
slint = { version = ">=1.18.1", default-features = false }
slint-build = ">=1.18.1"
tempfile = ">=3.27.0"
