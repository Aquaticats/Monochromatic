[tasks.build]
description = "Build the browser selector"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the browser selector with debug information"
run = "cargo build"

[tasks.lint]
description = "Check Rust, Slint, and the desktop entry"
run = ["cargo clippy --all-targets -- --deny warnings", "desktop-file-validate share/applications/monochromatic.browser-selector.desktop"]

[tasks.test]
description = "Run browser selector tests through nextest"
run = "cargo nextest run"

[tasks.install]
description = "Install the picker and register its per-user desktop entry"
depends = ["build"]
shell = "node --input-type=module-typescript -e"
run = '''
{{vars.desktop_paths}}
import { chmodSync, copyFileSync, mkdtempSync, readFileSync, renameSync, writeFileSync } from 'node:fs'

function installAtomically(destination: string, populate: (path: string) => void) {
  mkdirSync(dirname(destination), { recursive: true })
  const staging = mkdtempSync(join(dirname(destination), '.browser-selector-'))
  const stagedFile = join(staging, 'file')
  try {
    populate(stagedFile)
    renameSync(stagedFile, destination)
  } finally {
    rmSync(staging, { recursive: true, force: true })
  }
}

const metadata = JSON.parse(execFileSync('cargo', ['metadata', '--no-deps', '--format-version', '1'], { encoding: 'utf8' }))
const builtBinary = join(metadata.target_directory, 'release', binaryName)
const template = readFileSync(join('share', 'applications', desktopName), 'utf8')
// Desktop entries first unescape the value, then parse quoted arguments and expand field codes.
function desktopArgument(value: string) {
  const escaped = value
    .replaceAll('\\', '\\\\\\\\')
    .replaceAll(String.fromCharCode(96), '\\\\' + String.fromCharCode(96))
    .replaceAll('$', '\\\\$')
    .replaceAll('"', '\\\\"')
    .replaceAll('%', '%%')
    .replaceAll('\n', '\\n')
    .replaceAll('\r', '\\r')
    .replaceAll('\t', '\\t')
  return '"' + escaped + '"'
}

// GIO checks the first executable before expanding field codes. The shell receives a fixed
// script, with the binary and the incoming target supplied as individual arguments.
const launcher = '/bin/sh -c ' + desktopArgument('exec "$@"') + ' browser-selector ' + desktopArgument(binaryPath)
const desktopEntry = template.replace('Exec=' + binaryName, () => 'Exec=' + launcher)

installAtomically(binaryPath, path => {
  copyFileSync(builtBinary, path)
  chmodSync(path, 0o755)
})
installAtomically(desktopPath, path => writeFileSync(path, desktopEntry))
refreshDesktopDatabase()
'''

[tasks.uninstall]
description = "Remove the picker and its per-user desktop entry"
shell = "node --input-type=module-typescript -e"
run = '''
{{vars.desktop_paths}}
import { existsSync } from 'node:fs'

rmSync(desktopPath, { force: true })
if (existsSync(dirname(desktopPath))) {
  refreshDesktopDatabase()
}
rmSync(binaryPath, { force: true })
'''
[env]
# The picker uses stable markup and does not need the repository-wide experimental feature setting.
SLINT_ENABLE_EXPERIMENTAL_FEATURES = ""

[vars]
desktop_paths = '''
import { execFileSync } from 'node:child_process'
import { mkdirSync, rmSync } from 'node:fs'
import { homedir } from 'node:os'
import { dirname, isAbsolute, join } from 'node:path'

const home = homedir()
const configuredData = process.env.XDG_DATA_HOME ?? ''
const dataHome = isAbsolute(configuredData) ? configuredData : join(home, '.local', 'share')
const binaryName = 'monochromatic-browser-selector'
const desktopName = 'monochromatic.browser-selector.desktop'
const binaryPath = join(home, '.local', 'bin', binaryName)
const desktopPath = join(dataHome, 'applications', desktopName)

function refreshDesktopDatabase() {
  execFileSync('update-desktop-database', [dirname(desktopPath)], { stdio: 'inherit' })
}
'''
