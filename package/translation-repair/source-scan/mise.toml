[tasks."source-scans"]
description = "Ledger M59: build, then run every unit test that reads the whole of src or the docs (message inventory, dead code, unused imports, duplicate bodies, TSDoc examples, fixed-length cuts, clock times, task-list numbers, living-doc links, log roots, position references, kept caught errors, caught values turned into text, readers of a provider reply excerpt, exported names, stated floor inputs, text accumulators, number reads, fold copies, rendered-sheet census, directory listings, command-line reads, text-keyed tables, map writes over an unread key, wall-clock reads, process-global writes, locale and code-unit orderings, record checks, class identity across bundled packages, TSDoc attachment, count nouns, top-level suites, blank-line splits, own unit tests, test temp directories, trailing whitespace, dead test declarations, silent test cases, children of tests, children of production code, the reach of the start guard, blank-text tests, unseen characters, escaped backticks in comments, scan comparisons that cut what they found, Promise combinators, real-clock bounds in tests, schema property order, Markdown lint findings in the living docs), which fail on a new class, function, export, link, sheet, command-line read, text-keyed table, map write over a key its function never reads with no allowance saying what makes the key unique, wall-clock read, unsequenced process-global write, locale-dependent or code-unit ordering, comparator that cannot answer zero, check for an object written beside isJsonRecord, TSDoc block that documents nothing, count printed before a fixed plural, second top-level awaited describe in a test file, search or split on a blank line, production module with neither a unit test of its own nor an allowlist line, test directory made outside scratchDir or not bound where it is made, line ending in whitespace outside a template's text, top-level test declaration nothing reads, test case that prints no pass line, test file or fixture that starts a child process outside the fixture that removes every key from the child's environment, production start of a child process without the environment that removes every key and every setting, task that starts a built command without naming that command to the start guard, built command with no task, entry file that hands the start guard no environment, caught value turned into text whole outside the functions held with a reason, read of a provider status failure body excerpt outside the files named with a reason, Promise combinator called in production code outside allInInputOrder's own call and the sites listed with a reason or reached other than by a plain named call (Promise aliased, destructured, read by a computed key or off the global object, a member named Promise or constructor read, a combinator's name read off anything but Promise), combinator call in a function with no name or in one whose name another function of its file carries, listed combinator site holding more or fewer calls than listed or reason the source no longer holds, or test of whether a text is blank made by an empty-string comparison, a trimmed length or a string's length outside the named ones, character a reader cannot see written literally, or comment that writes a backtick with a backslash before it, or scan whose package-wide case compares through toEqual or toStrictEqual rather than a helper that names what differs, or bound a test or fixture sets on the real clock other than the shared hang stop and not listed with its class and reason, or listed bound or deferred file the source no longer holds, or class tested with instanceof (or a .constructor comparison) that is imported from a workspace package the importing package does not keep external, so its dist bundles a copy the real instances are not instances of, or answer schema whose properties are declared out of alphabetical order (ledger B762: Charm Hyper returns a tool call's keys alphabetically, so only an order that is also alphabetical holds on every provider), or Markdown lint finding the repository's Markdown linter makes in the package docs, the living repository-level docs or the package split plan, that its own test files never see; run beside the named tests of every commit touching the package's source, docs, README or task file, since the clock-time, task-list-number, living-doc-link and position-reference scans read the docs too; SPENDS NO QUOTA"
# The scans load these packages by their built entries, so they build first; the Markdown lint scan starts its child through the adjudication keyless fixture, which loads that package's built entry.
depends = ["//package/translation-repair/document-structure:build", "//package/translation-repair/markup:build", "//package/translation-repair/run:build", "//package/translation-repair/typography:build", "//package/translation-repair/adjudication:build"]
run = "mise run test:unit src/message-names-only.unit.test.ts src/dead-code.unit.test.ts src/duplicate-bodies.unit.test.ts src/tsdoc-example-scan.unit.test.ts src/fixed-length-cuts.unit.test.ts src/clock-time-zones.unit.test.ts src/task-list-numbers.unit.test.ts src/living-doc-links.unit.test.ts src/log-root-scan.unit.test.ts src/position-references.unit.test.ts src/caught-errors-kept.unit.test.ts src/caught-value-text.unit.test.ts src/body-excerpt-readers.unit.test.ts src/exported-function-names.unit.test.ts src/floor-inputs-stated.unit.test.ts src/text-accumulators.unit.test.ts src/number-reads.unit.test.ts src/fold-copies.unit.test.ts src/rendered-sheets-census.unit.test.ts src/unused-imports.unit.test.ts src/directory-listing-scan.unit.test.ts src/command-line-reads.unit.test.ts src/text-keyed-tables.unit.test.ts src/blind-map-writes.unit.test.ts src/wall-clock-reads.unit.test.ts src/global-writes-sequenced.unit.test.ts src/locale-orderings.unit.test.ts src/record-checks.unit.test.ts src/tsdoc-attachment.unit.test.ts src/count-nouns.unit.test.ts src/multi-suite-top-level.unit.test.ts src/blank-line-splits.unit.test.ts src/own-unit-tests.unit.test.ts src/temp-dirs-scratch.unit.test.ts src/trailing-whitespace.unit.test.ts src/dead-test-declarations.unit.test.ts src/silent-test-cases.unit.test.ts src/test-children-keyless.unit.test.ts src/production-children-keyless.unit.test.ts src/task-runner-guard-reach.unit.test.ts src/blank-text-tests.unit.test.ts src/literal-unseen-characters.unit.test.ts src/comment-escaped-backticks.unit.test.ts src/scan-direct-comparisons.unit.test.ts src/promise-combinators-in-order.unit.test.ts src/real-clock-bounds.unit.test.ts src/schema-property-order.unit.test.ts src/bundled-class-identity.unit.test.ts src/markdown-lint-clean.unit.test.ts"

[tasks."test:rotation-sweep"]
description = "Ledger B701: run every unit test file of every package that can reach the stage package once per salt 0 to 9, each salt moving the start of benchRotation by that many seats through a loader (no production source reads the environment), and list the cases a salt fails that salt 0 passes, naming the case, its file and the salts; exit non-zero if any; COSTS ten full runs of the family's unit tests (minutes to tens of minutes), so run it before a sheet text change lands and in the readiness pre-launch checks, never per commit; SPENDS NO QUOTA; narrow it with --package <directory> and --salt <n> (each repeatable) after --"
# The sweep loads every package by its built entry, so they build first.
depends = ["//package/translation-repair/adjudication:build:js:node", "//package/translation-repair/archive:build:js:node", "//package/translation-repair/artifact:build:js:node", "//package/translation-repair/artifact-pool:build:js:node", "//package/translation-repair/assembly:build:js:node", "//package/translation-repair/bench:build:js:node", "//package/translation-repair/consistency:build:js:node", "//package/translation-repair/consolidate:build:js:node", "//package/translation-repair/corpus-pass:build:js:node", "//package/translation-repair/corpus-source:build:js:node", "//package/translation-repair/coverage-census:build:js:node", "//package/translation-repair/insertion:build:js:node", "//package/translation-repair/lane-contest:build:js:node", "//package/translation-repair/page-check:build:js:node", "//package/translation-repair/page-pass:build:js:node", "//package/translation-repair/probe:build:js:node", "//package/translation-repair/reference:build:js:node", "//package/translation-repair/rendering-audit:build:js:node", "//package/translation-repair/repair:build:js:node", "//package/translation-repair/run:build:js:node", "//package/translation-repair/slice-cache:build:js:node", "//package/translation-repair/slice-reading:build:js:node", "//package/translation-repair/stage:build:js:node", "//package/translation-repair/translate-floor:build:js:node", "//package/translation-repair/translate-lane:build:js:node", "//package/translation-repair/translate-stage:build:js:node"]
