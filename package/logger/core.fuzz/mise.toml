# Named `bundle:*`, not `build:*`: this sidecar ships nothing, and the browser
# property bundle is test tooling loaded by the Playwright harness page. A
# `build` task would mark the package as shipping an artifact, and the
# require-eventual-artifact lint would then reject every relative helper import
# in the test files here.
[tasks."bundle:browser-properties"]
description = "Bundle the browser property layer (fast-check, the neutral logger artifact, the properties) for the Playwright harness page"
extends = "build:js:client"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.fuzz]
description = "Build module-logger, then run *.property.unit.test.ts as a time-budgeted fast-check campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
// Property files import the built module-logger entry points, so the runtime
// package's dist must be fresh before any property runs; rebuild it first to
// avoid chasing a bug the stale artifact has not yet seen fixed.
execFileSync('mise', ['run', '//package/logger/core:build'], { stdio: 'inherit' })
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, LOGGER_FUZZ_BUDGET_MS: budget } })
}
"""

[tasks."fuzz:coverage"]
description = "Deterministic V8 line-coverage reachability gate over the module-logger runtime src; --write refreezes the baseline"
usage = '''
flag "--write" help="Refreeze the committed baseline from this run instead of checking against it"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdtempSync, rmSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const root = process.cwd()
const mode = (process.env.usage_write === 'true') ? 'write' : 'check'
// The driver imports the module-logger package source through its `/ts` subpath,
// so no build step is needed; the report projects coverage onto the runtime
// package's src files (resolved through the same subpath), never this sidecar.
// `--localstorage-file` gives the process a real localStorage so that sink
// elects and its store paths run instead of the flagless short-circuit.
const dir = mkdtempSync(join(tmpdir(), 'logger-cov-'))
try {
  execFileSync('node', ['--localstorage-file', join(dir, 'localstorage.sqlite'), `${root}/src/coverage-driver.ts`], { stdio: 'inherit', env: { ...process.env, NODE_V8_COVERAGE: join(dir, 'v8') } })
  execFileSync('node', [`${root}/src/coverage-report.ts`, mode, join(dir, 'v8'), `${root}/coverage-baseline.json`], { stdio: 'inherit' })
} finally {
  rmSync(dir, { recursive: true, force: true })
}
"""
