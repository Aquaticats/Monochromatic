[tasks.build]
description = "Build the published font files; the pnpr publish job runs this task (#535)"
run = [{ tasks = ["build:font"] }]

[tasks."build:font"]
description = "Build Aquaticat font from SVG glyphs"
run = "node src/build-font.ts"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"
