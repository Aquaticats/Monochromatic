[tasks.build]
description = "Bundle client JS, build the unit suites' testing entry, then generate self-contained HTML"
run = ["mise run build:js:client", "mise run build:js:node", "node src/build.ts"]

[tasks."format:fonts"]
description = "Subset fonts-source/inter.woff2 to public/inter.woff2 based on glyph usage in src/. Run manually after adding non-ASCII page text."
run = "node src/subset-fonts.ts"

[tasks."build:js:client"]
extends = "build:js:client"

# The site builds no Node entry of its own; this one exists so the unit suites import
# built output instead of sibling source.
[tasks."build:js:node"]
extends = "build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"
[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"
depends = ["build:js:node"]
