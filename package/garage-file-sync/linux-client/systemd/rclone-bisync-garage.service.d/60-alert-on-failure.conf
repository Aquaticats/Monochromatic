[Unit]
# Any failed run (non-zero exit, timeout, launch failure) raises a desktop alert.
# A name the local disk refuses makes bisync abort, and every later run fails until
# a --resync, so without this the sync stops silently.
OnFailure=rclone-bisync-garage-alert@%n.service
# A run that exits with status 0 closes the alert streak with one recovery notice.
# The handler asks MONITOR_* whether the run exited with status 0 and stays silent
# otherwise. A run stopped by hand is not a success: measured under systemd 262 on this
# PC (2026-11-25), stopping a running oneshot ends it in Result=signal, so OnFailure=
# handles it. Added in systemd 249.
# Its handler is a separate template from the OnFailure= one: a handler named by both makes
# systemd 262 skip the MONITOR_* variables (measured, 2026-11-25).
OnSuccess=rclone-bisync-garage-recovered@%n.service
