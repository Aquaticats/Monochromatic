[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"
depends = ["build"]

# The suite spans one file per numeric category. Each imports the bare package name, so
# the neutral bundle the build writes has to exist first; the root unit glob runs these
# same files for callers who never ask for this package task.
[tasks.test]
description = "Run every numeric-format unit test file against the built neutral bundle"
run = "mise run test:unit"
