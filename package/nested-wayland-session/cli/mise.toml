[tasks."inspect:clipboard"]
depends = ["build"]
description = "Verify nested clipboard text, binary data, replacement, and clearing without host clipboard access"
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const client = async () => {
  const { spawn, spawnSync } = await import('node:child_process')
  const { once } = await import('node:events')
  const { setTimeout: wait } = await import('node:timers/promises')
  const { default: assert } = await import('node:assert/strict')
  assert(process.env.WAYLAND_DISPLAY)
  assert.notEqual(process.env.WAYLAND_DISPLAY, process.argv[1])
  assert.equal(process.env.WAYLAND_SOCKET, undefined)
  assert.equal(process.env.DISPLAY, undefined)
  assert.equal(process.env.XAUTHORITY, undefined)
  const primary = spawnSync('wl-paste', ['--primary', '--list-types'], { timeout: 1000 })
  assert.equal(primary.status, 1)
  assert.match(primary.stderr.toString(), /does not seem to support primary selection/)
  const fixtures = [
    { mime: 'text/plain;charset=utf-8', bytes: Buffer.from('Nested clipboard: 猫 é') },
    { mime: 'application/octet-stream', bytes: Buffer.from([0, 1, 127, 128, 255, 10]) },
    { mime: 'application/octet-stream', bytes: Buffer.alloc(2 * 1024 * 1024, 0xa5), abrupt: true },
  ]
  for (const fixture of fixtures) {
    const producer = spawn('wl-copy', ['--foreground', '--type', fixture.mime], { stdio: ['pipe', 'ignore', 'pipe'] })
    const exited = once(producer, 'exit')
    const errors = []
    producer.stderr.on('data', chunk => errors.push(chunk))
    const deadline = setTimeout(() => producer.kill(), 5000)
    producer.stdin.end(fixture.bytes)
    try {
      let transferred = false
      const started = performance.now()
      for (let attempt = 0; attempt < 30 && performance.now() - started < 3000; attempt++) {
        const result = spawnSync('wl-paste', ['--no-newline', '--type', fixture.mime], {
          env: { ...process.env, WAYLAND_DEBUG: 'client' }, timeout: 500, maxBuffer: 4 * 1024 * 1024,
        })
        if (result.status === 0) {
          assert.deepEqual(result.stdout, fixture.bytes)
          const protocol = result.stderr.toString()
          assert(protocol.includes('zwlr_data_control_manager_v1'))
          assert(protocol.includes('ext_data_control_manager_v1'))
          transferred = true
          break
        }
        await wait(20)
      }
      assert(transferred, 'nested clipboard did not serve ' + fixture.mime)
      if (fixture.abrupt) {
        producer.kill('SIGKILL')
      } else {
        const cleared = spawnSync('wl-copy', ['--clear'], { timeout: 1000 })
        assert.equal(cleared.status, 0)
      }
      const [code, signal] = await exited
      assert.equal(code, fixture.abrupt ? null : 0, 'clipboard source must reach the expected shutdown state')
      assert.equal(signal, fixture.abrupt ? 'SIGKILL' : null)
      const empty = spawnSync('wl-paste', ['--list-types'], { timeout: 1000 })
      assert.equal(empty.status, 1)
      assert.match(empty.stderr.toString(), /Nothing is copied/)
      assert.equal(Buffer.concat(errors).length, 0, 'clipboard source shutdown must not emit errors')
      console.log('Nested clipboard verified: ' + fixture.mime + ', ' + fixture.bytes.length + ' bytes, ' + (fixture.abrupt ? 'abrupt owner disconnect' : 'clear and clean source exit'))
    } finally {
      clearTimeout(deadline)
      if (producer.exitCode === null && producer.signalCode === null) producer.kill()
      await exited
    }
  }
}
execFileSync('./target/release/monochromatic-nested-wayland-session', [
  '--size', '480x320', '--', 'node', '--input-type=module', '-e',
  'await (' + client.toString() + ')()', '--', process.env.WAYLAND_DISPLAY ?? '',
], { stdio: 'inherit' })
"""

[tasks."inspect:color-scheme"]
depends = ["build"]
description = "Verify the runtime color-scheme switch on the private bus with a bus monitor, a Slint client, screenshots, and a decoy session bus"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn, spawnSync } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync, writeFileSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { setTimeout: wait } = await import('node:timers/promises')
const { default: assert } = await import('node:assert/strict')
// Runs inside the nested session as the hosted command.
const client = async () => {
{{vars.slint_scheme_probe}}
  const [hostDisplay, decoyAddress, socketPath, evidence] = process.argv.slice(1)
  const privateAddress = process.env.DBUS_SESSION_BUS_ADDRESS ?? String()
  assert(process.env.WAYLAND_DISPLAY)
  assert.notEqual(process.env.WAYLAND_DISPLAY, hostDisplay)
  assert.equal(process.env.DISPLAY, undefined)
  assert.match(privateAddress, /monochromatic-nested-wayland-session-/)
  assert.notEqual(privateAddress, decoyAddress)
  assert.equal(process.env.DBUS_STARTER_ADDRESS, undefined)
  const portal = ['--session', '--dest', 'org.freedesktop.portal.Desktop', '--object-path', '/org/freedesktop/portal/desktop']
  const served = () => {
    const result = spawnSync('gdbus', ['call', ...portal, '--method', 'org.freedesktop.portal.Settings.ReadOne', 'org.freedesktop.appearance', 'color-scheme'], { timeout: 3000 })
    assert.equal(result.status, 0, result.stderr.toString())
    return result.stdout.toString().trim()
  }
  // Bus-level observer: every signal the private portal emits, in order.
  const monitor = spawn('gdbus', ['monitor', ...portal], { stdio: ['ignore', 'pipe', 'inherit'] })
  const monitorOutput = []
  monitor.stdout.on('data', chunk => monitorOutput.push(chunk))
  const monitored = () => Buffer.concat(monitorOutput).toString()
  const signals = () => monitored().split('\n').filter(line => line.includes('SettingChanged'))
  // Mean luminance of one background pixel in the last frame of a short recording.
  const frame = async name => {
    const directory = join(evidence, 'frames-' + name)
    mkdirSync(directory)
    assert.equal(await control(socketPath, 'record ' + directory + ' 20 bmp'), 'ok')
    await wait(500)
    assert.match(await control(socketPath, 'record stop'), /^ok captured=/)
    const bytes = readFileSync(join(directory, readdirSync(directory).sort().at(-1)))
    const pixel = bytes.readUInt32LE(10) + 4 * 9
    return (bytes[pixel] + bytes[pixel + 1] + bytes[pixel + 2]) / 3
  }
  const empty = await screenshot(socketPath, evidence, 'empty')
  // Toolkit-level observer: Slint reports each Palette.color-scheme value it applies.
  const viewer = startViewer(evidence)
  const { seen } = viewer
  try {
    await until('the bus monitor to attach', () => monitored().includes('Monitoring signals'))
    await until('Slint to apply the startup scheme', () => seen().at(-1) === 'dark')
    assert.equal(served(), '(<uint32 1>,)')
    const startup = seen().length

    // Phase one never records, so each screenshot shows only what the client committed unprompted.
    await firstFrame(socketPath, evidence, empty)
    await wait(settle)
    const darkShot = await screenshot(socketPath, evidence, 'dark')
    // Negative control: the value already served changes nothing and emits nothing.
    assert.equal(await control(socketPath, 'color-scheme dark'), 'ok unchanged')
    // Positive control: a real change reaches the bus monitor and the toolkit.
    assert.equal(await control(socketPath, 'color-scheme light'), 'ok changed')
    await until('Slint to apply light', () => seen().at(-1) === 'light')
    await until('the light signal', () => signals().length >= 1)
    assert.equal(served(), '(<uint32 2>,)')
    await wait(settle)
    const lightShot = await screenshot(socketPath, evidence, 'light')
    assert.notEqual(lightShot, darkShot, 'screenshot did not change after the switch to light')

    assert.equal(await control(socketPath, 'color-scheme light'), 'ok unchanged')
    assert.equal(await control(socketPath, 'color-scheme dark'), 'ok changed')
    await until('Slint to apply dark again', () => seen().length === startup + 2 && seen().at(-1) === 'dark')
    await until('the dark signal', () => signals().length >= 2)
    assert.equal(served(), '(<uint32 1>,)')
    await wait(settle)
    const darkAgainShot = await screenshot(socketPath, evidence, 'dark-again')
    assert.notEqual(darkAgainShot, lightShot, 'screenshot did not change after the switch back to dark')
    assert.equal(darkAgainShot, darkShot, 'the first dark screenshot was not the frame the client shows for dark')

    // Signals arrive in order, so exactly these two prove both unchanged requests emitted nothing.
    assert.deepEqual(signals().map(line => line.replace(/^.*SettingChanged /, String())), [
      "('org.freedesktop.appearance', 'color-scheme', <uint32 2>)",
      "('org.freedesktop.appearance', 'color-scheme', <uint32 1>)",
    ])
    assert.deepEqual(seen().slice(startup), ['light', 'dark'])
    assert.match(await control(socketPath, 'color-scheme system'), /^err color-scheme value must be dark or light/)

    // Phase two reads pixels from recorded frames, an independent capture path.
    const darkLuminance = await frame('dark')
    assert(darkLuminance < 96, 'dark frame luminance ' + darkLuminance)
    assert.equal(await control(socketPath, 'color-scheme light'), 'ok changed')
    await until('Slint to apply light again', () => seen().at(-1) === 'light')
    const lightLuminance = await frame('light')
    assert(lightLuminance > 160, 'light frame luminance ' + lightLuminance)

    writeFileSync(join(evidence, 'private-bus-monitor.log'), monitored())
    writeFileSync(join(evidence, 'slint-seen.log'), viewer.reported())
    console.log('Slint observed: ' + seen().join(' -> '))
    console.log('Private bus signals: ' + signals().length + '; the two unchanged requests emitted none')
    console.log('Screenshots without recording: dark ' + darkShot.slice(0, 12) + ', light ' + lightShot.slice(0, 12) + ', dark ' + darkAgainShot.slice(0, 12))
    console.log('Recorded frame luminance: dark ' + darkLuminance + ', light ' + lightLuminance)
  } finally {
    monitor.kill()
    await viewer.stop()
  }
}
const evidence = mkdtempSync(join(tmpdir(), 'nested-color-scheme-'))
const socketPath = join(evidence, 'control.sock')
// A disposable decoy stands in for the host session bus in the compositor's own environment.
const decoyAddress = 'unix:path=' + join(evidence, 'decoy-bus')
const decoy = spawn('dbus-daemon', ['--session', '--nofork', '--nopidfile', '--nosyslog', '--print-address=1', '--address=' + decoyAddress], { stdio: ['ignore', 'pipe', 'inherit'] })
let failure
try {
  await once(decoy.stdout, 'data')
  const watcher = spawn('dbus-monitor', ['--address', decoyAddress], { stdio: ['ignore', 'pipe', 'inherit'] })
  const watcherOutput = []
  watcher.stdout.on('data', chunk => watcherOutput.push(chunk))
  const watched = () => Buffer.concat(watcherOutput).toString()
  const untilWatched = async text => {
    const started = performance.now()
    while (!watched().includes(text) && performance.now() - started < 3000) await wait(25)
    assert(watched().includes(text), 'decoy session bus watcher did not report ' + text)
  }
  try {
    await untilWatched('NameAcquired')
    const session = spawn('./target/release/monochromatic-nested-wayland-session', [
      '--size', '640x240', '--socket', socketPath, '--color-scheme', 'dark', '--',
      'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--',
      process.env.WAYLAND_DISPLAY ?? String(), decoyAddress, socketPath, evidence,
    ], { stdio: 'inherit', env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: decoyAddress } })
    const [code] = await once(session, 'exit')
    assert.equal(code, 0, 'nested color-scheme client failed')
    // Positive control: the watcher must see a deliberate environment-addressed connection.
    const sentinel = spawnSync('dbus-send', ['--session', '--type=signal', '/sentinel', 'org.example.Sentinel.Ping'], {
      timeout: 3000, env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: decoyAddress },
    })
    assert.equal(sentinel.status, 0, sentinel.stderr.toString())
    await untilWatched('member=Ping')
    writeFileSync(join(evidence, 'decoy-session-bus.log'), watched())
    // Every connection must call Hello first, so one Hello before the sentinel signal is the sentinel itself.
    const beforeSentinel = watched().slice(0, watched().indexOf('member=Ping'))
    assert.equal(beforeSentinel.split('member=Hello').length - 1, 1,
      'something other than the sentinel connected to the decoy session bus')
    assert(!watched().includes('SettingChanged'), 'a SettingChanged signal reached the decoy session bus')
    console.log('Decoy session bus saw only the sentinel connection; no portal traffic left the private bus')
  } finally {
    watcher.kill()
  }
} catch (error) {
  failure = error
} finally {
  decoy.kill()
}
console.log('Evidence: ' + evidence)
if (failure) throw failure
console.log('Nested runtime color-scheme switch verified')
'''

[tasks."inspect:stalled-parent"]
depends = ["build"]
description = "Verify screenshots stay current while a parent compositor withholds frame callbacks, by hosting one session inside another"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { default: assert } = await import('node:assert/strict')
// Runs inside the inner session as its hosted command.
const client = async () => {
{{vars.slint_scheme_probe}}
  const [outerSocket, innerSocket, evidence] = process.argv.slice(1)
  const empty = await screenshot(innerSocket, evidence, 'empty')
  const viewer = startViewer(evidence)
  const { seen } = viewer
  const switchTo = async (value, count) => {
    assert.equal(await control(innerSocket, 'color-scheme ' + value), 'ok changed')
    await until('Slint to apply ' + value, () => seen().length === count && seen().at(-1) === value)
    await wait(settle)
  }
  let recording = false
  try {
    await until('Slint to apply the startup scheme', () => seen().at(-1) === 'dark')
    const startup = seen().length
    await firstFrame(innerSocket, evidence, empty)
    await wait(settle)
    // One frame every ten seconds: the outer session now withholds frame callbacks from the
    // inner one, which is what a locked or hidden host window does to a single session.
    const frames = join(evidence, 'outer-frames')
    mkdirSync(frames)
    assert.equal(await control(outerSocket, 'record ' + frames + ' 0.1 bmp'), 'ok')
    recording = true
    const starved = performance.now()
    await wait(600)
    const dark = await screenshot(innerSocket, evidence, 'starved-dark')
    await switchTo('light', startup + 1)
    const light = await screenshot(innerSocket, evidence, 'starved-light')
    await switchTo('dark', startup + 2)
    const darkAgain = await screenshot(innerSocket, evidence, 'starved-dark-again')
    await switchTo('light', startup + 3)
    const lightAgain = await screenshot(innerSocket, evidence, 'starved-light-again')
    const elapsed = Math.round(performance.now() - starved)
    assert(elapsed < 8000, 'the starved phase outlived one outer recording period: ' + elapsed + ' ms')
    console.log('Starved screenshots: dark ' + dark.slice(0, 12) + ', light ' + light.slice(0, 12)
      + ', dark ' + darkAgain.slice(0, 12) + ', light ' + lightAgain.slice(0, 12) + ' in ' + elapsed + ' ms')
    // A client may still draw its first change unprompted; the later ones need frame callbacks.
    assert.notEqual(light, dark, 'inner screenshot did not change after the first switch')
    assert.equal(darkAgain, dark, 'inner screenshot is stale after the second switch')
    assert.equal(lightAgain, light, 'inner screenshot is stale after the third switch')
  } finally {
    if (recording) await control(outerSocket, 'record stop')
    await viewer.stop()
  }
}
const binary = './target/release/monochromatic-nested-wayland-session'
const evidence = mkdtempSync(join(tmpdir(), 'nested-stalled-parent-'))
const outerSocket = join(evidence, 'outer.sock')
const innerSocket = join(evidence, 'inner.sock')
const session = spawn(binary, [
  '--size', '640x240', '--socket', outerSocket, '--',
  binary, '--size', '640x240', '--socket', innerSocket, '--color-scheme', 'dark', '--',
  'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--',
  outerSocket, innerSocket, evidence,
], { stdio: 'inherit' })
const [code] = await once(session, 'exit')
console.log('Evidence: ' + evidence)
assert.equal(code, 0, 'the inner session did not keep its client current while its parent withheld frames')
console.log('Hosted client stays current while the parent compositor withholds frame callbacks')
'''

[tasks."inspect:scale"]
depends = ["build"]
description = "Verify --scale and the runtime scale command with a Slint client: reported scale, protocol events, screenshot size, rendered geometry, and click coordinates"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync, mkdirSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { default: assert } = await import('node:assert/strict')
// Runs inside the nested session as the hosted command.
const client = async () => {
{{vars.slint_scheme_probe}}
  const [socketPath, evidence, phase] = process.argv.slice(1)
  const logical = phase === 'runtime' ? { width: 640, height: 360 } : { width: 400, height: 300 }
  // The scene reports the scale Slint applies (one logical pixel in physical pixels), its logical
  // size, and every click position in logical pixels. The top-left quadrant is yellow on blue.
  // slint-viewer attaches --on handlers after `init` runs, so a one-shot timer reports the start.
  const scene = join(evidence, 'scale-scene.slint')
  writeFileSync(scene, [
    'export component Scene inherits Window {',
    '    callback scale-seen(float);',
    '    callback size-seen(float, float);',
    '    callback clicked-at(float, float);',
    '    property <float> scale: 1px / 1phx;',
    '    Timer {',
    '        interval: 50ms;',
    '        triggered => { root.scale-seen(root.scale); root.size-seen(root.width / 1px, root.height / 1px); self.running = false; }',
    '    }',
    '    changed scale => { root.scale-seen(root.scale); }',
    '    changed width => { root.size-seen(root.width / 1px, root.height / 1px); }',
    '    changed height => { root.size-seen(root.width / 1px, root.height / 1px); }',
    '    background: #204060;',
    '    Rectangle { x: 0px; y: 0px; width: root.width / 2; height: root.height / 2; background: #e0c040; }',
    '    TouchArea { clicked => { root.clicked-at(self.mouse-x / 1px, self.mouse-y / 1px); } }',
    '}',
    '',
  ].join('\n'))
  // WAYLAND_DEBUG makes the client's Wayland library print every event it receives on stderr.
  const viewer = spawn('slint-viewer', [
    '--on', 'scale-seen', 'echo scale-seen $1',
    '--on', 'size-seen', 'echo size-seen $1 $2',
    '--on', 'clicked-at', 'echo clicked-at $1 $2',
    scene,
  ], { stdio: ['ignore', 'pipe', 'pipe'], env: { ...process.env, WAYLAND_DEBUG: 'client' } })
  const output = []
  const protocol = []
  viewer.stdout.on('data', chunk => output.push(chunk))
  viewer.stderr.on('data', chunk => protocol.push(chunk))
  const reported = kind => Buffer.concat(output).toString().split('\n')
    .filter(line => line.startsWith(kind + ' ')).map(line => line.slice(kind.length + 1).split(' ').map(Number))
  const scales = () => reported('scale-seen').map(values => values[0])
  const clicks = () => reported('clicked-at')
  const events = pattern => [...Buffer.concat(protocol).toString().matchAll(pattern)].map(match => Number(match[1]))
  // Consecutive duplicates collapse, so the sequences read as changes.
  const changes = values => values.filter((value, index) => index === 0 || values[index - 1] !== value)
  const near = (actual, expected) => Math.abs(actual - expected) < 0.01
  // PNG stores width and height as big-endian words at bytes 16 and 20.
  const pngSize = name => {
    const bytes = readFileSync(join(evidence, name + '.png'))
    return [bytes.readUInt32BE(16), bytes.readUInt32BE(20)]
  }
  // The green channel of a few points in the last frame recorded into a directory.
  const lastFrameGreens = (directory, points) => {
    const bytes = readFileSync(join(directory, readdirSync(directory).sort().at(-1)))
    const offset = bytes.readUInt32LE(10)
    const width = bytes.readInt32LE(18)
    const height = bytes.readInt32LE(22)
    assert.equal(bytes.readUInt16LE(28), 32, 'recorded frames are 32-bit')
    // A positive height stores rows bottom-up; the green byte is second in either channel order.
    return points.map(([x, y]) => {
      const row = height > 0 ? Math.abs(height) - 1 - y : y
      return bytes[offset + (row * width + x) * 4 + 1]
    })
  }
  // The same points in the last frame of a short BMP recording made now.
  const greens = async (name, points) => {
    const directory = join(evidence, 'frames-' + name)
    mkdirSync(directory)
    assert.equal(await control(socketPath, 'record ' + directory + ' 20 bmp'), 'ok')
    await wait(400)
    assert.match(await control(socketPath, 'record stop'), /^ok captured=/)
    return lastFrameGreens(directory, points)
  }
  // Physical size the protocol prescribes: logical size times scale, rounded half away from zero.
  const physical = scale => [Math.round(logical.width * scale), Math.round(logical.height * scale)]
  // Checks one scale: client report, framebuffer size, client geometry, and click mapping.
  const check = async (scale, name) => {
    await until('Slint to apply scale ' + scale, () => near(scales().at(-1) ?? 0, scale))
    await wait(settle)
    await screenshot(socketPath, evidence, name)
    const [width, height] = pngSize(name)
    const [expectedWidth, expectedHeight] = physical(scale)
    // The parent may round the window up by less than its own scale, never down.
    assert(width >= expectedWidth && width <= expectedWidth + 3, name + ' width ' + width + ' for ' + expectedWidth)
    assert(height >= expectedHeight && height <= expectedHeight + 3, name + ' height ' + height + ' for ' + expectedHeight)
    // The yellow quadrant must end at half the physical size, and blue must reach the far corner.
    const halfX = Math.round(expectedWidth / 2)
    const halfY = Math.round(expectedHeight / 2)
    const [insideYellow, outsideYellow, farCorner] = await greens(name, [
      [halfX - 3, halfY - 3], [halfX + 3, halfY + 3], [expectedWidth - 3, expectedHeight - 3],
    ])
    assert(insideYellow > 150, name + ': yellow quadrant green ' + insideYellow)
    assert(outsideYellow > 50 && outsideYellow < 90, name + ': blue past the quadrant green ' + outsideYellow)
    assert(farCorner > 50 && farCorner < 90, name + ': blue at the far corner green ' + farCorner)
    // Logical clicks land on the same logical point at every scale.
    for (const [x, y] of [[500, 300], [100, 50]].filter(([x, y]) => x < logical.width && y < logical.height)) {
      const before = clicks().length
      assert.equal(await control(socketPath, 'click ' + x + ' ' + y), 'ok')
      await until('the click at ' + x + ',' + y, () => clicks().length === before + 1)
      const [seenX, seenY] = clicks().at(-1)
      assert(Math.abs(seenX - x) <= 0.5 && Math.abs(seenY - y) <= 0.5, name + ': click ' + x + ',' + y + ' seen at ' + seenX + ',' + seenY)
    }
    console.log('scale ' + scale + ': client reports ' + scales().at(-1) + ', screenshot ' + width + 'x' + height
      + ', quadrant greens ' + insideYellow + '/' + outsideYellow + '/' + farCorner)
  }
  const empty = await screenshot(socketPath, evidence, 'empty')
  try {
    await until('Slint to report its first scale', () => scales().length > 0)
    await firstFrame(socketPath, evidence, empty)
    if (phase === 'runtime') {
      await check(1, 'scale-1')
      // The scene's startup timer may report before the first configure, so only reports that
      // arrive after this point count; any of them would be a resize.
      const sizesBefore = reported('size-seen').length
      assert.deepEqual(reported('size-seen').at(-1), [logical.width, logical.height])
      // Negative control: the scale already applied changes nothing.
      assert.equal(await control(socketPath, 'scale 1'), 'ok unchanged')
      for (const [scale, name] of [[2, 'scale-2'], [1.25, 'scale-1.25'], [1.5, 'scale-1.5'], [1, 'scale-1-again']]) {
        assert.equal(await control(socketPath, 'scale ' + scale), 'ok changed')
        await check(scale, name)
      }
      assert.match(await control(socketPath, 'scale 1.333'), /^err scale must be a whole number of 120ths/)
      assert.match(await control(socketPath, 'scale'), /^err scale requires a value/)
      // A switch changes only the scale: the client reported no new logical size across four switches.
      assert.deepEqual(reported('size-seen').slice(sizesBefore), [], 'a scale switch resized the client')
      // A switch while recording: the frames after it must already have the new size, and the
      // last one the client's full drawing; nothing swaps the window while a recording runs.
      const during = join(evidence, 'frames-during-switch')
      mkdirSync(during)
      assert.equal(await control(socketPath, 'record ' + during + ' 20 bmp'), 'ok')
      // Let the recorder draw a few frames first: a window back buffer drawn into since its last
      // swap keeps its size, which is how a capture of the window itself went wrong.
      await wait(300)
      assert.equal(await control(socketPath, 'scale 2'), 'ok changed')
      await until('Slint to apply scale 2 while recording', () => near(scales().at(-1) ?? 0, 2))
      await wait(settle)
      assert.match(await control(socketPath, 'record stop'), /^ok captured=/)
      const lastDuring = readFileSync(join(during, readdirSync(during).sort().at(-1)))
      const [duringWidth, duringHeight] = physical(2)
      const recordedWidth = lastDuring.readInt32LE(18)
      const recordedHeight = Math.abs(lastDuring.readInt32LE(22))
      assert(recordedWidth >= duringWidth && recordedWidth <= duringWidth + 3, 'recorded width ' + recordedWidth + ' after a switch while recording')
      assert(recordedHeight >= duringHeight && recordedHeight <= duringHeight + 3, 'recorded height ' + recordedHeight + ' after a switch while recording')
      const [duringYellow, duringBlue, duringCorner] = lastFrameGreens(during, [
        [duringWidth / 2 - 3, duringHeight / 2 - 3], [duringWidth / 2 + 3, duringHeight / 2 + 3], [duringWidth - 3, duringHeight - 3],
      ])
      assert(duringYellow > 150 && duringBlue > 50 && duringBlue < 90 && duringCorner > 50 && duringCorner < 90,
        'frame recorded after a switch while recording: greens ' + [duringYellow, duringBlue, duringCorner])
      console.log('switch while recording: last frame ' + duringWidth + 'x' + duringHeight + ', greens '
        + [duringYellow, duringBlue, duringCorner].join('/'))
      await check(2, 'scale-2-again')
      // Positive control for that size detector, and resize at a scale other than 1: the logical
      // size changes at once and the framebuffer follows at the current scale.
      logical.width = 600
      logical.height = 340
      assert.equal(await control(socketPath, 'resize 600 340'), 'ok')
      await until('the client to report the new logical size', () => String(reported('size-seen').at(-1)) === '600,340')
      await check(2, 'resized-at-2')
      assert.deepEqual(changes(scales()), [1, 2, 1.25, 1.5, 1, 2])
    } else {
      // Started with --scale 1.5, the client never draws at scale 1.
      assert.deepEqual(changes(scales()), [1.5])
      await check(1.5, 'startup-1.5')
    }
  } finally {
    viewer.kill()
    if (viewer.exitCode === null && viewer.signalCode === null) await once(viewer, 'exit')
  }
  // What the client was told, from its own protocol log.
  const log = Buffer.concat(protocol).toString()
  writeFileSync(join(evidence, phase + '-client-protocol.log'), log)
  writeFileSync(join(evidence, phase + '-client-reports.log'), Buffer.concat(output).toString())
  const preferred = changes(events(/wp_fractional_scale_v1[@#]\d+\.preferred_scale\((\d+)\)/g))
  const outputScales = changes(events(/wl_output[@#]\d+\.scale\((-?\d+)\)/g))
  const destinations = events(/wp_viewport[@#]\d+\.set_destination\((\d+), \d+\)/g)
  console.log(phase + ': preferred_scale ' + preferred.join(' -> ') + '; wl_output.scale ' + outputScales.join(' -> ')
    + '; viewport widths ' + [...new Set(destinations)].join(', '))
  if (phase === 'runtime') {
    assert.deepEqual(preferred, [120, 240, 150, 180, 120, 240])
    assert.deepEqual(outputScales, [1, 2, 1, 2])
  } else {
    assert.deepEqual(preferred, [180])
    assert.deepEqual(outputScales, [2])
  }
  // The client sized its window in logical pixels through the viewport, never in physical pixels.
  // A cursor surface may set its own small viewport, so widths under 100 are not window widths.
  const windowWidths = phase === 'runtime' ? [640, 600] : [400]
  assert(windowWidths.every(width => destinations.includes(width)), 'viewport widths ' + destinations)
  assert(destinations.every(width => width < 100 || windowWidths.includes(width)),
    'a viewport was sized in physical pixels: ' + destinations)
  const other = log.split('\n').filter(line => line.trim() !== '' && !line.startsWith('['))
  console.log(phase + ': client stderr besides the protocol log: ' + (other.length === 0 ? 'none' : other.join(' | ')))
}
const binary = './target/release/monochromatic-nested-wayland-session'
const evidence = mkdtempSync(join(tmpdir(), 'nested-scale-'))
const host = async (phase, options) => {
  const directory = join(evidence, phase)
  mkdirSync(directory)
  const socketPath = join(directory, 'control.sock')
  const session = spawn(binary, [...options, '--socket', socketPath, '--color-scheme', 'dark', '--',
    'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--', socketPath, directory, phase,
  ], { stdio: 'inherit' })
  const [code] = await once(session, 'exit')
  assert.equal(code, 0, phase + ' scale client failed')
}
try {
  await host('runtime', ['--size', '640x360'])
  await host('startup', ['--size', '400x300', '--scale', '1.5'])
} finally {
  console.log('Evidence: ' + evidence)
}
console.log('Nested output scale verified at startup and at runtime')
'''

[tasks."inspect:resize-callbacks"]
depends = ["build"]
description = "Verify a resize made while recording reaches an animating Slint client within the same recorder tick: its frame callback follows the configure at once, once, and the first frame recorded after the command shows the new size"
shell = "node --input-type=module-typescript -e"
run = '''
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync, mkdirSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { default: assert } = await import('node:assert/strict')
// Runs inside the nested session as the hosted command.
const client = async () => {
{{vars.slint_scheme_probe}}
  const [socketPath, evidence] = process.argv.slice(1)
  // The scene animates all the time, so its renderer holds a frame request whenever the recorder is
  // the only sender of frame callbacks. The full-height strip at the right edge is yellow only in a
  // buffer drawn for the current width; a stale buffer shows blue there, or nothing past its edge.
  const scene = join(evidence, 'resize-scene.slint')
  writeFileSync(scene, [
    'export component Scene inherits Window {',
    '    property <int> step: 0;',
    '    background: #204060;',
    '    Timer { interval: 16ms; triggered => { root.step = Math.mod(root.step + 1, 200); } }',
    '    Rectangle { x: root.step * 1px; y: 10px; width: 40px; height: 40px; background: #e0c040; }',
    '    Rectangle { x: root.width - 30px; y: 0px; width: 30px; height: root.height; background: #e0c040; }',
    '}',
    '',
  ].join('\n'))
  // WAYLAND_DEBUG makes the client's Wayland library print every request and event with a
  // wall clock timestamp to the microsecond, so one clock orders the configure and the callbacks.
  const viewer = spawn('slint-viewer', [scene], {
    stdio: ['ignore', 'ignore', 'pipe'], env: { ...process.env, WAYLAND_DEBUG: 'client' },
  })
  const protocol = []
  viewer.stderr.on('data', chunk => protocol.push(chunk))
  // A line reads [HH:MM:SS.microseconds], an optional {queue name}, an arrow for requests, then the call.
  const lines = () => Buffer.concat(protocol).toString().split('\n').flatMap(line => {
    const match = /^\[(\d+):(\d+):(\d+\.\d+)\]\s+(?:\{[^}]*\}\s+)?(->\s+)?(.*)$/.exec(line)
    const time = match ? (Number(match[1]) * 3600 + Number(match[2]) * 60 + Number(match[3])) * 1000 : 0
    return match ? [{ time, request: match[4] !== undefined, text: match[5] }] : []
  })
  // The done events of frame callbacks only: wl_display.sync callbacks answer in the same way.
  const dones = () => {
    const frameCallbacks = new Set()
    return lines().filter(line => {
      const request = /^wl_surface[@#]\d+\.frame\(new id wl_callback[@#](\d+)\)/.exec(line.text)
      const done = /^wl_callback[@#](\d+)\.done\(/.exec(line.text)
      if (line.request && request) frameCallbacks.add(request[1])
      return !line.request && done !== null && frameCallbacks.has(done[1])
    })
  }
  const configures = () => lines().flatMap(line => {
    const match = /^xdg_toplevel[@#]\d+\.configure\((\d+), (\d+),/.exec(line.text)
    return !line.request && match ? [{ time: line.time, size: [Number(match[1]), Number(match[2])] }] : []
  })
  // A BMP of 32-bit pixels: the header names the pixel data offset and the size, and a positive
  // height stores rows bottom-up. The green byte is second in either channel order.
  const frameGreen = (file, x, y) => {
    const bytes = readFileSync(file)
    const offset = bytes.readUInt32LE(10)
    const width = bytes.readInt32LE(18)
    const height = bytes.readInt32LE(22)
    assert.equal(bytes.readUInt16LE(28), 32, 'recorded frames are 32-bit')
    const row = height > 0 ? height - 1 - y : y
    return { width, height: Math.abs(height), green: bytes[offset + (row * width + x) * 4 + 1] }
  }
  // Every frame request is answered by exactly one done event, and a done event only ever answers a request.
  const callbackAccounting = () => {
    // Callback ids are reused, so each request decides whether its id is a frame callback or a sync.
    const pending = new Set()
    const frameIds = new Set()
    const problems = []
    for (const line of lines()) {
      const request = /^(\w+)[@#]\d+\.(\w+)\(new id wl_callback[@#](\d+)\)/.exec(line.text)
      const done = /^wl_callback[@#](\d+)\.done\(/.exec(line.text)
      if (line.request && request) {
        frameIds.delete(request[3])
        if (request[1] === 'wl_surface' && request[2] === 'frame') {
          if (pending.has(request[3])) problems.push('callback ' + request[3] + ' requested again before it was answered')
          pending.add(request[3])
          frameIds.add(request[3])
        }
      } else if (!line.request && done && frameIds.has(done[1])) {
        if (!pending.has(done[1])) problems.push('callback ' + done[1] + ' answered twice')
        pending.delete(done[1])
      }
    }
    return { problems, outstanding: pending.size }
  }
  const frames = join(evidence, 'frames')
  mkdirSync(frames)
  const rows = []
  try {
    await until('the first configure', () => configures().length > 0)
    assert.equal(await control(socketPath, 'record ' + frames + ' 2 bmp'), 'ok')
    // Two recorder ticks of 500 ms answer the client before the first resize is made.
    const started = dones().length
    await until('two recorder ticks', () => dones().length >= started + 2)
    for (const [width, height] of [[600, 340], [640, 360], [560, 300], [640, 360]]) {
      // Resize 150 ms after a tick: the client has drawn and holds a request that only a
      // callback sent now, or the next tick 350 ms later, can answer.
      const ticks = dones().length
      await until('a recorder tick', () => dones().length > ticks, 3000)
      await wait(150)
      const recorded = readdirSync(frames).length
      const configured = configures().length
      assert.equal(await control(socketPath, 'resize ' + width + ' ' + height), 'ok')
      await until('the configure for ' + width + 'x' + height, () => configures().length > configured)
      const configure = configures()[configured]
      assert.deepEqual(configure.size, [width, height])
      await until('the first frame recorded after the command', () => readdirSync(frames).length > recorded)
      // The encoder writes the file a moment after the capture; the callbacks of the window
      // after the configure are all in the log by then.
      await wait(100)
      const answered = dones().filter(line => line.time >= configure.time)
      const gap = answered[0].time - configure.time
      // Mesa's swap throttle and the toolkit's redraw gate each hold a request on the surface, so one
      // send answers two callbacks together; a second send would answer the requests made after them.
      const burst = answered.filter(line => line.time - answered[0].time < 20).length
      const later = answered.filter(line => line.time - answered[0].time >= 20 && line.time - configure.time < 100).length
      const file = join(frames, readdirSync(frames).sort()[recorded])
      const edge = frameGreen(file, width - 10, Math.floor(height / 2))
      console.log('resize ' + width + 'x' + height + ': first callback ' + gap.toFixed(1) + ' ms after the configure, '
        + burst + ' answered together, ' + later + ' more in the first 100 ms; first frame recorded after it is ' + edge.width + 'x' + edge.height
        + ', right edge green ' + edge.green)
      rows.push({ width, height, gap, burst, later, edge })
    }
    assert.match(await control(socketPath, 'record stop'), /^ok captured=/)
  } finally {
    viewer.kill()
    if (viewer.exitCode === null && viewer.signalCode === null) await once(viewer, 'exit')
    writeFileSync(join(evidence, 'client-protocol.log'), Buffer.concat(protocol).toString())
  }
  for (const { width, height, gap, burst, later, edge } of rows) {
    const name = width + 'x' + height
    // Recorder ticks are 500 ms apart and the command came 150 ms after one, so a callback that
    // waited for the next tick would arrive about 350 ms after the configure.
    assert(gap < 100, name + ': the frame callback came ' + gap.toFixed(1) + ' ms after the configure, not at once')
    assert(burst >= 1 && burst <= 2, name + ': ' + burst + ' frame callbacks answered together after the configure')
    assert.equal(later, 0, name + ': ' + later + ' more frame callbacks in the first 100 ms after the configure')
    assert.deepEqual([edge.width, edge.height], [width, height], name + ': first recorded frame size')
    assert(edge.green > 150, name + ': the first frame recorded after the resize is stale, green ' + edge.green + ' at the right edge')
  }
  const { problems, outstanding } = callbackAccounting()
  assert.deepEqual(problems, [], 'frame callback accounting')
  // At the end the swap throttle and the redraw gate each wait for the next tick.
  assert(outstanding <= 2, outstanding + ' frame callbacks still unanswered')
  console.log('Every frame request was answered once; the log is in ' + join(evidence, 'client-protocol.log'))
}
const binary = './target/release/monochromatic-nested-wayland-session'
const evidence = mkdtempSync(join(tmpdir(), 'nested-resize-callbacks-'))
try {
  const session = spawn(binary, ['--size', '640x360', '--socket', join(evidence, 'control.sock'), '--',
    'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--', join(evidence, 'control.sock'), evidence,
  ], { stdio: 'inherit' })
  const [code] = await once(session, 'exit')
  assert.equal(code, 0, 'the resize callback client failed')
} finally {
  console.log('Evidence: ' + evidence)
}
console.log('A resize while recording reaches an animating client within the same recorder tick')
'''

