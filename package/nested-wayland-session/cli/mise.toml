// PNG decoding with zlib only: 8-bit RGB or RGBA, all five scanline filters.
const decodePng = path => {
  const bytes = readFileSync(path)
  assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a', path + ' is not a PNG')
  let offset = 8
  let header
  const parts = []
  while (offset < bytes.length) {
    const length = bytes.readUInt32BE(offset)
    const type = bytes.subarray(offset + 4, offset + 8).toString('latin1')
    const body = bytes.subarray(offset + 8, offset + 8 + length)
    if (type === 'IHDR') header = { width: body.readUInt32BE(0), height: body.readUInt32BE(4), depth: body[8], color: body[9] }
    if (type === 'IDAT') parts.push(body)
    offset += 12 + length
  }
  const channels = header.color === 6 ? 4 : 3
  const raw = inflateSync(Buffer.concat(parts))
  const stride = header.width * channels
  const data = Buffer.alloc(stride * header.height)
  for (let row = 0; row < header.height; row++) {
    const filter = raw[row * (stride + 1)]
    for (let index = 0; index < stride; index++) {
      const value = raw[row * (stride + 1) + 1 + index]
      const left = index >= channels ? data[row * stride + index - channels] : 0
      const up = row > 0 ? data[(row - 1) * stride + index] : 0
      const upLeft = row > 0 && index >= channels ? data[(row - 1) * stride + index - channels] : 0
      let predicted = 0
      if (filter === 1) predicted = left
      else if (filter === 2) predicted = up
      else if (filter === 3) predicted = (left + up) >> 1
      else if (filter === 4) {
        const estimate = left + up - upLeft
        const distances = [Math.abs(estimate - left), Math.abs(estimate - up), Math.abs(estimate - upLeft)]
        predicted = [left, up, upLeft][distances.indexOf(Math.min(...distances))]
      }
      data[row * stride + index] = (value + predicted) & 255
    }
  }
  const pixel = (x, y) => [...data.subarray(y * stride + x * channels, y * stride + x * channels + 3)]
  return { width: header.width, height: header.height, pixel, data }
}
const near = (actual, expected, tolerance = 12) => actual.every((value, index) => Math.abs(value - expected[index]) <= tolerance)
const YELLOW = [0xe0, 0xc0, 0x40]
const BLUE = [0x20, 0x40, 0x60]
const GREEN = [0x40, 0xc0, 0x60]
// A static scene: yellow top-left quadrant on blue; a click turns the bottom-right quadrant green.
const staticScene = [
  'export component Scene inherits Window {',
  '    property <bool> pressed: false;',
  '    background: #204060;',
  '    Rectangle { x: 0px; y: 0px; width: root.width / 2; height: root.height / 2; background: #e0c040; }',
  '    Rectangle { x: root.width / 2; y: root.height / 2; width: root.width / 2; height: root.height / 2; background: root.pressed ? #40c060 : #204060; }',
