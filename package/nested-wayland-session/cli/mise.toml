# Needs slint-viewer and bwrap. The device list comes from the binary's own --list-gpus, so the task runs once per device
# the host offers: every render node EGL lists and the software rasterizer. Per device it checks that the client's frames
# reach the screenshot, that a click changes the screenshot, that the gpu control answer names the device and Mesa's
# renderer, and that the hosted client opened only that device's DRM node (none for software). The fallback cases hide
