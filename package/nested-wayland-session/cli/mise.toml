# Each inspect task runs ./target/release (inspect:cli: ./target/debug), so it depends on the build that makes that
# binary: without the dependency a task passes against a binary built from older sources, as inspect:resize-callbacks
# did with its fix removed.
# Cargo work runs on the HOST when the native dev libraries are present, and falls
# back to the CachyOS build container otherwise (see Containerfile and
# doc/decision/desktop-app-podman-build.md). Unlike the desktop apps this package
# is Linux-only: it is a Wayland compositor, so there is no macOS/Windows branch.
#
# The built binary always RUNS on the host (it is a nested winit client of the host
# Wayland session and needs the host GPU), regardless of where it was compiled, so
# the `run` task executes the host-facing binary directly.

[vars]
# Bootstrap-safe cargo dispatch for this package, interpolated into the cargo tasks
# (each sets `shell = "node --input-type=module-typescript -e"`).
# - hostOk: `cargo` on PATH and pkg-config resolves the compositor's link-time
#   libraries (wayland-server for use_system_lib, xkbcommon for the keyboard, libdrm
#   for the dmabuf render-node query). When all are present the task runs cargo
#   natively; otherwise containerCargo runs the same command in podman.
# - containerCargo(args): build the image when missing, then run cargo in podman
#   (package dir bind-mounted at /work, cargo cache in a named volume, `label=disable`
#   to skip SELinux relabeling of the host tree). The repository-root clippy.toml is bind-mounted
#   read-only at /clippy-conf and named by CLIPPY_CONF_DIR, so the container lint applies the same
#   disallowed-methods ban as the host, where clippy finds that file in an ancestor directory.
#   A mount over /work/clippy.toml would leave an empty clippy.toml in the host package directory.
# Its imported binding (execFileSync) is reused by inline follow-ups, so those must
# not reimport it.
cargo_dispatch = """
const { execFileSync } = await import('node:child_process')
const rootClippyConfig = (await import('node:path')).resolve(process.cwd(), '../../../clippy.toml')
const onPath = (command) => { try { execFileSync('which', [command], { stdio: 'ignore' }); return true } catch { return false } }
const pkgConfigOk = () => { try { execFileSync('pkg-config', ['--exists', 'wayland-server', 'xkbcommon', 'libdrm'], { stdio: 'ignore' }); return true } catch { return false } }
const hostOk = onPath('cargo') && pkgConfigOk()
const IMAGE = 'localhost/monochromatic/nested-wayland-session'
// CACHYOS_IMAGE is the CachyOS image this host's CPU level supports (docker.io/cachyos/cachyos-v4, -v3 or plain), resolved by the
// repository's cachyos-image command; it throws on a host that is not x86-64, because this image has no Alpine variant.
const cachyosImageCommand = (await import('node:path')).resolve(process.cwd(), '../../test-harness/core-matrix/src/bin/cachyos-image.ts')
const baseImageArgument = () => execFileSync('node', [cachyosImageCommand, '--image-name', 'nested-wayland-session', '--build-argument'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim()
const containerCargo = (cargoArgs) => {
  let imageExists = true
  try { execFileSync('podman', ['image', 'exists', IMAGE], { stdio: 'ignore' }) } catch { imageExists = false }
  if (!imageExists) { execFileSync('podman', ['build', '--build-arg', baseImageArgument(), '-t', IMAGE, '-f', 'Containerfile', '.'], { stdio: 'inherit' }) }
  execFileSync('podman', ['run', '--rm', '--memory=2g', '--cpus=2', '--pids-limit=512', '--ulimit', 'nofile=4096:4096', '--env', 'CARGO_BUILD_JOBS=2', '--security-opt', 'label=disable', '--volume', `${process.cwd()}:/work`, '--volume', `${rootClippyConfig}:/clippy-conf/clippy.toml:ro`, '--env', 'CLIPPY_CONF_DIR=/clippy-conf', '--volume', 'nested-wayland-session-cargo:/cargo', '--workdir', '/work', IMAGE, 'cargo', ...cargoArgs], { stdio: 'inherit' })
}
const runCargo = (cargoArgs) => { if (hostOk) { execFileSync('cargo', cargoArgs, { stdio: 'inherit' }) } else { containerCargo(cargoArgs) } }
"""

# Shared body for hosted inspection clients (interpolated inside an async function whose
# source is passed to a nested `node -e`). It provides:
# - until(label, probe): poll until probe() is truthy, failing after ten seconds.
# - control(socketPath, line): send one control command, resolve with its response line.
# - startViewer(evidence): show a Slint scene through slint-viewer whose scheme-seen callback
#   reports every Palette.color-scheme value the toolkit applies. slint-viewer runs the --on
#   handler as a plain command, so the report arrives on the viewer's stdout.
# - screenshot(socketPath, evidence, name): write a PNG and return its SHA-256.
# - firstFrame(socketPath, evidence, emptyHash): wait until the client has committed a frame.
# Literal ''' strings keep JavaScript escapes such as '\n' out of TOML's own escaping.
slint_scheme_probe = '''
  const { spawn, spawnSync } = await import('node:child_process')
  const { once } = await import('node:events')
  const { createConnection } = await import('node:net')
  const { readFileSync, readdirSync, writeFileSync, mkdirSync } = await import('node:fs')
  const { join } = await import('node:path')
  const { createHash } = await import('node:crypto')
  const { setTimeout: wait } = await import('node:timers/promises')
  const { default: assert } = await import('node:assert/strict')
  // Time for the client to draw and commit after it reports a value.
  const settle = 400
  const until = async (label, probe, limit = 10000) => {
    const started = performance.now()
    while (performance.now() - started < limit) {
      const value = probe()
      if (value) return value
      await wait(25)
    }
    assert.fail('timed out waiting for ' + label)
  }
  const control = (socketPath, line) => new Promise((resolve, reject) => {
    const socket = createConnection(socketPath)
    let reply = ''
    socket.on('error', reject)
    socket.on('data', chunk => {
      reply += chunk
      if (reply.includes('\n')) { socket.end(); resolve(reply.trim()) }
    })
    socket.write(line + '\n')
  })
  const startViewer = evidence => {
    const scene = join(evidence, 'scene.slint')
    writeFileSync(scene, [
      'import { Palette } from "std-widgets.slint";',
      'export component Scene inherits Window {',
      '    callback scheme-seen(string);',
      '    property <string> scheme: Palette.color-scheme == ColorScheme.dark ? "dark"',
      '        : Palette.color-scheme == ColorScheme.light ? "light" : "unknown";',
      '    background: Palette.background;',
      '    init => { root.scheme-seen(root.scheme); }',
      '    changed scheme => { root.scheme-seen(root.scheme); }',
      '    Text {',
      '        text: "Palette.color-scheme: " + root.scheme;',
      '        color: Palette.foreground;',
      '        font-size: 28px;',
      '    }',
      '}',
      '',
    ].join('\n'))
    const viewer = spawn('slint-viewer', ['--on', 'scheme-seen', 'echo scheme-seen $1', scene], { stdio: ['ignore', 'pipe', 'inherit'] })
    const output = []
    viewer.stdout.on('data', chunk => output.push(chunk))
    const reported = () => Buffer.concat(output).toString()
    const seen = () => reported().split('\n').filter(line => line.startsWith('scheme-seen ')).map(line => line.slice(12))
    const stop = async () => {
      viewer.kill()
      if (viewer.exitCode === null && viewer.signalCode === null) await once(viewer, 'exit')
    }
    return { reported, seen, stop }
  }
  const screenshot = async (socketPath, evidence, name) => {
    const path = join(evidence, name + '.png')
    assert.equal(await control(socketPath, 'screenshot ' + path), 'ok')
    return createHash('sha256').update(readFileSync(path)).digest('hex')
  }
  // The toolkit reports its first value before its first frame is committed, so poll until
  // the screenshot stops being the empty screen captured before the client started.
  const firstFrame = async (socketPath, evidence, emptyHash) => {
    const started = performance.now()
    while (performance.now() - started < 10000) {
      if (await screenshot(socketPath, evidence, 'first-frame') !== emptyHash) return
      await wait(50)
    }
    assert.fail('timed out waiting for the client to commit its first frame')
  }
'''

# Shared body for hosted inspection clients that talk to the private bus without a window
# (interpolated inside an async function whose source is passed to a nested `node -e`). It provides:
# - until(label, probe): poll until probe() is truthy, failing after ten seconds.
# - control(socketPath, line): send one control command, resolve with its response line.
# - address: the private bus address the hosted client inherited.
# - busctl(...args): one busctl command against that address, returning trimmed standard output.
# - monitor(destination): a gdbus subscription to every signal the named service emits;
#   text() is everything printed, signals(member) the lines naming that signal.
# Literal ''' strings keep JavaScript escapes such as '\n' out of TOML's own escaping.
bus_probe = '''
  const { spawn, spawnSync } = await import('node:child_process')
  const { createConnection } = await import('node:net')
  const { setTimeout: wait } = await import('node:timers/promises')
  const { default: assert } = await import('node:assert/strict')
  const until = async (label, probe, limit = 10000) => {
    const started = performance.now()
    while (performance.now() - started < limit) {
      const value = await probe()
      if (value) return value
      await wait(25)
    }
    assert.fail('timed out waiting for ' + label)
  }
  const control = (socketPath, line) => new Promise((resolve, reject) => {
    const socket = createConnection(socketPath)
    let reply = ''
    socket.on('error', reject)
    socket.on('data', chunk => {
      reply += chunk
      if (reply.includes('\n')) { socket.end(); resolve(reply.trim()) }
    })
    socket.write(line + '\n')
  })
  const address = process.env.DBUS_SESSION_BUS_ADDRESS ?? String()
  assert.match(address, /monochromatic-nested-wayland-session-/)
  const busctl = (...args) => {
    const result = spawnSync('busctl', ['--address=' + address, ...args], { timeout: 5000 })
    assert.equal(result.status, 0, 'busctl ' + args.join(' ') + ': ' + result.stderr.toString())
    return result.stdout.toString().trim()
  }
  const monitor = destination => {
    const child = spawn('gdbus', ['monitor', '--address', address, '--dest', destination], { stdio: ['ignore', 'pipe', 'inherit'] })
    const chunks = []
    child.stdout.on('data', chunk => chunks.push(chunk))
    const text = () => Buffer.concat(chunks).toString()
    const signals = member => text().split('\n').filter(line => line.includes('.' + member + ' '))
    return { text, signals, stop: () => child.kill() }
  }
'''

# Shared runner for the service inspections: a disposable decoy bus stands in for the host session bus
# in the compositor's own environment, and must see no traffic but a deliberate sentinel.
# runInDecoy({ prefix, sessionOptions, client, clientArguments }) hosts `client` (its source text runs
# under `node -e` inside the nested session, receiving the control socket path, the evidence directory,
# and clientArguments) and fails unless the client exits 0 and the decoy saw only the sentinel connection.
decoy_runner = '''
const { spawn, spawnSync } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdtempSync, writeFileSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const { setTimeout: wait } = await import('node:timers/promises')
const { default: assert } = await import('node:assert/strict')
const runInDecoy = async ({ prefix, sessionOptions, client, clientArguments = [] }) => {
  const evidence = mkdtempSync(join(tmpdir(), prefix))
  const socketPath = join(evidence, 'control.sock')
  const decoyAddress = 'unix:path=' + join(evidence, 'decoy-bus')
  const decoy = spawn('dbus-daemon', ['--session', '--nofork', '--nopidfile', '--nosyslog', '--print-address=1', '--address=' + decoyAddress], { stdio: ['ignore', 'pipe', 'inherit'] })
  let failure
  try {
    await once(decoy.stdout, 'data')
    const watcher = spawn('dbus-monitor', ['--address', decoyAddress], { stdio: ['ignore', 'pipe', 'inherit'] })
    const watcherOutput = []
    watcher.stdout.on('data', chunk => watcherOutput.push(chunk))
    const watched = () => Buffer.concat(watcherOutput).toString()
    const untilWatched = async text => {
      const started = performance.now()
      while (!watched().includes(text) && performance.now() - started < 3000) await wait(25)
      assert(watched().includes(text), 'decoy session bus watcher did not report ' + text)
    }
    try {
      await untilWatched('NameAcquired')
      const session = spawn('./target/release/monochromatic-nested-wayland-session', [
        '--size', '640x240', '--socket', socketPath, ...sessionOptions, '--',
        'node', '--input-type=module', '-e', 'await (' + client.toString() + ')()', '--',
        socketPath, evidence, decoyAddress, ...clientArguments,
      ], { stdio: 'inherit', env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: decoyAddress } })
      const [code] = await once(session, 'exit')
      assert.equal(code, 0, 'nested client failed')
      // Positive control: the watcher must see a deliberate environment-addressed connection.
      const sentinel = spawnSync('dbus-send', ['--session', '--type=signal', '/sentinel', 'org.example.Sentinel.Ping'], {
        timeout: 3000, env: { ...process.env, DBUS_SESSION_BUS_ADDRESS: decoyAddress },
      })
      assert.equal(sentinel.status, 0, sentinel.stderr.toString())
      await untilWatched('member=Ping')
      writeFileSync(join(evidence, 'decoy-session-bus.log'), watched())
      // Every connection must call Hello first, so one Hello before the sentinel signal is the sentinel itself.
      const beforeSentinel = watched().slice(0, watched().indexOf('member=Ping'))
      assert.equal(beforeSentinel.split('member=Hello').length - 1, 1,
        'something other than the sentinel connected to the decoy session bus')
      assert(!/Notif|JobView|kuiserver|SettingChanged/.test(beforeSentinel), 'service traffic reached the decoy session bus')
      console.log('Decoy session bus saw only the sentinel connection; no service traffic left the private bus')
    } finally {
      watcher.kill()
    }
  } catch (error) {
    failure = error
  } finally {
    decoy.kill()
  }
  console.log('Evidence: ' + evidence)
  if (failure) throw failure
  return evidence
}
'''

