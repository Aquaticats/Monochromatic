    await wait(400)
    const first = await host.shot('baseline')
    assert(near(first.pixel(100, 75), YELLOW) && near(first.pixel(300, 75), BLUE) && near(first.pixel(300, 225), BLUE), 'the client frame is in the screenshot')
    assert.equal(await control(host.socketPath, 'click 300 225'), 'ok')
    let changed
    await until('the screenshot to show the click', async () => { changed = await host.shot('after-click'); return near(changed.pixel(300, 225), GREEN) })
    assert(!changed.data.equals(first.data), 'the click changed the screenshot')
    const answer = GPU_ANSWER.exec(await control(host.socketPath, 'gpu'))
    assert(answer, 'the gpu answer has the documented shape')
    assert.equal(answer[1], expectDevice, 'gpu answer device is ' + answer[1] + ', expected ' + expectDevice)
    assert.equal(answer[2], expectChoice, 'gpu answer choice is ' + answer[2] + ', expected ' + expectChoice)
    assert.equal(answer[3], expectFallback, 'gpu answer fallback is ' + answer[3] + ', expected ' + expectFallback)
    if (expectRenderer) assert.equal(answer[4], expectRenderer, 'gpu answer renderer is "' + answer[4] + '", --list-gpus said "' + expectRenderer + '"')
    const pid = await until('the hosted client process', () => viewerPid(host.session.pid))
    const nodes = [...new Set(driNodes(pid))]
    // The hosted client has no network: its namespace holds the loopback interface only.
    const interfaces = readFileSync('/proc/' + pid + '/net/dev', 'latin1').split('\n').slice(2).map(line => line.split(':')[0].trim()).filter(Boolean)
    assert.deepEqual(interfaces, ['lo'], 'the client sees network interfaces besides loopback: ' + interfaces)
    if (expectDevice === 'software') {
      assert.deepEqual(nodes, [], 'the client opened no DRM node while rendering in software')
      assert.equal(clientVariable(pid, 'LIBGL_ALWAYS_SOFTWARE'), '1', 'the client environment has LIBGL_ALWAYS_SOFTWARE=' + clientVariable(pid, 'LIBGL_ALWAYS_SOFTWARE') + ', expected 1')
    } else {
      assert(nodes.length > 0, 'the client opened a DRM node')
      assert.deepEqual(nodes.filter(node => node !== expectDevice), [], 'the client opened a node other than ' + expectDevice + ': ' + nodes)
    }
    const log = host.stderr()
    const dmabufBuffers = (log.match(/zwp_linux_buffer_params_v1[@#]\d+\.(create_immed|create)\(/g) ?? []).length
    const shmBuffers = (log.match(/wl_shm_pool[@#]\d+\.create_buffer\(/g) ?? []).length
    if (expectDevice === 'software') assert(dmabufBuffers === 0 && shmBuffers > 0, 'software client uses wl_shm buffers only: dmabuf ' + dmabufBuffers + ', shm ' + shmBuffers)
    else assert(dmabufBuffers > 0, 'the client created dmabuf buffers on the GPU')
    for (const pattern of expectLogs ?? []) assert(pattern.test(log), 'the compositor log lacks ' + pattern)
    writeFileSync(join(host.directory, 'compositor.log'), log)
    return 'device ' + answer[1] + ', renderer "' + answer[4] + '", client DRM nodes [' + nodes.join(' ') + '], dmabuf buffers ' + dmabufBuffers
      + ', shm buffers ' + shmBuffers + ', first frame and the click reached the screenshots'
  } finally {
    await finish(host).catch(() => host.session.kill())
  }
}

await check('--list-gpus names a usable device and the one auto uses', async () => {
  assert.equal(listed.status, 0, '--list-gpus exits 0')
  assert(devices.length > 0, 'the listing has at least one usable device')
  assert(autoUses, 'the listing names the device auto uses')
  return devices.map(device => device.choice).join(', ') + '; auto uses ' + autoUses[1]
})

for (const device of devices) {
  // DRI_PRIME is set in the compositor's environment on purpose: it moves a client to another GPU unless the
  // compositor removes it from the child's environment, and the client must still use the chosen device.
  const env = withoutParent({ ...baseEnvironment, DRI_PRIME: '1' })
  await check('--gpu ' + device.choice + ': client frames reach the screenshot, a click changes it, and the client renders on the same device', () => exerciseSession({
    name: 'gpu-' + device.choice.replace(/\W+/g, '-'),
    flags: ['--headless', '--gpu', device.choice], env,
    expectDevice: device.choice, expectChoice: device.choice, expectFallback: 'no', expectRenderer: device.renderer,
  }))
}

if (autoUses) {
  await check('auto (no --gpu) keeps the default device and reports it', () => exerciseSession({
    name: 'auto', flags: ['--headless'], env: withoutParent(baseEnvironment),
    expectDevice: autoUses[1], expectChoice: 'auto', expectFallback: 'no', expectRenderer: autoUses[2],
    expectLogs: [/headless: rendering on this device/],
  }))
}

await check('auto with no GPU visible falls back to software, logs why, and the client renders in software', () => exerciseSession({
  name: 'fallback-software', flags: ['--headless'], env: withoutParent(baseEnvironment), wrap: noGpu,
  expectDevice: 'software', expectChoice: 'auto', expectFallback: 'yes',
  expectLogs: [/headless: auto fell back because earlier devices could not be used/, /Mesa chose the software rasterizer/],
}))

await check('--gpu software with no GPU visible works and does not count as a fallback', () => exerciseSession({
  name: 'explicit-software-no-gpu', flags: ['--headless', '--gpu', 'software'], env: withoutParent(baseEnvironment), wrap: noGpu,
  expectDevice: 'software', expectChoice: 'software', expectFallback: 'no',
}))

await check('an explicit render node never falls back: with no GPU visible the start fails naming the node', async () => {
  const { code, text } = await failingStart({ name: 'explicit-node-no-gpu', flags: ['--headless', '--gpu', '/dev/dri/renderD128'], env: withoutParent(baseEnvironment), wrap: noGpu })
  assert(text.includes('--gpu /dev/dri/renderD128 cannot be used'), 'the message names the node: ' + text.slice(-500))
  assert(text.includes('never falls back'), 'the message says an explicit choice never falls back')
  assert(!/headless: rendering on this device/.test(text), 'no device was used')
  return 'exit ' + code
})

await check('auto with every device unusable fails and lists every attempt', async () => {
  // GALLIUM_DRIVER names a driver that does not exist, which makes Mesa's software device fail to initialize as well.
  const { code, text } = await failingStart({ name: 'nothing-usable', flags: ['--headless'], env: withoutParent({ ...baseEnvironment, GALLIUM_DRIVER: 'no-such-driver' }), wrap: noGpu })
  // The error message itself starts at the last "Error: " line; the compositor's own log lines above it name the attempts too.
  const message = text.slice(text.lastIndexOf('Error: '))
  for (const expected of ["Mesa's default render node: ", 'the software renderer (llvmpipe): ', 'never falls back', 'Choices: auto, software']) {
    assert(message.includes(expected), 'the message lacks "' + expected + '": ' + message.slice(-700))
  }
  return 'exit ' + code
})

await check('bad choices fail before any session starts, and the messages name the way forward', async () => {
  const plain = withoutParent(baseEnvironment)
  const nested = await failingStart({ name: 'gpu-without-headless', flags: ['--gpu', 'software'], env: plain })
  assert(nested.text.includes('--gpu is only valid together with --headless') && nested.text.includes('parent'), 'without --headless: ' + nested.text.slice(-400))
  assert.equal(nested.code, 1)
  const word = await failingStart({ name: 'gpu-bad-word', flags: ['--headless', '--gpu', 'amd'], env: plain })
  assert(word.text.includes('auto, software') && word.text.includes('--list-gpus'), 'bad word: ' + word.text.slice(-400))
  const notDrm = await failingStart({ name: 'gpu-not-drm', flags: ['--headless', '--gpu', '/dev/null'], env: plain })
  assert(notDrm.text.includes('/dev/null is not a DRM device node') && notDrm.text.includes('Choices: auto, software'), '/dev/null: ' + notDrm.text.slice(-500))
  const card = readdirSync('/dev/dri').find(entry => /^card\d+$/.test(entry))
  if (card) {
    const primary = await failingStart({ name: 'gpu-primary-node', flags: ['--headless', '--gpu', '/dev/dri/' + card], env: plain })
    assert(primary.text.includes('not a render node') && primary.text.includes('use its render node'), 'primary node: ' + primary.text.slice(-500))
  }
  return 'four messages checked' + (card ? ' plus the primary node ' + card : '')
})

