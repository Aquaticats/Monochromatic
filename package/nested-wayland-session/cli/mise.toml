const control = (socketPath, line) => new Promise((resolve, reject) => {
  const socket = createConnection(socketPath)
  let reply = ''
  socket.on('error', reject)
  socket.on('data', chunk => {
    reply += chunk
    if (reply.includes('\n')) { socket.end(); resolve(reply.trim()) }
