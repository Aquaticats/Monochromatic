[package]
name = "monochromatic-nested-wayland-session"
version = "0.6.2"
categories = ["command-line-utilities", "development-tools::testing"]
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/nested-wayland-session/cli"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["wayland", "compositor", "smithay", "testing", "screenshot"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Minimal single-app nested Wayland compositor for GUI testing: hosts one Wayland client fullscreen on the GPU (dmabuf) path, screenshots the framebuffer, and injects synthetic input over a Unix-socket control API."

# cargo-binstall's default URL is {repo}/releases/download/v{version}/{name}-{target}-v{version},
# but this repository tags each crate's release monochromatic-nested-wayland-session-v<version> and names the
# archive monochromatic-nested-wayland-session-<version>-<target>, so without this table mise falls back to
# compiling from source. Releases carry Linux archives only (x86_64 and aarch64, tar.gz).
# doc/troubleshooting/mise-cargo-binstall-falls-back-to-compiling.md has the evidence.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Library holds the display-independent logic (control protocol parsing, the
# US-layout char-to-keycode table, argument parsing) so it can be unit-tested
# without opening a window; the binary owns only process setup and the event
# loop. Mirrors package/file-manager/app's lib+bin split.
[lib]
name = "nested_wayland_session"
path = "src/lib.rs"

[[bin]]
name = "monochromatic-nested-wayland-session"
path = "src/main.rs"

[dependencies]
# Application-level error channel for the binary and the control-socket handlers,
# matching package/file-manager/app. A fixture wants one user-facing
# error type, not a hierarchy of custom error enums.
anyhow = { workspace = true }

# Own the CLI grammar and generated help, including child argv forwarding.
clap = { workspace = true, features = ["derive"] }

# In-process PNG encode for the screenshot readback. Pure-Rust, memory-safe
# encoder (no libpng process), matching the music-player's in-process decode
# rule. `default-features = false` + `png` keeps only the one codec we emit.
# `png` is the default capture format; `bmp` is the near-zero-cost fallback for
# sustained 60fps when PNG's deflate cannot keep up (raw pixels plus a header, so
# encoding is essentially a memcpy, at the cost of large files). AVIF is
# deliberately NOT enabled: its AV1 intra encode is far too CPU-heavy for
# real-time 60fps on CPU, the opposite of what this mode needs.
image = { workspace = true, default-features = false, features = ["png", "bmp"] }

# Multi-producer/multi-consumer channels for the 60fps capture pipeline: the
# render thread pushes raw frames onto one queue that N encoder worker threads
# drain in parallel. std's mpsc Receiver is single-consumer, so a shared work
# queue needs crossbeam's MPMC channel. (These plain key = value deps MUST stay
# ABOVE the `[dependencies.smithay]` sub-table below; see the note there.)
crossbeam-channel = { workspace = true }

# The logging facade plus its stderr subscriber, matching the sibling Rust apps.
# tracing routes lifecycle events (client connect, toplevel map, control command,
# screenshot) as structured events; the subscriber installs the stderr sink
# (RUST_LOG, default info). NOTE: these plain key = value dependencies must stay
# ABOVE the `[dependencies.smithay]` sub-table below; TOML folds any key that
# follows a `[table]` header INTO that table, so putting them after would make
# them bogus `smithay.tracing` keys instead of top-level dependencies.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Private XDG Settings portal used by --color-scheme. The blocking API owns its
# executor thread while the Smithay event loop stays synchronous.
zbus = { workspace = true }

# The compositor toolkit. Pinned EXACTLY to the crates.io 0.7.0 release with `=`,
# not a caret range: Smithay is pre-1.0, its git HEAD is far ahead of 0.7.0 with
# breaking changes, and its `## Unreleased` changelog already lists many. The
# `anvil`/`smallvil` examples track git, so we copy their approach but write
# against the stable 0.7.0 API surface (see doc/decision/nested-wayland-session.md).
# Features, all needed for the nested-winit GPU path, none of the udev/DRM/libseat
# stack a real hardware compositor would pull:
#   backend_winit   nested winit window + its EGL/GLES renderer (pulls backend_egl,
#                   renderer_gl, wayland-client/cursor/egl; libwayland-client is
#                   dlopened at runtime via winit's wayland-dlopen feature)
#   backend_drm     DrmNode, so the dmabuf v4 default-feedback path can name the
#                   render node the client should allocate against
#   renderer_gl     GlesRenderer (GLES2/EGL), the renderer that imports dmabuf
#   wayland_frontend  the wl_compositor / xdg_shell / wl_shm / wl_seat server state
#   desktop         Space, Window, and the render_output helper
#   use_system_lib  EGL bind_wl_display (the legacy wl_drm accel path Mesa accepts
#                   as an alternative to dmabuf v4), matching anvil's proven config
[dependencies.smithay]
workspace = true
default-features = false
features = [
  "backend_winit",
  "backend_drm",
  "renderer_gl",
  "wayland_frontend",
  "desktop",
  "use_system_lib",
]

# Test-only: parses Plasma's interface XML for tests/fake_services/contract.rs, so the fake's
# introspected names and signatures are compared with the real files instead of a hand-written copy.
# It is maintained by the zbus project and already shares winnow, zvariant, and zbus_names with zbus.
[dev-dependencies]
zbus_xml = { workspace = true }

# Release profile mirrors the sibling desktop apps: a small, fast, stripped
# fixture binary. overflow-checks stays on so an arithmetic wrap in the layout or
# readback math becomes a real panic at the site, not a silently corrupt frame.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
overflow-checks = true
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Named catalogs this crate selects from rust-catalog.toml (doc/decision/rust-dependency-catalog.md).
[package.metadata.rust-catalog.catalogs]
smithay = "pinned"

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
anyhow = ">=1.0.104"
clap = ">=4.6.7"
crossbeam-channel = ">=0.5.15"
image = { version = ">=0.25.10", default-features = false }
smithay = { version = "=0.7.0", default-features = false }
tracing = ">=0.1.44"
tracing-subscriber = ">=0.3.23"
zbus = ">=5.19.0"
zbus_xml = ">=5.2.1"
