[package]
name = "monochromatic-search-shadow"
version = "0.2.0"
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/search-shadow/cli"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["ripgrep", "ioprio", "bfq", "shim"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Shadows rg, the grep family, find, fd, du and similar tools: runs the real tool at the lowest best-effort disk priority and refuses repository-wide unbounded walks that stall the NVMe."

# cargo-binstall's default URL is {repo}/releases/download/v{version}/{name}-{target}-v{version}, but this
# repository tags each crate's release monochromatic-search-shadow-v<version> and names the archive
# monochromatic-search-shadow-<version>-<target>, so without this table cargo-binstall falls back to compiling.
# The archive holds the `search-shadow` binary (the {bin} below), not a file named after the crate.
# Releases carry Linux archives only (x86_64 and aarch64, tar.gz); the crate uses ioprio_set and /proc.
# The version that first carries this table is 0.1.1; 0.1.0 has no archives and installs by compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "search_shadow"
path = "src/lib.rs"

[[bin]]
name = "search-shadow"
path = "src/main.rs"

[dependencies]
# Owns the `search-shadow` command grammar (`link`, `--help`, `--version`). The shadow mode
# for rg, grep and find never touches it: those tools' arguments pass through untouched.
clap = { workspace = true }

# The raw `ioprio_set` system call: it sets the disk priority in-process, so the shadow needs no `ionice` and no extra exec.
# The only `unsafe` in the crate is the single call in src/priority.rs.
libc = { workspace = true }

[dev-dependencies]
# Disposable directories for the PATH, symlink and policy fixtures.
tempfile = { workspace = true }

# Startup latency is the point of this crate: every search starts through it. A smaller, abort-on-panic,
# link-time-optimized binary starts fastest; a panic here must stop the search, never continue it.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
clap = ">=4"
libc = ">=0.2"
tempfile = ">=3"
