[tasks.build]
description = "Build the search-shadow binary in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the search-shadow binary in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy over the lib, bin and tests with warnings denied"
run = "cargo clippy --release --all-targets -- --deny warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"
