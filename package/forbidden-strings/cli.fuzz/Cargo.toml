[package]
name = "forbidden-strings-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[package.metadata]
cargo-fuzz = true

[dependencies]
# `arbitrary` drives the structured generator; the derive feature powers the small
# closed enums (BadFlag). `libfuzzer-sys` is the harness. `sha2` fingerprints content
# into redacted crash messages (length + SHA-256, never raw bytes).
arbitrary = { workspace = true, features = ["derive"] }
libfuzzer-sys = { workspace = true, features = ["arbitrary-derive"] }
sha2 = { workspace = true }

[dependencies.forbidden-strings]
path = "../cli"
features = ["fuzzing"]
version = "=0.5.0"

# Use independent workspace for fuzzers
[workspace]
members = ["."]

# Library target hosting the shared structured generator used by
# every fuzz target via `use forbidden_strings_fuzz::generators::*;`.
# Cargo would auto-detect `src/lib.rs` even without this section; we
# spell it out so the rename / path-override surface is explicit.
[lib]
name = "forbidden_strings_fuzz"
path = "src/lib.rs"

# Spell out `panic = "unwind"` so libFuzzer can capture and minimize crashes by
# unwinding. The scanner crate under fuzz also uses `unwind` (load-bearing for its
# `catch_unwind` fail-closed scan boundary, see ../cli/Cargo.toml),
# so this does not change the effective strategy today. It is pinned anyway so the
# harness keeps working if the scanner's setting ever changes to `abort`, under which a
# panic would kill the process before libFuzzer records a reproducer.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# The scanner's `build.rs` precompiles its embedded baseline through the
# forbidden-regex build-dependency, which Cargo builds at `opt-level = 0` by default.
# Profiles are read only from this workspace root, so the scanner manifest's own
# build-override does not reach fuzz builds; see ../cli/Cargo.toml
# for the measurement.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

[[bin]]
name = "fuzz_literal_roundtrip"
path = "fuzz_targets/fuzz_literal_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_scan_format"
path = "fuzz_targets/fuzz_scan_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ruleset_scan_invariants"
path = "fuzz_targets/fuzz_ruleset_scan_invariants.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_embedding"
path = "fuzz_targets/fuzz_embedding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cache_envelope"
path = "fuzz_targets/fuzz_cache_envelope.rs"
test = false
doc = false
bench = false

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
arbitrary = ">=1.4.2"
libfuzzer-sys = ">=0.4.13"
sha2 = ">=0.10.9"
