# No [tools] here: the Rust toolchain (nightly + rust-src + llvm-tools-preview)
# is managed repo-wide in the root mise.no-env.toml [tools], so every crate
# shares one channel. mise still applies that toolchain to tasks run in this
# directory; cargo-fuzz needs the nightly it provides.

[tasks."lint:clippy:container"]
description = "Check all fuzz sidecar targets with Clippy in the bounded mount-free offline snapshot"
run = "node bin/smoke-container.mjs --clippy"

[tasks."smoke:embedding:container"]
description = "Fuzz native embedding snapshots with ASan in a mount-free offline 2 GiB / 2 CPU container"
run = "node bin/smoke-container.mjs"

[tasks.test]
description = "cargo nextest run --lib (unit tests for the structured generator)"
# Scoped to `--lib`: the library target hosts the generator unit tests
# (src/generators_tests.rs). The fuzz_targets/* bins are libFuzzer harnesses
# that only link under cargo-fuzz's injected sanitizer-coverage RUSTFLAGS, so a
# plain `cargo nextest run` over all targets would fail to build them. nextest
# is inherited from the repo-root [tools]; the nightly toolchain declared there
# applies, which nextest runs under without issue.
run = "cargo nextest run --lib --release"

[tasks."format:clippy"]
description = "Apply Clippy's machine-applicable suggestions to every Rust target"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets"

[tasks."lint:clippy"]
description = "Run Clippy over every Rust target with warnings denied"
run = "cargo clippy --release --all-targets -- --deny warnings"

[tasks.list]
description = "List all fuzz targets"
run = "cargo fuzz list --fuzz-dir ."

[tasks.build]
description = "Build all fuzz targets (AddressSanitizer instrumented)"
# `--target x86_64-unknown-linux-gnu` is load-bearing: cargo-fuzz 0.13.1
# defaults to `x86_64-unknown-linux-musl` on Linux, but the ASAN flags it
# sets via RUSTFLAGS conflict with musl's static libc
# (`sanitizer is incompatible with statically linked libc, disable it
# using -C target-feature=-crt-static`). Forcing gnu picks a target where
# dynamic libc satisfies the sanitizer. macOS / Windows hosts cannot use
# this task as-written; would need a per-platform target switch.
#
# `--sanitizer address` is explicit even though `address` is cargo-fuzz's
# default: it pins AddressSanitizer (memory-error detection: heap/stack
# overflows, use-after-free) so a future cargo-fuzz default change cannot
# silently drop it. Note the gnu target above exists precisely because ASAN
# is on. A Rust panic / failed assertion is a logic abort, not a memory
# error, so libFuzzer (not ASAN) reports it with its "rudimentary signal
# handlers ... Combine libFuzzer with AddressSanitizer" note; that note is
# normal for panic crashes and does NOT mean ASAN is off.
run = "cargo fuzz build --fuzz-dir . --sanitizer address --target x86_64-unknown-linux-gnu"

[tasks.smoke]
description = "Run every fuzz target for 30s with the dictionary as a smoke test (AddressSanitizer instrumented)"
# `--target x86_64-unknown-linux-gnu` and `--sanitizer address` rationale: see build.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdirSync } = await import('node:fs')
const targets = execFileSync('cargo', ['fuzz', 'list', '--fuzz-dir', '.'], { encoding: 'utf8' }).split('\\n').map((line) => line.trim()).filter(Boolean)
for (const target of targets) {
  console.log(`--- ${target} ---`)
  // Dual corpus: gitignored scratch first (libFuzzer writes new discoveries
  // only to the first dir), committed seed/<target> second (read-only in
  // practice). Explicit corpus positionals replace cargo-fuzz's default
  // corpus/<target>, and cargo-fuzz only auto-creates the default, so both
  // dirs are created here before the run.
  mkdirSync(`corpus/${target}`, { recursive: true })
  mkdirSync(`seed/${target}`, { recursive: true })
  execFileSync('cargo', ['fuzz', 'run', '--fuzz-dir', '.', target, '--sanitizer', 'address', '--target', 'x86_64-unknown-linux-gnu', `corpus/${target}`, `seed/${target}`, '--', '-max_total_time=30', '-rss_limit_mb=2048', '-dict=dictionary/forbidden-strings.dict'], { stdio: 'inherit' })
}
"""

[tasks.run]
description = "Run or replay one fuzz target. Pass libFuzzer flags (e.g. -max_total_time=30) and/or input paths (a crash artifact or corpus dir) after --."
usage = """
arg "target" help="Fuzz target name (e.g. fuzz_extract_gate_soundness)"
arg "[args]" var=#true help="libFuzzer flags (-flag=v) and/or input paths to replay (artifacts/<target>/crash-...)"
"""
# `--target x86_64-unknown-linux-gnu` rationale: see build.
#
# usage_args arrives shell-escaped; parseUsageArgs recovers the argument
# vector (single-quoted spans kept whole, outer quotes stripped), so cargo
# forwards clean flags/paths to libfuzzer rather than literal-quoted tokens.
#
# Partition (artifact replay): split the extras into FLAG args
# (leading `-`, e.g. `-max_total_time=30`) and INPUT paths (no leading
# `-`, e.g. `artifacts/<target>/crash-...`). cargo-fuzz appends the
# default `corpus/<target>` positional ONLY when no input positional is
# given before `--`. So a single crash artifact must be passed as an
# input positional (before `--`), not as a libFuzzer arg (after `--`):
# otherwise libfuzzer receives both the artifact file AND a corpus dir
# as positionals, tries to opendir the file, and exits 1 with
# "Not a directory: artifacts/<target>/crash-...; exiting". Inputs go
# before `--` (cargo-fuzz CORPUS slot, suppressing the default corpus);
# flags go after `--`. With no input, continuous fuzzing runs over the
# dual corpus: gitignored scratch corpus/<target> first (libFuzzer
# writes new discoveries only to the first dir), committed
# seed/<target> second. Both dirs are created up front because
# cargo-fuzz only auto-creates its default corpus positional.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
const { execFileSync } = await import('node:child_process')
const { mkdirSync } = await import('node:fs')
const target = process.env.usage_target
const extras = parseUsageArgs(process.env.usage_args ?? '')
const flags = extras.filter((part) => part.startsWith('-'))
const replays = extras.filter((part) => !part.startsWith('-'))
const corpusDirs = [`corpus/${target}`, `seed/${target}`]
if (replays.length === 0) {
  for (const dir of corpusDirs) {
    mkdirSync(dir, { recursive: true })
  }
}
const inputs = replays.length === 0 ? corpusDirs : replays
execFileSync('cargo', ['fuzz', 'run', '--fuzz-dir', '.', target, '--sanitizer', 'address', '--target', 'x86_64-unknown-linux-gnu', ...inputs, '--', '-dict=dictionary/forbidden-strings.dict', ...flags], { stdio: 'inherit' })
"""

[tasks."lock:members"]
description = "Record a changed version of a path dependency in this lockfile without moving any other locked version"
run = "cargo update --offline --workspace"
