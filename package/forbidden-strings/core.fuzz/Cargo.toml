[package]
name = "forbidden-regex-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[package.metadata]
cargo-fuzz = true

[dependencies]
# `anyhow` carries errors in the developer-only artifact decoder helper binary.
anyhow = { workspace = true }
arbitrary = { workspace = true, features = ["derive"] }
libfuzzer-sys = { workspace = true, features = ["arbitrary-derive"] }
# The differential oracle. `regex` cannot do `&`/`~`, so the differential target only
# generates the shared dialect (no set algebra) and compares byte verdicts. Kept inside
# the inline `[dependencies]` block: a bare key after a `[dependencies.<name>]` subtable
# would bind to that subtable instead of being a top-level dependency.
regex = { workspace = true }

# The engine under test, by path (sibling crate). The public API (compile / RegexSet /
# from_bytes / is_match / matches) is the whole fuzz surface, so no internal-access
# feature is needed.
[dependencies.forbidden-regex]
path = "../core"
version = "=0.1.1"

# Use an independent workspace for the fuzzers, like the sibling fuzz package.
[workspace]
members = ["."]

# Library target hosting the structured pattern/content generator shared by the
# roundtrip and differential targets via `use forbidden_regex_fuzz::generators::*;`.
[lib]
name = "forbidden_regex_fuzz"
path = "src/lib.rs"

# Inherit `panic = "unwind"` from the engine crate so libFuzzer can capture and
# minimize crashes via unwinding. Under `panic = "abort"` a panic would abort the
# process before libFuzzer records a reproducer.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[[bin]]
name = "fuzz_compile"
path = "fuzz_targets/fuzz_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_from_bytes"
path = "fuzz_targets/fuzz_from_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_differential"
path = "fuzz_targets/fuzz_differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_line_matches"
path = "fuzz_targets/fuzz_line_matches.rs"
test = false
doc = false
bench = false

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
anyhow = ">=1.0.104"
arbitrary = ">=1.4.2"
libfuzzer-sys = ">=0.4.13"
regex = ">=1.12.4"
