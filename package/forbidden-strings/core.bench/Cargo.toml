[package]
name = "forbidden-regex-bench"
version = "0.1.0"
# The crate also carries the `seedless` diagnostic bin under src/bin, so a bare
# `cargo run` (the mise `bench` task) would be ambiguous; pin the throughput bench.
default-run = "forbidden-regex-bench"
edition = "2024"
publish = false
description = "Throughput benchmark comparing forbidden-regex against the regex crate on a pre-serialized RegexSet."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[[bin]]
name = "forbidden-regex-bench"
path = "src/main.rs"

[dependencies]
# The engine under test, by path so the comparison never enters its published
# dependency graph.
forbidden-regex = { path = "../core", version = "=0.1.1" }

# The baseline. `regex` cannot do `&`/`~`, but the dialect overlap (literals,
# classes, bounded repetition, alternation, anchors) is exactly where a fair
# head-to-head throughput comparison lives.
regex = { workspace = true }

# The scanner crate, by path, imported ONLY for its exported BUILTIN_RULES
# constant (the embedded betterleaks-ported baseline the bench replays); this
# replaces a fragile ../../../../ include_str! into the repository root.
forbidden-strings = { path = "../../forbidden-strings/cli", version = "=0.5.0" }

# The same gitignore-aware walker the real forbidden-strings scanner uses, so the
# corpus is the exact file set that scanner would process (honors `.gitignore`,
# `.git/info/exclude`, skips `.git`/`.jj`).
ignore = { workspace = true }

# The logging facade and its subscriber. The bench's [phase]/[diag]/[oracle] progress and
# the parity WARNINGs become tracing events on stderr (RUST_LOG, default info); the
# throughput report itself stays on stdout via println!.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Build both engines under one standard release profile so neither is advantaged:
# whole-graph LTO, one codegen unit, full optimization. Overflow checks stay off
# here (the deployed scanner turns them on; this measures the algorithm).
[profile.release]
lto = true
codegen-units = 1
opt-level = 3

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
ignore = ">=0.4.33"
regex = ">=1.12.4"
tracing = ">=0.1.44"
tracing-subscriber = ">=0.3.23"
