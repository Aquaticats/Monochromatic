[tasks.build]
description = "Build the throughput benchmark in release mode"
run = "cargo build --release"

[tasks.run]
description = "Run the throughput benchmark vs the regex crate"
run = "cargo run --release"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."lock:members"]
description = "Record a changed version of a path dependency in this lockfile without moving any other locked version"
run = "cargo update --offline --workspace"
