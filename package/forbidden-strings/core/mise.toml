[tasks.build]
description = "Build the forbidden-regex library in release mode"
run = "cargo build --locked --release"

[tasks."build:debug"]
description = "Build the forbidden-regex library in debug mode"
run = "cargo build --locked"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check --locked"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --locked --release --all-targets -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

[tasks."test:debug"]
description = "cargo nextest run in debug mode for fast TDD iteration"
# Debug builds skip release LTO, so iteration is fast during the counting-automaton
# rebuild. The release `test` task is the gate before declaring a milestone done.
run = "cargo nextest run"

[tasks.bench]
description = "Throughput (lines/second) comparison vs the regex crate on a pre-serialized RegexSet"
# Bench lives in a sidecar crate (../core.bench) so the regex comparison
# dep never enters this published crate's own test/build graph. resharp is deferred
# (its serialized matcher is too slow to be a useful baseline).
run = "cargo run --release --manifest-path ../core.bench/Cargo.toml"

[tasks."test:mutation:image"]
description = "Build the Podman image that runs mutation testing (one-time; layer-cached)"
# Podman caches layers so re-runs are fast no-ops; the toolchain argument comes from toolchain.lock.json.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
// RUST_TOOLCHAIN is the nightly toolchain.lock.json records; the Containerfile has no default, so a build without it stops.
const rustToolchainBuildArgument = execFileSync('node', [process.getBuiltinModule('node:path').resolve(process.cwd(), '../../test-harness/core-matrix/src/bin/locked-rust-toolchain.ts'), '--build-argument'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim()
execFileSync('podman', ['build', '--build-arg', rustToolchainBuildArgument, '--tag', 'forbidden-regex-mutants', '--file', 'mutants.Containerfile', '.'], { stdio: 'inherit' })
"""

[tasks."test:mutation:snapshot"]
description = "Bake the crate, its tests, its lockfile, its cargo-mutants configuration and its fetched dependencies into the source snapshot image a mutation campaign layers over; `-- --memory <size> --cpus <count>` bound the build"
# Needs the base image of test:mutation:image and a network for `cargo fetch`; the campaign itself runs offline.
run = "node bin/build-test-image.ts"

[tasks."test:mutation"]
description = "Mutation-test the engine in a mount-free, bounded container (mutated code must not run on the host); `-- --file src/<glob>.rs --examine <regex> --timeout <s> --build-timeout <s> --memory <size> --cpus <count> --pids-limit <count>` go to the campaign step only"
depends = ["test:mutation:image"]
# cargo-mutants compiles and runs MUTATED source: arbitrary, unpredictable code that runs ONLY inside a disposable
# rootless Podman container with no network, never on the host. The crate is baked into the snapshot image, not mounted;
# the crate's .cargo/mutants.toml excludes the proven-equivalent mutants. One campaign runs one container; several run
# at once through the launcher of package/mutation-test/cli-cargo-mutants (its slot limiter bounds how many).
run = ["node bin/build-test-image.ts", "node bin/mutate-container.ts"]

[tasks."lint:scripts:types"]
description = "Type-check the verification scripts in bin (TypeScript)"
extends = "lint:types"

[tasks."lint:scripts:oxlint"]
description = "Lint explicitly selected engine TypeScript script paths with Oxlint"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('lint:scripts:oxlint requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', files)
"""

[tasks."format:scripts:oxlint"]
description = "Auto-fix explicitly selected engine TypeScript script paths with Oxlint"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('format:scripts:oxlint requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...files])
"""

[tasks.release]
description = "Start the forbidden-regex release on GitHub and print the run URL: `-- <from> <to> <note>` (quote the note; `--dry-run` first runs everything except the push and the publish). The crate-release workflow bumps the crate and every exact pin of it, checks, dry-runs the publish, pushes the bump to main and starts cargo-publish; nothing compiles here"
run = "node ../../crate-release/cli/bin/dispatch-release.ts --crate forbidden-regex"

[tasks."release:wait"]
description = "Follow the release run that `release` printed, then the cargo-publish run it started, then check crates.io (a library has no GitHub release, so the check ends with PUBLISH CHECK FAILED naming only the missing release assets; the crates.io line is its result): `-- <run URL or id> <version>`"
run = "node ../../crate-release/cli/bin/await-release.ts --crate forbidden-regex"
