[tasks.build]
description = "Build the forbidden-regex library in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the forbidden-regex library in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.package]
description = "Build the crates.io package tarball"
run = "cargo package"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run --release"

[tasks."test:debug"]
description = "cargo nextest run in debug mode for fast TDD iteration"
# Debug builds skip release LTO, so iteration is fast during the counting-automaton
# rebuild. The release `test` task is the gate before declaring a milestone done.
run = "cargo nextest run"

[tasks.bench]
description = "Throughput (lines/second) comparison vs the regex crate on a pre-serialized RegexSet"
# Bench lives in a sidecar crate (../core.bench) so the regex comparison
# dep never enters this published crate's own test/build graph. resharp is deferred
# (its serialized matcher is too slow to be a useful baseline).
run = "cargo run --release --manifest-path ../core.bench/Cargo.toml"

[tasks."test:mutation:image"]
description = "Build the Podman image that runs mutation testing (one-time; layer-cached)"
# Single bare command; podman caches layers so re-runs are fast no-ops.
run = "podman build --tag forbidden-regex-mutants --file mutants.Containerfile ."

[tasks."test:mutation"]
description = "Mutation-test the engine inside a Podman container (mutated code must not run on the host)"
depends = ["test:mutation:image"]
# cargo-mutants compiles and runs MUTATED source: arbitrary, unpredictable code that runs
# ONLY inside this disposable rootless Podman container, never on the host. The crate is
# mounted read-write (cargo-mutants writes its build copies and mutants.out); a named
# volume caches the crates.io registry so only the first run downloads deps.
#
# cargo-mutants defaults to ONE mutant at a time, which left the box idle; this runs
# `--jobs` mutants in parallel, scaled to the host (cores minus two, to keep the machine
# responsive), and caps the container at the same core count and proportional memory per
# the repo's heavy-run isolation rule (bounds stated explicitly). `--security-opt
# label=disable` avoids relabeling the host crate tree (namespace isolation is what keeps
# mutated code off the host). Extra cargo-mutants flags pass straight through (e.g.
# `mise run test:mutation -- --file src/parse.rs` to scope, or `-- --list` to enumerate).
shell = "node --input-type=module-typescript -e"
run = """
const os = await import('node:os')
const { execFileSync } = await import('node:child_process')
const cores = os.cpus().length
const jobs = Math.max(1, cores - 2)
const memGb = Math.max(6, Math.min(jobs * 2, 24))
const extra = process.argv.slice(1)
try {
  execFileSync('podman', [
    'run', '--rm', '--security-opt', 'label=disable',
    `--cpus=${jobs}`, `--memory=${memGb}g`,
    '--volume', `${process.cwd()}:/work`,
    '--volume', 'forbidden-regex-mutants-registry:/usr/local/cargo/registry',
    '--workdir', '/work', 'forbidden-regex-mutants',
    'cargo', 'mutants', '--colors=never', '--jobs', String(jobs), ...extra,
  ], { stdio: 'inherit' })
} catch (err) {
  // cargo-mutants exits non-zero when any mutant survives or times out; surface that exit
  // code as the task's own (a CI gate) without a Node stack-trace dump over the report.
  process.exitCode = err.status ?? 1
}
"""
