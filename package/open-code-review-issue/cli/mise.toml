[tasks.run]
description = "Run open-code-review-issue from source"
run = "node src/cli.ts"

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks."test:integration"]
description = "Run built CLI integration tests against disposable fixtures and a fake gh executable"
run = "node src/cli.integration.test.ts"

[tasks.buildAndTest]
description = "Build the CLI, then run unit and integration tests"
run = ["mise run build", "mise run test:unit", "mise run test:integration"]
