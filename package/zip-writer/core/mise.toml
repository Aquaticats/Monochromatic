[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."watch:lint:types"]
extends = "watch:lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build neutral ZIP writer artifacts, then run unit tests"
run = ["mise run build", "mise run test:unit"]
