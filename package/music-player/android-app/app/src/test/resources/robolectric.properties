# Robolectric defaults for the Compose wiring tests under src/test/kotlin/dev/monochromatic/musicplayer/wiring.
# sdk: the app's targetSdk (36), the only runtime jar the tests download; Robolectric 4.17 lists it for JDK 21 or newer.
# application: a bare Application, so the debug build's StrictMode and library warm-up never start in a test.
sdk=36
application=android.app.Application
