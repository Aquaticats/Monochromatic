# Android island. mise owns this package by shelling to the committed Gradle
# wrapper, the pattern the kopia Jetpack Compose vet established. pnpm has no part
# in this build graph; cargo takes part only through cargo-ndk, which
# cross-compiles the native engine .so (see build:native).
#
# The toolchain (JDK, Android SDK command-line tools, cargo-ndk) is provisioned
# from the root mise manifest, not here, so the repo is self-contained from one
# place (see the "Android toolchain" block in mise.toml). mise exports
# ANDROID_HOME / ANDROID_SDK_ROOT from the android-sdk tool, which Gradle and
# cargo-ndk both read, so no machine-local local.properties is required. The SDK
# *components* (platforms, build-tools, ndk, platform-tools) and the Android Rust
# target are installed by the run-once root `prepare:android` task (auto-run by the
# `prepare` umbrella).
#
# One engine, one variant: the media3 and hybrid flavors are gone (the full-Rust
# engine won the head-to-head), so the tasks below drive the single debug/release
# variant (assembleDebug, testDebugUnitTest, connectedDebugAndroidTest, lintDebug).

[vars]
# Shared Clippy dispatcher for the Android-native crate. Clippy must run through
# cargo-ndk because the crate imports Android-only NDK APIs. opusic-sys also needs
# ANDROID_NDK_HOME propagated explicitly so its CMake build cross-compiles libopus.
android_clippy_dispatch = '''
const { existsSync, readdirSync } = await import("node:fs")
const { join } = await import("node:path")
const { execFileSync } = await import("node:child_process")
const sdk = process.env.ANDROID_HOME
if (!sdk) {
  throw new Error("ANDROID_HOME is unset; run `mise install` at the repo root.")
}
const ndkDir = join(sdk, "ndk")
const ndks = existsSync(ndkDir)
  ? readdirSync(ndkDir).filter((entry) => existsSync(join(ndkDir, entry, "build", "cmake", "android.toolchain.cmake")))
  : []
if (ndks.length === 0) {
  throw new Error(`No NDK under ${ndkDir}; run \`mise run prepare:android\` once to install it.`)
}
const ndkHome = join(ndkDir, ndks.sort((left, right) => left.localeCompare(right, undefined, { numeric: true })).at(-1))
const runAndroidClippy = (cargoArgs) => {
  execFileSync(
    "cargo",
    ["ndk", "--target", "arm64-v8a", "--target", "x86_64", "--platform", "26", ...cargoArgs],
    { stdio: "inherit", env: { ...process.env, ANDROID_NDK_HOME: ndkHome } },
  )
}
'''

# Tools (java, android-sdk, cargo-ndk) are inherited from the root mise manifest;
# this package declares no [tools] of its own. The one-time SDK-component install
# is the root `prepare:android` task (the `prepare` umbrella auto-runs it). See
# mise.toml.

[tasks."build:native"]
description = "Cross-compile the native engine .so for both 64-bit ABIs (arm64-v8a for real devices, x86_64 for emulators; 16KB-aligned via the NDK 29 linker default, API 26 floor) into app/src/main/jniLibs. Derives and exports ANDROID_NDK_HOME from the mise-provisioned $ANDROID_HOME/ndk (run prepare:android once)."
dir = "{{config_root}}/rust"
shell = "node --input-type=module-typescript -e"
run = '''
const { existsSync, readdirSync, readFileSync, rmSync } = await import("node:fs");
const { join } = await import("node:path");
const sdk = process.env.ANDROID_HOME;
if (!sdk) {
  throw new Error("ANDROID_HOME is unset; the android-sdk mise tool exports it. Run `mise install` at the repo root.");
}
const ndkDir = join(sdk, "ndk");
// An NDK install is a version dir carrying the CMake toolchain file; ignore anything else.
const ndks = existsSync(ndkDir)
  ? readdirSync(ndkDir).filter((e) => existsSync(join(ndkDir, e, "build", "cmake", "android.toolchain.cmake")))
  : [];
if (ndks.length === 0) {
  throw new Error(`No NDK under ${ndkDir}; run \`mise run prepare:android\` once to install it.`);
}
// Pick the highest version, matching cargo-ndk's own autodetect choice.
const ndkHome = join(ndkDir, ndks.sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).at(-1));
const toolchainFile = join(ndkHome, "build", "cmake", "android.toolchain.cmake");
// Self-heal against poisoned opusic-sys CMake caches for both ABIs. A configure
// without the Android toolchain, against another NDK, or before this checkout was
// moved leaves compiler checks and absolute CMAKE_CACHEFILE_DIR paths that CMake
// never re-evaluates. Purge only caches whose toolchain, target path, or x86 SSE
// marker is wrong; healthy caches stay incremental.
const buildRoots = ["target/aarch64-linux-android", "target/x86_64-linux-android"];
for (const buildRoot of buildRoots) {
  if (!existsSync(buildRoot)) {
    continue;
  }
  for (const profile of readdirSync(buildRoot)) {
    const profBuild = join(buildRoot, profile, "build");
    if (!existsSync(profBuild)) {
      continue;
    }
    for (const entry of readdirSync(profBuild)) {
      if (!entry.startsWith("opusic-sys-")) {
        continue;
      }
      const cacheDir = join(process.cwd(), profBuild, entry, "out", "build");
      const cachePath = join(cacheDir, "CMakeCache.txt");
      if (!existsSync(cachePath)) {
        continue;
      }
      const cache = readFileSync(cachePath, "utf8");
      const currentDirectory = `CMAKE_CACHEFILE_DIR:INTERNAL=${cacheDir}`;
      const healthy = cache.includes(toolchainFile)
        && cache.includes(currentDirectory)
        && !cache.includes("SSE1_SUPPORTED:INTERNAL=1");
      if (!healthy) {
        console.log(`Purging poisoned opusic-sys CMake cache (forces clean reconfigure): ${join(profBuild, entry)}`);
        rmSync(join(profBuild, entry), { recursive: true, force: true });
      }
    }
  }
}
// cargo-ndk autodetects the NDK for its own Rust cross-toolchain, but it does NOT
// export ANDROID_NDK_HOME to child build scripts. opusic-sys (bundled libopus)
// reads ANDROID_NDK_HOME to apply the CMake android toolchain; without it that
// build silently falls back to a HOST compile (and a /usr/local install). So set
// it explicitly, derived from the mise SDK, keeping the build self-contained.
const { execFileSync } = await import("node:child_process");
// Build both 64-bit ABIs in one invocation: arm64-v8a for physical devices and
// x86_64 for emulators (which run the x86_64 system image on an x86_64 host). A
// repeated -t makes cargo-ndk cross-compile each and drop libmusicplayer_native.so
// into the matching jniLibs/<abi>/ dir (jniLibs/arm64-v8a, jniLibs/x86_64). Without
// the x86_64 .so the app dies on an x86_64 emulator with UnsatisfiedLinkError
// ("library libmusicplayer_native.so not found") the instant PlaybackService loads
// the engine. Both ABIs inherit the NDK 29 linker's 16KB max-page-size default, so
// neither trips the emulator's non-16KB-alignment warning. The 32-bit ABIs
// (armeabi-v7a, x86) are intentionally omitted: no current target needs them.
execFileSync(
  "cargo",
  ["ndk", "-t", "arm64-v8a", "-t", "x86_64", "--platform", "26", "-o", "../app/src/main/jniLibs", "build", "--release"],
  { stdio: "inherit", env: { ...process.env, ANDROID_NDK_HOME: ndkHome } },
);
'''

[tasks.build]
description = "Assemble the debug APK (rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:assembleDebug --no-daemon --console=plain"

[tasks."build:release"]
description = "Assemble the optimized (non-debuggable) release APK, debug-signed so it installs unless the MUSIC_PLAYER_KEYSTORE_FILE, _KEYSTORE_PASSWORD, _KEY_ALIAS and _KEY_PASSWORD values are set (rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:assembleRelease --no-daemon --console=plain"

# The release APK's license notices. licenseeAndroidRelease fails when a library's license is not allowed (the
# licensee block in app/build.gradle.kts) and lists the libraries; collectAndroidLibraryNotices copies their NOTICE
# files; the script then checks the native crates with cargo-about (rust/about.toml, network for `cargo fetch`) and
# writes app/build/third-party-licenses/THIRD-PARTY-LICENSES.txt, which the release build packages as
# assets/THIRD-PARTY-LICENSES.txt. Run it before build:release; the release workflow does, and sets
# MUSIC_PLAYER_REQUIRE_THIRD_PARTY_LICENSES=true so a release without the notices fails.
# Decision: ../../../doc/decision/music-player-third-party-licenses.md.
[tasks.notices]
description = "Write app/build/third-party-licenses/THIRD-PARTY-LICENSES.txt: the license notices of the release APK (Android libraries checked by licensee, native crates by cargo-about)"
dir = "{{config_root}}"
run = [
  "./gradlew :app:licenseeAndroidRelease :app:collectAndroidLibraryNotices --no-daemon --console=plain",
  "node ../desktop-app/bin/third-party-notices.mjs --product android --crate rust --output app/build/third-party-licenses/THIRD-PARTY-LICENSES.txt --android-libraries app/build/reports/licensee/androidRelease/artifacts.json --android-library-notices app/build/third-party-licenses/android-library-notices.txt",
]

[tasks.install]
description = "Install the debug APK on the connected device (rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:installDebug --no-daemon --console=plain"

# Build the release APK, install it on every attached device, and launch it on
# each of them. Gradle's installRelease already fans out across all connected
# devices, but a bare `adb shell am start` fails with "more than one
# device/emulator" once more than one is attached, so the launch step enumerates
# `adb devices` and pins -s <serial> per device. adb is the mise-provisioned one
# ($ANDROID_HOME/platform-tools, installed by prepare:android) so it matches the
# version Gradle's installRelease uses and will not bounce the adb server. The
# launch targets the MainActivity launcher component (applicationId
# dev.monochromatic.musicplayer). This is a node -e body (not an array of bare
# commands) because the per-device fan-out is logic; execFileSync throws on a
# non-zero exit, so a failed install still stops before any launch, preserving
# CM2's fail-fast intent.
[tasks."run:release"]
description = "Build the debug-signed release APK, install it on every attached device, and launch it on each of them."
dir = "{{config_root}}"
depends = ["build:release"]
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import("node:child_process");
const { join } = await import("node:path");
const sdk = process.env.ANDROID_HOME;
if (!sdk) {
  throw new Error("ANDROID_HOME is unset; the android-sdk mise tool exports it. Run `mise install` at the repo root.");
}
const adb = join(sdk, "platform-tools", "adb");
// Install the optimized release APK. Gradle's installRelease already targets every
// attached device, so no per-device loop is needed for the install itself.
execFileSync("./gradlew", [":app:installRelease", "--no-daemon", "--console=plain"], { stdio: "inherit" });
// Enumerate attached devices. `adb devices` prints a header line, then one
// "<serial>\t<state>" line per device. Keep only the entries whose state is
// exactly `device` (drop the header and any `offline` / `unauthorized` entries).
const serials = execFileSync(adb, ["devices"], { encoding: "utf8" })
  .split("\n")
  .slice(1)
  .map((line) => line.trim())
  .filter((line) => line.length > 0)
  .map((line) => line.split("\t"))
  .filter((parts) => parts[1] === "device")
  .map((parts) => parts[0]);
if (serials.length === 0) {
  throw new Error("No attached device in `device` state; connect or boot one, then re-run.");
}
// Launch MainActivity on each device, pinning -s <serial> so a multi-device attach
// no longer fails with "more than one device/emulator".
for (const serial of serials) {
  console.log(`Launching on ${serial}`);
  execFileSync(adb, ["-s", serial, "shell", "am", "start", "-n", "dev.monochromatic.musicplayer/.MainActivity"], { stdio: "inherit" });
}
'''

[tasks."test:unit"]
description = "Run host JVM unit tests for the pure-logic core (no device)"
dir = "{{config_root}}"
run = "./gradlew :app:testDebugUnitTest --no-daemon --console=plain"

[tasks."test:instrumented:build"]
description = "Assemble the app + instrumented-test APKs (native .so included; no device). Run on device with am instrument or connectedAndroidTest."
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain"

[tasks."test:instrumented"]
description = "Run instrumented tests on the connected device (pin ANDROID_SERIAL; hold the adb flock; rebuilds the native .so first)"
dir = "{{config_root}}"
depends = ["build:native"]
run = "./gradlew :app:connectedDebugAndroidTest --no-daemon --console=plain"

# Non-destructive on-device instrumented run. Unlike test:instrumented (which uses
# connectedDebugAndroidTest and uninstalls/reinstalls, wiping the SAF grant and the
# warm peak cache), this installs with `-r` (keeps app data + grants) and drives a
# single class via `am instrument`. Defaults to the silent PeakSweepWorkerTest
# (decode-only, no audio); pass another fully-qualified class via the `class` arg,
# but note RustEngineTest plays audio. Caveat: `am instrument` exits 0 even when a
# test fails, so read its output for "OK (N tests)" versus "FAILURES!!!".
[tasks."test:instrumented:device"]
description = "Non-destructive on-device instrumented run (install -r + am instrument; keeps the SAF grant + warm cache). Defaults to the silent PeakSweepWorkerTest; override with the `class` arg."
dir = "{{config_root}}"
depends = ["test:instrumented:build"]
run = [
  "adb install -r app/build/outputs/apk/debug/app-debug.apk",
  "adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk",
  "adb shell am instrument -w -e class {{arg(name='class', default='dev.monochromatic.musicplayer.PeakSweepWorkerTest')}} dev.monochromatic.musicplayer.test/androidx.test.runner.AndroidJUnitRunner",
]

[tasks.lint]
description = "Run Android Lint on the debug variant"
dir = "{{config_root}}"
run = "./gradlew :app:lintDebug --no-daemon --console=plain"

# Enforce KDoc on this app's Kotlin via the shared kotlin-linter (package/linter/kotlin).
# Scans only this app's main source root so detekt never walks node_modules/build.
# Picked up by the root `lint:detekt` fanout.
[tasks."lint:detekt"]
description = "Enforce KDoc on this app's Kotlin via the shared kotlin-linter"
dir = "{{config_root}}"
run = "../../linter/kotlin/gradlew --project-dir ../../linter/kotlin detektCheck -PdetektInput={{config_root}}/app/src/main/kotlin --no-daemon --console=plain"

[tasks."format:clippy"]
description = "Apply Clippy's machine-applicable suggestions to every Android-native Rust target"
dir = "{{config_root}}/rust"
shell = "node --input-type=module-typescript -e"
run = '''
{{vars.android_clippy_dispatch}}
runAndroidClippy(["clippy", "--fix", "--allow-dirty", "--allow-staged", "--allow-no-vcs", "--all-targets"])
'''

[tasks."lint:clippy"]
description = "Run Clippy over every Android-native Rust target for both supported ABIs"
dir = "{{config_root}}/rust"
shell = "node --input-type=module-typescript -e"
run = '''
{{vars.android_clippy_dispatch}}
runAndroidClippy(["clippy", "--release", "--all-targets", "--", "--deny", "warnings"])
'''

[tasks.clean]
description = "Delete Gradle build outputs"
dir = "{{config_root}}"
run = "./gradlew clean --no-daemon --console=plain"
