# Cargo work runs on the HOST when the native dev libraries are present, and
# falls back to the CachyOS build container otherwise (see Containerfile).
# On non-Linux targets (macOS, Windows) every task takes a NATIVE cargo branch
# first (process.platform !== 'linux'): no pkg-config/PipeWire probe, no podman
# fallback (a Linux container cannot produce a macOS or Windows binary), and the
# audio backend is cpal (src/output_cpal.rs: CoreAudio on macOS, WASAPI on
# Windows). Prereqs:
#   macOS:   a Rust toolchain with `cargo` on PATH; `cmake` plus the Command Line
#            Tools C compiler (the opus crate's opusic-sys backend builds libopus
#            1.6.1 from source via cmake). The repo's mise `aqua:Kitware/CMake`
#            tool provides cmake; `brew install cmake` also works.
#   Windows: rustup (msvc host) + a nightly toolchain on PATH; Visual Studio (C++
#            build tools with the CRT, the linker `link.exe` and the Windows SDK, which
#            rustc finds through vswhere); and `cmake` on PATH (opusic-sys builds
#            libopus 1.6.1 via cmake; 1.6.1's cmake_minimum_required is 3.16, so
#            CMake 4 needs no policy override). No LLVM is needed: the linker is
#            Visual Studio's `link.exe` (doc/decision/music-player-windows-linkers.md).
#            See HANDOVER.windows-toolchain-and-check.md. The `build:windows-gnu` and
#            `test:windows-gnu` tasks build the GNU target instead (MSYS2 MinGW-w64
#            gcc on PATH, no Visual Studio; on Linux they cross-compile in a
#            container and test under Wine); see README "Windows".
# Host build deps (layer with rpm-ostree on an immutable Fedora):
#   pipewire-devel fontconfig-devel freetype-devel
# plus rustup/cargo and libclang already on PATH; cmake comes from the repo's mise
# `aqua:Kitware/CMake` tool (opusic-sys vendors and cmake-builds libopus 1.6.1, so
# no system opus-devel is needed) and the host's system `make` is its generator.
# The cargo_dispatch var (node -e) probes pkg-config for those libraries; when any
# is missing containerCargo runs the same cargo command in podman instead (package
# dir bind-mounted at /work plus the sibling ../truepeak-core and the Android test
# resources mounted read-only, cargo registry in a named volume, `label=disable` to
# skip SELinux relabeling of the host tree). The *:container tasks call
# containerCargo directly to force the podman path regardless of host libraries;
# verify:container is the umbrella assertion.
# Why podman and not mise-managed deps (conda route rejected):
# see ../../../doc/decision/desktop-app-podman-build.md

[env]
# Slint's experimental builtins (FlexboxLayout in the page-tab bar) must be
# enabled for the markup compiler on the host exactly as the Containerfile bakes
# them for the container path; without it the UI compile fails with "Unknown
# element". podman does not forward host env into the container, so this only
# affects the host branch (the image sets its own copy). Needed on macOS too,
# since the same UI markup is compiled there.
SLINT_ENABLE_EXPERIMENTAL_FEATURES = "1"
# NOTE: LIBCLANG_PATH was a process-wide env here but is now set inside the Linux
# hostEnv() of cargo_dispatch below, NOT globally. On macOS it must stay UNSET so
# bindgen finds the Command Line Tools' libclang automatically; a global Linux
# path (/usr/lib64) would point bindgen at a nonexistent directory there.

[vars]
# Bootstrap-safe cargo dispatch for this package. Interpolated into the cargo
# tasks, each of which sets `shell = "node --input-type=module-typescript -e"`.
# - On macOS/Windows (process.platform !== 'linux') runCargo builds natively with
#   no host env and no container (a Linux container cannot produce those binaries;
#   cpal is the audio backend there).
# - hostOk (Linux): cargo on PATH and pkg-config resolves the PipeWire + Slint font
#   libraries (fontconfig also validates its freetype2 Requires). libopus is NOT
#   probed; the opus crate's opusic-sys backend cmake-builds libopus 1.6.1.
# - hostEnv() (Linux host branch only): LIBCLANG_PATH points bindgen (libspa-sys)
#   at the versioned host libclang, and BINDGEN_EXTRA_CLANG_ARGS supplies the clang
#   resource dir (globbed so an LLVM bump needs no edit) since libclang in
#   /usr/lib64 looks beside itself for stdbool.h under /usr/lib/clang/<v>.
# - containerCargo(args): build the image when missing, then run cargo in podman, with ../truepeak-core and the Android
#   test resources mounted read-only beside /work (a Cargo path dependency and the theme-roles drift fixture).
# - runCargo(args): native off Linux, else host when hostOk, else container.
# Its imported bindings (execFileSync, globSync) are reused by inline follow-ups,
# so those must not reimport them.
cargo_dispatch = """
const { execFileSync } = await import('node:child_process')
const { globSync } = await import('node:fs')
const onPath = (command) => { try { execFileSync('which', [command], { stdio: 'ignore' }); return true } catch { return false } }
const pkgConfigOk = () => { try { execFileSync('pkg-config', ['--exists', 'libpipewire-0.3', 'fontconfig', 'freetype2'], { stdio: 'ignore' }); return true } catch { return false } }
const hostOk = onPath('cargo') && pkgConfigOk()
const hostEnv = () => {
  const clangDirs = globSync('/usr/lib/clang/*').sort()
  const resourceDir = clangDirs[clangDirs.length - 1]
  return { ...process.env, LIBCLANG_PATH: '/usr/lib64', BINDGEN_EXTRA_CLANG_ARGS: `-resource-dir=${resourceDir}` }
}
const defaultContainer = { image: 'localhost/monochromatic/music-player', containerfile: 'Containerfile', cargoVolume: 'music-player-cargo', limits: [], env: [], program: 'cargo' }
// CACHYOS_IMAGE is the CachyOS image this host's CPU level supports (cachyos-v4, -v3 or plain), resolved by the repository's
// cachyos-image command; it throws on a host that is not x86-64, because these images have no Alpine variant.
const cachyosBuildArguments = (imageName) => ['--build-arg', execFileSync('node', [process.getBuiltinModule('node:path').resolve(process.cwd(), '../../test-harness/core-matrix/src/bin/cachyos-image.ts'), '--image-name', imageName, '--build-argument'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim()]
const containerCargo = (cargoArgs, containerOptions = {}) => {
  const container = { ...defaultContainer, ...containerOptions }
  let imageExists = true
  try { execFileSync('podman', ['image', 'exists', container.image], { stdio: 'ignore' }) } catch { imageExists = false }
  if (!imageExists) { execFileSync('podman', ['build', ...cachyosBuildArguments(container.image.split('/').pop()), '-t', container.image, '-f', container.containerfile, '.'], { stdio: 'inherit' }) }
  // Forward SLINT_EMIT_DEBUG_INFO into the container ONLY when the caller set it
  // (the test + mcp tasks do). podman does not inherit host env, and the
  // ElementHandle / MCP introspection APIs refuse to run without this debug info.
  // Production build tasks never set it, so their container binaries stay lean.
  const debugInfoEnv = process.env.SLINT_EMIT_DEBUG_INFO ? ['-e', 'SLINT_EMIT_DEBUG_INFO=1'] : []
  // The crate reads two paths outside its own directory, and the container mounts only the package directory at
  // /work, so each is mounted read-only where the same relative path from /work finds it: ../truepeak-core is the
  // Cargo path dependency, and ../android-app/app/src/test/resources holds the theme-roles-vector.txt fixture that
  // src/theme_roles_fixture_tests.rs compares with the Rust derivation. A missing source fails here by name, never
  // as a skipped test or a bare podman statfs error. The repository's root clippy.toml (the fleet-wide ban on
  // Result::unwrap) is mounted at /clippy.toml: clippy searches the ancestors of /work, so the container lint runs
  // with the same rules as the host lint (issue 1756).
  const { resolve } = process.getBuiltinModule('node:path')
  const { existsSync } = process.getBuiltinModule('node:fs')
  const siblingMounts = [['../truepeak-core', '/truepeak-core'], ['../android-app/app/src/test/resources', '/android-app/app/src/test/resources'], ['../../../clippy.toml', '/clippy.toml']]
  const siblingMountArgs = siblingMounts.flatMap(([relative, inside]) => {
    const host = resolve(process.cwd(), relative)
    if (!existsSync(host)) { throw new Error(`containerCargo needs ${host} (mounted read-only at ${inside}) but it does not exist; run the task from the checked-out package/music-player/desktop-app directory of a full checkout`) }
    return ['-v', `${host}:${inside}:ro`]
  })
  // A private tmpfs at /run/user/0 is the container's XDG_RUNTIME_DIR, because the notification tests' private D-Bus socket needs the
  // per-user runtime directory (438bc434e4) and a container has none.
  execFileSync('podman', ['run', '--rm', ...container.limits, '--security-opt', 'label=disable', ...debugInfoEnv, ...container.env, '--tmpfs', '/run/user/0:mode=0700', '--env', 'XDG_RUNTIME_DIR=/run/user/0', '-v', `${process.cwd()}:/work`, ...siblingMountArgs, '-v', `${container.cargoVolume}:/cargo`, '-w', '/work', container.image, container.program, ...cargoArgs], { stdio: 'inherit' })
}
const runCargo = (cargoArgs) => {
  if (process.platform !== 'linux') { execFileSync('cargo', cargoArgs, { stdio: 'inherit' }) }
  else if (hostOk) { execFileSync('cargo', cargoArgs, { stdio: 'inherit', env: hostEnv() }) }
  else { containerCargo(cargoArgs) }
}
"""

# Dispatch for the x86_64-pc-windows-gnu tasks. Interpolated after cargo_dispatch, whose bindings it reuses.
# - On Windows the build is NATIVE: rustup with the GNU target (or a GNU host) and an MSYS2 MinGW-w64 gcc on PATH
#   (the cmake crate and rustc then use GNU ld through gcc; no Visual Studio is involved).
# - On Linux it is a CROSS build inside the Containerfile.windows-gnu image (mingw-w64 from CachyOS), capped at 6 GiB and 4
#   CPUs, with its own target directory so the Linux build cache is untouched; tests run under Wine (the image sets
#   the cargo runner for this target). The image carries the linker and runner variables, so none are passed here.
# - macOS cannot run either path.
windows_gnu_dispatch = """
const gnuTarget = 'x86_64-pc-windows-gnu'
const gnuContainer = {
  image: 'localhost/monochromatic/music-player-windows-gnu',
  containerfile: 'Containerfile.windows-gnu',
  cargoVolume: 'music-player-cargo-windows-gnu',
  limits: ['--memory=6g', '--cpus=4'],
  env: ['-e', 'CARGO_TARGET_DIR=/work/target/windows-gnu'],
}
const runWindowsGnu = (cargoArgs) => {
  if (process.platform === 'win32') { execFileSync('cargo', cargoArgs, { stdio: 'inherit' }) }
  else if (process.platform === 'linux') { containerCargo(cargoArgs, gnuContainer) }
  else { throw new Error(`The x86_64-pc-windows-gnu tasks run on Windows (MSYS2 MinGW-w64) or Linux (container + Wine), not ${process.platform}`) }
}
"""

