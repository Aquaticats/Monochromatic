[tasks."test:alpine"]
description = "Alpine (musl) guard in podman, the same commands as the test-alpine job of .github/workflows/music-player-release.yml: build Containerfile.alpine, cargo nextest, build the app and the nested compositor, then the three smoke scenarios (no sound, ALSA, PipeWire)"
# Everything runs inside Alpine containers with explicit bounds; the cargo registry and both target directories live under
# target/alpine-cache (gitignored) so a second run reuses them, as the workflow's actions/cache does. The workflow is the
# reference: change a command in both places.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdirSync } = await import('node:fs')
const { join, resolve } = await import('node:path')
const packageDir = process.cwd()
const musicPlayer = resolve(packageDir, '..')
const compositor = resolve(packageDir, '../../nested-wayland-session/cli')
const cache = join(packageDir, 'target', 'alpine-cache')
for (const sub of ['cargo', 'target-app', 'target-nws', 'scratch', 'smoke-out', 'context']) { mkdirSync(join(cache, sub), { recursive: true }) }
const podman = (args) => execFileSync('podman', args, { stdio: 'inherit' })
for (const target of ['build', 'smoke']) {
  podman(['build', '--target', target, '--tag', `music-player-alpine-${target}`, '--file', 'Containerfile.alpine', join(cache, 'context')])
}
const bounds = ['--memory=12g', '--cpus=4', '--security-opt', 'label=disable']
const appMounts = ['--volume', `${musicPlayer}:/src:ro`, '--volume', `${join(cache, 'cargo')}:/cargo`, '--volume', `${join(cache, 'target-app')}:/target`]
const appEnv = ['--env', 'CARGO_HOME=/cargo', '--env', 'CARGO_TARGET_DIR=/target', '--env', 'CARGO_INCREMENTAL=0', '--env', 'CARGO_PROFILE_DEV_DEBUG=0', '--env', 'SLINT_EMIT_DEBUG_INFO=1', '--env', 'SLINT_ENABLE_EXPERIMENTAL_FEATURES=1']
podman(['run', '--rm', ...bounds, ...appMounts, '--volume', `${join(cache, 'scratch')}:/src/desktop-app/target`, ...appEnv, '--workdir', '/src/desktop-app', 'music-player-alpine-build', 'cargo', 'nextest', 'run', '--locked', '--features', 'alsa-fallback', '--no-fail-fast'])
podman(['run', '--rm', ...bounds, ...appMounts, ...appEnv, '--workdir', '/src/desktop-app', 'music-player-alpine-build', 'cargo', 'build', '--locked', '--features', 'alsa-fallback'])
podman(['run', '--rm', ...bounds, '--volume', `${compositor}:/src:ro`, '--volume', `${join(cache, 'cargo')}:/cargo`, '--volume', `${join(cache, 'target-nws')}:/target`, '--env', 'CARGO_HOME=/cargo', '--env', 'CARGO_TARGET_DIR=/target', '--env', 'CARGO_INCREMENTAL=0', '--env', 'CARGO_PROFILE_RELEASE_LTO=false', '--env', 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16', '--workdir', '/src', 'music-player-alpine-build', 'cargo', 'build', '--release', '--locked'])
podman(['run', '--rm', '--memory=4g', '--cpus=4', '--security-opt', 'label=disable', '--volume', `${join(cache, 'target-app', 'debug', 'music-player')}:/opt/music-player/music-player:ro`, '--volume', `${join(cache, 'target-nws', 'release', 'monochromatic-nested-wayland-session')}:/opt/music-player/nws:ro`, '--volume', `${join(packageDir, 'fixture')}:/opt/music-player/fixture:ro`, '--volume', `${join(cache, 'smoke-out')}:/tmp/smoke-out`, 'music-player-alpine-smoke', 'music-player-smoke'])
console.error(`smoke screenshots and logs: ${join(cache, 'smoke-out')}`)
"""

[tasks."verify:container"]
description = "Assert the container build/clippy/test path works even when the host has the dev libs"
# Aborts on the first failing step (execFileSync throws) so a broken container
# path fails the task rather than being masked by a later passing step.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
execFileSync('mise', ['run', 'image'], { stdio: 'inherit' })
containerCargo(['build', '--release'])
containerCargo(['clippy', '--release', '--', '-D', 'warnings'])
// Only the test step needs the introspection debug info; set it right before so
// the asserted build + clippy steps above still exercise the lean production path.
process.env.SLINT_EMIT_DEBUG_INFO = '1'
containerCargo(['nextest', 'run', '--release'])
"""

[tasks.run]
description = "Build (host if dev libs present, else container), then run the music-player GUI on the host (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# The binary is BUILT host-first (or in the container when the host lacks the
# PipeWire/Opus/clang dev headers) and RUN directly on the host. Running on the
# host means the window, audio, D-Bus, and the KDE taskbar all use the host
# session natively: no socket passthrough, no --userns=keep-id, and the .desktop
# association + LauncherEntry taskbar progress work without the container's SASL
# EXTERNAL uid juggling. A container-built binary links only against runtime libs
# present on the host (verified with `ldd`). A binary runs on a host whose glibc is at least the container's. The container is
# CachyOS, which ships the newest glibc: on 2026-10-29 its release binary needed GLIBC_2.44 (`sinh`, `cosh`) and did not
# start on a Fedora 44 host with glibc 2.43 ("version `GLIBC_2.44' not found"), so on such a host the container
# fallback of this task builds a binary that cannot run there.
#
# The host environment already provides WAYLAND_DISPLAY, XDG_RUNTIME_DIR, the
# D-Bus session bus, PipeWire, and the XDG user dirs, so the empty-launch auto-load
# finds the music directory, GPU GL uses /dev/dri directly, and the session file
# lands in the real ~/.config/music-player. SLINT_BACKEND is read from the host env
# if set (to force the software renderer). The KDE .desktop uses a bare
# `Exec=music-player`, resolved on the systemd user PATH which includes ~/.local/bin
# (verified via `systemctl --user show-environment`) but NOT this package's
# target/release, so the binary is copied to ~/.local/bin to exercise the SAME
# binary the launcher resolves. When HOME is unset, both installs are skipped and
# the freshly built target/release copy is run instead.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
const { mkdirSync, copyFileSync } = await import('node:fs')
const { join } = await import('node:path')
const home = process.env.HOME ?? ''
runCargo(['build', '--release'])
let bin
if (process.platform !== 'linux') {
  bin = process.platform === 'win32' ? './target/release/music-player.exe' : './target/release/music-player'
} else if (home !== '') {
  const appsDir = join(home, '.local/share/applications')
  mkdirSync(appsDir, { recursive: true })
  copyFileSync('share/applications/monochromatic.music-player.desktop', join(appsDir, 'monochromatic.music-player.desktop'))
  const binDir = join(home, '.local/bin')
  mkdirSync(binDir, { recursive: true })
  copyFileSync('target/release/music-player', join(binDir, 'music-player'))
  bin = join(binDir, 'music-player')
} else {
  bin = './target/release/music-player'
}
const extras = parseUsageArgs(process.env.usage_args ?? '')
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."run-quick"]
description = "Release-optimised build WITHOUT link-time optimisation, then run it on the host for fast iteration (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# Middle path between `run` (thin LTO since 2026-10-11, the distributed binary) and `run-debug` (unoptimised, too slow
# to analyse a library). Measured on this crate on a loaded 16-core host (load average 27 to 43, so compare the settings with each
# other, not the absolute numbers): rebuilding only this crate took ~300 s with fat LTO, ~60 s with thin LTO and
# ~17 s with LTO off (two runs each, within 3 s of each other); the binary is 41.6 MB, 46.4 MB and 46.7 MB. Fat LTO
# spends 287 of the 302 s of rustc time in `LLVM_fatlto` (rustc -Ztime-passes), not in compiling this crate's code.
# `CARGO_PROFILE_RELEASE_LTO=off` overrides the profile for this run only, so Cargo.toml (generated by file-enforcer)
# is untouched, and a separate target directory keeps the `run` build cache warm. Like `run-debug`, it does NOT
# install into ~/.local/bin or the .desktop file.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
const { join } = await import('node:path')
process.env.CARGO_PROFILE_RELEASE_LTO = 'off'
process.env.CARGO_TARGET_DIR = join(process.cwd(), 'target', 'quick')
runCargo(['build', '--release'])
const extras = parseUsageArgs(process.env.usage_args ?? '')
const bin = process.platform === 'win32' ? './target/quick/release/music-player.exe' : './target/quick/release/music-player'
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."run-debug"]
description = "Debug build (host if dev libs present, else container), then run it on the host for fast iteration (pass file/folder paths after --)"
usage = '''
arg "[args]" var=#true help="File or folder paths to enqueue"
'''
# Fast-iteration sibling of `run`: builds the unoptimised DEBUG binary (~10s
# incremental, no LTO/strip) and runs target/debug/music-player directly. It does
# NOT copy into ~/.local/bin or install the .desktop, so the installed release
# binary the launcher resolves is left untouched.
shell = "node --input-type=module-typescript -e"
run = """
{{vars.cargo_dispatch}}
{{vars.parse_usage_args}}
runCargo(['build'])
const extras = parseUsageArgs(process.env.usage_args ?? '')
const bin = process.platform === 'win32' ? './target/debug/music-player.exe' : './target/debug/music-player'
execFileSync(bin, extras, { stdio: 'inherit' })
"""

[tasks."gen:fixtures"]
description = "Generate tiny per-codec audio fixtures with host ffmpeg (run once, commit results)"
# Runs on the host: ffmpeg is present there. 0.3s 440Hz stereo sine per codec.
# 48000 Hz is used because libopus only accepts a fixed set of input rates
# (8000/12000/16000/24000/48000); 48000 is the safe common rate.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const specs = [
  { ext: 'wav', args: [] },
  { ext: 'flac', args: [] },
  { ext: 'mp3', args: ['-c:a', 'libmp3lame'] },
  { ext: 'ogg', args: ['-c:a', 'libvorbis'] },
  { ext: 'opus', args: ['-c:a', 'libopus'] },
  { ext: 'aac.m4a', args: ['-c:a', 'aac'] },
  { ext: 'alac.m4a', args: ['-c:a', 'alac'] },
]
for (const spec of specs) {
  const out = `fixture/tone.${spec.ext}`
  console.log(`generating ${out}`)
  execFileSync('ffmpeg', ['-y', '-f', 'lavfi', '-i', 'sine=frequency=440:duration=0.3', '-ac', '2', '-ar', '48000', ...spec.args, out], { stdio: 'inherit' })
}
// offset.opus: a remux of tone.opus with a +0.5s timestamp offset so its first
// audio frame is NOT frame 0, reproducing the Ogg/Opus seek-to-start bug that the
// seek_to_start_of_offset_opus regression test depends on.
console.log('generating fixture/offset.opus')
execFileSync('ffmpeg', ['-y', '-i', 'fixture/tone.opus', '-c', 'copy', '-output_ts_offset', '0.5', 'fixture/offset.opus'], { stdio: 'inherit' })
"""

[tasks."gen:icons"]
description = "Regenerate the macOS .icns + Windows .ico from asset/icon.svg (run once, commit results)"
# The host (immutable Fedora) carries none of the icon tools, so generation runs
# in the Containerfile.icons image (built first; layer-cached after the first
# run). rsvg-convert renders the SVG to PNG at each size; png2icns packs the macOS
# set, icotool packs the Windows set. The PNGs are throwaway (under dist/,
# gitignored); the committed outputs are asset/music-player.{icns,ico}.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdirSync } = await import('node:fs')
// CACHYOS_IMAGE is the CachyOS image this host's CPU level supports (cachyos-v4, -v3 or plain), resolved by the repository's
// cachyos-image command; it throws on a host that is not x86-64, because these images have no Alpine variant.
const cachyosBuildArguments = (imageName) => ['--build-arg', execFileSync('node', [process.getBuiltinModule('node:path').resolve(process.cwd(), '../../test-harness/core-matrix/src/bin/cachyos-image.ts'), '--image-name', imageName, '--build-argument'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim()]
execFileSync('podman', ['build', ...cachyosBuildArguments('icon-tools'), '-t', 'localhost/monochromatic/icon-tools', '-f', 'Containerfile.icons', '.'], { stdio: 'inherit' })
const img = 'localhost/monochromatic/icon-tools'
const mount = `${process.cwd()}:/work`
const inContainer = (toolArgs) => execFileSync('podman', ['run', '--rm', '--security-opt', 'label=disable', '-v', mount, '-w', '/work', img, ...toolArgs], { stdio: 'inherit' })
mkdirSync('dist/icons', { recursive: true })
for (const size of [16, 32, 48, 64, 128, 256, 512, 1024]) {
  inContainer(['rsvg-convert', '-w', String(size), '-h', String(size), 'asset/icon.svg', '-o', `dist/icons/icon-${size}.png`])
}
inContainer(['png2icns', 'asset/music-player.icns', 'dist/icons/icon-16.png', 'dist/icons/icon-32.png', 'dist/icons/icon-48.png', 'dist/icons/icon-128.png', 'dist/icons/icon-256.png', 'dist/icons/icon-512.png', 'dist/icons/icon-1024.png'])
inContainer(['icotool', '-c', '-o', 'asset/music-player.ico', 'dist/icons/icon-16.png', 'dist/icons/icon-32.png', 'dist/icons/icon-48.png', 'dist/icons/icon-64.png', 'dist/icons/icon-128.png', 'dist/icons/icon-256.png'])
console.log('regenerated asset/music-player.icns and asset/music-player.ico; commit them')
"""

# Distribution / code signing.
# The per-OS binaries are still BUILT on their own OS (the Mach-O on the Mac, the
# .exe on Windows, both via `build`), because cross-compiling a Slint+cpal GUI
# from Linux is out of scope for what ships. (`build:windows-gnu` does cross-compile the
# GNU Windows target in a container, as a proof of the toolchain; that .exe has no icon.) Only the bundling + signing + notarization is
# cross-platform and centralized here on Linux: rcodesign (a repo-wide mise tool)
# for macOS, osslsigncode (in Containerfile.sign) for Windows. Each task assumes
# the freshly built binary has been synced into dist/. Real credentials are read
# from env vars and, when absent, a throwaway self-signed identity is used so the
# pipeline runs end to end (those artifacts are NOT distributable). See
# HANDOVER.macos-signing-credentials.md, HANDOVER.windows-signing-credentials.md,
# and doc/decision/desktop-app-code-signing.md.

[tasks."bundle:macos"]
description = "Assemble dist/Music Player.app around the macOS Mach-O (synced from the Mac)"
# Runs on Linux. MP_MACOS_BINARY (default dist/music-player) is the Mach-O built
# on the Mac. Info.plist is a template: __MP_VERSION__ is replaced with the
# Cargo.toml version; asset/music-player.icns is the committed bundle icon.
shell = "node --input-type=module-typescript -e"
run = """
const { existsSync, rmSync, mkdirSync, copyFileSync, readFileSync, writeFileSync, chmodSync } = await import('node:fs')
const bin = process.env.MP_MACOS_BINARY ?? 'dist/music-player'
if (!existsSync(bin)) { throw new Error(`macOS binary not found at ${bin}. Build on the Mac then copy target/release/music-player to ${bin}. Build task: //package/music-player/desktop-app:build`) }
const versionLine = readFileSync('Cargo.toml', 'utf8').split('\\n').find((line) => line.trimStart().startsWith('version'))
const ver = versionLine.slice(versionLine.indexOf('"') + 1, versionLine.lastIndexOf('"'))
const app = 'dist/Music Player.app'
rmSync(app, { recursive: true, force: true })
mkdirSync(`${app}/Contents/MacOS`, { recursive: true })
mkdirSync(`${app}/Contents/Resources`, { recursive: true })
copyFileSync(bin, `${app}/Contents/MacOS/music-player`)
chmodSync(`${app}/Contents/MacOS/music-player`, 0o755)
const plist = readFileSync('macos/Info.plist', 'utf8').split('__MP_VERSION__').join(ver)
writeFileSync(`${app}/Contents/Info.plist`, plist)
copyFileSync('asset/music-player.icns', `${app}/Contents/Resources/music-player.icns`)
console.log(`assembled ${app} version ${ver}`)
"""

[tasks."sign:macos"]
description = "Sign dist/Music Player.app with rcodesign (Developer ID from env, else throwaway self-signed)"
# Real path: a Developer ID Application .p12 + password file (MP_MACOS_P12 /
# MP_MACOS_P12_PASSWORD_FILE), signed --for-notarization (hardened runtime +
# secure timestamp). Test path (env unset): a throwaway self-signed cert under
# dist/selfsign, neutral subject; such a build will NOT pass Gatekeeper.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { existsSync, mkdirSync } = await import('node:fs')
const app = 'dist/Music Player.app'
if (!existsSync(app)) { throw new Error(`${app} not found; run bundle:macos first`) }
if (process.env.MP_MACOS_P12 !== undefined) {
  const pwfile = process.env.MP_MACOS_P12_PASSWORD_FILE ?? ''
  if (pwfile === '') { throw new Error('MP_MACOS_P12 is set but MP_MACOS_P12_PASSWORD_FILE is not') }
  console.log('signing with Developer ID (.p12) for notarization')
  execFileSync('rcodesign', ['sign', '--p12-file', process.env.MP_MACOS_P12, '--p12-password-file', pwfile, '--for-notarization', '--entitlements-xml-file', 'macos/entitlements.plist', app], { stdio: 'inherit' })
} else {
  console.error('MP_MACOS_P12 unset: signing with a THROWAWAY self-signed cert (not distributable, cannot notarize)')
  mkdirSync('dist/selfsign', { recursive: true })
  if (!existsSync('dist/selfsign/macos-test.crt')) {
    execFileSync('rcodesign', ['generate-self-signed-certificate', '--profile', 'developer-id-application', '--person-name', 'Monochromatic Test (self-signed, not for distribution)', '--pem-filename', 'dist/selfsign/macos-test'], { stdio: 'inherit' })
  }
  execFileSync('rcodesign', ['sign', '--pem-file', 'dist/selfsign/macos-test.crt', '--pem-file', 'dist/selfsign/macos-test.key', '--code-signature-flags', 'runtime', '--entitlements-xml-file', 'macos/entitlements.plist', app], { stdio: 'inherit' })
}
execFileSync('rcodesign', ['verify', `${app}/Contents/MacOS/music-player`], { stdio: 'inherit' })
console.log(`signed ${app}`)
"""

[tasks."notarize:macos"]
description = "Submit dist/Music Player.app to Apple notary and staple the ticket (needs real Apple creds)"
# Requires MP_ASC_API_KEY_JSON (an App Store Connect API key encoded by
# `rcodesign encode-app-store-connect-api-key`). The .app must already be signed
# with a real Developer ID (sign:macos with MP_MACOS_P12).
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { existsSync } = await import('node:fs')
const app = 'dist/Music Player.app'
if (!existsSync(app)) { throw new Error(`${app} not found; run bundle:macos + sign:macos first`) }
if (process.env.MP_ASC_API_KEY_JSON === undefined) { throw new Error('MP_ASC_API_KEY_JSON unset. Create an App Store Connect API key, encode it with `rcodesign encode-app-store-connect-api-key -o key.json <issuer-id> <key-id> AuthKey_<key-id>.p8`, then set MP_ASC_API_KEY_JSON=key.json. See HANDOVER.macos-signing-credentials.md.') }
execFileSync('rcodesign', ['notary-submit', '--api-key-file', process.env.MP_ASC_API_KEY_JSON, '--staple', app], { stdio: 'inherit' })
console.log(`notarized + stapled ${app}`)
"""

[tasks."sign:windows"]
description = "Authenticode-sign dist/music-player.exe in the sign container (org cert from env, else self-signed)"
# Runs osslsigncode in Containerfile.sign. MP_WIN_EXE (default
# dist/music-player.exe) is the .exe built on Windows. Real path: an organization
# OV cert over PKCS#11 (MP_WIN_PKCS11_MODULE / _CERT / _KEY) with an RFC3161
# timestamp (MP_WIN_TIMESTAMP_URL, default Certum). Test path: a throwaway
# self-signed .pfx under dist/selfsign; SmartScreen will not trust it.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { existsSync, mkdirSync } = await import('node:fs')
// CACHYOS_IMAGE is the CachyOS image this host's CPU level supports (cachyos-v4, -v3 or plain), resolved by the repository's
// cachyos-image command; it throws on a host that is not x86-64, because these images have no Alpine variant.
const cachyosBuildArguments = (imageName) => ['--build-arg', execFileSync('node', [process.getBuiltinModule('node:path').resolve(process.cwd(), '../../test-harness/core-matrix/src/bin/cachyos-image.ts'), '--image-name', imageName, '--build-argument'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'inherit'] }).trim()]
execFileSync('podman', ['build', ...cachyosBuildArguments('sign'), '-t', 'localhost/monochromatic/sign', '-f', 'Containerfile.sign', '.'], { stdio: 'inherit' })
const exe = process.env.MP_WIN_EXE ?? 'dist/music-player.exe'
if (!existsSync(exe)) { throw new Error(`Windows exe not found at ${exe}. Build on x13-win then copy target/release/music-player.exe to ${exe}. Build task: //package/music-player/desktop-app:build`) }
const out = 'dist/music-player-signed.exe'
const ts = process.env.MP_WIN_TIMESTAMP_URL ?? 'http://time.certum.pl'
const pre = ['run', '--rm', '--security-opt', 'label=disable', '-v', `${process.cwd()}:/work`, '-w', '/work', 'localhost/monochromatic/sign']
if (process.env.MP_WIN_PKCS11_MODULE !== undefined) {
  console.log('signing with organization OV cert via PKCS#11')
  execFileSync('podman', [...pre, 'osslsigncode', 'sign', '-pkcs11module', process.env.MP_WIN_PKCS11_MODULE, '-pkcs11cert', process.env.MP_WIN_PKCS11_CERT, '-key', process.env.MP_WIN_PKCS11_KEY, '-n', 'Music Player', '-ts', ts, '-in', exe, '-out', out], { stdio: 'inherit' })
  execFileSync('podman', [...pre, 'osslsigncode', 'verify', '-in', out], { stdio: 'inherit' })
} else {
  console.error('MP_WIN_PKCS11_MODULE unset: signing with a THROWAWAY self-signed cert (SmartScreen will warn)')
  mkdirSync('dist/selfsign', { recursive: true })
  if (!existsSync('dist/selfsign/win-test.pfx')) {
    execFileSync('podman', [...pre, 'openssl', 'req', '-x509', '-newkey', 'rsa:2048', '-nodes', '-keyout', 'dist/selfsign/win-test.key', '-out', 'dist/selfsign/win-test.crt', '-days', '825', '-subj', '/O=Monochromatic Test/CN=Monochromatic Test (self-signed, not for distribution)'], { stdio: 'inherit' })
    execFileSync('podman', [...pre, 'openssl', 'pkcs12', '-export', '-out', 'dist/selfsign/win-test.pfx', '-inkey', 'dist/selfsign/win-test.key', '-in', 'dist/selfsign/win-test.crt', '-passout', 'pass:test'], { stdio: 'inherit' })
  }
  execFileSync('podman', [...pre, 'osslsigncode', 'sign', '-pkcs12', 'dist/selfsign/win-test.pfx', '-pass', 'test', '-n', 'Music Player', '-in', exe, '-out', out], { stdio: 'inherit' })
  execFileSync('podman', [...pre, 'osslsigncode', 'verify', '-CAfile', 'dist/selfsign/win-test.crt', '-in', out], { stdio: 'inherit' })
}
console.log(`signed ${out}`)
"""

[tasks."verify:signing"]
description = "Self-signed end-to-end check of the signing pipeline (needs dist/ binaries synced from the Mac/Windows boxes)"
# Exercises bundle:macos + sign:macos (self-signed) and sign:windows (self-signed)
# so the mechanics are proven on Linux without any real credentials. The artifacts
# produced are NOT distributable.
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
console.log('== macOS: bundle + self-signed sign + verify ==')
execFileSync('mise', ['run', 'bundle:macos'], { stdio: 'inherit' })
execFileSync('mise', ['run', 'sign:macos'], { stdio: 'inherit' })
console.log('== Windows: self-signed sign + verify ==')
execFileSync('mise', ['run', 'sign:windows'], { stdio: 'inherit' })
console.log('self-signed signing pipeline OK (artifacts are NOT distributable)')
"""
