[vars]
build_cover_question = '''
const { readFileSync, writeFileSync } = await import("node:fs")
const { join } = await import("node:path")
const root = process.cwd()
const templatePath = join(root, "questions", "archive", "cover-p.template.html")
const outputPath = join(root, "questions", "archive", "cover-p.html")
const darkCards = [
  { basename: "cover-round-cover-dark-wallpaper-s100", code: "D100", title: "Dark cover · wallpaper seed · 100% text", alt: "folded cover in dark mode under the measured wallpaper seed at default text size" },
  { basename: "cover-round-cover-dark-wallpaper-s085", code: "D085", title: "Dark cover · wallpaper seed · 85% text", alt: "folded cover in dark mode under the measured wallpaper seed at the smallest Android text preset" },
  { basename: "cover-round-cover-dark-wallpaper-s150", code: "D150", title: "Dark cover · wallpaper seed · 150% text", alt: "folded cover in dark mode under the measured wallpaper seed at 150 percent text with the two-by-two mode arrangement" },
  { basename: "cover-round-cover-dark-wallpaper-s200", code: "D200", title: "Dark cover · wallpaper seed · 200% text", alt: "folded cover in dark mode under the measured wallpaper seed at 200 percent text with the four-row mode arrangement" },
  { basename: "cover-round-cover-dark-coral-s100", code: "DCOR", title: "Dark cover · coral seed · 100% text", alt: "folded cover in dark mode under an uncontrolled warm coral palette at default text size" },
]
const pickerCards = [
  { basename: "cover-round-cover-picker-p1-s100", code: "P1", title: "Picker opened · P1 dropdown field plus floating menu panel · 100% text", alt: "outlined dropdown field trigger with an inset menu container panel over the list" },
  { basename: "cover-round-cover-picker-p2-s100", code: "P2", title: "Picker opened · P2 dropdown field plus in-slot picker · 100% text", alt: "outlined dropdown field trigger with the picker replacing the list slot above the visible deck" },
  { basename: "cover-round-cover-picker-p3-s100", code: "P3", title: "Picker opened · P3 app-bar title plus floating menu panel · 100% text", alt: "app-bar title trigger with an inset menu container panel over the list" },
  { basename: "cover-round-cover-picker-p4-s100", code: "P4", title: "Picker opened · P4 app-bar title plus in-slot picker · 100% text", alt: "app-bar title trigger with the picker replacing the list slot above the visible deck" },
  { basename: "cover-round-cover-picker-p2-s200", code: "P2-200", title: "Picker opened · P2 in-slot picker · 200% text", alt: "in-slot picker at 200 percent text with the deck still visible" },
]
const lightCards = [
  { basename: "cover-round-cover-picker-p2-light-s100", code: "L3", title: "Settled light (D45) · P2 in-slot picker · 100% text", alt: "in-slot picker in light mode on the settled flat surface with hairlines at both seams" },
]
const cardHtml = (card) => {
  const relativePath = join("questions", "render", `${card.basename}.png`)
  const encoded = readFileSync(join(root, relativePath)).toString("base64")
  const source = `data:image/png;base64,${encoded}`
  return `<article class="evidence-card"><span class="code">${card.code}</span><button class="evidence-button" type="button" data-preview-title="${card.title}" data-preview-src="${source}"><img src="${source}" width="411" height="923" alt="${card.alt}"><span class="evidence-label">Open ${card.code} at panel scale</span></button></article>`
}
let html = readFileSync(templatePath, "utf8")
html = html.replace("@@DARK_CARDS@@", darkCards.map(cardHtml).join("\n"))
html = html.replace("@@LIGHT_CARDS@@", lightCards.map(cardHtml).join("\n"))
html = html.replace("@@PICKER_CARDS@@", pickerCards.map(cardHtml).join("\n"))
if (html.includes("@@DARK_CARDS@@") || html.includes("@@LIGHT_CARDS@@") || html.includes("@@PICKER_CARDS@@")) {
  throw new Error("Cover questionnaire still contains a card placeholder.")
}
writeFileSync(outputPath, html)
console.log("Built self-contained folded cover questionnaire.")
'''

validate_cover_question = '''
const { execFileSync } = await import("node:child_process")
const { readFileSync } = await import("node:fs")
const { join } = await import("node:path")
const root = process.cwd()
const htmlPath = join(root, "questions", "archive", "cover-p.html")
const html = readFileSync(htmlPath, "utf8")
if (html.includes("@@DARK_CARDS@@") || html.includes("@@LIGHT_CARDS@@") || html.includes("@@PICKER_CARDS@@")) {
  throw new Error("Cover questionnaire contains an unresolved card placeholder.")
}
if (/<script\s+[^>]*src=|<link\s+[^>]*href=/i.test(html)) {
  throw new Error("Cover questionnaire depends on an external script or stylesheet.")
}
const dataUrls = [...html.matchAll(/data:image\/png;base64,([A-Za-z0-9+/=]+)/g)]
if (dataUrls.length !== 22) {
  throw new Error(`Cover questionnaire embeds ${dataUrls.length} image references; expected 22.`)
}
const uniqueImages = new Map(dataUrls.map((match) => [match[1], Buffer.from(match[1], "base64")]))
if (uniqueImages.size !== 11) {
  throw new Error(`Cover questionnaire embeds ${uniqueImages.size} distinct captures; expected 11.`)
}
const pngSignature = "89504e470d0a1a0a"
for (const [encoded, image] of uniqueImages) {
  if (image.subarray(0, 8).toString("hex") !== pngSignature) {
    throw new Error(`Embedded evidence ${encoded.slice(0, 16)} is not a PNG.`)
  }
  const width = image.readUInt32BE(16)
  const height = image.readUInt32BE(20)
  if (width !== 1080 || height !== 2424) {
    throw new Error(`Embedded cover evidence is ${width} × ${height}; expected 1080 × 2424.`)
  }
}
const required = [
  "Choose the cover light surface",
  "It does not authorize production implementation.",
  "D43",
  "no in-app volume",
  "One row at 85% and 100%",
  "2 × 2 at 150%",
  "four rows at 200%",
  "Light surface: settled (D45)",
  "Decision: cover subdirectory picker opened state",
  "P1",
  "P2 · recommended",
  "P3",
  "P4",
  "Ranking: P2 &gt; P4 &gt; P1 &gt; P3.",
  "name=\"pickerOpenedState\"",
  "spaces alone do not complete this field",
  "Native pixels",
  "Reset 100%",
  "Source 1080 × 2424 physical px · design 411 × 923dp",
  "Response path:",
  "reply in chat with the light code",
  "@media (prefers-color-scheme: dark)",
  "color-scheme: light dark",
]
for (const fragment of required) {
  if (!html.includes(fragment)) {
    throw new Error(`Cover questionnaire is missing required content: ${fragment}`)
  }
}
const radioCount = (html.match(/type="radio"/g) ?? []).length
if (radioCount !== 4) {
  throw new Error(`Cover questionnaire has ${radioCount} radio choices; expected 4.`)
}
if (html.includes('id="copy-answer"') || html.includes("navigator.clipboard") || html.includes("execCommand('copy')")) {
  throw new Error("Cover questionnaire includes an unnecessary clipboard control or API.")
}
const basenames = [
  "cover-round-cover-dark-wallpaper-s100",
  "cover-round-cover-dark-wallpaper-s085",
  "cover-round-cover-dark-wallpaper-s150",
  "cover-round-cover-dark-wallpaper-s200",
  "cover-round-cover-dark-coral-s100",
  "cover-round-cover-picker-p1-s100",
  "cover-round-cover-picker-p2-s100",
  "cover-round-cover-picker-p3-s100",
  "cover-round-cover-picker-p4-s100",
  "cover-round-cover-picker-p2-s200",
  "cover-round-cover-picker-p2-light-s100",
]
const hexToRgb = (hex) => [1, 3, 5].map((start) => Number.parseInt(hex.slice(start, start + 2), 16))
const toPixel = (hex) => `srgba(${hexToRgb(hex).join(",")},1)`
const luminance = (hex) => hexToRgb(hex)
  .map((value) => value / 255)
  .map((value) => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4)
  .reduce((sum, value, index) => sum + value * [0.2126, 0.7152, 0.0722][index], 0)
const contrastRatio = (first, second) => {
  const [lighter, darker] = [luminance(first), luminance(second)].sort((left, right) => right - left)
  return (lighter + 0.05) / (darker + 0.05)
}
const readRoles = (environment, mode) => {
  const evidence = JSON.parse(readFileSync(join(root, "questions", "evidence", `cover-round-${environment}-roles-${mode}.json`), "utf8"))
  const expected = environment === "wallpaper"
    ? { seed: "45588C", style: "TONAL_SPOT", contrast: "0.0" }
    : { seed: "D45D42", style: "TONAL_SPOT", contrast: "0.0" }
  if (
    evidence.request.seed !== expected.seed
    || evidence.request.style !== expected.style
    || evidence.request.contrast !== expected.contrast
  ) {
    throw new Error(`${environment}/${mode} role evidence does not match its requested Android environment.`)
  }
  return evidence.resolvedRoles
}
const modeRows = (scale) => {
  const hierarchy = readFileSync(join(root, "questions", "evidence", `cover-round-cover-dark-wallpaper-${scale}.xml`), "utf8")
  const tops = ["Repeat track", "Play in order", "Shuffle Camellia", "Shuffle all folders"].map((label) => {
    const match = hierarchy.match(new RegExp(`content-desc="${label}"[^>]*bounds="\\[(\\d+),(\\d+)\\]`))
    if (!match) {
      throw new Error(`${scale} hierarchy is missing mode target ${label}.`)
    }
    return Number(match[2])
  })
  return new Set(tops).size
}
if (modeRows("s085") !== 1 || modeRows("s100") !== 1) {
  throw new Error("Cover mode control does not use one row at 85% and 100% text.")
}
if (modeRows("s150") !== 2) {
  throw new Error("Cover mode control does not use the connected 2 × 2 arrangement at 150% text.")
}
if (modeRows("s200") !== 4) {
  throw new Error("Cover mode control does not use four rows at 200% text.")
}
const seamRowCount = (basename, outlineHex) => {
  const column = execFileSync("magick", [
    join(root, "questions", "render", `${basename}.png`),
    "-crop", "1x2424+540+0", "+repage", "txt:",
  ], { encoding: "utf8" })
  const needle = outlineHex.slice(1).toUpperCase()
  return column.split("\n").filter((line) => line.includes(needle)).length
}
for (const [index, basename] of basenames.entries()) {
  const hierarchyPath = join(root, "questions", "evidence", `${basename}.xml`)
  const hierarchy = readFileSync(hierarchyPath, "utf8")
  const markers = (basename.includes("-picker-p1") || basename.includes("-picker-p3"))
    ? [
      'bounds="[0,0][1080,2424]"',
      'text="Camellia"',
      'text="Cult of Luna"',
      'text="Open"',
    ]
    : basename.includes("-picker-") && !basename.includes("-s200")
      ? [
        'bounds="[0,0][1080,2424]"',
        'text="Camellia"',
        'text="Cult of Luna"',
        'content-desc="Pause"',
      ]
      : basename.includes("-picker-")
        ? [
          'bounds="[0,0][1080,2424]"',
          'text="Camellia"',
          'content-desc="Pause"',
        ]
        : [
        'bounds="[0,0][1080,2424]"',
        'text="Camellia"',
        'text="Open"',
        'text="Another Xronixle"',
        'content-desc="Pause"',
        'content-desc="Previous track"',
        'content-desc="Next track"',
        'content-desc="Repeat track"',
        'content-desc="Settings"',
      ]
  const missing = markers.filter((marker) => !hierarchy.includes(marker))
  if (missing.length > 0) {
    throw new Error(`${basename} hierarchy is missing accepted markers: ${missing.join(", ")}.`)
  }
  if (hierarchy.includes('content-desc="Volume"')) {
    throw new Error(`${basename} restored the in-app volume control removed by D43.`)
  }
  if (hierarchy.includes('content-desc="Playing"')) {
    throw new Error(`${basename} restored the rejected current-row play icon.`)
  }
  const boundsOf = (text) => {
    const match = hierarchy.match(new RegExp(`text="${text}"[^>]*bounds="\\[(\\d+),(\\d+)\\]\\[(\\d+),(\\d+)\\]`))
    if (!match) {
      throw new Error(`${basename} hierarchy has no bounds for ${text}.`)
    }
    return match.slice(1).map(Number)
  }
  const imagePath = join(root, "questions", "render", `${basename}.png`)
  const sample = (...points) => execFileSync("magick", [
    imagePath, "-format",
    ["%[fx:minima.a]", "%[fx:maxima.a]", ...points.map(([x, y]) => `%[pixel:p{${x},${y}}]`)].join("|"),
    "info:",
  ], { encoding: "utf8" }).trim().split("|")
  if (basename.includes("-picker-")) {
    const yMid = basename.includes("-s200") ? 600 : 1200
    const pickerPixels = sample([540, 60], [20, yMid], [1040, yMid], [600, 1200], [540, 2300], [540, 400])
    if (pickerPixels[0] !== "1" || pickerPixels[1] !== "1") {
      throw new Error(`${basename}.png is not fully opaque.`)
    }
    const [barTop, rail, names, floating, behindDeck] = pickerPixels.slice(2)
    if (basename.includes("-light")) {
      const roles = readRoles("wallpaper", "light")
      const lowest = toPixel(roles.surface_container_lowest)
      if (rail !== lowest || names !== lowest || barTop !== lowest || behindDeck !== lowest) {
        throw new Error(`${basename}.png does not match the D45 flat light mapping.`)
      }
      const seams = seamRowCount(basename, roles.outline_variant)
      if (seams < 3 || seams > 5) {
        throw new Error(`${basename}.png shows ${seams} hairline rows; D45 expects two 1dp seams.`)
      }
    } else if (basename.includes("-p1") || basename.includes("-p3")) {
      // D32 fixed ladder: the stable strategy substitutes container roles, so the
      // floating picker surface is the fixed high step, not the generated role.
      const high = "srgba(26,26,31,1)"
      if (floating !== high || rail !== high) {
        throw new Error(`${basename}.png does not match its disclosed floating picker surface.`)
      }
      if (behindDeck !== "srgba(10,10,13,1)") {
        throw new Error(`${basename}.png lost the player deck behind the picker panel.`)
      }
      if (barTop !== "srgba(0,0,0,1)") {
        throw new Error(`${basename}.png lost its true-black top row.`)
      }
    } else {
      if (barTop !== "srgba(0,0,0,1)" || rail !== "srgba(0,0,0,1)" || names !== "srgba(0,0,0,1)") {
        throw new Error(`${basename}.png lost its true-black in-slot picker surfaces.`)
      }
      if (behindDeck !== "srgba(10,10,13,1)") {
        throw new Error(`${basename}.png lost its fixed D41 deck neutral.`)
      }
    }
    const expectedEncoded = readFileSync(imagePath).toString("base64")
    const firstEmbedded = dataUrls[index * 2]?.[1]
    const secondEmbedded = dataUrls[index * 2 + 1]?.[1]
    if (firstEmbedded !== expectedEncoded || secondEmbedded !== expectedEncoded) {
      throw new Error(`${basename}.png does not match its two displayed embedded references.`)
    }
    continue
  }
  const chip = boundsOf("Camellia")
  const currentRow = boundsOf("Another Xronixle")
  const secondRow = boundsOf("Burning Aquamarine")
  const topPoint = [chip[0] + 20, Math.round((chip[1] + chip[3]) / 2)]
  const currentPoint = [Math.min(1060, currentRow[2] + 30), Math.round((currentRow[1] + currentRow[3]) / 2)]
  const listPoint = [Math.min(1060, secondRow[2] + 30), Math.round((secondRow[1] + secondRow[3]) / 2)]
  const deckPoint = [540, 2414]
  const pixels = sample(topPoint, listPoint, deckPoint, currentPoint)
  if (pixels[0] !== "1" || pixels[1] !== "1") {
    throw new Error(`${basename}.png is not fully opaque.`)
  }
  const [top, list, deck, current] = [pixels[2], pixels[3], pixels[4], pixels[5]]
  if (basename.includes("-dark-")) {
    const roles = readRoles(basename.includes("coral") ? "coral" : "wallpaper", "dark")
    if (top !== "srgba(0,0,0,1)" || list !== "srgba(0,0,0,1)") {
      throw new Error(`${basename}.png lost its true-black cover window or list canvas.`)
    }
    if (deck !== "srgba(10,10,13,1)") {
      throw new Error(`${basename}.png lost its fixed D41 deck neutral.`)
    }
    if (current !== toPixel(roles.surface_container_low)) {
      throw new Error(`${basename}.png does not carry the D42 generated current-row neutral.`)
    }
  } else {
    const roles = readRoles("wallpaper", "light")
    const low = toPixel(roles.surface_container_low)
    const lowest = toPixel(roles.surface_container_lowest)
    if (current !== low) {
      throw new Error(`${basename}.png does not carry the D42 generated current-row neutral on light.`)
    }
    if (basename.includes("-l3-")) {
      if (top !== lowest || list !== lowest || deck !== lowest) {
        throw new Error(`${basename}.png does not match the L3 flat surface mapping.`)
      }
      const seams = seamRowCount(basename, roles.outline_variant)
      if (seams < 3 || seams > 5) {
        throw new Error(`${basename}.png shows ${seams} hairline rows; L3 expects two 1dp seams.`)
      }
    } else {
      if (top !== low || list !== lowest || deck !== low) {
        throw new Error(`${basename}.png does not match the L1/L2 ramp mapping.`)
      }
      const seams = seamRowCount(basename, roles.outline_variant)
      if (basename.includes("-l1-") && (seams < 1 || seams > 3)) {
        throw new Error(`${basename}.png shows ${seams} hairline rows; L1 expects one 1dp deck seam.`)
      }
      if (basename.includes("-l2-") && seams !== 0) {
        throw new Error(`${basename}.png shows ${seams} hairline rows; L2 expects none.`)
      }
    }
  }
  const expectedEncoded = readFileSync(imagePath).toString("base64")
  const firstEmbedded = dataUrls[index * 2]?.[1]
  const secondEmbedded = dataUrls[index * 2 + 1]?.[1]
  if (firstEmbedded !== expectedEncoded || secondEmbedded !== expectedEncoded) {
    throw new Error(`${basename}.png does not match its two displayed embedded references.`)
  }
}
for (const environment of ["wallpaper", "coral"]) {
  for (const mode of ["dark", "light"]) {
    const roles = readRoles(environment, mode)
    const surfacePairs = mode === "dark"
      ? [
        ["#000000", roles.on_surface],
        ["#000000", roles.on_surface_variant],
        ["#0A0A0D", roles.on_surface],
        [roles.surface_container_low, roles.on_surface],
        [roles.surface_container_low, roles.on_surface_variant],
      ]
      : [
        [roles.surface_container_lowest, roles.on_surface],
        [roles.surface_container_low, roles.on_surface],
        [roles.surface_container_lowest, roles.on_surface_variant],
        [roles.surface_container_low, roles.on_surface_variant],
      ]
    const accentPairs = [
      [roles.primary, roles.on_primary],
      [roles.secondary_container, roles.on_secondary_container],
    ]
    const outlinePairs = mode === "dark"
      ? [["#000000", roles.outline], [roles.surface_container_low, roles.outline]]
      : [[roles.surface_container_lowest, roles.outline], [roles.surface_container_low, roles.outline]]
    for (const pair of [...surfacePairs, ...accentPairs]) {
      const ratio = contrastRatio(pair[0], pair[1])
      if (!Number.isFinite(ratio) || ratio < 4.5) {
        throw new Error(`${environment}/${mode} text pair ${pair.join("/")} contrast is ${ratio.toFixed(2)}; expected at least 4.5.`)
      }
    }
    for (const pair of outlinePairs) {
      const ratio = contrastRatio(pair[0], pair[1])
      if (!Number.isFinite(ratio) || ratio < 3) {
        throw new Error(`${environment}/${mode} outline pair ${pair.join("/")} contrast is ${ratio.toFixed(2)}; expected at least 3.`)
      }
    }
  }
}
if (!html.includes("dialog.showModal()") || !html.includes("returnTarget.focus()") || !html.includes("nativeScaleY")) {
  throw new Error("Cover preview does not retain modal, focus restoration, and exact native scaling behavior.")
}
console.log("Folded cover questionnaire is valid.")
'''

