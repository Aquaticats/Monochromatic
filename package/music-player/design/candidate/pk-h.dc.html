<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet"><style>html,body{height:100%;margin:0;overflow:hidden;background:#000}</style></helmet>
<div style="background:#000;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;box-sizing:border-box;padding-bottom:88px;font-family:Roboto,system-ui,sans-serif">
<div style="width:{{ boxW }};height:{{ boxH }};flex:0 0 auto;overflow:visible"><div style="width:418px;height:883px;transform:scale({{ scale }});transform-origin:top left;outline:1px solid #26262E;color:#E6E0E9;display:flex;flex-direction:column;overflow:hidden;background:#000">
  <div style="flex:0 0 auto;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #26262E">
    <div style="flex:1 1 auto"></div>
    <div style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 16px;border:1px solid #938F99;border-radius:20px;font-size:14px;font-weight:500"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#CAC4D0"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Open</div>
  </div>
  <div style="flex:1 1 auto;min-height:0;display:flex;overflow:hidden">
    <div style="flex:0 0 48px;min-height:0;overflow:auto;display:flex;flex-direction:column;border-right:1px solid #121216;scrollbar-width:none">
      <sc-for list="{{ rail }}" as="c" hint-placeholder-count="27">
        <div onClick="{{ c.pick }}" style="width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;font-size:14px;font-weight:500;cursor:pointer;color:{{ c.fg }};border-top:{{ c.rule }}"><span style="width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:{{ c.bg }}">{{ c.label }}</span></div>
      </sc-for>
    </div>
    <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;gap:8px;padding:12px 16px 2px"><span style="font-size:22px;line-height:28px;color:#D0BCFF">{{ heading }}</span><span style="font-size:11px;color:#8E8894;font-family:ui-monospace,monospace">{{ extentNote }}</span></div>
      <div ref="{{ scrollRef }}" style="flex:1 1 auto;min-height:0;overflow:auto;padding:0 16px 16px">
        <div style="display:flex;flex-wrap:wrap;column-gap:0;row-gap:0">
          <sc-for list="{{ shown }}" as="r" hint-placeholder-count="40">
            <div onClick="{{ r.pick }}" style="min-height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding-right:10px;cursor:pointer;font-size:14px;color:{{ r.fg }};font-weight:{{ r.weight }};max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="border-bottom:{{ r.rule }}">{{ r.name }}</span><span style="color:#5A5561;font-size:12px">·</span></div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div></div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:8px 16px;color:#8E8894;font-size:11px;line-height:14px;font-family:ui-monospace,monospace;background:#000">{{ caption }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:418,&quot;height&quot;:979}}">
class Component extends DCLogic {
  state = { rail: null, cell: "latinC", selected: "Camellia", scale: 1, lines: 0, screens: 0 };

  // The extent claim is this candidate's whole argument, so it is measured, never
  // estimated: distinct item tops for the line count, scrollHeight/clientHeight for
  // the screen count (review-notes #1, every number comes from a source).
  measure() {
    const el = this.el;
    if (!el) return;
    const flow = el.firstElementChild;
    const tops = new Set();
    if (flow) [...flow.children].forEach((ch) => tops.add(Math.round(ch.getBoundingClientRect().top)));
    const lines = tops.size;
    const screens = el.clientHeight ? el.scrollHeight / el.clientHeight : 0;
    if (lines !== this.state.lines || Math.abs(screens - this.state.screens) > 0.01) {
      this.setState({ lines, screens });
    }
  }
  componentDidUpdate() { requestAnimationFrame(() => this.measure()); }
  componentDidMount() {
    this.fit = () => this.setState({ scale: Math.min(1, window.innerWidth / 418, (window.innerHeight - 96) / 883) });
    this.fit(); window.addEventListener("resize", this.fit);
    Promise.all([import("./artists.js"), import("./buckets.js")])
      .then(([a, b]) => this.setState({ rail: b.railFor(a.ARTISTS), total: a.ARTISTS.length }));
  }
  componentWillUnmount() { window.removeEventListener("resize", this.fit); }
  renderVals() {
    const s = this.state;
    const sections = s.rail || [];
    let active = null;
    sections.forEach((sec) => sec.cells.forEach((c) => { if (c.key === s.cell) active = c; }));
    const shown = active ? active.names : [];

    const rail = [];
    sections.forEach((sec, si) => sec.cells.forEach((c, ci) => {
      const on = c.key === s.cell;
      rail.push({
        label: c.label, fg: on ? "#E8DEF8" : "#CAC4D0", bg: on ? "#4A4458" : "transparent",
        rule: si > 0 && ci === 0 ? "1px solid #26262E" : "0",
        pick: () => this.setState({ cell: c.key })
      });
    }));

    return {
      scale: s.scale, boxW: Math.round(418 * s.scale) + "px", boxH: Math.round(883 * s.scale) + "px",
      rail, heading: active ? active.label : "",
      scrollRef: (el) => { this.el = el; requestAnimationFrame(() => this.measure()); },
      extentNote: shown.length + " names · " + s.lines + " lines · " + s.screens.toFixed(2) + " screens (measured)",
      shown: shown.map((n) => {
        const sel = n === s.selected;
        return {
          name: n, fg: sel ? "#D0BCFF" : "#E6E0E9", weight: sel ? 500 : 400,
          rule: sel ? "2px solid #D0BCFF" : "2px solid transparent",
          pick: () => this.setState({ selected: n })
        };
      }),
      caption: "PK-H: same rules as pk-g, denser: 14px instead of 16, and a muted middot doing the separating instead of a 24dp gap. More names per line, so the extent drops (counter above is measured off the DOM). The trade is that it reads more like running text than like a set of targets, and the middot is one more mark on screen."
    };
  }
}
</script>
</body>
</html>
