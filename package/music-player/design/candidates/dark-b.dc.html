<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/material-design-3-design-system-503c3571-4db9-4b54-8695-7f53861f5059/tokens/palette.css">
<link rel="stylesheet" href="_ds/material-design-3-design-system-503c3571-4db9-4b54-8695-7f53861f5059/tokens/color.css">
<link rel="stylesheet" href="_ds/material-design-3-design-system-503c3571-4db9-4b54-8695-7f53861f5059/tokens/fonts.css">
<style>html,body{height:100%;margin:0;overflow:hidden;background:#141218}</style>
</helmet>
<div style="--md-sys-color-surface-dim:#141218;--md-sys-color-surface-bright:#3B383E;--md-sys-color-surface:#141218;--md-sys-color-surface-container-lowest:#0F0D13;--md-sys-color-surface-container-low:#1D1B20;--md-sys-color-surface-container:#211F26;--md-sys-color-surface-container-high:#2B2930;--md-sys-color-surface-container-highest:#36343B;--md-sys-color-surface-variant:#49454F;--md-sys-color-on-surface:#E6E0E9;--md-sys-color-on-surface-variant:#CAC4D0;--md-sys-color-outline:#938F99;--md-sys-color-outline-variant:#49454F;--md-sys-color-primary:#D0BCFF;--md-sys-color-on-primary:#381E72;--md-sys-color-secondary-container:#4A4458;--md-sys-color-on-secondary-container:#E8DEF8;width:100vw;height:100vh;overflow:hidden;box-sizing:border-box;padding:12px 12px 56px;display:flex;align-items:flex-start;justify-content:center;gap:20px;font-family:'Roboto Flex',system-ui,sans-serif;background:#141218" data-theme="dark">

  

  <div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto">
    <div style="display:flex;align-items:baseline;gap:8px;color:#E6E0E9"><span style="font-size:15px;font-weight:500">2b</span><span style="font-size:11px;font-family:ui-monospace,monospace;opacity:.7">#000 window, ramp rebuilt from black</span></div>
    <div style="width:{{ boxW }};height:{{ boxH }};overflow:hidden">
      <div style="width:418px;height:883px;transform:scale({{ scale }});transform-origin:top left;display:flex;flex-direction:column;background:#000;color:#E6E0E9;overflow:hidden">
        <div style="flex:0 0 auto;min-height:56px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:#0A0A0D">
          <div style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:20px;border:1px solid #938F99;font-size:14px;font-weight:500"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Open</div>
        </div>
        <div style="flex:1 1 auto;min-height:0;display:flex">
          <div style="flex:0 0 48px;min-height:0;overflow:auto;display:flex;flex-direction:column;background:#121216;scrollbar-width:none">
            <sc-for list="{{ rail }}" as="c" hint-placeholder-count="27">
              <div onClick="{{ c.pick }}" style="width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;font-size:14px;font-weight:500;cursor:pointer;color:{{ c.fg }}"><span style="width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:{{ c.bg }}">{{ c.label }}</span></div>
            </sc-for>
          </div>
          <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:#000">
            <div style="flex:0 0 auto;padding:10px 16px 2px;font-size:22px;line-height:28px;color:#D0BCFF">{{ letter }}</div>
            <div style="flex:1 1 auto;min-height:0;overflow:auto;padding:0 16px 16px">
              <div style="display:flex;flex-wrap:wrap;column-gap:24px;row-gap:0">
                <sc-for list="{{ shown }}" as="r" hint-placeholder-count="18">
                  <div onClick="{{ r.pick }}" style="min-height:48px;box-sizing:border-box;display:flex;align-items:center;cursor:pointer;font-size:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:{{ r.fg }};font-weight:{{ r.weight }};border-bottom:{{ r.rule }}">{{ r.name }}</div>
                </sc-for>
              </div>
            </div>
          </div>
        </div>
        <div style="flex:0 0 auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;background:#0A0A0D;border-top:1px solid #26262E">
          <div style="text-align:center"><div style="font-size:16px;font-weight:500">Another Xronixle</div><div style="font-size:12px;color:#CAC4D0;margin-top:2px;font-variant-numeric:tabular-nums">1 of 16 · −1.2 dBTP</div></div>
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12px;color:#CAC4D0;font-variant-numeric:tabular-nums;min-width:26px">0:42</span>
            <div style="flex:1 1 auto;height:44px;display:flex;align-items:center;gap:4px"><div style="flex:0 0 16%;height:16px;border-radius:8px 2px 2px 8px;background:#D0BCFF"></div><div style="width:4px;height:44px;border-radius:2px;background:#D0BCFF"></div><div style="flex:1 1 auto;height:16px;border-radius:2px 8px 8px 2px;background:#22222A"></div></div>
            <span style="font-size:12px;color:#CAC4D0;font-variant-numeric:tabular-nums;min-width:26px;text-align:right">4:35</span>
          </div>
          <div style="position:relative;display:flex;align-items:center;justify-content:center;gap:24px">
            <div style="width:48px;height:48px;border-radius:24px;background:#1A1A1F;display:grid;place-items:center"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#CAC4D0"><path d="M7 6h2v12H7zm3 6 8 6V6z"></path></svg></div>
            <div style="width:64px;height:64px;border-radius:32px;background:#D0BCFF;display:grid;place-items:center"><svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:#381E72"><path d="M8 5h3.2v14H8zm4.8 0H16v14h-3.2z"></path></svg></div>
            <div style="width:48px;height:48px;border-radius:24px;background:#1A1A1F;display:grid;place-items:center"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#CAC4D0"><path d="M15 6h2v12h-2zM6 18l8-6-8-6z"></path></svg></div>
            <div style="position:absolute;right:0;top:50%;margin-top:-24px;width:48px;height:48px;border-radius:24px;display:grid;place-items:center;background:#121216"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:#CAC4D0"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4"></path></svg></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid #938F99;border-radius:20px;overflow:hidden">
            <div style="min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;border-right:1px solid #938F99;border-bottom:1px solid #938F99">Repeat</div>
            <div style="min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;border-bottom:1px solid #938F99;background:#4A4458;color:#E8DEF8">In order</div>
            <div style="min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;border-right:1px solid #938F99">Shuffle folder</div>
            <div style="min-height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500">Shuffle all</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  

<div style="position:absolute;left:0;right:0;bottom:0;padding:10px 16px;color:#E8DEF8;font-size:11px;line-height:15px;font-family:ui-monospace,monospace;background:#1D1B20">{{ caption }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:820}}">
class Component extends DCLogic {
  state = { rail: null, cell: "latinC", selected: "Camellia", scale: 0.6 };
  componentDidMount() {
    this.fit = () => this.setState({ scale: Math.min(1, (window.innerWidth - 40) / 418, (window.innerHeight - 120) / 883) });
    this.fit(); window.addEventListener("resize", this.fit);
    Promise.all([import("./artists.js"), import("./buckets.js")])
      .then(([a, b]) => this.setState({ rail: b.railFor(a.ARTISTS) }));
  }
  componentWillUnmount() { window.removeEventListener("resize", this.fit); }
  renderVals() {
    const s = this.state;
    const sections = s.rail || [];
    let active = null;
    sections.forEach((sec) => sec.cells.forEach((c) => { if (c.key === s.cell) active = c; }));
    const shown = active ? active.names : [];

    const rail = [];
    sections.forEach((sec) => sec.cells.forEach((c) => {
      const on = c.key === s.cell;
      rail.push({
        label: c.label, fg: on ? "#E8DEF8" : "#CAC4D0", bg: on ? "#4A4458" : "transparent",
        pick: () => this.setState({ cell: c.key })
      });
    }));

    return {
      scale: s.scale, boxW: Math.round(418 * s.scale) + "px", boxH: Math.round(883 * s.scale) + "px",
      rail, letter: active ? active.label : "",
      shown: shown.map((n) => {
        const sel = n === s.selected;
        return {
          name: n, fg: sel ? "#D0BCFF" : "#E6E0E9", weight: sel ? 500 : 400,
          rule: sel ? "2px solid #D0BCFF" : "2px solid transparent",
          pick: () => this.setState({ selected: n })
        };
      }),
      swatches: [
        { md3: "#000000", own: "#000000", label: "window" },
        { md3: "#0F0D13", own: "#0A0A0D", label: "lowest / low" },
        { md3: "#1D1B20", own: "#121216", label: "container" },
        { md3: "#282A2F", own: "#1A1A1F", label: "high" },
        { md3: "#33353A", own: "#22222A", label: "highest" }
      ],
      caption: "2B · THE PROJECT'S OWN RAMP measured down from black. Flatter and truer to the OLED intent; five token values diverge from MD3 and must be maintained. TRUE BLACK, two implementations, the rule is fixed (#000 window); this is how the surfaces ABOVE it are built. 2a overrides only the surface role and keeps MD3's own dark container ramp (neutral 4→22, faintly warm), least deviation from the bound system, but the panes read as grey cards on black. 2b keeps the project's own ramp measured down from black, flatter and truer to the OLED intent, but five token values now diverge from MD3 and have to be maintained. Same picker in both; click the rail."
    };
  }
}
</script>
</body>
</html>
