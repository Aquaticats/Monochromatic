<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="../_ds/material-design-3-design-system-503c3571-4db9-4b54-8695-7f53861f5059/tokens/fonts.css" rel="stylesheet"><style>html,body{height:100%;margin:0;overflow:hidden;background:#000}</style></helmet>
<div style="background:#000;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;box-sizing:border-box;padding-bottom:88px;font-family:'Roboto Flex',system-ui,sans-serif">
<div style="width:{{ boxW }};height:{{ boxH }};flex:0 0 auto;overflow:visible"><div style="width:418px;height:883px;transform:scale({{ scale }});transform-origin:top left;outline:1px solid #26262E;color:#E6E0E9;display:flex;flex-direction:column;overflow:hidden;background:#000">
  <div style="flex:0 0 auto;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #26262E">
    <div style="flex:1 1 auto"></div>
    <div style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 16px;border:1px solid #938F99;border-radius:20px;font-size:14px;font-weight:500"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#CAC4D0"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Open</div>
  </div>
  <div style="flex:1 1 auto;min-height:0;display:flex;overflow:hidden">
    <div style="flex:0 0 48px;min-height:0;overflow:auto;display:flex;flex-direction:column;border-right:1px solid #121216;scrollbar-width:none">
      <sc-for list="{{ rail }}" as="c" hint-placeholder-count="27">
        <div onClick="{{ c.pick }}" style="width:48px;min-height:{{ c.h }};flex:0 0 auto;display:grid;place-items:center;font-size:{{ c.size }};font-weight:500;cursor:pointer;color:{{ c.fg }};border-top:{{ c.rule }}">
          <span style="min-width:{{ c.dot }};height:{{ c.dot }};padding:0 {{ c.pad }};box-sizing:border-box;border-radius:16px;display:grid;place-items:center;background:{{ c.bg }}">{{ c.label }}</span>
        </div>
      </sc-for>
    </div>
    <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;gap:8px;padding:12px 16px 4px"><span style="font-size:22px;line-height:28px;color:#D0BCFF">{{ heading }}</span><span style="font-size:11px;color:#8E8894;font-family:ui-monospace,monospace">{{ fitNote }}</span></div>
      <div style="flex:1 1 auto;min-height:0;overflow:hidden;padding:4px 12px 12px">
        <div style="display:flex;flex-wrap:wrap;gap:4px">
          <sc-for list="{{ shown }}" as="r" hint-placeholder-count="20">
            <div onClick="{{ r.pick }}" style="min-height:48px;box-sizing:border-box;display:flex;align-items:center;padding:0 14px;border-radius:8px;font-size:14px;cursor:pointer;background:{{ r.bg }};color:{{ r.fg }};font-weight:{{ r.weight }};max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</div>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
</div></div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:8px 16px;color:#8E8894;font-size:11px;line-height:14px;font-family:ui-monospace,monospace;background:#000">{{ caption }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:418,&quot;height&quot;:979}}">
const CAP = 30;

class Component extends DCLogic {
  state = { rail: null, open: "latinC", cell: "latinC", sub: null, selected: "Camellia", scale: 1 };
  componentDidMount() {
    this.fit = () => this.setState({ scale: Math.min(1, window.innerWidth / 418, (window.innerHeight - 96) / 883) });
    this.fit(); window.addEventListener("resize", this.fit);
    Promise.all([import("./artists.js"), import("./buckets.js")])
      .then(([a, b]) => this.setState({ rail: b.railFor(a.ARTISTS, CAP), total: a.ARTISTS.length }));
  }
  componentWillUnmount() { window.removeEventListener("resize", this.fit); }

  pickCell(cell) {
    if (cell.sub) this.setState({ open: cell.key, cell: cell.key, sub: cell.sub[0].key });
    else this.setState({ open: null, cell: cell.key, sub: null });
  }

  renderVals() {
    const s = this.state;
    const sections = s.rail || [];
    let active = null, activeSub = null;
    sections.forEach((sec) => sec.cells.forEach((c) => {
      if (c.key === s.cell) { active = c; if (c.sub) activeSub = c.sub.find((x) => x.key === s.sub) || c.sub[0]; }
    }));
    const shown = activeSub ? activeSub.names : active ? active.names : [];

    const rail = [];
    sections.forEach((sec, si) => {
      sec.cells.forEach((c, ci) => {
        const on = c.key === s.cell;
        rail.push({
          label: c.label, h: "48px", size: "14px", dot: "32px", pad: "0px",
          fg: on ? "#E8DEF8" : "#CAC4D0", bg: on ? "#4A4458" : "transparent",
          rule: si > 0 && ci === 0 ? "1px solid #26262E" : "0",
          pick: () => this.pickCell(c)
        });
        if (c.sub && s.open === c.key) {
          c.sub.forEach((sb) => {
            const sOn = sb.key === s.sub;
            rail.push({
              label: sb.label, h: "48px", size: "12px", dot: "28px", pad: "3px",
              fg: sOn ? "#E8DEF8" : "#CAC4D0", bg: sOn ? "#4A4458" : "#121216", rule: "0",
              pick: () => this.setState({ cell: c.key, sub: sb.key })
            });
          });
        }
      });
    });

    return {
      scale: s.scale, boxW: Math.round(418 * s.scale) + "px", boxH: Math.round(883 * s.scale) + "px",
      rail,
      heading: activeSub ? active.label + activeSub.label.slice(1).toLowerCase() : active ? active.label : "",
      fitNote: shown.length + " / " + CAP + ", fits one screen",
      shown: shown.map((n) => {
        const sel = n === s.selected;
        return { name: n, bg: sel ? "#4A4458" : "#0A0A0D", fg: sel ? "#E8DEF8" : "#E6E0E9", weight: sel ? 500 : 400, pick: () => this.setState({ selected: n }) };
      }),
      caption: "PK-D: the answer to the scroll-length constraint: the NAMES AREA NEVER SCROLLS. The rail is generated from the library, not fixed: a cell holding more than " + CAP + " names expands in place (tap C, or か) into prefix ranges, an accordion inside the one-column rail, not a row of tabs. Only scripts present in the library get a section (this one has Latin, Japanese, Cyrillic, Greek, Hangul, separated by a hairline; a Latin-only library shows none of them). " + (s.total ? s.total.toLocaleString("en-US") : "…") + " folders, no list anywhere."
    };
  }
}
</script>
</body>
</html>
