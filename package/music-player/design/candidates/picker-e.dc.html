<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="../_ds/material-design-3-design-system-503c3571-4db9-4b54-8695-7f53861f5059/tokens/fonts.css" rel="stylesheet"><style>html,body{height:100%;margin:0;overflow:hidden}</style></helmet>
<div style="background:#000;color:#e9e9ea;font-family:'Google Sans Text',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column">
  <div style="flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #282828;font-size:13px;color:#8e8e93">
    <span style="display:flex;align-items:center;gap:8px;min-height:48px;box-sizing:border-box;background:#1e1e1e;border:1px solid #3a3a42;border-radius:8px;padding:0 14px;color:#e9e9ea;font-size:14px">Camellia</span>
    <span style="font-variant-numeric:tabular-nums">{{ total }} folders</span>
  </div>
  <div style="flex:1 1 auto;min-height:0;display:flex">
    <div style="flex:1 1 auto;min-height:0;overflow:auto;padding:0 0 20px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div style="position:sticky;top:0;z-index:1;background:#0b0b0c;padding:6px 14px;font-size:11.5px;color:#8e8e93;letter-spacing:.06em;border-bottom:1px solid #1a1a1c">{{ g.letter }} · {{ g.count }}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;padding:1px 0">
          <sc-for list="{{ g.names }}" as="n" hint-placeholder-count="9">
            <div style="display:flex;align-items:center;height:48px;padding:0 14px;background:#101011;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ n }}</div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="flex:0 0 auto;width:40px;border-left:1px solid #1a1a1c;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;padding:6px 0;font-size:11px;color:#8e8e93;text-align:center">
      <span style="padding:1px 0">#</span><span style="padding:1px 0">A</span><span style="padding:1px 0">B</span><span style="padding:1px 0">C</span><span style="padding:1px 0">D</span><span style="padding:1px 0">E</span><span style="padding:1px 0">F</span><span style="padding:1px 0">G</span><span style="padding:1px 0">H</span><span style="padding:1px 0">I</span><span style="padding:1px 0">J</span><span style="padding:1px 0">K</span><span style="padding:1px 0">L</span><span style="padding:1px 0">M</span><span style="padding:1px 0">N</span><span style="padding:1px 0">O</span><span style="padding:1px 0">P</span><span style="padding:1px 0">Q</span><span style="padding:1px 0">R</span><span style="padding:1px 0">S</span><span style="padding:1px 0">T</span><span style="padding:1px 0">U</span><span style="padding:1px 0">V</span><span style="padding:1px 0">W</span><span style="padding:1px 0">X</span><span style="padding:1px 0">Y</span><span style="padding:1px 0">Z</span>
    </div>
  </div>
  <div style="flex:0 0 auto;padding:9px 14px;border-top:1px solid #282828;color:#55555c;font-size:12px;font-family:ui-monospace,monospace">E: uniform 48px cells in a responsive grid, sticky letter headers. Predictable rhythm, long names truncate.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:520}}">
class Component extends DCLogic {
  state = { groups: [], letters: [], total: 0 };
  componentDidMount() {
    import("./artists.js").then((m) => {
      this.setState({ groups: m.grouped(), letters: m.LETTERS, total: m.ARTISTS.length });
    });
  }
  renderVals() {
    return { groups: this.state.groups, letters: this.state.letters, total: this.state.total };
  }
}
</script>
</body>
</html>
