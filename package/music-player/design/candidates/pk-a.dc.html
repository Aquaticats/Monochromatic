<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="_ds/material-design-3-design-system-503c3571-4db9-4b54-8695-7f53861f5059/tokens/fonts.css" rel="stylesheet"><style>html,body{height:100%;margin:0;overflow:hidden;background:#000}</style></helmet>
<div style="background:#000;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden;position:relative;box-sizing:border-box;padding-bottom:72px;font-family:'Roboto Flex',system-ui,sans-serif">
<div style="width:{{ boxW }};height:{{ boxH }};flex:0 0 auto;overflow:visible"><div style="width:418px;height:883px;transform:scale({{ scale }});transform-origin:top left;outline:1px solid #26262E;color:#E6E0E9;display:flex;flex-direction:column;overflow:hidden;background:#000">
  <div style="flex:0 0 auto;min-height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #26262E">
    <div style="flex:1 1 auto"></div>
    <div style="min-height:40px;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:0 16px;border:1px solid #938F99;border-radius:20px;font-size:14px;font-weight:500"><svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:#CAC4D0"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Open</div>
  </div>
  <div style="flex:1 1 auto;min-height:0;display:flex;overflow:hidden">
    <div style="flex:0 0 48px;min-height:0;overflow:auto;display:flex;flex-direction:column;border-right:1px solid #121216;scrollbar-width:none">
      <sc-for list="{{ letterCells }}" as="l" hint-placeholder-count="27">
        <div onClick="{{ l.pick }}" style="width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;font-size:14px;font-weight:500;cursor:pointer;color:{{ l.fg }}"><span style="width:32px;height:32px;border-radius:16px;display:grid;place-items:center;background:{{ l.bg }}">{{ l.label }}</span></div>
      </sc-for>
    </div>
    <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
      <div style="flex:0 0 auto;padding:12px 16px 4px"><span style="font-size:22px;line-height:28px;color:#D0BCFF">{{ letter }}</span></div>
      <div style="flex:1 1 auto;min-height:0;overflow:auto">
        <sc-for list="{{ shown }}" as="r" hint-placeholder-count="14">
          <div onClick="{{ r.pick }}" style="min-height:48px;box-sizing:border-box;display:flex;align-items:center;padding:0 16px;font-size:16px;cursor:pointer;background:{{ r.bg }};color:{{ r.fg }};font-weight:{{ r.weight }}"><span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</span></div>
        </sc-for>
      </div>
    </div>
  </div>
</div></div>
<div style="position:absolute;left:0;right:0;bottom:0;padding:8px 16px;color:#8E8894;font-size:11px;line-height:14px;font-family:ui-monospace,monospace;background:#000">{{ caption }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:418,&quot;height&quot;:963}}">
class Component extends DCLogic {
  state = { data: null, letter: "C", selected: "Camellia", scale: 1 };
  componentDidMount() {
    this.fit = () => this.setState({ scale: Math.min(1, window.innerWidth / 418, (window.innerHeight - 80) / 883) });
    this.fit(); window.addEventListener("resize", this.fit);
    import("./artists.js").then((m) => this.setState({ data: m }));
  }
  componentWillUnmount() { window.removeEventListener("resize", this.fit); }
  renderVals() {
    const s = this.state, d = s.data;
    const shown = d ? d.ARTISTS.filter((n) => d.bucketOf(n) === s.letter) : [];
    return {
      scale: s.scale, boxW: Math.round(418 * s.scale) + "px", boxH: Math.round(883 * s.scale) + "px",
      letter: s.letter,
      shown: shown.map((n) => {
        const sel = n === s.selected;
        return { name: n, bg: sel ? "#4A4458" : "transparent", fg: sel ? "#E8DEF8" : "#E6E0E9", weight: sel ? 500 : 400, pick: () => this.setState({ selected: n }) };
      }),
      letterCells: (d ? d.LETTERS : []).map((l) => ({
        label: l, fg: l === s.letter ? "#E8DEF8" : "#CAC4D0", bg: l === s.letter ? "#4A4458" : "transparent",
        pick: () => this.setState({ letter: l })
      })),
      caption: "PK-A: one plain column, 48dp rows, no chip shape, no dividers. body-large 16px, full-width selection. C = " + shown.length + " names; the column scrolls within the letter. Left half only (418×883)."
    };
  }
}
</script>
</body>
</html>
