[tasks.build]
description = "Build the truepeak-core bench in release mode"
run = "cargo build --release"

[tasks.run]
description = "Evaluate + search a corpus: pass the tracks.jsonl path after --"
# Example: mise run //package/music-player/truepeak-core.bench:run -- out/tracks.jsonl
run = "cargo run --release --"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:clippy"]
description = "Run clippy with warnings denied"
run = "cargo clippy --release --all-targets -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run"
