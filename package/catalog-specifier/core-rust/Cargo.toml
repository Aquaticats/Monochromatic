[package]
name = "monochromatic-catalog-specifier"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["development-tools", "parser-implementations"]
documentation = "https://docs.rs/monochromatic-catalog-specifier"
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/catalog-specifier/core-rust"
include = [
  "src/**/*.rs",
  "fixtures/*.json",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["pnpm", "catalog", "package-json", "dependencies", "lint"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Pure checker for a package manifest's dependency specifiers: every dependency must be catalog:, catalog:<name> or exactly workspace:*. Bytes in, findings out, with no file or process access."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "monochromatic_catalog_specifier"
path = "src/lib.rs"

[dependencies]
# Reads the manifest bytes into a tree that keeps duplicate object keys visible, which a map-based JSON parser drops.
monochromatic-jsonc-edit = { path = "../../jsonc-edit/core-rust", version = "=0.1.3" }

[dev-dependencies]
# Loads fixtures/vectors.json, the executable form of the contract in the README.
serde_json = { workspace = true }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
serde_json = ">=1.0.154"
