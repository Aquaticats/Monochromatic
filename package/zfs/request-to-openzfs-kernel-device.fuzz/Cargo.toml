[package]
name = "zfs-request-to-openzfs-kernel-device-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = { workspace = true }
monochromatic-zfs-request-to-openzfs-kernel-device = { path = "../request-to-openzfs-kernel-device", version = "=0.1.0-alpha.1" }

# cargo-fuzz discovers targets through `cargo metadata`, so the harness needs an
# explicit bin entry.
[[bin]]
name = "nvlist_codec"
path = "fuzz_targets/nvlist_codec.rs"
test = false
doc = false
bench = false

# libFuzzer records and minimizes a failing input by unwinding out of the
# assertion.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

# Independent workspace, matching the other fuzz sidecars.
[workspace]
members = ["."]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
libfuzzer-sys = ">=0.4.13"

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"
