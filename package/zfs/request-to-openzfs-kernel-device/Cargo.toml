[package]
name = "monochromatic-zfs-request-to-openzfs-kernel-device"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["api-bindings", "filesystem"]
documentation = "https://docs.rs/monochromatic-zfs-request-to-openzfs-kernel-device"
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/zfs/request-to-openzfs-kernel-device"
include = [
  "src/**/*.rs",
  # A `uses/` link is a folder-tree aid; cargo follows symlinks, so without
  # this negation the package would hold a copy of the tree under every link.
  "!src/**/uses/**",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "PROVENANCE.md",
  "LICENSES/*.txt",
]
keywords = ["zfs", "openzfs", "ioctl", "worktree", "nvlist"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Typed /dev/zfs requests for the Git wrapper's ZFS worktree route: the OpenZFS 2.4.4 command struct, checked names, an owned native nvlist codec and bounded replies, with no C library and no zfs program."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "monochromatic_zfs_request_to_openzfs_kernel_device"
path = "src/lib.rs"

[dependencies]
# Parses the ABI's fixed struct fields and reports the kernel's errno values as text.
libc = { workspace = true }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
libc = ">=0.2.191"
