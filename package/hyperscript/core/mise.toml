[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

# The suites import the package by its bare name, which Node resolves through the
# exports map to dist/final/neutral, so the artifact must exist before they run.
[tasks."test:unit"]
extends = "test:unit"
depends = ["build"]
