# bootc-image-builder disk configuration
# See: https://github.com/osbuild/bootc-image-builder

# Root filesystem -- 40 GiB covers OS + KDE + dev packages with room for
# rpm-ostree layering during iterative development.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "40 GiB"

