[vars]
# Lowest weight podman accepts for a container's disk I/O (`--blkio-weight` takes 10 to 1000; the default is 100). Repository rule
# HXR (AGENTS.md) starts containers that can exhaust the host at this weight. The image:check containers are rootful, so they sit
# in a system scope outside this task's unit and the launcher's IOWeight never reaches them. `--blkio-weight` sets io.bfq.weight
# (read by the BFQ scheduler) and `--cgroup-conf io.weight=` sets io.weight (read by the other schedulers); the host's scheduler
# reads one of them. @monochromatic-dev/container-limit-core holds the one copy; src/container-arguments.unit.test.ts fails if this variable differs from it.
lowest_disk_weight = "10"

[tasks.run]
description = "Build container image and import as libvirt VM"
run = "node src/build-and-import.ts"

[tasks."image:build"]
description = "Build the dev OS image without converting disks or replacing a libvirt VM"
run = "sudo --non-interactive podman build --cpu-period 100000 --cpu-quota 800000 --memory 12g --tag localhost/monochromatic-dev:latest --file Containerfile --ignorefile .containerignore ../../.."

[tasks."image:check"]
description = "Inspect OdyTTY and terminal defaults in disposable containers from the dev image"
run = [
  "sudo --non-interactive podman run --rm --network none --cpus 2 --memory 2g --pids-limit 128 --blkio-weight {{vars.lowest_disk_weight}} --cgroup-conf io.weight={{vars.lowest_disk_weight}} --user user --entrypoint /usr/bin/odytty localhost/monochromatic-dev:latest --version",
  "sudo --non-interactive podman run --rm --network none --cpus 2 --memory 2g --pids-limit 128 --blkio-weight {{vars.lowest_disk_weight}} --cgroup-conf io.weight={{vars.lowest_disk_weight}} --user user --env XDG_CONFIG_HOME=/home/user/.config --entrypoint /usr/bin/odytty localhost/monochromatic-dev:latest --show-config",
  "sudo --non-interactive podman run --rm --network none --cpus 2 --memory 2g --pids-limit 128 --blkio-weight {{vars.lowest_disk_weight}} --cgroup-conf io.weight={{vars.lowest_disk_weight}} --user user --entrypoint /usr/bin/cat localhost/monochromatic-dev:latest /home/user/.config/kdeglobals /home/user/.config/xdg-terminals.list /usr/share/applications/io.unfinished_works.odytty.desktop",
]

[tasks.import]
description = "Import already-built qcow2 into libvirt (skips build+convert)"
run = "node src/import.ts"

[tasks.push]
description = "Push image to GHCR and sign with cosign"
run = "node src/sign-and-push.ts"

[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"
depends = ["build"]

[tasks.buildAndTest]
description = "Build the node bin (verification is the build + dts emit; the bin has no inert invocation to smoke-run)"
run = ["mise run build", "mise run test:unit"]
