[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks."test:scope"]
description = "Exercise the exact pre-install workflow launcher against disposable Git repositories"
run = "node src/ci-scope.unit.test.ts"

[tasks."lint:scope"]
description = "Lint the dependency-free scope entry and its subprocess regression tests"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['src/ci-scope.ts', 'src/ci-scope-git.ts', 'src/ci-scope-error.ts', 'src/ci-scope.unit.test.ts'])
"""

[tasks.fuzz]
description = "Build module-toml-edit, then run *.property.unit.test.ts as a time-budgeted fast-check campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
// Property files import the built module-toml-edit entry point, so the runtime
// package's dist must be fresh before any property runs; rebuild it first to
// avoid chasing a bug the stale artifact has not yet seen fixed.
execFileSync('mise', ['run', '//package/toml-edit/core:build'], { stdio: 'inherit' })
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, TOML_EDIT_FUZZ_BUDGET_MS: budget } })
}
"""

[tasks."fuzz:coverage"]
description = "Deterministic V8 line-coverage reachability gate over the module-toml-edit runtime src; --write refreezes the baseline"
usage = '''
flag "--write" help="Refreeze the committed baseline from this run instead of checking against it"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdtempSync, rmSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const root = process.cwd()
const mode = (process.env.usage_write === 'true') ? 'write' : 'check'
// The driver imports the module-toml-edit package source through its `/ts`
// subpath, so no build step is needed; the report projects coverage onto the
// runtime package's src files (resolved through the same subpath), never this
// sidecar.
const dir = mkdtempSync(join(tmpdir(), 'toml-edit-cov-'))
try {
  // MONOCHROMATIC_WARN=false keeps the CRLF-normalization warning off the coverage run's stderr.
  execFileSync('node', [`${root}/src/coverage-driver.ts`], { stdio: 'inherit', env: { ...process.env, MONOCHROMATIC_WARN: 'false', NODE_V8_COVERAGE: dir } })
  execFileSync('node', [`${root}/src/coverage-report.ts`, mode, dir, `${root}/coverage-baseline.json`], { stdio: 'inherit' })
} finally {
  rmSync(dir, { recursive: true, force: true })
}
"""
