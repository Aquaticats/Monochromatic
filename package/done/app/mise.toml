[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:client"]
extends = "build:js:client"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:client"]
extends = "watch:build:js:client"

[tasks."serve:site"]
hide = true
description = "Start Done once"
run = "node src/server.ts"

[tasks."dev:site"]
description = "Start Done in watch mode"
run = "mise watch --watch src --restart serve:site"

# start:site intentionally omitted -- production is managed by the
# orchestrator container, not by mise (see PLAN.md section 7).

[tasks."dev"]
description = "Start Done in watch mode alongside a local llama.cpp inference server"
run = [{ tasks = ["dev:site:llama", "dev:site"] }]

[tasks."dev:llama"]
hide = true
description = "Start llama-server with default model (LFM2.5-1.2B-Instruct-Q4_K_M)"
run = "llama-server --hf-repo LiquidAI/LFM2.5-1.2B-Instruct-GGUF --hf-file LFM2.5-1.2B-Instruct-Q4_K_M.gguf --ctx-size 4096 --host 127.0.0.1 --port 8080"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"
hide = true

[tasks."lint:oxlint"]
extends = "lint:oxlint"
[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"
