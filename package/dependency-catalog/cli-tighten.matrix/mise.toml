[tasks."test:unit"]
extends = "test:unit"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

# Containerised end-to-end matrix; needs podman and network (pnpm install pulls from the registry).
# Not part of test:unit, which discovers *.unit.test.* and skips *.unit.matrix.test.ts.
[tasks."test:matrix"]
description = "Run the catalog-tighten install-layout matrix in containers"
run = "node src/matrix.unit.matrix.test.ts"
