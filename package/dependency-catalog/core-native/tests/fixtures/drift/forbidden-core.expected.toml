[package]
name = "forbidden-regex"
version = "0.1.1"
authors = ["Aquaticat"]
categories = ["text-processing", "development-tools"]
documentation = "https://docs.rs/forbidden-regex"
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/forbidden-strings/core"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["regex", "derivative", "dfa", "intersection", "complement"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Restricted byte-oriented regex engine for line-at-a-time secret scanning, with counting, product, and DFA back-ends, set-level literal gating, intersection (&), and complement (~)."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "forbidden_regex"
path = "src/lib.rs"

[dependencies]
# `serde` derives the (de)serialization for the compiled `Dfa`/`Regex`/`RegexSet`
# so a built automaton can be persisted and reloaded. Derive feature lets the DFA
# structs declare `#[derive(Serialize, Deserialize)]` instead of hand-written impls.
serde = { workspace = true, features = ["derive"] }

# `bincode` 1.3 is a pure-serde, dependency-light binary codec (its only dep is
# serde). It encodes the compiled DFA to bytes and decodes it back. 1.x is chosen
# over 2.x because 2.x adds its own `Encode`/`Decode` derive layer this crate does
# not need; the plain `bincode::serialize`/`deserialize` serde path is enough.
bincode = { workspace = true }

# The logging facade. forbidden-regex is a pure compute library, so it emits only at its
# public `compile` boundary (debug) and on parse/build failures (warn); with no subscriber
# installed the macros collapse to a cheap max-level check, so the scanning hot path (the
# counting simulation, the DFA walks) pays nothing.
tracing = { workspace = true }

# `memchr` provides the SIMD substring search (`memmem::Finder`) behind the
# per-pattern required-literal prefilter. Most scanned lines contain no secret, so
# rejecting them on a cheap literal scan before the counting simulation is the
# dominant throughput win; `memchr` is the canonical, dependency-light impl.
memchr = { workspace = true }

# `aho-corasick` provides the RegexSet-level combined prefilter: one multi-pattern
# pass over a line (auto-selecting SIMD Teddy for small seed sets) replaces one
# substring scan per rule, so a non-matching line is rejected in a single pass.
aho-corasick = { workspace = true }

# `regex-automata` provides the SIMD literal prefilter (the same machinery the regex
# crate uses) for the RegexSet gate's fast reject. With hundreds of seed literals,
# aho-corasick's high-level search falls back to a scalar automaton; this prefilter
# picks the best SIMD strategy (Teddy, memchr on rare bytes) for the negative-line
# fast path. `perf-literal` enables the literal searchers.
regex-automata = { workspace = true, default-features = false, features = ["std", "syntax", "perf-literal"] }

# Why `panic = "unwind"` + `overflow-checks = true` here, mirroring the
# forbidden-strings scanner this engine serves:
#
# 1. `overflow-checks = true`: the DFA builder does index and counter arithmetic
#    (state ids, byte-class indices, repetition desugaring counts). A silent wrap
#    would build the WRONG automaton and the engine would fail OPEN (a secret
#    scanner that misses a leak), the worst failure for this use. With checks on,
#    a wrap becomes a real panic at the arithmetic site instead of a corrupt DFA.
#
# 2. `panic = "unwind"`: keeps a panicking compile recoverable by a caller's
#    `catch_unwind` boundary (the scanner uses one), rather than aborting the CI
#    process. `compile`/`new` themselves return `Result` and aim never to panic;
#    this is defense-in-depth for unknown shapes during the build phase.
[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "unwind"
overflow-checks = true
strip = true

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
aho-corasick = ">=1.1.4"
bincode = ">=1.3.3"
memchr = ">=2.8.2"
regex-automata = { version = ">=0.4.14", default-features = false }
serde = ">=1.0.229"
tracing = ">=0.1.44"
