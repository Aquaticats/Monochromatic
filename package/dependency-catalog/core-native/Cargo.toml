[package]
name = "monochromatic-dependency-catalog"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["development-tools", "parser-implementations"]
documentation = "https://docs.rs/monochromatic-dependency-catalog"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["cargo", "catalog", "workspace", "toml"]
description = "Pure-function library that renders a pnpm-style rust-catalog.toml into each Cargo workspace root's [workspace.dependencies]: parses and validates the catalog, adopts literal versions, prunes unused entries, writes internal path versions, and reports drift, all as format-preserving toml_edit edits over file contents."
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/dependency-catalog/core-native"
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"

[lib]
name = "monochromatic_dependency_catalog"
path = "src/lib.rs"

[dependencies]
# Parses the catalog and every crate manifest, and edits them in place keeping comments and layout.
toml_edit = { workspace = true }

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
toml_edit = ">=0.25.17"
