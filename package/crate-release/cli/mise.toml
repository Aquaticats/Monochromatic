[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:unit"]
extends = "test:unit"

[tasks.release]
description = "Start the release of a crate listed in releasable-crates.json on GitHub and print the run URL: `-- --crate <name> [--dry-run] <from> <to> <note>` (see README.md). Nothing compiles here"
run = "node bin/dispatch-release.ts"

[tasks."release:wait"]
description = "Follow a release run, then the cargo-publish run it started, then verify crates.io and the GitHub release: `-- --crate <name> [options] <run URL or id> <version>` (see README.md)"
run = "node bin/await-release.ts"

[tasks."release:run"]
description = "Run the release command itself: bump, lock, dry-run the publish when the version goes to crates.io, and commit locally; an alpha skips the check and the dry run. The release workflow runs it on a runner with `--host runner`; a release that is not an alpha compiles the crate on the machine that runs it (see README.md)"
run = "node bin/release.ts"

[tasks."release:push"]
description = "Append the head commit of this checkout to a branch through the GraphQL API so GitHub signs it: `-- --repo <owner/name> --branch <branch> --scratch-dir <dir>`; the release workflow runs it (see README.md)"
run = "node bin/push-release.ts"

[tasks."release:wait:commit"]
description = "Wait for the publish workflow run of a commit, then verify crates.io and the GitHub release: `-- --crate-name <name> [options] <sha> <version>` (see README.md)"
run = "node bin/wait-publish.ts"
