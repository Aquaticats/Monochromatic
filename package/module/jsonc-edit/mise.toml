[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:browser"]
extends = "build:js:browser"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:browser"]
extends = "watch:build:js:browser"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.buildAndTest]
description = "Build the neutral bundle, then run unit tests against the built dist"
run = ["mise run build", "mise run test:unit"]

# Non-runtime tooling lives in sidecar packages so this package's src stays pure
# production code: fuzz property tests + run budget + coverage gate in
# jsonc-edit.fuzz, the parse benchmark in jsonc-edit.bench, the conformance corpus
# in jsonc-edit.conformance.

[tasks."test:mutation"]
description = "Run container-isolated oxc mutation tests"
usage = 'arg "[args]" var=#true help="Optional mutation-test flags and package-relative source files"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
runWorkspaceNode('package/mutation-test/cli', 'cli', ['--package', 'package/module/jsonc-edit', ...args])
"""
