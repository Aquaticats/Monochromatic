[package]
name = "monochromatic-file-enforcer-cli"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["command-line-utilities", "development-tools"]
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/file-enforcer/cli"
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["file-enforcer", "generated-files", "jsonc", "drift"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "The file-enforcer command line: write, check, watch, explain, and the per-user commands, every line of output one JSON object."

# cargo-binstall's default URL is {repo}/releases/download/v{version}/{name}-{target}-v{version}, but this
# repository tags each crate's release {name}-v{version} and names the archive {name}-{version}-{target}.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "file_enforcer_cli"
path = "src/lib.rs"

[[bin]]
name = "file-enforcer"
path = "src/main.rs"

[dependencies]
# The rule engine, the server and the client; this crate only parses the command line and prints.
monochromatic-file-enforcer = { path = "../core-rust", version = "=0.1.0" }
# Owns the command grammar; its help, version and parse errors are re-emitted as JSON lines.
clap = { workspace = true, features = ["derive"] }
# Event lines are built as JSON objects.
serde_json = { workspace = true }

[dev-dependencies]
# Disposable worktrees and runtime directories for the binary tests.
tempfile = { workspace = true }
# Reads the child process id from the server's reply and stops stray servers.
libc = { workspace = true }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
clap = ">=4.6.7"
libc = ">=0.2.191"
serde_json = ">=1.0.154"
tempfile = ">=3.27.0"
