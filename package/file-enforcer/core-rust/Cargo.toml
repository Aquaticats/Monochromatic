[package]
name = "monochromatic-file-enforcer"
version = "0.1.0"
authors = ["Aquaticat"]
categories = ["development-tools", "filesystem"]
documentation = "https://docs.rs/monochromatic-file-enforcer"
edition = "2024"
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/file-enforcer/core-rust"
include = [
  "src/**/*.rs",
  "fixtures/*.jsonc",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSES/*.txt",
]
keywords = ["file-enforcer", "generated-files", "jsonc", "drift"]
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
description = "Rule engine behind file-enforcer: plans every rule against a virtual view of the worktree, validates the whole run, then publishes generated files one by one, and serves the plans over a per-worktree Unix socket."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "monochromatic_file_enforcer"
path = "src/lib.rs"

[dependencies]
# Reads `file-enforcer.config.jsonc` (and the per-user config) with comments intact; the decoder is hand-written over its value model.
monochromatic-jsonc-edit = { path = "../../jsonc-edit/core-rust", version = "=0.1.2" }
# Expands one glob segment at a time (`package/*/*/Cargo.toml`) without walking the whole tree.
globset = { workspace = true }
# Derives `file-enforcer.schema.json` from the config types; the types do not derive serde.
schemars = { workspace = true }
# Strict JSON for events, JSON-RPC lines and the schema; `preserve_order` keeps event fields in the order they are written.
serde_json = { workspace = true, features = ["preserve_order"] }
# Content digests for the socket name, the build identity and the mirror comparison.
sha2 = { workspace = true }
# Edits `Cargo.toml` keys while keeping comments, order and unowned keys.
toml_edit = { workspace = true }
# The per-worktree server's runtime-directory fallback and the per-user config location.
directories = { workspace = true }
# Recommended watcher behind `watch`.
notify = { workspace = true }
# Owner checks (`geteuid`) and the startup lock (`flock`), which the standard library does not expose.
libc = { workspace = true }

[dev-dependencies]
# Disposable worktrees for the engine and server tests.
tempfile = { workspace = true }
# Checks the hand-written decoder against the committed schema over the sample corpus.
jsonschema = { workspace = true }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
directories = ">=6"
globset = ">=0.4.20"
jsonschema = ">=0.60.2"
libc = ">=0.2.191"
notify = ">=8.2.0"
schemars = ">=1.2.3"
serde_json = ">=1.0.154"
sha2 = ">=0.10.9"
tempfile = ">=3.27.0"
toml_edit = ">=0.25.17"
