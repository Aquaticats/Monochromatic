[tasks.build]
description = "Build the monochromatic-file-enforcer library in release mode"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the monochromatic-file-enforcer library in debug mode"
run = "cargo build"

[tasks.lint]
description = "cargo check (no codegen)"
run = "cargo check"

[tasks."lint:types"]
description = "Type-level gate for this crate: cargo check plus clippy with warnings denied"
run = ["cargo check", "cargo clippy --all-targets -- -D warnings"]

[tasks."lint:clippy"]
description = "Run clippy over the lib and tests with warnings denied"
run = "cargo clippy --all-targets -- -D warnings"

[tasks."format:clippy"]
description = "Apply clippy's machine-applicable suggestions in place"
run = "cargo clippy --fix --allow-dirty --allow-staged"

[tasks.test]
description = "cargo nextest run"
run = "cargo nextest run"

[tasks."schema:write"]
description = "Rewrite the committed file-enforcer.schema.json from the config types"
run = "cargo run --example write-schema --quiet"

[tasks.package]
description = "Build and verify the crates.io package tarball"
run = "cargo package"

[tasks."publish:dry-run"]
description = "Package and verify, then abort before uploading to crates.io"
run = "cargo publish --dry-run"

[tasks.publish]
description = "Fallback local publish. Canonical path is .github/workflows/cargo-publish.yml (OIDC Trusted Publishing); the very first version of a crate must be published once with a personal API token (doc/runbook/publish-crate-first-time.md)."
run = "cargo publish"

[tasks.release]
description = "Start the file-enforcer release on GitHub and print the run URL: `-- <from> <to> <note>` (quote the note; `--dry-run` first runs everything except the push and the publish). The crate-release workflow bumps the crate and every exact pin of it, checks, dry-runs the publish, pushes the bump to main and starts cargo-publish; nothing compiles here"
run = "node ../../crate-release/cli/bin/dispatch-release.ts --crate monochromatic-file-enforcer"

[tasks."release:wait"]
description = "Follow the release run that `release` printed, then the cargo-publish run it started, then check crates.io (a library has no GitHub release, so the check ends with PUBLISH CHECK FAILED naming only the missing release assets; the crates.io line is its result): `-- <run URL or id> <version>`"
run = "node ../../crate-release/cli/bin/await-release.ts --crate monochromatic-file-enforcer"
