# Reports count only sidecar files present when the audit started, listed in
# dist/recall/baseline-files.txt from `git ls-tree` at that commit, so files
# added since can never raise recall. Light JSON reading, so it runs on the host.
[tasks."recall:report"]
description = "Write dist/recall/baseline-files.txt from the audit's starting commit and print the runtime and type recall summaries as JSON"
usage = '''
flag "--baseline-commit <rev>" default="e4237dc8f" help="Commit whose sidecar files count toward recall"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdirSync, writeFileSync } = await import('node:fs')
const { join, relative, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const packagePath = relative(repoRoot, packageRoot)
const run = async (command, args, capture) => {
  const child = spawn(command, args, { stdio: ['ignore', capture ? 'pipe' : 'inherit', 'inherit'] })
  const chunks = []
  if (capture) child.stdout.on('data', (chunk) => { chunks.push(chunk) })
  const [code] = await once(child, 'close')
  if (code !== 0) throw new Error(`${command} ${args.join(' ')} exited with ${String(code)}`)
  return Buffer.concat(chunks).toString('utf8')
}
const listing = await run('git', ['-C', repoRoot, 'ls-tree', '-r', '--name-only', (process.env.usage_baseline_commit ?? 'e4237dc8f').trim(), '--', `${packagePath}/src`], true)
const files = listing.split('\\n').filter((line) => line !== '').map((line) => line.slice(packagePath.length + 1))
mkdirSync(join(packageRoot, 'dist', 'recall'), { recursive: true })
writeFileSync(join(packageRoot, 'dist', 'recall', 'baseline-files.txt'), `${files.join('\\n')}\\n`)
console.log(`${String(files.length)} baseline files`)
await run('node', ['src/recall-runtime-report.ts'], false)
await run('node', ['src/recall-types-report.ts'], false)
"""

# Unsearched surfaces (doc/audit/deepmerge-ts-surface-2026-09-24.md). The
# TypeScript matrix and cost sweeps need eleven compiler releases, installed
# by surface:install into dist/surface/scratch (never this workspace, so the
# lockfile is untouched). Each run executes inside the podman caps with the
# repo read-only and only dist/surface/ writable at its host path.
[tasks."surface:install"]
description = "Write and install the surface toolchain (TypeScript 4.7 to 7.0 plus probes) into dist/surface/scratch, in a 2 GiB / 2 CPU podman container"
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdirSync } = await import('node:fs')
const { join, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const out = join(packageRoot, 'dist', 'surface')
const scratch = join(out, 'scratch')
mkdirSync(scratch, { recursive: true })
const nodeMajor = process.versions.node.split('.')[0]
const inContainer = async (workdir, command) => {
  const child = spawn('podman', [
    'run', '--memory=2g', '--cpus=2', '--rm', '--init',
    '--security-opt', 'label=disable',
    '--volume', `${repoRoot}:${repoRoot}:ro`,
    '--volume', `${out}:${out}:rw`,
    '--workdir', workdir,
    `docker.io/library/node:${nodeMajor}-slim`,
    ...command,
  ], { stdio: 'inherit' })
  const [code] = await once(child, 'exit')
  if (code !== 0) throw new Error(`surface install step ${command.join(' ')} exited with ${String(code)}`)
}
await inContainer(packageRoot, ['node', 'src/surface-toolchain.ts', scratch])
await inContainer(scratch, ['npm', 'install', '--no-audit', '--no-fund'])
"""

