const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`declared-type positive control container exited with ${String(code)}`)
"""

# Mutation testing of a deepmerge-ts checkout (doc/audit/deepmerge-ts-mutation-2026-09-24.md).
# StrykerJS and Vitest live only in the image from container/mutation.Containerfile
# (user decision in doc/handover/deepmerge-ts-hardening.md); every run mounts the
# checkout read-only at /checkout, this repo read-only at its host path, and
# dist/mutation/ writable at /out, inside the usual 2 GiB / 2 CPU caps.
[tasks."mutation:image"]
description = "Build the pinned StrykerJS + Vitest + esbuild image the mutation tasks run in"
run = "podman build --tag localhost/deepmerge-ts-mutation:stryker-10.0.0 --file container/mutation.Containerfile container"

[tasks.mutation]
description = "StrykerJS over a deepmerge-ts checkout with upstream's own Vitest suite; writes dist/mutation/mutation.json"
depends = ["mutation:image"]
usage = '''
flag "--checkout <dir>" required=#true help="Absolute path of the deepmerge-ts checkout to mutate"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdirSync } = await import('node:fs')
const { join, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const out = join(packageRoot, 'dist', 'mutation')
mkdirSync(out, { recursive: true })
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${resolve(process.env.usage_checkout ?? '')}:/checkout:ro`,
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  '--volume', `${out}:/out:rw`,
  '--workdir', packageRoot,
  'localhost/deepmerge-ts-mutation:stryker-10.0.0',
  'node', 'src/mutation-score.ts',
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`mutation container exited with ${String(code)}`)
"""

[tasks."mutation:sweep"]
description = "Run Stryker's survivors from dist/mutation/mutation.json through every sidecar unit file; --baseline checks the unmutated bundle first"
depends = ["mutation:image"]
usage = '''
flag "--checkout <dir>" required=#true help="Absolute path of the same deepmerge-ts checkout the mutation task used"
flag "--baseline" help="Only bundle the unmutated checkout and require every sidecar file to pass against it"
arg "[ids]..." help="Mutant ids to sweep; default every Survived and NoCoverage mutant"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { join, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const out = join(packageRoot, 'dist', 'mutation')
const mode = (process.env.usage_baseline === 'true') ? ['baseline'] : ['sweep', ...(process.env.usage_ids ?? '').split(' ').filter((id) => id !== '')]
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${resolve(process.env.usage_checkout ?? '')}:/checkout:ro`,
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  '--volume', `${out}:/out:rw`,
  '--workdir', packageRoot,
  'localhost/deepmerge-ts-mutation:stryker-10.0.0',
  'node', 'src/mutation-sweep.ts', ...mode,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`mutation sweep container exited with ${String(code)}`)
"""

[tasks."mutation:differential"]
description = "Compare mutant bundles from mutation:sweep with the baseline on fixed-seed generated cases, after a self-comparison and a control mutant"
depends = ["mutation:image"]
usage = '''
flag "--runs <runs>" default="1000" help="Cases per category"
flag "--control <id>" required=#true help="A mutant the sidecar detects; it must show a difference"
arg "<ids>..." help="Mutant ids to compare"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { join, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const out = join(packageRoot, 'dist', 'mutation')
const ids = (process.env.usage_ids ?? '').split(' ').filter((id) => id !== '')
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  '--volume', `${out}:/out:rw`,
  '--workdir', packageRoot,
  'localhost/deepmerge-ts-mutation:stryker-10.0.0',
  'node', 'src/mutation-differential.ts', (process.env.usage_runs ?? '1000').trim(), (process.env.usage_control ?? '').trim(), ...ids,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`mutation differential container exited with ${String(code)}`)
"""

# Historical recall (doc/audit/deepmerge-ts-recall-2026-09-24.md): does the
# sidecar detect bugs deepmerge-ts actually shipped and fixed? `recall:setup`
# fetches every npm release and upstream trees on the host (downloads and
# `git archive` only) into ~/temp/agent, outside this repo; the runtime,
# types, and packaging runs each execute inside the podman caps with the repo
# read-only and only their own dist/recall/<area>/ writable.
[tasks."recall:setup"]
description = "Fetch every npm release and the upstream trees the recall ledger names into ~/temp/agent (host; downloads and git archive only)"
usage = '''
flag "--clone <dir>" required=#true help="Absolute path of a full-history deepmerge-ts clone with its push URL disabled"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { resolve } = await import('node:path')
const child = spawn('node', ['src/recall-setup.ts', resolve(process.env.usage_clone ?? '')], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`recall setup exited with ${String(code)}`)
"""

[tasks."recall:runtime"]
description = "Rebuild each runtime ledger row's buggy and fixed bundles and run every sidecar unit file against both, in a 2 GiB / 2 CPU podman container; one line per row in dist/recall/runtime/runtime.jsonl"
depends = ["mutation:image"]
usage = '''
flag "--trees <dir>" help="Upstream trees from recall:setup (default ~/temp/agent/deepmerge-ts-recall-trees)"
arg "[ids]..." help="Ledger row ids from src/recall-ledger-runtime.ts; default every row"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdirSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const out = join(packageRoot, 'dist', 'recall', 'runtime')
mkdirSync(out, { recursive: true })
const trees = resolve((process.env.usage_trees ?? '') === '' ? join(homedir(), 'temp', 'agent', 'deepmerge-ts-recall-trees') : (process.env.usage_trees ?? ''))
const ids = (process.env.usage_ids ?? '').split(' ').filter((id) => id !== '')
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  '--volume', `${trees}:/trees:ro`,
  '--volume', `${out}:/out:rw`,
  '--workdir', packageRoot,
  'localhost/deepmerge-ts-mutation:stryker-10.0.0',
  'node', 'src/recall-runtime.ts', ...ids,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`recall runtime container exited with ${String(code)}`)
"""

# The result-type run maps `deepmerge-ts` to each release's declarations and
# type-checks the whole sidecar with the workspace compiler, so its output
# directory must sit inside the package (generated tsconfigs resolve the
# package's node_modules); it is mounted writable at its host path.
[tasks."recall:types"]
description = "Type-check the sidecar against npm releases for the type ledger, in a 2 GiB / 2 CPU podman container; `corpus <seed> <size>`, `check <version>...`, or `control <id>`, results in dist/recall/types/results/"
usage = '''
flag "--npm <dir>" help="Extracted npm releases from recall:setup (default ~/temp/agent/deepmerge-ts-recall-npm)"
arg "<mode>" help="corpus, check, or control"
arg "[args]..." help="corpus: <seed> <size>; check: npm versions; control: one type ledger id"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { mkdirSync } = await import('node:fs')
const { homedir } = await import('node:os')
const { join, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const out = join(packageRoot, 'dist', 'recall', 'types')
mkdirSync(out, { recursive: true })
const npmDir = resolve((process.env.usage_npm ?? '') === '' ? join(homedir(), 'temp', 'agent', 'deepmerge-ts-recall-npm') : (process.env.usage_npm ?? ''))
const args = (process.env.usage_args ?? '').split(' ').filter((arg) => arg !== '')
const nodeMajor = process.versions.node.split('.')[0]
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  '--volume', `${out}:${out}:rw`,
  '--volume', `${npmDir}:${npmDir}:ro`,
  '--env', `RECALL_NPM_DIR=${npmDir}`,
  '--workdir', packageRoot,
  `docker.io/library/node:${nodeMajor}-slim`,
  'node', 'src/recall-types.ts', (process.env.usage_mode ?? '').trim(), ...args,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`recall types container exited with ${String(code)}`)
"""

