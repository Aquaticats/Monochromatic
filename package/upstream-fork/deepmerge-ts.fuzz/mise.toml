# Bun and Deno run every sidecar unit file from their official images; only
# the major is fixed for Bun and Deno tracks latest, matching the audit.
# DEEPMERGE_FUZZ_TARGET passes through (its directory mounted read-only), so
# the same task checks the CJS build or a control build.
[tasks."surface:runtime"]
description = "Run every sidecar unit file under Bun or Deno in a 2 GiB / 2 CPU podman container"
usage = '''
flag "--runtime <name>" required=#true help="bun or deno"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { dirname, resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const runtime = (process.env.usage_runtime ?? '').trim()
const denoRun = ['deno', 'run', '--allow-all', '--no-lock', '--node-modules-dir=manual']
const commands = {
  bun: { image: 'docker.io/oven/bun:1', command: ['bun', 'src/surface-runtime.ts', 'bun'] },
  deno: { image: 'docker.io/denoland/deno:latest', command: [...denoRun, 'src/surface-runtime.ts', ...denoRun] },
}
if (!Object.hasOwn(commands, runtime)) throw new Error(`--runtime must be bun or deno, got ${runtime}`)
const { image, command } = commands[runtime]
const override = process.env.DEEPMERGE_FUZZ_TARGET
const targetArgs = (override === undefined || override === '')
  ? []
  : ['--volume', `${dirname(resolve(override))}:${dirname(resolve(override))}:ro`, '--env', `DEEPMERGE_FUZZ_TARGET=${resolve(override)}`]
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  ...targetArgs,
  '--workdir', packageRoot,
  image,
  ...command,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`surface runtime container exited with ${String(code)}`)
"""
