[tasks.buildAndTest]
description = "Build the neutral bundle, then run every *.unit.test.ts against the built dist"
run = ["mise run build", "mise run test:unit"]

# This package writes real config files, resolves per-user config directories,
# sets file modes, and watches paths, so the suite runs against a disposable
# container filesystem as well as on the host. The repo is mounted read-only at
# its host path so pnpm's symlinks resolve, with `label=disable` instead of `:Z`
# so SELinux never relabels the whole checkout (AGENTS.md BOX); every write
# lands in the container-local /tmp and $HOME.
[tasks."test:container"]
description = "Run every *.unit.test.ts in a 2 GiB / 2 CPU podman container with a disposable HOME and tmpdir"
usage = 'arg "[args]" var=#true help="Test file paths to run (when provided, only those files run)"'
shell = "node --input-type=module-typescript -e"
run = """
const { spawn } = await import('node:child_process')
const { once } = await import('node:events')
const { resolve } = await import('node:path')
const packageRoot = process.cwd()
const repoRoot = resolve(packageRoot, '../../..')
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
const nodeMajor = process.versions.node.split('.')[0]
const runner = [
  \"const { spawn } = await import('node:child_process')\",
  \"const { once } = await import('node:events')\",
  \"const { glob } = await import('node:fs/promises')\",
  \"const asked = JSON.parse(process.env.CONF_FORK_TEST_FILES ?? '[]')\",
  \"const picks = asked.length > 0 ? asked : []\",
  \"if (picks.length === 0) { for await (const file of glob('**/*.unit.test.ts', { exclude: (name) => name.includes('node_modules') })) picks.push(file) }\",
  \"const failed = []\",
  \"for (const file of picks) {\",
  \"  const child = spawn('node', [file], { stdio: 'inherit' })\",
  \"  const [code] = await once(child, 'exit')\",
  \"  if (code !== 0) failed.push(file)\",
  \"}\",
  \"if (failed.length > 0) throw new Error('test files failed: ' + failed.join(', '))\",
].join('\\n')
const child = spawn('podman', [
  'run', '--memory=2g', '--cpus=2', '--rm', '--init',
  '--security-opt', 'label=disable',
  '--volume', `${repoRoot}:${repoRoot}:ro`,
  '--workdir', packageRoot,
  '--env', 'HOME=/tmp/conf-fork-home',
  '--env', 'TMPDIR=/tmp',
  '--env', `CONF_FORK_TEST_FILES=${JSON.stringify(args)}`,
  `docker.io/library/node:${nodeMajor}-slim`,
  'node', '--input-type=module-typescript', '-e', runner,
], { stdio: 'inherit' })
const [code] = await once(child, 'exit')
if (code !== 0) throw new Error(`test:container exited with ${String(code)}`)
"""

[tasks."test:mutation"]
description = "Run container-isolated oxc mutation tests over this package"
usage = 'arg "[args]" var=#true help="Optional mutation-test flags and package-relative source files"'
# mutation-test resolves both --package and its own runtime files against its
# cwd, so the task runs from the monorepo root.
dir = "../../.."
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
runWorkspaceNode('package/mutation-test/cli', 'cli', ['--package', 'package/upstream-fork/conf', '--report', 'package/upstream-fork/conf/dist/mutation-report.json', ...args])
"""
