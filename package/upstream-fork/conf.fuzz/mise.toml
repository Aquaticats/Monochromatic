[tasks.lint]
extends = "lint"

[tasks."lint:oxlint"]
description = "Lint this sidecar's authored source with Oxlint; upstream-conf/ is a vendored oracle fixture, not repository-owned code"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['src'])
"""

[tasks."format:oxlint"]
description = "Auto-fix this sidecar's authored source with Oxlint"
usage = 'arg "[args]" var=#true help="Paths to auto-fix; omitted means src/"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.parse_usage_args}}
{{vars.dispatch_workspace_node}}
ensureOxlintConfig()
const targets = parseUsageArgs(process.env.usage_args ?? '')
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...(targets.length === 0 ? ['src'] : targets)])
"""

[tasks."lint:types"]
extends = "lint:types"

[tasks."test:unit"]
extends = "test:unit"

[tasks.fuzz]
description = "Run *.property.unit.test.ts as a longer fast-check campaign under node"
usage = '''
flag "--runs <n>" help="fast-check runs per property (default 5000)"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const runs = (process.env.usage_runs ?? '5000').trim()
// Property files import the conf-fork package source through its `/ts` subpath,
// so no build step is needed; they self-execute via a top-level `await describe`.
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${runs} runs each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, CONF_FORK_FUZZ_RUNS: runs } })
}
"""

[tasks."fuzz:coverage"]
description = "Deterministic V8 covered-function reachability gate over the conf-fork runtime src; --write refreezes the baseline"
usage = '''
flag "--write" help="Refreeze the committed baseline instead of checking against it"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { mkdtempSync, rmSync } = await import('node:fs')
const { tmpdir } = await import('node:os')
const { join } = await import('node:path')
const root = process.cwd()
const mode = (process.env.usage_write === 'true') ? 'write' : 'check'
// The driver imports the conf-fork package source through its `/ts` subpath, so
// no build step is needed; the report projects coverage onto the runtime package's
// src files (its SOURCE_MARKER targets package/upstream-fork/conf/src), not this
// sidecar.
const dir = mkdtempSync(join(tmpdir(), 'conf-fork-cov-'))
try {
  execFileSync('node', [`${root}/src/coverage-driver.ts`], { stdio: 'inherit', env: { ...process.env, NODE_V8_COVERAGE: dir } })
  execFileSync('node', [`${root}/src/coverage-report.ts`, mode, dir, `${root}/coverage-baseline.json`], { stdio: 'inherit' })
} finally {
  rmSync(dir, { recursive: true, force: true })
}
"""
