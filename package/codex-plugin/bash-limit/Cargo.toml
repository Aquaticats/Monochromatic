[package]
name = "monochromatic-codex-plugin-bash-limit"
version = "0.0.2"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Native resource-limit hook for agent shell execution"
repository = "https://github.com/Aquaticats/Monochromatic.git"
readme = "README.md"
publish = false
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/codex-plugin/bash-limit"

[[bin]]
name = "codex-bash-limit"
path = "src/main.rs"

[dependencies]
serde_json = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true

[workspace]

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
serde_json = ">=1.0.154"
