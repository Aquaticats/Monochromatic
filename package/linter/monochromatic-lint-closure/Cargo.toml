[package]
name = "monochromatic-lint-closure"
version = "0.0.0"
edition = "2024"
description = "Dylint library lint that reports closures unless they own state for a callee that keeps it."
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/Aquaticats/Monochromatic.git"
publish = false
homepage = "https://github.com/Aquaticats/Monochromatic/tree/main/package/linter/monochromatic-lint-closure"

[lib]
name = "monochromatic_lint_closure"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
dylint_linting = { workspace = true }

[dev-dependencies]
dylint_testing = { workspace = true }

[package.metadata.rust-analyzer]
rustc_private = true

# Canonical lint policy, enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
dylint_linting = ">=6.2"
dylint_testing = ">=6.2"
