[package]
name = "monochromatic-lint-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[dependencies]
# Existing repository libFuzzer harness and structured JSONC generator.
libfuzzer-sys = { workspace = true, features = ["arbitrary-derive"] }
jsonc-edit-fuzz = { path = "../../jsonc-edit/core-rust.fuzz", version = "=0.0.0" }
monochromatic-jsonc-edit = { path = "../../jsonc-edit/core-rust", version = "=0.1.2" }
monochromatic-lint = { path = "../monochromatic-lint", version = "=0.4.0" }
# Match the subject's semantic frontend; this fixed in-memory fixture avoids Cargo execution during fuzzing.
ra_ap_hir = { workspace = true }
ra_ap_ide_db = { workspace = true }
ra_ap_test_fixture = { workspace = true }
ra_ap_vfs = { workspace = true }

[lib]
name = "monochromatic_lint_fuzz"
path = "src/lib.rs"

[[bin]]
name = "merge_values"
path = "fuzz_targets/merge_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rust_style"
path = "fuzz_targets/rust_style.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rust_explicit_types"
path = "fuzz_targets/rust_explicit_types.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "orchestration"
path = "fuzz_targets/orchestration.rs"
test = false
doc = false
bench = false

[profile.release]
panic = "unwind"

[workspace]
members = ["."]

# Named catalogs this crate selects from rust-catalog.toml (doc/decision/rust-dependency-catalog.md).
[package.metadata.rust-catalog.catalogs]
ra_ap_hir = "pinned"
ra_ap_ide_db = "pinned"
ra_ap_test_fixture = "pinned"
ra_ap_vfs = "pinned"

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
libfuzzer-sys = ">=0.4.13"
ra_ap_hir = "=0.0.336"
ra_ap_ide_db = "=0.0.336"
ra_ap_test_fixture = "=0.0.336"
ra_ap_vfs = "=0.0.336"
