[env]
# Bound compiler fan-out during local iteration; container gates also cap memory and CPUs.
CARGO_BUILD_JOBS = "2"

[tasks.build]
description = "Build the native unified-linter implementation"
run = "cargo build --release"

[tasks."build:debug"]
description = "Build the native unified-linter implementation for iteration"
run = "cargo build"

[tasks.lint]
description = "Check the Rust implementation without code generation"
run = "cargo check"

[tasks."lint:types"]
description = "Check Rust types and deny Clippy findings"
run = ["cargo check", "cargo clippy --all-targets -- -D warnings"]

[tasks."lint:scripts:types"]
description = "Type-check the verification scripts in bin (TypeScript)"
extends = "lint:types"

[tasks."lint:scripts:oxlint"]
description = "Lint explicitly selected linter TypeScript script paths with Oxlint, without the diagnostics of the older .mjs scripts in bin"
usage = 'arg "[paths]" var=#true help="Package-relative files to lint"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('lint:scripts:oxlint requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', files)
"""

[tasks."format:scripts:oxlint"]
description = "Auto-fix explicitly selected linter TypeScript script paths with Oxlint"
usage = 'arg "[paths]" var=#true help="Package-relative files to fix"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
const files = parseUsageArgs(process.env.usage_paths ?? '')
if (files.length === 0) { throw new Error('format:scripts:oxlint requires at least one file') }
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...files])
"""

[tasks."format:rust"]
description = "Format the native unified-linter source"
run = "cargo fmt"

[tasks."lint:rustfmt"]
description = "Check native source formatting"
run = "cargo fmt --check"

[tasks.test]
description = "Run native unit and conformance tests"
run = "cargo nextest run --all-targets"

[tasks."test:host"]
description = "Run the host-only real run of the closure check over package/wg/cli-quicker-exempt (needs cargo-dylint, the rustc-dev nightly and a warm cargo cache; the container tests use a stub cargo instead)"
run = "cargo nextest run --test closure_binary --run-ignored only"

[tasks."dependencies:fetch"]
description = "Fetch the locked dependency archives before offline container verification"
run = "cargo fetch --locked"

[tasks.lock]
description = "Regenerate the owning Cargo lockfile without fetching dependencies"
run = "cargo generate-lockfile --offline"

[tasks."lock:version"]
description = "Refresh only this crate's own lockfile entry after a version bump, without re-resolving any dependency"
run = "cargo update --offline --package monochromatic-lint"

[tasks."lint:container"]
description = "Run Clippy against the tested source snapshot with a read-only bounded compiler"
depends = ["test:container"]
run = "node bin/clippy-container.ts"

[tasks."lint:rust-style"]
description = "Run Clippy after the focused Rust style container tests without hiding the separate Markdown failure"
depends = ["test:rust-style"]
run = "node bin/clippy-container.ts"

[tasks.mutation]
description = "Run cargo-mutants in the tested, mount-free 2 GiB / 2 CPU source snapshot"
depends = ["test:container"]
run = "node bin/mutate-container.ts"

[tasks."mutation:rust-style"]
description = "Mutate the sidecar test rule with its focused baseline in the bounded source snapshot"
depends = ["test:rust-style"]
run = "node bin/mutate-container.ts --rust-style"

[tasks."mutation:markdown"]
description = "Mutate native Markdown modules against their tests after full container tests and Clippy"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --markdown"

[tasks."mutation:markdown:parent"]
description = "Mutate only the Markdown parent lookup against its contract control, which never walks ancestors and fails at once under a constant replacement"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --markdown-parent"

[tasks."mutation:processors:files"]
description = "Mutate every processor module against the processor tests after full container tests and Clippy"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --processors"

[tasks."mutation:inferred-constants"]
description = "Mutate generic constant-slot resolution against its slot controls and the semantic conformance suite after full container tests and Clippy"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --inferred-constants"

[tasks."mutation:executable"]
description = "Mutate the executable's orchestration, entry point, command grammar, Rust rule selection, input expansion and fix loop against every test except the five Cargo-workspace tests, after full container tests and Clippy"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --executable"

[tasks."mutation:core"]
description = "Mutate configuration, findings, inline directives, grouped edits and the syntax-only Rust rules against every test except the five Cargo-workspace tests, after full container tests and Clippy"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --core"

[tasks."mutation:semantic"]
description = "Mutate the semantic engine and the explicit-type rule against the whole suite, with a per-mutant limit set from this scope's own baseline, after full container tests and Clippy"
depends = ["lint:container"]
run = "node bin/mutate-container.ts --semantic"

[tasks."mutation:coverage"]
description = "Prove from listings that the mutation scopes together hold every mutant of the unscoped listing, name by name, without building"
run = "node bin/mutate-container.ts --coverage"

[tasks."mutation:list:executable"]
description = "Inspect the executable mutant scope without mutating or building source"
run = "node bin/mutate-container.ts --list --executable"

[tasks."mutation:list:core"]
description = "Inspect the configuration, findings, inline directive, edits and syntax-only Rust rule mutant scope without mutating or building source"
run = "node bin/mutate-container.ts --list --core"

[tasks."mutation:list:semantic"]
description = "Inspect the semantic engine and explicit-type rule mutant scope without mutating or building source"
run = "node bin/mutate-container.ts --list --semantic"

[tasks."mutation:list:markdown"]
description = "Inspect the Markdown mutant scope without mutating or building source"
run = "node bin/mutate-container.ts --list --markdown"

[tasks."mutation:list:inferred-constants"]
description = "Inspect the constant-slot resolver mutant scope without mutating or building source"
run = "node bin/mutate-container.ts --list --inferred-constants"

[tasks."test:container"]
description = "Run artifact tests in a mount-free, network-disabled 2 GiB / 2 CPU container"
run = "node bin/test-container.ts"

[tasks."test:rust-style"]
description = "Verify the sidecar test rule independently of unfinished Markdown adapters, under the same container bounds"
run = "node bin/test-container.ts rust_tests_in_sidecars"

[tasks."test:markdown"]
description = "Run only the Markdown test modules, the same slice the Markdown mutation scope uses, under the container bounds"
run = "node bin/test-container.ts markdown"

[tasks."test:inferred-constants"]
description = "Run only the constant-slot resolver controls under the container bounds"
run = "node bin/test-container.ts rust_inferred_constants"

[tasks."test:processors"]
description = "Verify processors in a mount-free, network-disabled snapshot with cached native dependencies"
shell = "node --input-type=module-typescript -e"
run = '''
import { spawnSync } from 'node:child_process';
import { cp, mkdtemp, rm, writeFile } from 'node:fs/promises';
import { tmpdir } from 'node:os';
import { join } from 'node:path';
// Concurrent worktrees set MONOCHROMATIC_LINT_IMAGE_TAG so one snapshot never runs another's image.
const imageTag = process.env.MONOCHROMATIC_LINT_IMAGE_TAG ?? 'development';
const tag = 'localhost/monochromatic-lint-processors:' + imageTag;
function command(args, allowFailure = false) {
  const result = spawnSync('podman', args, { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
  if (result.error) throw result.error;
  if (!allowFailure && result.status !== 0) throw new Error(result.stderr);
  if (!args.includes('inspect')) process.stdout.write(result.stdout + result.stderr);
  return result;
}
const cached = command(['image', 'inspect', tag], true);
const inspected = cached.status === 0 ? cached : command(['image', 'inspect', 'localhost/monochromatic-lint-test:' + imageTag]);
const base = JSON.parse(inspected.stdout)[0].Id.replace(/^sha256:/u, '');
if (!/^[a-f0-9]{64}$/u.test(base)) throw new Error('Missing tested native base image');
const context = await mkdtemp(join(tmpdir(), 'processor-snapshot-'));
try {
  await cp('src', join(context, 'src'), { recursive: true });
  await cp('fixtures', join(context, 'fixtures'), { recursive: true });
  await writeFile(join(context, 'Containerfile'), [
    'FROM ' + base,
    'COPY src /work/package/linter/monochromatic-lint/src',
    'COPY fixtures /work/package/linter/monochromatic-lint/fixtures',
    'RUN ["cargo","nextest","run","--offline","--locked","--all-targets","--no-run"]',
    'RUN ["cargo","build","--offline","--locked","--lib"]',
    'RUN ["rustc","--edition=2024","--extern","monochromatic_lint=target/debug/libmonochromatic_lint.rlib","-L","dependency=target/debug/deps","src/processors_consumer.rs","--out-dir","target"]',
    'CMD ["cargo","nextest","run","--offline","--locked","--all-targets"]',
    '',
  ].join('\n'));
  command(['build', '--network=none', '--http-proxy=false', '--pull=never',
    '--memory=2g', '--cpu-period=100000', '--cpu-quota=200000', '--tag', tag, context]);
  console.log('Processor snapshot: ' + JSON.parse(command(['image', 'inspect', tag]).stdout)[0].Id);
  command(['run', '--rm', '--init', '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=128', tag]);
  command(['run', '--rm', '--init', '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=128', tag,
    '/work/package/linter/monochromatic-lint/target/processors_consumer']);
} finally {
  await rm(context, { recursive: true, force: true });
}
'''

[tasks."format:processors"]
description = "Format only processor-owned Rust modules without modifying concurrent source"
run = "rustfmt --edition 2024 src/processors.rs src/processors_check.rs src/processors_docs.rs src/processors_fences.rs src/processors_lines.rs src/processors_model.rs src/processors_prepare.rs src/processors_projection.rs src/processors_rewrite.rs src/processors_spans.rs src/processors_tests.rs src/processors_projection_tests.rs src/processors_controls_tests.rs src/processors_edge_tests.rs src/processors_fuzz_tests.rs src/processors_consumer.rs"

[tasks."test:processors:anchor-control"]
description = "Probe consumer failure anchors against the existing immutable library without rebuilding it"
shell = "node --input-type=module-typescript -e"
run = '''
import { spawnSync } from 'node:child_process';
function podman(args, allowFailure = false) {
  const result = spawnSync('podman', args, { encoding: 'utf8', maxBuffer: 8 * 1024 * 1024 });
  if (result.error) throw result.error;
  if (!allowFailure && result.status !== 0) throw new Error(result.stderr);
  process.stdout.write(result.stdout + result.stderr);
  return result;
}
const container = podman(['create', '--init', '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=128',
  'localhost/monochromatic-lint-processors:' + (process.env.MONOCHROMATIC_LINT_IMAGE_TAG ?? 'development'), 'sh', '-c',
  'rustc --edition=2024 --extern monochromatic_lint=target/debug/libmonochromatic_lint.rlib -L dependency=target/debug/deps --out-dir /tmp /tmp/processors_consumer.rs && /tmp/processors_consumer']).stdout.trim();
try {
  podman(['cp', 'src/processors_consumer.rs', container + ':/tmp/processors_consumer.rs']);
  const result = podman(['start', '--attach', container], true);
  if (result.status !== 0) throw new Error('Artifact anchor control failed: ' + result.status);
} finally {
  podman(['rm', '--force', container]);
}
'''

[tasks."evidence:processors"]
description = "Record processor source hashes and render-check the scoped Markdown handoff"
shell = "node --input-type=module-typescript -e"
run = '''
import { createHash } from 'node:crypto';
import { readdir, readFile, mkdir, writeFile } from 'node:fs/promises';
import { resolve, join } from 'node:path';
import { pathToFileURL } from 'node:url';
import { spawnSync } from 'node:child_process';
const root = resolve('../../..');
const modules = await readdir(join(root, 'node_modules/.pnpm'));
const rendererDirectory = modules.find(function micromarkDirectory(name) { return name.startsWith('micromark@'); });
if (rendererDirectory === undefined) throw new Error('Installed micromark renderer missing');
const renderer = await import(pathToFileURL(join(root, 'node_modules/.pnpm', rendererDirectory, 'node_modules/micromark/index.js')).href);
const doc = await readFile(join(root, 'doc/handover/unified-linter-processors.md'), 'utf8');
const html = renderer.micromark(doc);
if (!html.includes('<h1>Unified-linter processor handoff</h1>') || !html.includes('<h2>Commit blocker</h2>'))
  throw new Error('Handoff headings did not render');
if (html.includes('<em>') || html.includes('`')) throw new Error('Unintended emphasis or literal code delimiters in rendered handoff');
await mkdir('target/verification', { recursive: true });
await writeFile('target/verification/processors-handover.html', html);
const sources = {};
const names = (await readdir('src')).filter(function processorSource(name) { return name.startsWith('processors') && name.endsWith('.rs'); }).sort();
for (const name of names) sources['src/' + name] = createHash('sha256').update(await readFile(join('src', name))).digest('hex');
sources['fixtures/processors.json'] = createHash('sha256').update(await readFile('fixtures/processors.json')).digest('hex');
for (const name of ['src/lib.rs', 'Cargo.toml', 'Cargo.lock'])
  sources[name] = createHash('sha256').update(await readFile(name)).digest('hex');
const image = spawnSync('podman', ['image', 'inspect', 'localhost/monochromatic-lint-processors:' + (process.env.MONOCHROMATIC_LINT_IMAGE_TAG ?? 'development')], { encoding: 'utf8' });
if (image.error) throw image.error;
if (image.status !== 0) throw new Error(image.stderr);
const imageId = JSON.parse(image.stdout)[0].Id;
const checked = spawnSync('podman', ['run', '--rm', '--init', '--network=none', '--memory=2g', '--cpus=2',
  '--pids-limit=128', imageId, 'sha256sum', ...Object.keys(sources)], { encoding: 'utf8' });
if (checked.error) throw checked.error;
if (checked.status !== 0) throw new Error(checked.stderr);
for (const line of checked.stdout.trim().split('\n')) {
  const [digest, name] = line.split(/\s{2}/u);
  if (sources[name] !== digest) throw new Error('Test snapshot differs from current processor inputs: ' + name);
}
const sourceSha256 = createHash('sha256').update(JSON.stringify(sources)).digest('hex');
const manifest = { sourceSha256, sources, image: imageId,
  renderer: rendererDirectory, markdownSha256: createHash('sha256').update(doc).digest('hex') };
await writeFile('target/verification/processors-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
console.log(JSON.stringify(manifest, null, 2));
console.log('Handoff rendered to target/verification/processors-handover.html');
'''

[tasks."mutation:processors"]
description = "Remove concrete processor safety guards in a mount-free bounded immutable snapshot; `-- --memory <size> --cpus <count> --pids-limit <count>` override the 2g, 2 CPUs and 128 PIDs defaults"
run = "node bin/mutate-processors.ts"

[tasks."processors:tools"]
description = "Read the installed mutation and Rust consumer compiler interfaces before invoking them"
run = ["cargo mutants --help", "rustc --help"]

[tasks."mutation:list:processors"]
description = "Inspect concrete guard mutant identities without compiling or mutating source"
shell = "node --input-type=module-typescript -e"
run = '''
import { spawnSync } from 'node:child_process';
import { exclusionArguments } from '@monochromatic-dev/mutation-test-cli-cargo-mutants/ts';
const files = ['src/processors_projection.rs', 'src/processors_prepare.rs', 'src/processors_rewrite.rs'];
const listed = spawnSync('cargo', ['mutants', '--list', '--no-config', ...exclusionArguments([]), ...files.flatMap((file) => ['--file', file])], { stdio: 'inherit' });
process.exitCode = listed.status ?? 1;
'''

[tasks."lint:processors"]
description = "Run Clippy against the processor-tested bounded source snapshot"
depends = ["test:processors"]
shell = "node --input-type=module-typescript -e"
run = '''
import { spawnSync } from 'node:child_process';
const compiler = spawnSync('rustc', ['--print', 'sysroot'], { encoding: 'utf8' });
if (compiler.error) throw compiler.error;
if (compiler.status !== 0) throw new Error(compiler.stderr);
const result = spawnSync('podman', [
  'run', '--rm', '--init', '--network=none', '--memory=2g', '--cpus=2', '--pids-limit=128',
  '--security-opt', 'label=disable', '--volume', compiler.stdout.trim() + ':/toolchain:ro',
  '--env', 'PATH=/toolchain/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',
  '--env', 'RUSTC=/toolchain/bin/rustc', '--env', 'RUSTDOC=/toolchain/bin/rustdoc',
  'localhost/monochromatic-lint-processors:' + (process.env.MONOCHROMATIC_LINT_IMAGE_TAG ?? 'development'),
  '/toolchain/bin/cargo', 'clippy', '--offline', '--locked', '--all-targets', '--', '-D', 'warnings',
], { stdio: 'inherit' });
if (result.error) throw result.error;
if (result.status !== 0) throw new Error('Processor snapshot Clippy failed: ' + result.status);
'''

[tasks.run]
description = "Run the debug build of monochromatic-lint from this package directory (pass paths and flags after --)"
run = "cargo run --quiet --bin monochromatic-lint --"

[tasks."test:processors:slice"]
description = "Run only the processor tests in the tagged mount-free, network-disabled 2 GiB / 2 CPU snapshot"
run = "node bin/test-container.ts processors"
