# Monorepo-wide Kotlin linter (custom detekt rule set), the Kotlin sibling of
# package/linter/monochromatic-lint. The whole-tree scan lives in the root `lint:detekt` task (in
# mise.toml), not here, so the fanout-discovered package `lint` below stays a
# local compile check and does not scan the repo twice.
#
# Gradle is the committed wrapper (gradle 9.5.1), matching the android-app pattern;
# java is inherited from the root mise manifest. detekt and the detekt CLI resolve
# from mavenCentral.

[tasks.build]
description = "Build the require-kdoc plugin jar"
dir = "{{config_root}}"
run = "./gradlew jar --no-daemon --console=plain"

[tasks."publish:bundle"]
description = "Build the signed Maven Central deployment bundle without uploading it"
dir = "{{config_root}}"
run = "./gradlew centralBundle --no-daemon --console=plain"

[tasks."verify:publication"]
description = "Build the signed Central bundle and resolve it from a disposable consumer project"
run = [{ tasks = ["publish:bundle"] }, { tasks = ["verify:publication:consumer"] }]

[tasks."verify:publication:consumer"]
hide = true
dir = "{{config_root}}"
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { mkdirSync, readFileSync, rmSync, writeFileSync } = await import('node:fs')
const { join } = await import('node:path')
const { pathToFileURL } = await import('node:url')
const packageRoot = process.env.MISE_CONFIG_ROOT ?? process.cwd()
const properties = readFileSync(join(packageRoot, 'gradle.properties'), 'utf8')
const versionLine = properties.split('\n').find((line) => line.startsWith('version='))
if (versionLine === undefined) { throw new Error('gradle.properties has no version entry') }
const version = versionLine.slice('version='.length).trim()
const consumerRoot = join(packageRoot, 'build', 'publication-consumer')
const repositoryRoot = join(packageRoot, 'build', 'central-staging')
rmSync(consumerRoot, { force: true, recursive: true })
mkdirSync(consumerRoot, { recursive: true })
writeFileSync(join(consumerRoot, 'settings.gradle'), "rootProject.name = 'publication-consumer'\n")
writeFileSync(join(consumerRoot, 'build.gradle'), `
plugins { id 'java' }
repositories {
    exclusiveContent {
        forRepository {
            maven { url = uri(System.getenv('PUBLICATION_REPOSITORY')) }
        }
        filter {
            includeGroup 'cat.aquati.monochromatic'
        }
    }
    mavenCentral()
}
dependencies {
    runtimeOnly 'cat.aquati.monochromatic:detekt-rules:${version}'
}
tasks.register('resolvePublication') {
    doLast {
        def artifact = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'cat.aquati.monochromatic' && it.moduleVersion.id.name == 'detekt-rules'
        }
        if (artifact == null || !artifact.file.isFile()) {
            throw new GradleException('Published detekt-rules artifact did not resolve')
        }
        println('resolved-publication=' + artifact.file.name)
    }
}
`)
execFileSync(
  join(packageRoot, 'gradlew'),
  ['--project-dir', consumerRoot, 'resolvePublication', '--no-daemon', '--console=plain'],
  {
    cwd: packageRoot,
    env: {
      ...process.env,
      GRADLE_USER_HOME: join(consumerRoot, 'gradle-user-home'),
      PUBLICATION_REPOSITORY: pathToFileURL(repositoryRoot).href,
    },
    stdio: 'inherit',
  },
)
'''

[tasks."verify:central"]
description = "Resolve the current version from Maven Central and trigger it through detekt"
dir = "{{config_root}}"
shell = "node --input-type=module-typescript -e"
run = '''
const { execFileSync } = await import('node:child_process')
const { mkdirSync, readFileSync, rmSync, writeFileSync } = await import('node:fs')
const { join } = await import('node:path')
const packageRoot = process.env.MISE_CONFIG_ROOT ?? process.cwd()
const properties = readFileSync(join(packageRoot, 'gradle.properties'), 'utf8')
const versionLine = properties.split('\n').find((line) => line.startsWith('version='))
if (versionLine === undefined) { throw new Error('gradle.properties has no version entry') }
const version = versionLine.slice('version='.length).trim()
const consumerRoot = join(packageRoot, 'build', 'central-consumer')
rmSync(consumerRoot, { force: true, recursive: true })
mkdirSync(consumerRoot, { recursive: true })
writeFileSync(join(consumerRoot, 'settings.gradle'), "rootProject.name = 'central-consumer'\n")
writeFileSync(join(consumerRoot, 'Fixture.kt'), 'fun undocumented(): Int = 1\n')
writeFileSync(join(consumerRoot, 'build.gradle'), `
plugins { id 'java' }
repositories { mavenCentral() }
configurations {
    detektCli
    detektRules {
        transitive = false
    }
}
dependencies {
    detektCli 'dev.detekt:detekt-cli:2.0.0-alpha.5'
    detektRules 'cat.aquati.monochromatic:detekt-rules:${version}'
}
def detektOutput = new ByteArrayOutputStream()
tasks.register('verifyPublishedRules', JavaExec) {
    classpath = configurations.detektCli
    mainClass = 'dev.detekt.cli.Main'
    args '--input', file('Fixture.kt').absolutePath,
        '--config', file('${join(packageRoot, 'detekt.yml')}').absolutePath,
        '--build-upon-default-config',
        '--plugins', configurations.detektRules.singleFile.absolutePath
    ignoreExitValue = true
    standardOutput = detektOutput
    errorOutput = detektOutput
    doLast {
        def output = detektOutput.toString('UTF-8')
        print output
        if (executionResult.get().exitValue == 0) {
            throw new GradleException('Published rule did not reject the undocumented fixture')
        }
        if (!output.contains("Missing KDoc on function 'undocumented'.") || !output.contains('[RequireKDoc]')) {
            throw new GradleException('Published rule did not emit the expected RequireKDoc finding')
        }
    }
}
`)
execFileSync(
  join(packageRoot, 'gradlew'),
  ['--project-dir', consumerRoot, 'verifyPublishedRules', '--no-daemon', '--console=plain'],
  {
    cwd: packageRoot,
    env: { ...process.env, GRADLE_USER_HOME: join(consumerRoot, 'gradle-user-home') },
    stdio: 'inherit',
  },
)
'''

[tasks.lint]
description = "Local compile check of the rule set (the monorepo scan is the root lint:detekt)"
dir = "{{config_root}}"
run = "./gradlew compileKotlin compileTestKotlin --no-daemon --console=plain"

[tasks.test]
description = "Run the JVM unit tests for the require-kdoc rule set"
dir = "{{config_root}}"
run = "./gradlew test --no-daemon --console=plain"

[tasks."lint:detekt"]
description = "Dogfood: run require-kdoc over this package's own Kotlin sources"
dir = "{{config_root}}"
run = "./gradlew detektCheck -PdetektInput={{config_root}}/src/main/kotlin --no-daemon --console=plain"
