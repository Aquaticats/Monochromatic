# detekt configuration for the monorepo-wide require-kdoc run. Detekt's default config
# stays active, and this file adds the repo custom require-kdoc rule set.
# File-level exclusions (build output, .kts scripts, test sources) are passed as
# global --excludes by the runner, which stops detekt parsing them at all.
complexity:
  # Disabled as a whole rule set by maintainer decision on 2026-10-10: the human judged detekt's
  # complexity rules (condition counts, cyclomatic complexity, method length, loop jumps and the
  # rest of the set) bad for this repo and said they should have been disabled from the start.
  # This also covers the former TooManyFunctions note: the repo uses no max-functions budgets,
  # and TypeScript and Rust size budgets are handled by dedicated repo linters.
  active: false

style:
  # The repo uses early returns for guard clauses (and elvis-returns like `x ?: return`)
  # that detekt's excludeGuardClauses detector does not reliably recognize, so a
  # per-function return limit fights the readable guard-clause style rather than helping.
  # Disabled repo-wide by maintainer decision; function size is bounded by the dedicated
  # per-language linters, not by return count.
  ReturnCount:
    active: false

require-kdoc:
  active: true
  # detekt 2 fails the run on error-severity findings, replacing build.maxIssues.
  severity: error
  RequireKDoc:
    active: true
    # Set true to let `override` members inherit documentation from the supertype.
    # Default false to require KDoc on every declaration, as require-tsdoc does.
    allowOverride: false
