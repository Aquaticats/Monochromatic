[tasks.build]
extends = "build"

[tasks."build:js"]
extends = "build:js"

[tasks."build:js:node"]
extends = "build:js:node"

[tasks."watch:build"]
extends = "watch:build"

[tasks."watch:build:js"]
extends = "watch:build:js"

[tasks."watch:build:js:node"]
extends = "watch:build:js:node"

[tasks.lint]
extends = "lint"

[tasks."lint:types"]
extends = "lint:types"

[tasks."lint:config:types"]
description = "Type-check the repository's file-enforcer configuration and its imported owners"
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
runWorkspaceNode('package/dev-script/task-util', 'tsc-filter', ['--build', 'tsconfig.repository.json'])
"""

[tasks."test:unit"]
extends = "test:unit"

[tasks."lint:oxlint"]
extends = "lint:oxlint"

[tasks."format:oxlint"]
extends = "format:oxlint"

[tasks."test:container"]
description = "Run the container matrix tests: ensurePackage across OS/user, toolchain providers in bounded containers"
run = [
  "node src/package/mise.container-test.ts",
  "node src/toolchain/mise.container-test.ts",
]

[tasks.fuzz]
description = "Run the property tests as a time-budgeted fuzz campaign under node"
usage = '''
flag "--budget <ms>" help="Per-property time budget in milliseconds (default 60000)"
'''
shell = "node --input-type=module-typescript -e"
run = """
const { execFileSync } = await import('node:child_process')
const { glob } = await import('node:fs/promises')
const budget = (process.env.usage_budget ?? '60000').trim()
const files = []
for await (const file of glob('src/**/*.property.unit.test.ts')) { files.push(file) }
console.log(`Fuzz campaign over ${files.length} property files at ${budget}ms each`)
for (const file of files) {
  console.log(`fuzzing ${file}`)
  execFileSync('node', [file], { stdio: 'inherit', env: { ...process.env, FILE_ENFORCER_FUZZ_BUDGET_MS: budget } })
}
"""

[tasks."test:mutation"]
description = "Run container-isolated oxc mutation tests"
usage = 'arg "[args]" var=#true help="Optional mutation-test flags and package-relative source files"'
shell = "node --input-type=module-typescript -e"
run = """
{{vars.dispatch_workspace_node}}
const args = (process.env.usage_args ?? '').trim().split(' ').filter(Boolean)
runWorkspaceNode('package/cli/mutation-test', 'cli', ['--package', 'package/dev-script/file-enforcer', ...args])
"""
