[package]
name = "terminal"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false
description = "Slint desktop terminal prototype backed by Ghostty's libghostty-vt core."

[lints.clippy]
complexity = { level = "allow", priority = -1 }
disallowed_methods = "deny"
implicit_return = "deny"
needless_return = "allow"
shadow_reuse = "deny"
shadow_same = "deny"
shadow_unrelated = "deny"

[lib]
name = "terminal_app"
path = "src/lib.rs"

[[bin]]
name = "monochromatic-terminal"
path = "src/main.rs"

[dependencies]
# `anyhow` carries application-level errors for the terminal binary and PTY adapter.
anyhow = { workspace = true }
# Same Slint release family as package/music-player/desktop-app so both desktop
# prototypes share Flickable smooth wheel and touch scrolling. The explicit winit
# backend lets the app stamp its Wayland app id before the window is created. The
# slint-build build-dependency in this file must stay in this same release family
# because the markup compiler and runtime are versioned together.
# "1.18.1" here is Cargo's default caret requirement (">=1.18.1, <2.0.0"), not an
# exact pin: unlike pnpm, where a bare version string pins the exact release,
# Cargo already lets `cargo update` move to any newer 1.x release past 1.18.1.
i-slint-backend-winit = { workspace = true }
# Safe Rust binding for Ghostty's terminal core. Default features are disabled
# because this prototype renders text cells only and does not need Kitty images.
libghostty-vt = { workspace = true, default-features = false }
# WezTerm's PTY abstraction. It gives this app safe shell spawn, read, write,
# and resize operations without hand-written forkpty or ioctl setup.
# Pin the first upstream revision after the crates.io 0.9.0 release that upgrades
# nix from 0.28 to 0.29. nix 0.28 requires cfg_aliases 0.1.1, whose expression
# macro emits future-incompatible trailing semicolons and has no fixed 0.1 release.
# This revision keeps portable-pty at 0.9.0 and changes no default-feature PTY
# implementation code; the source delta only updates optional serde imports.
# Revert to a crates.io release once one includes nix 0.29 or newer.
portable-pty = { workspace = true }
# "1.18.1" here is Cargo's default caret requirement (">=1.18.1, <2.0.0"), not an
# exact pin, the same as i-slint-backend-winit and slint-build in this file.
slint = { workspace = true, features = [ "backend-winit", "renderer-femtovg", "renderer-software", ] }
# The logging facade and its subscriber. tracing routes this prototype's callback-error
# diagnostics as structured events; tracing-subscriber installs the stderr sink (RUST_LOG,
# default info) so failures are visible when launched from a terminal.
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
# Must match the `slint` release family used for this crate's slint and
# i-slint-backend-winit dependencies because the compiler and runtime are
# versioned together. "1.18.1" here is Cargo's default caret requirement
# (">=1.18.1, <2.0.0"), not an exact pin.
slint-build = { workspace = true }

# Standalone crate: its own workspace root, so no ancestor Cargo.toml can absorb it.
# Enforced by file-enforcer (doc/planning/cargo-toml-file-enforcer.md).
[workspace]

# Generated by file-enforcer from rust-catalog.toml; edit the catalog, not this table (doc/decision/rust-dependency-catalog.md).
[workspace.dependencies]
anyhow = ">=1.0.104"
i-slint-backend-winit = ">=1.18.1"
libghostty-vt = { version = ">=0.1.1", default-features = false }
portable-pty = { git = "https://github.com/wezterm/wezterm", rev = "f78f72f2f18bf459561e3681f016365273d3e281" }
slint = ">=1.18.1"
slint-build = ">=1.18.1"
tracing = ">=0.1.44"
tracing-subscriber = ">=0.3.23"
