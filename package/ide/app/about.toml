# cargo-about configuration for the Rust crate license list the executable carries.
# The `notices` task runs `cargo-about generate --frozen --fail` with this file and `about.json.hbs`
# and writes target/crate-licenses.json, which build.rs embeds as LICENSES/crates.json.

# Licenses the crates may be used under, in order of preference: for a crate offered under
# `A OR B`, the first listed one is chosen. MIT comes first because the crates' own MIT files carry
# the copyright lines the license asks to reproduce; Apache-2.0 next, whose attribution notices would
# sit in NOTICE files that none of these crates ship. Preferring BSD-3-Clause over Apache-2.0 was
# tried: cargo-about then took every BSD header among the source files of moxcms and pxfm as a
# separate text (224 texts instead of 197).
# Slint is used under GPL-3.0-only, whose text LICENSES/GPL-3.0-or-later.txt already carries; its
# royalty-free license would instead ask for Slint's attribution in the application (default chosen
# on 2026-10-06, open to the user's veto). A dependency under any other license stops the task,
# so a new license is reviewed before it ships.
accepted = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "GPL-3.0-only",
]

# The executable is built for these two release targets only; crates that other targets would pull in are left out.
# Both release builds (x86_64 and aarch64, .github/workflows/ide-release.yml) embed the same list, so the licenses of the
# union are printed: on 2026-10-22 the aarch64 graph was a subset of the x86_64 one (449 crates, of which only
# core_detect is absent on aarch64), so the list is the one the x86_64-only configuration printed.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

# Build scripts and tests run while building; they are not part of the executable.
# Procedural-macro crates follow normal edges, so cargo-about keeps them and their dependencies.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# The unpublished package itself carries its own texts in LICENSES/.
private = { ignore = true }
