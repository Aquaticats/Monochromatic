[tasks."lint:oxlint"]
extends = "lint:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', parseUsageArgs(process.env.usage_args ?? ''))
"""

# Parse gate for the formatting-commit step. The style commits 68415aeb53
# and 3da31bdc3a shipped 20 files whose autofix output no longer parsed
# (issue 1794); nothing between `format` and `git commit` checked that the
# formatted files still parse. Run this over the changed files before any
# formatting commit.
# JS files go to `node --check`, the parser that will run them; TypeScript
# files to `transpileModule` from `typescript/sync`, the compiler's own
# parser, which unlike `node --experimental-strip-types --check` does not
# false-positive on type-only syntax. Declaration files parse under their
# non-declaration suffix because typescript@7.1.0-beta panics in output
# generation for .d.* fileNames. Post-`--` paths are repo-relative or
# absolute files or directories; omitted checks every changed and untracked
# JS/TS file. Exits 1 when anything fails to parse.
[tasks."lint:parse"]
description = "Parse-check JS and TypeScript sources before a formatting commit"
usage = 'arg "[paths]" var=#true help="Files or dirs to parse-check (default: changed and untracked JS/TS files)"'
shell = "node --input-type=module-typescript -e"
run = '''
{{vars.parse_usage_args}}
const { execFileSync, spawnSync } = await import('node:child_process');
const { existsSync, readdirSync, readFileSync, statSync } = await import('node:fs');
const { createRequire } = await import('node:module');
const { extname, join, resolve } = await import('node:path');
const { pathToFileURL } = await import('node:url');

const repoRoot = process.env.MISE_MONOREPO_ROOT ?? execFileSync('git', ['rev-parse', '--show-toplevel'], { encoding: 'utf8' }).trim();
const NODE_CHECK_EXTENSIONS = new Set(['.js', '.mjs', '.cjs']);
const TYPESCRIPT_EXTENSIONS = new Set(['.ts', '.mts', '.cts', '.tsx', '.jsx']);

const isParseTarget = (path) => {
  const extension = extname(path);
  return NODE_CHECK_EXTENSIONS.has(extension) || TYPESCRIPT_EXTENSIONS.has(extension);
};

const collectFromDirectory = ({ directory, files }) => {
  const stack = [directory];
  while (stack.length > 0) {
    const current = stack.pop();
    for (const entry of readdirSync(current, { withFileTypes: true })) {
      if (entry.name === '.git' || entry.name === 'node_modules') continue;
      const child = join(current, entry.name);
      if (entry.isDirectory()) stack.push(child);
      else if (entry.isFile() && isParseTarget(child)) files.add(child);
    }
  }
};

const files = new Set();
const problems = [];
const passedPaths = parseUsageArgs(process.env.usage_paths ?? '');
if (passedPaths.length === 0) {
  const changed = execFileSync('git', ['diff', '--name-only', 'HEAD'], { cwd: repoRoot, encoding: 'utf8' });
  const untracked = execFileSync('git', ['ls-files', '--others', '--exclude-standard'], { cwd: repoRoot, encoding: 'utf8' });
  for (const line of `${changed}${untracked}`.split('\n')) {
    if (line !== '' && isParseTarget(line)) files.add(resolve(repoRoot, line));
  }
} else {
  for (const passed of passedPaths) {
    const absolute = resolve(repoRoot, passed);
    if (!existsSync(absolute)) {
      problems.push(`${passed}: no such file or directory`);
      continue;
    }
    const stats = statSync(absolute);
    if (stats.isDirectory()) collectFromDirectory({ directory: absolute, files });
    else if (stats.isFile() && isParseTarget(absolute)) files.add(absolute);
  }
}

const sortedFiles = [...files].sort();

for (const file of sortedFiles) {
  if (!NODE_CHECK_EXTENSIONS.has(extname(file))) continue;
  const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
  if (result.error !== undefined) {
    problems.push(`${file}: node --check failed to run: ${result.error.message}`);
    continue;
  }
  if (result.status === 0) continue;
  const syntaxLine = result.stderr.split('\n').find((line) => line.startsWith('SyntaxError')) ?? `node --check exited ${result.status}`;
  problems.push(`${file}: ${syntaxLine}`);
}

const typeScriptFiles = sortedFiles.filter((file) => TYPESCRIPT_EXTENSIONS.has(extname(file)));
if (typeScriptFiles.length > 0) {
  const requireFromRoot = createRequire(join(repoRoot, 'package.json'));
  const typescriptSyncPath = requireFromRoot.resolve('typescript/sync');
  const { API } = await import(pathToFileURL(typescriptSyncPath).href);
  const errorText = (error) => String(error instanceof Error ? error.message : error).split('\n')[0];
  // typescript@7.1.0-beta panics in output generation for .d.* fileNames because
  // transpileModule always emits and declaration files have nothing to emit, so
  // parse declaration content under the matching non-declaration suffix; the
  // parse grammar is identical and parse diagnostics still report.
  const parseName = (file) => file.replace(/\.d\.(mts|cts|ts)$/u, '.$1');
  const api = new API();
  try {
    for (const file of typeScriptFiles) {
      const source = readFileSync(file, 'utf8');
      try {
        const output = api.transpileModule(source, { fileName: parseName(file), reportDiagnostics: true });
        for (const diagnostic of output.diagnostics ?? []) {
          const position = diagnostic.startPosition;
          const location = position === undefined ? file : `${file}:${position.line + 1}:${position.character + 1}`;
          const message = typeof diagnostic.text === 'string' ? diagnostic.text : JSON.stringify(diagnostic.text);
          problems.push(`${location}: TS${diagnostic.code} ${message}`);
        }
      } catch (error) {
        problems.push(`${file}: typescript/sync transpileModule threw: ${errorText(error)}`);
      }
    }
  } finally {
    try {
      api.close();
    } catch (error) {
      problems.push(`typescript/sync api.close threw: ${errorText(error)}`);
    }
  }
}

for (const problem of problems) console.error(problem);
console.log(`lint:parse: ${sortedFiles.length} files checked, ${problems.length} problems`);
if (problems.length > 0) process.exitCode = 1;
'''

[tasks."format:oxlint"]
extends = "format:oxlint"
usage = 'arg "[args]" var=#true help="Package-relative source paths; omitted means the entire package"'
run = """
{{vars.dispatch_workspace_node}}
{{vars.parse_usage_args}}
ensureOxlintConfig()
runWorkspaceNode('package/monorepo-task/core-exec', 'oxlint-wrapper', ['--fix', ...parseUsageArgs(process.env.usage_args ?? '')])
"""

[tasks."test:unit"]
extends = "test:unit"

[tasks."test:tsc-failure"]
description = "Verify built TypeScript wrapper exit handling with disposable compiler processes"
run = "node src/tsc-failure.unit.test.ts"

[tasks.buildAndTest]
description = "Build the seven node entries, then run unit tests against the built testing seam"
run = ["mise run build", "mise run test:unit"]
